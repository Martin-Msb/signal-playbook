sources:
  - {id: reinforcement-learning-and-bandits-s1, title: "Sutton and Barto: Reinforcement Learning, An Introduction, second edition, MIT Press 2018 (2020 printing)", url: "http://incompleteideas.net/book/RLbook2020.pdf", kind: primary, vendor: false}
  - {id: reinforcement-learning-and-bandits-s2, title: "Amodei, Olah, Steinhardt, Christiano, Schulman and Mané: Concrete Problems in AI Safety, arXiv 1606.06565", url: "https://arxiv.org/abs/1606.06565", kind: primary, vendor: false}
  - {id: reinforcement-learning-and-bandits-s3, title: "Li, Chu, Langford and Schapire: A Contextual-Bandit Approach to Personalized News Article Recommendation, arXiv 1003.0146", url: "https://arxiv.org/abs/1003.0146", kind: primary, vendor: false}
  - {id: reinforcement-learning-and-bandits-s4, title: "Li, Chu, Langford and Wang: Unbiased Offline Evaluation of Contextual-bandit-based News Article Recommendation Algorithms, arXiv 1003.5956", url: "https://arxiv.org/abs/1003.5956", kind: primary, vendor: false}
claims:
  - {id: reinforcement-learning-and-bandits-definition, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Reinforcement learning is learning how to map situations to actions so as to maximise a numerical reward signal. The learner is not told which actions to take, but must discover which actions yield the most reward by trying them."}
  - {id: reinforcement-learning-and-bandits-bandit, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "In the k-armed bandit problem the learner chooses repeatedly among k actions, receives after each choice a numerical reward drawn from a stationary probability distribution that depends on the action selected, and aims to maximise the expected total reward over some time period."}
  - {id: reinforcement-learning-and-bandits-sample-average, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "The value of an action is the expected reward given that the action is selected. The sample-average method estimates it by averaging the rewards actually received when the action was taken."}
  - {id: reinforcement-learning-and-bandits-greedy, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Greedy action selection always exploits current knowledge to maximise immediate reward. It spends no time sampling apparently inferior actions to see if they might really be better."}
  - {id: reinforcement-learning-and-bandits-testbed, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "On Sutton and Barto's 10-armed testbed the greedy method found the optimal action in only approximately one-third of the tasks. The ε-greedy methods eventually performed better because they continued to explore."}
  - {id: reinforcement-learning-and-bandits-dilemma, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "The agent has to exploit what it has already experienced in order to obtain reward, but it also has to explore in order to make better action selections in the future. Neither exploration nor exploitation can be pursued exclusively without failing at the task."}
  - {id: reinforcement-learning-and-bandits-explore-cost, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Reward is lower in the short run, during exploration, but higher in the long run, because the better actions that exploration discovers can then be exploited many times."}
  - {id: reinforcement-learning-and-bandits-epsilon, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "An ε-greedy method behaves greedily most of the time but, with small probability ε, selects randomly from among all the actions with equal probability."}
  - {id: reinforcement-learning-and-bandits-epsilon-rate, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "On the 10-armed testbed the ε = 0.1 method explored more and usually found the optimal action earlier, but never selected it more than 91% of the time. The ε = 0.01 method improved more slowly but eventually would perform better. ε can also be reduced over time."}
  - {id: reinforcement-learning-and-bandits-ucb, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "ε-greedy action selection forces the non-greedy actions to be tried indiscriminately. Upper confidence bound action selection chooses among them by taking into account both how close their estimates are to being maximal and the uncertainties in those estimates."}
  - {id: reinforcement-learning-and-bandits-contextual, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Associative search tasks, often now called contextual bandits, involve learning a policy, a mapping from situations to the actions that are best in those situations, while each action affects only the immediate reward. If actions are allowed to affect the next situation as well as the reward, the task is the full reinforcement learning problem."}
  - {id: reinforcement-learning-and-bandits-news, class: B, sources: [reinforcement-learning-and-bandits-s3], verified: "2026-11-27", text: "Li and colleagues model personalised news article recommendation as a contextual bandit problem: a learning algorithm sequentially selects articles using contextual information about the users and articles, and adapts its selection strategy from user-click feedback to maximise total user clicks."}
  - {id: reinforcement-learning-and-bandits-value-policy, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Action-value methods learn the values of actions and then select actions based on those estimates. Policy gradient methods instead learn a parameterised policy that can select actions without consulting a value function. Q-learning is an off-policy temporal-difference control algorithm whose learned action-value function directly approximates the optimal one."}
  - {id: reinforcement-learning-and-bandits-value-function, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "The reward signal indicates what is good in an immediate sense, whereas a value function specifies what is good in the long run: the total amount of reward an agent can expect to accumulate over the future, starting from a state."}
  - {id: reinforcement-learning-and-bandits-reward-goal, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "The agent always learns to maximise its reward, so it is critical that the rewards truly indicate what is to be accomplished. If achieving subgoals were rewarded, the agent might find a way to achieve them without achieving the real goal."}
  - {id: reinforcement-learning-and-bandits-reward-unexpected, class: A, sources: [reinforcement-learning-and-bandits-s1], verified: "2026-11-27", text: "Reinforcement learning agents can discover unexpected ways to make their environments deliver reward, some of which might be undesirable, or even dangerous."}
  - {id: reinforcement-learning-and-bandits-reward-hacking, class: A, sources: [reinforcement-learning-and-bandits-s2], verified: "2026-11-27", text: "Formal rewards or objective functions are an attempt to capture the designer's informal intent, and can sometimes be gamed by solutions that are valid in some literal sense but do not meet that intent. A designer may choose an objective that seems highly correlated with accomplishing the task, but that correlation breaks down when the objective is strongly optimised."}
  - {id: reinforcement-learning-and-bandits-safe-exploration, class: A, sources: [reinforcement-learning-and-bandits-s2], verified: "2026-11-27", text: "Exploration can be dangerous, since it involves taking actions whose consequences the agent does not understand well. Common exploration policies such as epsilon-greedy explore by choosing an action at random and make no attempt to avoid dangerous situations."}
  - {id: reinforcement-learning-and-bandits-bounded, class: B, sources: [reinforcement-learning-and-bandits-s2], verified: "2026-11-27", text: "Real-world reinforcement learning projects can often avoid harmful exploration by hard-coding an avoidance of catastrophic behaviours. If a portion of the state space is known to be safe, and even the worst action within it can be recovered from or bounded in harm, the agent can be allowed to run freely within those bounds. Potentially unsafe actions can also be checked with a human."}
  - {id: reinforcement-learning-and-bandits-offline, class: B, sources: [reinforcement-learning-and-bandits-s4, reinforcement-learning-and-bandits-s3], verified: "2026-11-27", text: "Offline evaluation of new contextual bandit algorithms is critical for protecting online user experiences, and is challenging because of their partial-label nature. Li and colleagues introduce a replay methodology that is completely data-driven and can provide provably unbiased evaluations, and argue that any bandit algorithm can be reliably evaluated offline using previously recorded random traffic."}
