sources:
  - {id: prompting-s1, title: "OpenAI: Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering", kind: primary, vendor: true}
  - {id: prompting-s2, title: "OpenAI: Text generation", url: "https://developers.openai.com/api/docs/guides/text", kind: primary, vendor: true}
  - {id: prompting-s3, title: "Anthropic: Prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", kind: primary, vendor: true}
  - {id: prompting-s4, title: "OWASP GenAI Security Project: LLM01:2026 Prompt Injection", url: "https://genai.owasp.org/llm2026/llm012026-prompt-injection/", kind: primary, vendor: false}
  - {id: prompting-s5, title: "OWASP GenAI Security Project: LLM07:2025 System Prompt Leakage", url: "https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/", kind: primary, vendor: false}
claims:
  - {id: prompting-instructions, class: A, sources: [prompting-s1, prompting-s3], verified: "2026-11-27", text: "OpenAI defines prompt engineering as the process of writing effective instructions for a model. Anthropic states that Claude responds well to clear, explicit instructions and that being specific about the output wanted can help enhance results."}
  - {id: prompting-roles, class: B, sources: [prompting-s1, prompting-s2, prompting-s3], verified: "2026-11-27", text: "In OpenAI's API, developer messages are instructions provided by the application developer and are prioritised ahead of user messages. Anthropic states that setting a role in the system prompt focuses the model's behaviour and tone."}
  - {id: prompting-few-shot, class: B, sources: [prompting-s1, prompting-s3], verified: "2026-11-27", text: "Anthropic states that examples are one of the most reliable ways to steer output format, tone and structure, calls the technique few-shot or multishot prompting, and recommends 3 to 5 examples that are relevant, diverse and wrapped in example tags. OpenAI advises showing a diverse range of possible inputs with the desired outputs."}
  - {id: prompting-structure, class: B, sources: [prompting-s1, prompting-s3], verified: "2026-11-27", text: "Anthropic states that XML tags help the model parse complex prompts unambiguously, especially when a prompt mixes instructions, context, examples and variable inputs. OpenAI states that Markdown headers and lists can mark distinct sections of a prompt and that XML tags can help delineate where one piece of content begins and ends."}
  - {id: prompting-boundary, class: A, sources: [prompting-s4, prompting-s5], verified: "2026-11-27", text: "OWASP states that LLMs make no architectural distinction between instructions and data, both being tokens on the same stream. It also states that the system prompt should not be considered a secret, nor should it be used as a security control, and that security controls should be enforced independently from the LLM."}
  - {id: prompting-injection, class: A, sources: [prompting-s4], verified: "2026-11-27", text: "OWASP defines a prompt injection vulnerability as input to a large language model altering the model's behaviour in ways the application developer did not intend. It states that marking untrusted content reduces attack success in non-adaptive tests only, because an attacker who knows the marking scheme can mimic it, and advises holding credentials and state-change capability in application code, not the model, with least privilege per operation."}
  - {id: prompting-versioning, class: B, sources: [prompting-s1, prompting-s2], verified: "2026-11-27", text: "OpenAI recommends storing production prompts in application code instead of creating reusable prompt objects, and states that code-managed prompts allow typed inputs, code review, tests and the normal deployment process."}
  - {id: prompting-testing, class: B, sources: [prompting-s1, prompting-s2], verified: "2026-11-27", text: "OpenAI recommends pinning production applications to specific model snapshots, building tests and evaluation suites that measure prompt behaviour, and adding representative fixtures, tests and evaluation checks before changing production prompts."}
