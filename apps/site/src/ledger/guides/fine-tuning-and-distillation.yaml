  - {id: fine-tuning-and-distillation-s2, title: "Hinton, Vinyals and Dean: Distilling the Knowledge in a Neural Network", url: "https://arxiv.org/abs/1503.02531", kind: primary, vendor: false}
  - {id: fine-tuning-and-distillation-s3, title: "Sanh et al.: DistilBERT, a distilled version of BERT: smaller, faster, cheaper and lighter", url: "https://arxiv.org/abs/1910.01108", kind: primary, vendor: false}
  - {id: fine-tuning-and-distillation-s4, title: "Carlini et al.: Extracting Training Data from Large Language Models", url: "https://arxiv.org/abs/2012.07805", kind: primary, vendor: false}
