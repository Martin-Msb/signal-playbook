sources:
  - {id: orchestration-s1, title: "Apache Airflow documentation: Tasks", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/tasks.html", kind: primary, vendor: false}
  - {id: orchestration-s2, title: "Apache Airflow documentation: Backfill", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/backfill.html", kind: primary, vendor: false}
  - {id: orchestration-s3, title: "Apache Airflow documentation: UI Overview", url: "https://airflow.apache.org/docs/apache-airflow/stable/ui.html", kind: primary, vendor: false}
  - {id: orchestration-s4, title: "Dagster documentation: Defining assets", url: "https://dagster.io/docs/guides/build/assets/defining-assets", kind: primary, vendor: true}
  - {id: orchestration-s5, title: "Prefect documentation: How to automatically rerun your workflow when it fails", url: "https://docs.prefect.io/v3/how-to-guides/workflows/retries", kind: primary, vendor: true}
claims:
  - {id: orchestration-tasks, class: A, sources: [orchestration-s1], verified: "2026-11-26", text: "Apache Airflow arranges tasks in DAGs and uses upstream and downstream dependencies to express the order in which they should run. By default, a task runs when its upstream tasks have succeeded."}
  - {id: orchestration-retries, class: A, sources: [orchestration-s1], verified: "2026-11-26", text: "Airflow tasks can retry after failure. A failed task with retry attempts remaining is placed in the up-for-retry state and rescheduled."}
  - {id: orchestration-prefect-retries, class: B, sources: [orchestration-s5], verified: "2026-11-26", text: "Prefect allows retry counts and retry delays to be configured for flows and individual tasks. A task can be configured to retry without rerunning other completed tasks in the workflow."}
  - {id: orchestration-backfill, class: B, sources: [orchestration-s2], verified: "2026-11-26", text: "Airflow backfill creates runs for past dates of a time-based Dag. A reprocessing option determines whether existing runs are skipped, failed runs are recreated, or completed and failed runs are recreated."}
  - {id: orchestration-run-history, class: B, sources: [orchestration-s3], verified: "2026-11-26", text: "The Airflow Dag Run view displays run metadata including logical date, run type, duration and Dag version. Task instance details include state, start and end dates, and try number."}
  - {id: orchestration-dagster-assets, class: B, sources: [orchestration-s4], verified: "2026-11-26", text: "A Dagster asset definition includes an asset key, upstream asset keys from which its contents are derived, and a function that computes and stores the asset. Dagster tracks the dependencies and handles asset execution within a pipeline."}
  - {id: orchestration-governance, class: A, sources: [orchestration-s3], verified: "2026-11-26", text: "Airflow run metadata and task instance details make the run period, task outcomes and retry attempts reviewable."}
