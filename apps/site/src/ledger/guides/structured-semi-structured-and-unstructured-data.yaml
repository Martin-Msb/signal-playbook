claims:
  - {id: structured-semi-structured-and-unstructured-data-table, class: A, sources: [structured-semi-structured-and-unstructured-data-s1], verified: "2026-11-25", text: "In a relational table the number and order of the columns is fixed, and each column has a name and a data type. The number of rows is variable. The data type constrains the set of possible values that can be assigned to a column."}
  - {id: structured-semi-structured-and-unstructured-data-schema-first, class: A, sources: [structured-semi-structured-and-unstructured-data-s2], verified: "2026-11-25", text: "Structured data requires a fixed schema that is defined before the data can be loaded and queried. Semi-structured data does not require a prior definition of a schema and can constantly evolve: new attributes can be added at any time."}
  - {id: structured-semi-structured-and-unstructured-data-semi, class: A, sources: [structured-semi-structured-and-unstructured-data-s2], verified: "2026-11-25", text: "Semi-structured data does not conform to the standards of traditional structured data, but it contains tags (labels) or other types of mark-up that identify individual, distinct entities within the data. Entities within the same class may have different attributes even though they are grouped together, and the data can contain N-level hierarchies of nested information."}
  - {id: structured-semi-structured-and-unstructured-data-json, class: A, sources: [structured-semi-structured-and-unstructured-data-s3], verified: "2026-11-25", text: "JSON can represent four primitive types (strings, numbers, booleans and null) and two structured types (objects and arrays). An object is an unordered collection of zero or more name/value pairs, where a name is a string. There is no requirement that the values in an array be of the same type."}
  - {id: structured-semi-structured-and-unstructured-data-xml, class: A, sources: [structured-semi-structured-and-unstructured-data-s4], verified: "2026-11-25", text: "In XML, parsed data is made up of characters, some of which form character data and some of which form markup. Markup encodes a description of the document's storage layout and logical structure."}
  - {id: structured-semi-structured-and-unstructured-data-logs, class: B, sources: [structured-semi-structured-and-unstructured-data-s5], verified: "2026-11-25", text: "OpenTelemetry describes semistructured logs as logs that include machine-readable key/value pairs or delimited fields but do not guarantee a stable schema across emitters. A log encoded as JSON is not automatically structured: what makes a log structured is the presence of a stable schema. Unstructured logs do not follow a consistent structure and may need substantial work to parse or pre-process them to be machine-readable."}
  - {id: structured-semi-structured-and-unstructured-data-variant, class: B, sources: [structured-semi-structured-and-unstructured-data-s2], verified: "2026-11-25", text: "Snowflake stores semi-structured data in the data types ARRAY, OBJECT and VARIANT. A VARIANT can hold a value of any other data type, including an ARRAY or an OBJECT. Snowflake can import semi-structured data from JSON, Avro, ORC, Parquet and XML formats."}
  - {id: structured-semi-structured-and-unstructured-data-path, class: B, sources: [structured-semi-structured-and-unstructured-data-s6], verified: "2026-11-25", text: "Databricks recommends using VARIANT over JSON strings for semi-structured data. In its SQL syntax a colon selects a top-level field, a dot or brackets select nested fields with named keys, and a bracketed index selects a value from an array."}
  - {id: structured-semi-structured-and-unstructured-data-parquet-variant, class: B, sources: [structured-semi-structured-and-unstructured-data-s7], verified: "2026-11-25", text: "The Apache Parquet Variant binary encoding allows representation of semi-structured data such as JSON. A Variant contains a primitive, an array or an object, and is encoded with two binary values, the value and the metadata."}
  - {id: structured-semi-structured-and-unstructured-data-jsonb, class: A, sources: [structured-semi-structured-and-unstructured-data-s8], verified: "2026-11-25", text: "PostgreSQL's jsonb type stores data in a decomposed binary format that is slightly slower to input but significantly faster to process, since no reparsing is needed. The documentation recommends that JSON documents have a somewhat fixed structure even where maximal flexibility is desired: the structure is typically unenforced, but a predictable structure makes it easier to write queries that usefully summarise a set of documents."}
  - {id: structured-semi-structured-and-unstructured-data-unstructured, class: A, sources: [structured-semi-structured-and-unstructured-data-s9], verified: "2026-11-25", text: "Unstructured data is information that does not fit into a predefined data model or schema. It is typically text-heavy, such as form responses and social media conversations, and also encompasses images, video and audio."}
  - {id: structured-semi-structured-and-unstructured-data-tika, class: B, sources: [structured-semi-structured-and-unstructured-data-s10, structured-semi-structured-and-unstructured-data-s11], verified: "2026-11-25", text: "The Apache Tika toolkit detects and extracts metadata and text from over a thousand different file types. The format list of Tika 3.2.3 states that it can process single email messages in the RFC 822 format, extract metadata from image and audio formats, and have OCR performed on the contents of an image through Tesseract."}
  - {id: structured-semi-structured-and-unstructured-data-speech, class: B, sources: [structured-semi-structured-and-unstructured-data-s12], verified: "2026-11-25", text: "Whisper is a general-purpose speech recognition model that performs multilingual speech recognition, speech translation and language identification."}
  - {id: structured-semi-structured-and-unstructured-data-embedding, class: A, sources: [structured-semi-structured-and-unstructured-data-s13], verified: "2026-11-25", text: "An embedding is a vector (list) of floating point numbers. The distance between two vectors measures their relatedness."}
  - {id: structured-semi-structured-and-unstructured-data-pgvector, class: B, sources: [structured-semi-structured-and-unstructured-data-s14], verified: "2026-11-25", text: "pgvector is open-source vector similarity search for Postgres. It stores vectors with the rest of the data and supports exact and approximate nearest neighbor search."}
  - {id: structured-semi-structured-and-unstructured-data-inspect, class: B, sources: [structured-semi-structured-and-unstructured-data-s15], verified: "2026-11-25", text: "Google Cloud Sensitive Data Protection helps discover, classify and de-identify sensitive data. Its inspection service reports every instance of data that matches a chosen infoType, and the documentation calls inspection especially useful for unstructured data, such as user-provided comments."}
  - {id: structured-semi-structured-and-unstructured-data-patterns, class: B, sources: [structured-semi-structured-and-unstructured-data-s16], verified: "2026-11-25", text: "Microsoft Purview sensitive information types are pattern-based classifiers that detect sensitive information such as social security, credit card or bank account numbers. The primary element of a pattern can be a regular expression, a keyword list, a keyword dictionary or a function. Named entity types detect person names, physical addresses and medical terms and conditions."}
  - {id: structured-semi-structured-and-unstructured-data-macie, class: B, sources: [structured-semi-structured-and-unstructured-data-s17], verified: "2026-11-25", text: "Amazon Macie discovers sensitive data by using machine learning and pattern matching. It retrieves and analyses objects in Amazon S3 buckets, inspecting them for sensitive data, and its managed data identifiers detect multiple types of personally identifiable information."}
