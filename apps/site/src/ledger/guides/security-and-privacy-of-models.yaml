sources:
  - {id: security-and-privacy-of-models-s1, title: "NIST AI 100-2 E2025: Adversarial Machine Learning, A Taxonomy and Terminology of Attacks and Mitigations", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-2e2025.pdf", kind: primary, vendor: false, note: "Final edition published March 2025. The NIST publication page at csrc.nist.gov/pubs/ai/100/2/e2025/final listed no superseding edition on 27 November 2026."}
  - {id: security-and-privacy-of-models-s2, title: "MITRE ATLAS: atlas-data repository", url: "https://github.com/mitre-atlas/atlas-data", kind: primary, vendor: false}
  - {id: security-and-privacy-of-models-s3, title: "MITRE ATLAS: data release 2026.10", url: "https://github.com/mitre-atlas/atlas-data/blob/main/dist/v6/ATLAS-2026.10.yaml", kind: primary, vendor: false, note: "The file dist/v6/ATLAS-latest.yaml pointed to this release on 27 November 2026."}
  - {id: security-and-privacy-of-models-s4, title: "EUR-Lex: Consolidated Artificial Intelligence Act", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false, note: "Consolidated text dated 27 July 2026. Checked 27 November 2026."}
claims:
  - {id: security-and-privacy-of-models-stages, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "The adversarial machine learning literature predominantly considers attacks at either the training stage or the deployment stage. During training the attacker might control part of the training data, their labels, the model parameters or the code of ML algorithms, resulting in different types of poisoning attacks. During deployment the adversary could mount evasion attacks to change the model's predictions, as well as privacy attacks to infer sensitive information about the training data or the model."}
  - {id: security-and-privacy-of-models-objectives, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "The attacker's objectives are classified along three dimensions according to the three main types of security violations: availability breakdown, integrity violation and privacy compromise."}
  - {id: security-and-privacy-of-models-capabilities, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Attacks on predictive AI systems can be taxonomised by the capabilities an attacker controls. With training data control the attacker inserts or modifies training samples. With testing data control the attacker adds perturbations to testing samples at deployment time. With query access the attacker submits queries to the model and receives predictions, which are labels or model confidences."}
  - {id: security-and-privacy-of-models-evasion, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "In an evasion attack the adversary's goal is to generate adversarial examples: samples whose classification can be changed to an arbitrary class of the attacker's choice, often with only minimal perturbation. Adversarial examples are similar to the original sample but alter the model predictions to the attacker's choices."}
  - {id: security-and-privacy-of-models-black-box, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Adversarial examples are also applicable in black-box settings in which attackers only obtain query access to the trained model. Even when attackers obtain only the model's predicted labels or confidence scores, deep neural networks are still vulnerable to adversarial examples."}
  - {id: security-and-privacy-of-models-poisoning, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Poisoning attacks occur during the ML training stage. In a data poisoning attack an adversary controls a subset of the training data by either inserting or modifying training samples."}
  - {id: security-and-privacy-of-models-label-flipping, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Label flipping is a poisoning strategy in which an adversary generates training examples with incorrect or altered labels. If the adversary can control the labelling function of the training data, inserting several poisoned samples with the target label makes the model learn the wrong label."}
  - {id: security-and-privacy-of-models-poison-effects, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Availability poisoning attacks typically cause indiscriminate degradation of the ML model on all samples, while targeted and backdoor poisoning attacks induce integrity violations on a small set of target samples. Availability poisoning attacks are usually detectable by monitoring the standard performance metrics of ML models, and targeted poisoning attacks are notoriously challenging to defend against."}
  - {id: security-and-privacy-of-models-membership, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "With a membership inference attack an adversary can determine whether a particular record was included in the dataset used for training an ML model. Most of these attacks have been developed for black-box settings in which the adversary generates queries to the trained ML model."}
  - {id: security-and-privacy-of-models-loss, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "The loss-based membership inference attack uses the knowledge that the ML model minimises the loss on training samples. It determines that a target sample is part of training if its loss is lower than a fixed threshold."}
  - {id: security-and-privacy-of-models-membership-harm, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "In certain situations, determining that an individual is part of the training set already has privacy implications, such as in a medical study of patients with a rare disease. Membership inference can also be used as a building block for mounting data extraction attacks."}
  - {id: security-and-privacy-of-models-overfit, class: B, sources: [security-and-privacy-of-models-s3], verified: "2026-11-27", text: "MITRE ATLAS states that ensuring that models do not overfit during training is a strategy for limiting model memorisation of individual records and improving privacy in deployment."}
  - {id: security-and-privacy-of-models-adversarial-training, class: B, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Adversarial training augments training data with adversarial examples generated iteratively during training using their correct labels. The benefit usually comes at the cost of decreased model accuracy on clean data, and adversarial training is expensive due to the iterative generation of adversarial examples during training."}
  - {id: security-and-privacy-of-models-tradeoff, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "The mitigations that have proven resilient against evasion exhibit inherent trade-offs between robustness and accuracy and come with additional computational costs during training. Designing ML models that resist evasion while maintaining accuracy remains an open problem."}
  - {id: security-and-privacy-of-models-adaptive, class: B, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "The field has a history of publishing defences evaluated under relatively weak adversarial models that are subsequently broken by more powerful attacks. Mitigations need to be evaluated against strong adaptive attacks."}
  - {id: security-and-privacy-of-models-sanitisation, class: B, sources: [security-and-privacy-of-models-s1, security-and-privacy-of-models-s3], verified: "2026-11-27", text: "Training data sanitisation leverages the insight that poisoned samples are typically different from regular training samples: the techniques clean the training set and remove the poisoned samples before training is performed. The MITRE ATLAS mitigation Sanitize Training Data is to detect, quarantine, and remove or remediate poisoned data before it is used to train an AI model."}
  - {id: security-and-privacy-of-models-provenance, class: B, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "To mitigate some of the risks of targeted poisoning, model developers may protect training data through traditional cybersecurity measures such as access controls, use methods for data sanitisation and validation, and use mechanisms for dataset provenance and integrity attestation."}
  - {id: security-and-privacy-of-models-dp, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Differential privacy guarantees a bound on how much an attacker with access to the algorithm output can learn about each individual record in the dataset. Its privacy parameter ε, the privacy budget, bounds the probability that the attacker can determine whether a particular record was included in the dataset. By definition, differential privacy provides mitigation against data reconstruction and membership inference attacks."}
  - {id: security-and-privacy-of-models-dp-sgd, class: B, sources: [security-and-privacy-of-models-s1, security-and-privacy-of-models-s3], verified: "2026-11-27", text: "The most widely used differential privacy algorithm for training ML models is DP-SGD. MITRE ATLAS states that differential privacy can be applied during training, by adding calibrated noise to clipped gradients, or to inference outputs."}
  - {id: security-and-privacy-of-models-dp-utility, class: B, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "One of the main challenges of using differential privacy in practice is setting the privacy parameters to achieve a trade-off between the level of privacy and the achieved utility, which is typically measured in terms of accuracy for ML models. Empirical privacy auditing is recommended to complement the theoretical analysis of private training algorithms."}
  - {id: security-and-privacy-of-models-federated, class: A, sources: [security-and-privacy-of-models-s1], verified: "2026-11-27", text: "Federated learning is a type of machine learning in which a model is trained in a decentralised fashion using multiple data sources without pooling or combining the data in any centralised location. Entities or devices collaboratively train a global model by exchanging model updates without directly sharing the data that each entity controls. Model poisoning attacks are most prevalent in federated learning, where clients send local model updates to the aggregating server, and in supply-chain attacks."}
  - {id: security-and-privacy-of-models-federated-limit, class: B, sources: [security-and-privacy-of-models-s3], verified: "2026-11-27", text: "MITRE ATLAS states that federated learning enables training without revealing training data to training participants. Such mechanisms by themselves do not prevent disclosure through a deployed model's outputs, but can be combined with differential privacy."}
  - {id: security-and-privacy-of-models-atlas, class: A, sources: [security-and-privacy-of-models-s2], verified: "2026-11-27", text: "MITRE ATLAS (Adversarial Threat Landscape for AI Systems) is a public knowledge base of adversary tactics, techniques and procedures targeting AI systems."}
  - {id: security-and-privacy-of-models-atlas-entries, class: C, sources: [security-and-privacy-of-models-s3], verified: "2026-11-27", text: "The MITRE ATLAS data release 2026.10, modified on 28 October 2026, lists the techniques Evade AI Model, Training Data Poisoning and Infer Membership, and the mitigations Predictive AI Model Hardening, Sanitize Training Data and Privacy-Preserving AI Training and Inference."}
  - {id: security-and-privacy-of-models-ai-act, class: C, sources: [security-and-privacy-of-models-s4], verified: "2026-11-27", text: "Article 15 of Regulation (EU) 2024/1689 states that the technical solutions to address AI specific vulnerabilities of high-risk AI systems shall include, where appropriate, measures to prevent, detect, respond to, resolve and control for attacks trying to manipulate the training data set (data poisoning), or pre-trained components used in training (model poisoning), inputs designed to cause the AI model to make a mistake (adversarial examples or model evasion), confidentiality attacks or model flaws."}
