claims:
  - {id: monitoring-and-drift-constant, class: A, sources: [monitoring-and-drift-s1], verified: "2026-11-27", text: "Seemingly subtle changes in a data distribution can destroy the performance of otherwise state-of-the-art models. Models are typically tested on held-out data to estimate their future performance, which assumes that the process underlying the input and output data remains constant. Drift occurs when the process at test time differs from the process that generated the training data, and the model's performance can then no longer be expected to match that observed on held-out training data."}
  - {id: monitoring-and-drift-decay, class: A, sources: [monitoring-and-drift-s2], verified: "2026-11-27", text: "ML models can have reduced performance not only due to suboptimal coding but also due to constantly evolving data profiles. Models can decay in more ways than conventional software systems. Monitoring detects performance degradation and model staleness."}
  - {id: monitoring-and-drift-covariate, class: A, sources: [monitoring-and-drift-s1, monitoring-and-drift-s6], verified: "2026-11-27", text: "Covariate drift, also referred to as input drift, occurs when the distribution of the input data has shifted while the relationship of outputs to inputs has not. It may result in the model giving unreliable predictions. NannyML's documentation uses data drift for the same shift in the inputs."}
  - {id: monitoring-and-drift-test, class: A, sources: [monitoring-and-drift-s1], verified: "2026-11-27", text: "To decide whether differences between a distribution and its reference are due to drift or to natural randomness in the data, statistical two-sample hypothesis testing is used. If the p-value obtained is below a given threshold, the null hypothesis that the two distributions are equal is rejected, suggesting drift is occurring."}
  - {id: monitoring-and-drift-ks, class: B, sources: [monitoring-and-drift-s3], verified: "2026-11-27", text: "scipy.stats.ks_2samp performs the two-sample Kolmogorov-Smirnov test. It compares the underlying continuous distributions of two independent samples, and under the two-sided alternative its null hypothesis is that the two distributions are identical."}
  - {id: monitoring-and-drift-vertex, class: B, sources: [monitoring-and-drift-s4], verified: "2026-11-27", flags: [vendor-stated], text: "Vertex AI Model Monitoring defines training-serving skew as the feature data distribution in production deviating from the distribution used to train the model, with the training data as baseline. It calculates the distance score for numerical features with the Jensen-Shannon divergence, and an alert is logged when the statistical distance between a feature's distribution and its baseline exceeds the specified threshold."}
  - {id: monitoring-and-drift-evidently, class: B, sources: [monitoring-and-drift-s5], verified: "2026-11-27", flags: [vendor-stated], text: "Evidently detects data drift by comparing the distributions of the values in a column between a reference dataset and a current dataset. Its available methods include PSI, Wasserstein distance and Jensen-Shannon distance."}
  - {id: monitoring-and-drift-proxy, class: A, sources: [monitoring-and-drift-s1], verified: "2026-11-27", text: "Real-time ground truths are not typically available, and some types of drift, such as prior and concept drift, are especially difficult to detect without access to them. As a workaround proxies are required: a model's predictions can be monitored to check for prior drift, which is a shift in the distribution of the outputs."}
  - {id: monitoring-and-drift-baseline, class: B, sources: [monitoring-and-drift-s7], verified: "2026-11-27", flags: [vendor-stated], text: "Amazon SageMaker Model Monitor captures data from incoming requests to a real-time endpoint and the resulting model predictions. A baseline is created from the dataset that was used to train the model, and predictions outside the baseline's constrained values are reported as violations."}
  - {id: monitoring-and-drift-concept, class: A, sources: [monitoring-and-drift-s1], verified: "2026-11-27", text: "Concept drift occurs when the process generating the output from the input has changed. The model might then no longer give a suitable approximation of the true process."}
  - {id: monitoring-and-drift-estimate, class: B, sources: [monitoring-and-drift-s6], verified: "2026-11-27", flags: [vendor-stated], text: "NannyML estimates performance metrics of monitored models in the absence of ground truth with two approaches. Confidence-based Performance Estimation (CBPE) leverages the confidence scores of the predictions and assumes they are well-calibrated probabilities. Direct Loss Estimation (DLE) trains a nanny model that directly estimates the value of the loss of the monitored model."}
  - {id: monitoring-and-drift-estimate-limit, class: A, sources: [monitoring-and-drift-s6], verified: "2026-11-27", text: "While dealing well with data drift, CBPE will not work under concept drift, that is when the probability of the outcome given the inputs changes. Except from very specific cases, there is no way to identify concept drift without any ground truth data."}
  - {id: monitoring-and-drift-outcomes, class: B, sources: [monitoring-and-drift-s9], verified: "2026-11-27", text: "Outcomes analysis compares model outputs to corresponding real-world outcomes to assess model performance relative to model objectives and business use. It can take many forms, including reports or analysis performed as part of ongoing monitoring and standalone activities such as back-testing."}
  - {id: monitoring-and-drift-thresholds, class: B, sources: [monitoring-and-drift-s9], verified: "2026-11-27", text: "Outcomes analysis and other elements of the validation process may identify material errors or persistent deviations outside of the banking organisation's established performance thresholds. In such cases, model adjustment, recalibration or redevelopment may be warranted."}
  - {id: monitoring-and-drift-alpha, class: A, sources: [monitoring-and-drift-s1], verified: "2026-11-27", text: "In a hypothesis test for drift the threshold on the p-value represents the desired false positive rate. For online detectors there is a trade-off between the expected run time before a false detection and the expected delay in responding to drift."}
  - {id: monitoring-and-drift-adwin, class: B, sources: [monitoring-and-drift-s12], verified: "2026-11-27", text: "ADWIN (ADaptive WINdowing) is a drift detection method that keeps a variable-length window of recent items. It compares the averages of two sub-windows, and concept drift is detected if the distribution equality no longer holds."}
  - {id: monitoring-and-drift-triggers, class: B, sources: [monitoring-and-drift-s2], verified: "2026-11-27", text: "An ML pipeline can be triggered on demand, on a schedule where new labelled data is systematically available daily, weekly or monthly, on availability of new training data, on model performance degradation, and on significant changes in the data distributions. Continuous training is concerned with automatically retraining and serving the models."}
  - {id: monitoring-and-drift-actions, class: B, sources: [monitoring-and-drift-s7], verified: "2026-11-27", flags: [vendor-stated], text: "Early detection of deviations in model quality allows corrective actions such as retraining models, auditing upstream systems or fixing quality issues."}
  - {id: monitoring-and-drift-ongoing, class: B, sources: [monitoring-and-drift-s9, monitoring-and-drift-s8], verified: "2026-11-27", text: "In the US banking agencies' Revised Guidance on Model Risk Management of 17 April 2026, which supersedes SR 11-7, ongoing model monitoring involves an evaluation of the extent to which a model is performing as expected given potential changes in products, exposures, activities, clients, data relevance or market conditions. A model that no longer performs as expected may warrant overlays, adjustment or redevelopment. Generative and agentic AI models are not within the scope of the guidance."}
  - {id: monitoring-and-drift-nist, class: B, sources: [monitoring-and-drift-s10], verified: "2026-11-27", text: "NIST AI RMF MANAGE 2.4: mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use."}
  - {id: monitoring-and-drift-nist-production, class: B, sources: [monitoring-and-drift-s10], verified: "2026-11-27", text: "NIST AI RMF MEASURE 2.4: the functionality and behaviour of the AI system and its components are monitored when in production. MANAGE 4.1: post-deployment AI system monitoring plans are implemented."}
  - {id: monitoring-and-drift-eu-post-market, class: B, sources: [monitoring-and-drift-s11], verified: "2026-11-27", text: "Article 72 of the EU AI Act, in the consolidated text of 27 July 2026: providers shall establish and document a post-market monitoring system proportionate to the nature of the AI technologies and the risks of the high-risk AI system. The system shall actively and systematically collect, document and analyse relevant data on the performance of high-risk AI systems throughout their lifetime."}
  - {id: monitoring-and-drift-eu-plan, class: C, sources: [monitoring-and-drift-s11], verified: "2026-11-27", text: "Article 72(3) of the EU AI Act, as replaced by Regulation (EU) 2026/1744: the post-market monitoring system shall be based on a post-market monitoring plan that is part of the technical documentation, and the Commission shall adopt guidance, including a template, on the plan by 2 September 2027."}
