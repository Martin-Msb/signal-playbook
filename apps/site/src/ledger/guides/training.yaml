claims:
  - {id: training-next-word, class: A, sources: [training-s6], verified: "2026-11-27", text: "Anthropic's glossary defines pretraining as the initial process of training language models on a large unlabelled corpus of text, and states that autoregressive language models are pretrained to predict the next word, given the previous context of text in the document."}
  - {id: training-hidden-tokens, class: A, sources: [training-s7], verified: "2026-11-27", text: "Google's Machine Learning Crash Course states that in the first phase of training a large language model certain tokens in the training data are intentionally hidden, the model trains by trying to predict those missing tokens, and loss guides the degree to which backpropagation updates parameter values."}
  - {id: training-loss, class: A, sources: [training-s8], verified: "2026-11-27", text: "Loss is a numerical metric that describes how wrong a model's predictions are."}
  - {id: training-gpt3-tokens, class: A, sources: [training-s1], verified: "2026-11-27", text: "GPT-3 is an autoregressive language model with 175 billion parameters, and all GPT-3 models were trained for a total of 300 billion tokens."}
  - {id: training-not-instructions, class: A, sources: [training-s6], verified: "2026-11-27", text: "Anthropic's glossary states that pretrained models are not inherently good at answering questions or following instructions, and that fine-tuning and RLHF are used to refine these pretrained models."}
  - {id: training-instruction-tuning, class: A, sources: [training-s7], verified: "2026-11-27", text: "An optional further training step called instruction tuning can improve a large language model's ability to follow instructions."}
  - {id: training-demonstrations, class: A, sources: [training-s2], verified: "2026-11-27", text: "The InstructGPT study collected a dataset of labeller demonstrations of the desired model behaviour and used it to fine-tune GPT-3 with supervised learning. Its supervised fine-tuning dataset contains about 13k training prompts."}
  - {id: training-rankings, class: A, sources: [training-s2], verified: "2026-11-27", text: "The InstructGPT study collected a dataset of rankings of model outputs, trained a reward model to predict the human-preferred output, and fine-tuned the supervised model to optimise that reward, a method it calls reinforcement learning from human feedback."}
  - {id: training-rlhf, class: A, sources: [training-s6], verified: "2026-11-27", text: "Anthropic's glossary states that in reinforcement learning from human feedback the human feedback consists of ranking a set of two or more example texts, and the reinforcement learning process encourages the model to prefer outputs that are similar to the higher-ranked ones."}
  - {id: training-feedback-limits, class: A, sources: [training-s2], verified: "2026-11-27", text: "The InstructGPT authors state that their procedure aligns the behaviour of GPT-3 to the stated preferences of a specific group of people, mostly their labellers and researchers, rather than any broader notion of human values."}
  - {id: training-no-updates-at-use, class: A, sources: [training-s1], verified: "2026-11-27", text: "For all tasks in the GPT-3 study the model is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified purely via text interaction with the model."}
  - {id: training-pinned, class: B, sources: [training-s12], verified: "2026-11-27", text: "Anthropic states that each Claude model ID identifies a pinned version of the model, and that the underlying model remains constant for the lifetime of that ID."}
  - {id: training-cutoff-meaning, class: B, sources: [training-s9], verified: "2026-11-27", text: "Anthropic's Transparency Hub states that a model's knowledge cutoff date means its knowledge base is most extensive and reliable on information and events up to that date."}
  - {id: training-sonnet-dates, class: C, sources: [training-s10, training-s9], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic lists Claude Sonnet 5.5 with a training data cutoff of Jun 2026, a release date of September 2026 and a retirement date not sooner than September 28, 2027."}
  - {id: training-post-training, class: B, sources: [training-s9], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that Claude Sonnet 5.5 was pretrained on large, diverse datasets to acquire language capabilities, and after pretraining underwent substantial post-training with the goal of making it an effective assistant."}
  - {id: training-lifecycle, class: B, sources: [training-s11], verified: "2026-11-27", text: "Anthropic describes a model lifecycle of active, legacy, deprecated and retired. A deprecated model is still functional and is assigned a retirement date, requests to a retired model fail, and Anthropic provides at least 60 days' notice before retiring a publicly released model."}
  - {id: training-sonnet45, class: C, sources: [training-s11], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic deprecated claude-sonnet-4-5-20250929 on September 30, 2026 with a retirement date of November 30, 2026, and names claude-sonnet-5-5 as the recommended replacement."}
  - {id: training-data-mix, class: B, sources: [training-s9], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that Claude Sonnet 5.5 was trained on a proprietary mix of publicly available information from the internet, public and private datasets, and other sources, such as synthetic data generated by other models."}
  - {id: training-licences, class: A, sources: [training-s13], verified: "2026-11-27", text: "The Data Provenance Initiative audited and traced more than 1,800 text datasets and observed frequent miscategorisation of licences on widely used dataset hosting sites, with licence omission of over 70% and error rates of over 50%."}
  - {id: training-model-cards, class: A, sources: [training-s3], verified: "2026-11-27", text: "Model cards are short documents accompanying trained machine learning models that disclose the context in which models are intended to be used, details of the performance evaluation procedures, and other relevant information."}
  - {id: training-poisoning, class: A, sources: [training-s4], verified: "2026-11-27", text: "The BadNets study shows that an adversary can create a maliciously trained network that has state-of-the-art performance on the user's training and validation samples but behaves badly on specific attacker-chosen inputs, and that a backdoor can persist when the network is later retrained for another task."}
  - {id: training-ai-act, class: C, sources: [training-s5], verified: "2026-11-27", text: "Article 53(1) of the consolidated EU AI Act requires providers of general-purpose AI models to put in place a policy to comply with Union law on copyright and related rights, and to draw up and make publicly available a sufficiently detailed summary about the content used for training of the model."}
