sources:
  - {id: training-pipelines-s1, title: "Google Cloud Architecture Center: MLOps: Continuous delivery and automation pipelines in machine learning", url: "https://docs.cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning", kind: primary, vendor: false}
  - {id: training-pipelines-s2, title: "TensorFlow: The TFX User Guide", url: "https://www.tensorflow.org/tfx/guide", kind: primary, vendor: false}
  - {id: training-pipelines-s3, title: "TensorFlow: TFX guide, ML Metadata", url: "https://www.tensorflow.org/tfx/guide/mlmd", kind: primary, vendor: false}
  - {id: training-pipelines-s4, title: "MLflow documentation: MLflow Model Registry", url: "https://mlflow.org/docs/latest/ml/model-registry/", kind: primary, vendor: false}
  - {id: training-pipelines-s5, title: "Kubeflow Pipelines documentation: Run", url: "https://www.kubeflow.org/docs/components/pipelines/concepts/run/", kind: primary, vendor: false}
claims:
  - {id: training-pipelines-manual, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "In the manual process that Google's MLOps guidance calls level 0, every step is manual, including data analysis, data preparation, model training and validation, with manual transition from one step to another. The process assumes models that do not change frequently, and a new model version is deployed only a couple of times per year."}
  - {id: training-pipelines-automation, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "The goal of MLOps level 1 is continuous training of the model by automating the ML pipeline. The steps are orchestrated and the transition between steps is automated. Automating retraining on new data requires automated data and model validation steps in the pipeline, pipeline triggers and metadata management."}
  - {id: training-pipelines-components, class: B, sources: [training-pipelines-s2], verified: "2026-11-27", text: "A TFX pipeline is a sequence of components that implement an ML pipeline. It typically includes ExampleValidator, which looks for anomalies and missing values in the dataset, Transform, which performs feature engineering, Trainer, which trains the model, and Evaluator, which helps validate exported models. TFX pipelines can be orchestrated on Apache Airflow, Apache Beam and Kubeflow Pipelines."}
  - {id: training-pipelines-run, class: B, sources: [training-pipelines-s5], verified: "2026-11-27", text: "In Kubeflow Pipelines a run is a single execution of a pipeline. A recurring run is a repeatable run of a pipeline, and its configuration includes a copy of a pipeline with all parameter values specified and a run trigger."}
  - {id: training-pipelines-triggers, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "ML production pipelines can be automated to retrain models on demand, on a schedule, on availability of new training data, on model performance degradation, and on significant changes in the data distributions."}
  - {id: training-pipelines-data-validation, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "Data validation is required before model training to decide whether to retrain the model or stop the execution of the pipeline. Input data that does not comply with the expected schema is an anomaly, and the pipeline should stop so the data science team can investigate."}
  - {id: training-pipelines-model-validation, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "Offline model validation occurs after training and before the model is promoted to production. It produces evaluation metric values on a test dataset, compares them with the current model, checks that performance is consistent on various segments of the data, and tests the model for deployment, including infrastructure compatibility and consistency with the prediction service API."}
  - {id: training-pipelines-evaluator-gate, class: B, sources: [training-pipelines-s2], verified: "2026-11-27", text: "Model validation in TFX is performed by passing both a candidate and a baseline model to the Evaluator component, which computes metrics for both along with a corresponding set of diff metrics. Thresholds may then be applied and used to gate pushing models to production."}
  - {id: training-pipelines-metadata, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "Each time the pipeline executes, the ML metadata store records the pipeline and component versions that were executed, the executor of the pipeline, the parameter arguments, pointers to the artifacts produced by each step, a pointer to the previous trained model and the model evaluation metrics."}
  - {id: training-pipelines-lineage, class: A, sources: [training-pipelines-s3], verified: "2026-11-27", text: "ML Metadata records every artifact that an execution used and every artifact it produced, which allows lineage tracking: it can recurse back from any artifact to all of its upstream inputs. It helps answer which dataset a model trained on and which pipeline run created it, and a context can track the owner and changelist used for a workflow run."}
  - {id: training-pipelines-registry, class: B, sources: [training-pipelines-s4], verified: "2026-11-27", text: "The MLflow Model Registry is a centralized model store that provides lineage, meaning which MLflow experiment and run produced the model, versioning, aliasing, metadata tagging and annotation. A new model is added as version 1, and each new model registered to the same model name increments the version number."}
  - {id: training-pipelines-approval, class: B, sources: [training-pipelines-s4], verified: "2026-11-27", text: "MLflow model versions carry tags. Versions undergoing pre-deployment validation can be tagged validation_status:pending and those cleared for deployment validation_status:approved. An alias such as champion is a mutable, named reference to one version of a registered model."}
  - {id: training-pipelines-cicd, class: B, sources: [training-pipelines-s1], verified: "2026-11-27", text: "In MLOps level 2 an automated CI/CD system builds, tests and deploys new pipeline components. Pipeline continuous integration builds source code and runs tests, pipeline continuous delivery deploys the artifacts to the target environment, and automated triggering executes the pipeline in production and pushes the trained model to the model registry."}
