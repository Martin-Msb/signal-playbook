sources:
  - {id: model-serving-s1, title: "vLLM: Documentation", url: "https://docs.vllm.ai/en/latest/", kind: primary, vendor: false}
  - {id: model-serving-s2, title: "vLLM: Automatic Prefix Caching", url: "https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/", kind: primary, vendor: false}
  - {id: model-serving-s3, title: "Kwon et al.: Efficient Memory Management for Large Language Model Serving with PagedAttention", url: "https://arxiv.org/abs/2309.06180", kind: primary, vendor: false}
  - {id: model-serving-s4, title: "Hugging Face Transformers: Quantization overview", url: "https://huggingface.co/docs/transformers/main/en/quantization/overview", kind: primary, vendor: false}
  - {id: model-serving-s5, title: "Hugging Face Transformers: How caching works", url: "https://huggingface.co/docs/transformers/main/en/cache_explanation", kind: primary, vendor: false}
  - {id: model-serving-s6, title: "NVIDIA Triton Inference Server: Batchers", url: "https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/batcher.html", kind: primary, vendor: true}
  - {id: model-serving-s7, title: "Kubernetes: Horizontal Pod Autoscaling", url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/", kind: primary, vendor: false}
  - {id: model-serving-s8, title: "KServe: Autoscaling generative inference", url: "https://kserve.github.io/website/docs/model-serving/generative-inference/autoscaling", kind: primary, vendor: false}
  - {id: model-serving-s9, title: "KServe: Generative inference overview", url: "https://kserve.github.io/website/docs/model-serving/generative-inference/overview", kind: primary, vendor: false}
  - {id: model-serving-s10, title: "Anthropic: Data residency", url: "https://platform.claude.com/docs/en/manage-claude/data-residency", kind: primary, vendor: true}
  - {id: model-serving-s11, title: "AWS: Amazon Bedrock cross-Region inference", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html", kind: primary, vendor: true}
  - {id: model-serving-s12, title: "AWS: Amazon Bedrock data protection", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html", kind: primary, vendor: true}
  - {id: model-serving-s13, title: "Hugging Face: Text Generation Inference", url: "https://huggingface.co/docs/text-generation-inference/index", kind: primary, vendor: false}
  - {id: model-serving-s14, title: "vLLM: Quantization", url: "https://docs.vllm.ai/en/latest/features/quantization/", kind: primary, vendor: false}
  - {id: model-serving-s15, title: "vLLM: Installation", url: "https://docs.vllm.ai/en/latest/getting_started/installation/", kind: primary, vendor: false}
  - {id: model-serving-s16, title: "NIST: AI 600-1, Generative Artificial Intelligence Profile", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
claims:
  - {id: model-serving-accelerators, class: B, sources: [model-serving-s15], verified: "2026-11-27", text: "vLLM lists NVIDIA GPUs through CUDA, AMD GPUs through ROCm and Intel XPUs among its supported hardware platforms."}
  - {id: model-serving-batch-needed, class: A, sources: [model-serving-s3], verified: "2026-11-27", text: "High throughput serving of large language models requires batching sufficiently many requests at a time. The key-value cache memory for each request is huge and grows and shrinks dynamically. When managed inefficiently, this memory can be significantly wasted by fragmentation and redundant duplication, limiting the batch size."}
  - {id: model-serving-paged, class: B, sources: [model-serving-s3, model-serving-s1], verified: "2026-11-27", text: "vLLM manages attention key and value memory with PagedAttention. Its authors report that it improves the throughput of popular LLMs by 2 to 4 times with the same level of latency compared with FasterTransformer and Orca."}
  - {id: model-serving-server, class: B, sources: [model-serving-s1, model-serving-s13], verified: "2026-11-27", text: "vLLM is a library for LLM inference and serving, with continuous batching of incoming requests, chunked prefill, prefix caching, an OpenAI-compatible API server and streaming outputs. Text Generation Inference is a toolkit for deploying and serving LLMs that lists continuous batching of incoming requests for increased total throughput. It is in maintenance mode, and its maintainers recommend vLLM and SGLang going forward."}
  - {id: model-serving-dynamic-batching, class: A, sources: [model-serving-s6], verified: "2026-11-27", text: "Dynamic batching is a feature of Triton that allows inference requests to be combined by the server. Creating a batch of requests typically results in increased throughput. A maximum queue delay lets the batcher hold requests so that more can join a batch, which trades increased latency for increased throughput."}
  - {id: model-serving-kv-cache, class: A, sources: [model-serving-s5], verified: "2026-11-27", text: "Autoregressive generation makes a prediction one token at a time, and each new prediction depends on all the previous context. A key-value cache stores the key and value pairs derived from the attention layers of previously processed tokens and reuses them for subsequent tokens, avoiding recomputation. With causal attention, a processed token's representation never changes with respect to future tokens. The cache's memory grows linearly with sequence length."}
  - {id: model-serving-prefix-cache, class: A, sources: [model-serving-s2], verified: "2026-11-27", text: "Automatic Prefix Caching in vLLM caches the KV cache of existing queries, so that a new query can directly reuse the KV cache if it shares the same prefix with one of the existing queries, allowing the new query to skip the computation of the shared part. Its example workloads are repeated queries over the same long document and multi-round conversation in the same chat session."}
  - {id: model-serving-quantisation, class: A, sources: [model-serving-s4, model-serving-s14], verified: "2026-11-27", text: "Quantization stores a model's weights, and sometimes its activations, in fewer bits so the model needs less memory. Models are usually loaded in bf16, which takes 2 bytes per parameter. An 8B model needs about 16 GB for its weights in bf16, about 8 GB at 8 bits and about 4 to 5 GB at 4 bits. Fewer bits cost some accuracy, and each quantization method makes a different tradeoff between memory, speed and accuracy. vLLM states that quantization trades off model precision for a smaller memory footprint."}
  - {id: model-serving-quant-formats, class: B, sources: [model-serving-s1, model-serving-s4], verified: "2026-11-27", text: "vLLM lists INT8, INT4, GPTQ, AWQ and GGUF among the quantization formats it supports. Transformers quantizes a full-precision checkpoint while it loads when given a quantization config, for example in 4 bits with bitsandbytes."}
  - {id: model-serving-autoscaling, class: B, sources: [model-serving-s7, model-serving-s8], verified: "2026-11-27", text: "In Kubernetes a HorizontalPodAutoscaler automatically updates a workload resource with the aim of scaling capacity to match demand, on observed metrics such as average CPU utilization or any custom metric. Horizontal scaling means that the response to increased load is to deploy more Pods. If load decreases and the number of Pods is above the configured minimum, it scales the workload back down. KServe's autoscaling guide scales LLM services with KEDA on metrics such as vllm:num_requests_running, with a target number of concurrent requests per pod and minimum and maximum replicas."}
  - {id: model-serving-kserve, class: B, sources: [model-serving-s9], verified: "2026-11-27", text: "The Hugging Face serving runtime in KServe uses the vLLM backend engine, which is optimized for LLMs, and provides OpenAI-compatible API endpoints."}
  - {id: model-serving-residency, class: B, sources: [model-serving-s11], verified: "2026-11-27", text: "Amazon Bedrock offers geographic cross-Region inference profiles, which keep data residency within geographic boundaries such as US, EU and APAC, and global profiles, which route to any supported AWS commercial Region worldwide. AWS advises the geographic type when data processing must remain within specific geographic boundaries."}
  - {id: model-serving-residency-api, class: C, sources: [model-serving-s10], verified: "2026-11-27", text: "On the Claude API the inference_geo parameter controls where model inference runs for a request. The value global is the default and lets inference run in any available geography, and us runs inference only in US-based infrastructure. These are the only two values available. US-only inference is priced at 1.1 times the standard rate on Claude 4.6 and later models."}
  - {id: model-serving-isolation, class: B, sources: [model-serving-s12], verified: "2026-11-27", text: "Amazon Bedrock deploys models into Model Deployment Accounts that are owned and operated by the Amazon Bedrock service team. Model providers do not have access to those accounts, so they do not have access to Amazon Bedrock logs or to customer prompts and completions."}
  - {id: model-serving-fallback, class: B, sources: [model-serving-s11, model-serving-s16], verified: "2026-11-27", text: "To meet an availability target, AWS advises adding bounded retries and multi-Region or multi-model fallback in the application. The NIST Generative AI Profile suggests documenting risks in the system value chain to identify over-reliance on third-party data and to identify fallbacks, and establishing policies and procedures to test and manage risks related to rollover and fallback technologies."}
