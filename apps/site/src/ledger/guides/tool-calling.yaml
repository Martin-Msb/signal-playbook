sources:
  - {id: tool-calling-s1, title: "OpenAI: Function calling", url: "https://developers.openai.com/api/docs/guides/function-calling", kind: primary, vendor: true}
  - {id: tool-calling-s2, title: "Anthropic: Tool use with Claude", url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", kind: primary, vendor: true}
  - {id: tool-calling-s3, title: "Anthropic: Define tools", url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", kind: primary, vendor: true}
  - {id: tool-calling-s4, title: "Anthropic: Parallel tool use", url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use", kind: primary, vendor: true}
  - {id: tool-calling-s5, title: "OWASP GenAI Security Project: LLM03:2026 Excessive Agency", url: "https://genai.owasp.org/llm2026/llm032026-excessive-agency/", kind: primary, vendor: false}
claims:
  - {id: tool-calling-purpose, class: A, sources: [tool-calling-s1, tool-calling-s2], verified: "2026-11-27", text: "A function definition allows the model to pass data to the application, where the application's code can access data or take actions suggested by the model. With automatic tool choice, Claude calls a tool when the request maps to the tool's described capability and the answer is not already in context."}
  - {id: tool-calling-definition, class: A, sources: [tool-calling-s1, tool-calling-s3], verified: "2026-11-27", text: "A tool definition contains a name, a description of what the tool does and when to use it, and a JSON Schema that defines its input arguments."}
  - {id: tool-calling-description, class: B, sources: [tool-calling-s3], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that detailed descriptions are by far the most important factor in tool performance, and that they should explain what the tool does, when it should be used and what each parameter means."}
  - {id: tool-calling-flow, class: A, sources: [tool-calling-s1, tool-calling-s2], verified: "2026-11-27", text: "Tool calling is a multi-step conversation between the application and the model: the application makes a request with tools the model could call, receives a tool call from the model, executes code on the application side with input from the tool call, makes a second request with the tool output, and receives a final response or more tool calls."}
  - {id: tool-calling-app-runs, class: A, sources: [tool-calling-s1, tool-calling-s2], verified: "2026-11-27", text: "For tools the developer defines, the model returns a structured call and the application runs it. The application's code runs the operation and sends back the result, which the model uses to answer the original question."}
  - {id: tool-calling-parallel, class: B, sources: [tool-calling-s1, tool-calling-s4], verified: "2026-11-27", text: "The model may call multiple tools in a single response. The application returns one result for each call, and it can prevent multiple calls per turn with the parallel_tool_calls setting in the OpenAI API or disable_parallel_tool_use in the Claude API."}
  - {id: tool-calling-parallel-order, class: B, sources: [tool-calling-s4], verified: "2026-11-27", text: "The Claude API does not prescribe an execution order for the calls in one turn. Independent, read-only operations are usually safe to run in parallel, and tools with side effects, shared state or ordering requirements might be better run sequentially."}
  - {id: tool-calling-hosted, class: B, sources: [tool-calling-s1, tool-calling-s2], verified: "2026-11-27", text: "Providers also run tools themselves. Anthropic's server tools, such as web_search and code_execution, run on Anthropic's infrastructure with no handler code in the application, and the OpenAI platform provides built-in tools that let the model search the web and run code."}
  - {id: tool-calling-strict, class: B, sources: [tool-calling-s1, tool-calling-s2], verified: "2026-11-27", text: "Setting strict to true on a function in the OpenAI API ensures function calls reliably adhere to the function schema instead of being best effort. Adding strict: true to a custom tool definition in the Claude API ensures tool calls always match the schema."}
  - {id: tool-calling-excessive-agency, class: A, sources: [tool-calling-s5], verified: "2026-11-27", text: "Excessive Agency is the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM. Its root cause is typically one or more of excessive functionality, excessive permissions and excessive autonomy."}
  - {id: tool-calling-least-privilege, class: A, sources: [tool-calling-s5], verified: "2026-11-27", text: "OWASP advises limiting the tools an LLM agent is allowed to call to the minimum necessary, and limiting the permissions that tools are granted to other systems to the minimum necessary, enforced through the permissions of the identity the tool uses to connect."}
  - {id: tool-calling-validate, class: A, sources: [tool-calling-s5], verified: "2026-11-27", text: "OWASP advises that tools define a strict schema for any input parameters and validate contents prior to use, and that authorisation is implemented in logic rather than relying on an LLM to decide if an action is allowed."}
  - {id: tool-calling-log, class: A, sources: [tool-calling-s5], verified: "2026-11-27", text: "OWASP advises logging and monitoring the activity of LLM tools and downstream systems to identify where undesirable actions are taking place. This does not prevent Excessive Agency but can limit the damage caused."}
  - {id: tool-calling-approval, class: A, sources: [tool-calling-s5], verified: "2026-11-27", text: "OWASP advises human-in-the-loop control to approve high-impact actions before they are taken. A graduated enforcement policy lets low-consequence or easily reversible actions auto-approve while high-consequence or irreversible ones route to human review: a customer service chatbot can auto-process a refund as store credit, while an external payout routes to human approval."}
