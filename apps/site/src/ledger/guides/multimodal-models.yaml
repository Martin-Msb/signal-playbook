claims:
  - {id: multimodal-models-inputs, class: A, sources: [multimodal-models-s1], verified: "2026-11-27", text: "The GPT-4 technical report describes a large-scale multimodal model which can accept image and text inputs and produce text outputs."}
  - {id: multimodal-models-patches, class: A, sources: [multimodal-models-s8], verified: "2026-11-27", text: "The Vision Transformer splits an image into patches and provides the sequence of linear embeddings of these patches as input to a Transformer. Image patches are treated the same way as tokens in a language application."}
  - {id: multimodal-models-projection, class: A, sources: [multimodal-models-s9], verified: "2026-11-27", text: "LLaVA connects a vision encoder and a large language model. A trainable projection matrix converts image features into language embedding tokens that have the same dimensionality as the word embedding space of the language model, giving a sequence of visual tokens."}
  - {id: multimodal-models-all-tokenised, class: B, sources: [multimodal-models-s11], verified: "2026-11-27", flags: [vendor-stated], text: "Google states that all input to the Gemini API is tokenised, including images, video and audio."}
  - {id: multimodal-models-token-counts, class: C, sources: [multimodal-models-s11], verified: "2026-11-27", flags: [vendor-stated], text: "Google documents that in the Gemini API an image of at most 384 pixels in both dimensions counts as 258 tokens and audio counts as 32 tokens per second."}
  - {id: multimodal-models-audio-frames, class: A, sources: [multimodal-models-s3], verified: "2026-11-27", text: "Whisper re-samples audio to 16,000 Hz and computes an 80-channel log-magnitude Mel spectrogram on 25-millisecond windows with a stride of 10 milliseconds, which the encoder of an encoder-decoder Transformer processes."}
  - {id: multimodal-models-audio-workflows, class: B, sources: [multimodal-models-s4], verified: "2026-11-27", text: "OpenAI documents distinct audio workflows, among them a speech-to-speech agent, a transcript of an audio file, live captions, continuous speech translation and generated speech."}
  - {id: multimodal-models-document-layout, class: A, sources: [multimodal-models-s5], verified: "2026-11-27", text: "DocFormer is a multi-modal transformer for visual document understanding of formats such as forms and receipts. It combines text, vision and spatial features using multi-modal self-attention, and takes the bounding box coordinates of each word as spatial features."}
  - {id: multimodal-models-layoutlm, class: A, sources: [multimodal-models-s13], verified: "2026-11-27", text: "LayoutLM jointly models interactions between text and layout information across scanned document images, for tasks such as information extraction from scanned documents."}
  - {id: multimodal-models-shared-space, class: A, sources: [multimodal-models-s2], verified: "2026-11-27", text: "CLIP learns a multi-modal embedding space by jointly training an image encoder and a text encoder to maximise the cosine similarity of the image and text embeddings of the real pairs in a batch while minimising it for the incorrect pairings."}
  - {id: multimodal-models-joint-embedding, class: A, sources: [multimodal-models-s10], verified: "2026-11-27", text: "ImageBind learns a joint embedding across six modalities: images, text, audio, depth, thermal and IMU data. Its authors report that image-paired data is sufficient to bind the modalities together and that the embedding enables cross-modal retrieval."}
  - {id: multimodal-models-gdpr-personal-data, class: A, sources: [multimodal-models-s6], verified: "2026-11-27", text: "Article 4(1) of the GDPR defines personal data as any information relating to an identified or identifiable natural person."}
  - {id: multimodal-models-gdpr-minimisation, class: A, sources: [multimodal-models-s6], verified: "2026-11-27", text: "Article 5(1)(c) of the GDPR requires personal data to be adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed."}
  - {id: multimodal-models-gdpr-biometric-data, class: A, sources: [multimodal-models-s6], verified: "2026-11-27", text: "Article 4(14) of the GDPR defines biometric data as personal data resulting from specific technical processing relating to the physical, physiological or behavioural characteristics of a natural person, which allow or confirm the unique identification of that person, such as facial images or dactyloscopic data."}
  - {id: multimodal-models-voice, class: A, sources: [multimodal-models-s12], verified: "2026-11-27", text: "Recital 15 of the EU AI Act describes biometric identification as the automated recognition of physical, physiological and behavioural human features such as the face and the voice, for the purpose of establishing an individual's identity."}
  - {id: multimodal-models-synthetic-marking, class: A, sources: [multimodal-models-s7], verified: "2026-11-27", text: "Article 50(2) of the consolidated EU AI Act requires providers of AI systems generating synthetic audio, image, video or text content to ensure that the outputs are marked in a machine-readable format and detectable as artificially generated or manipulated, subject to the exceptions in that paragraph."}
  - {id: multimodal-models-deepfake-disclosure, class: A, sources: [multimodal-models-s7], verified: "2026-11-27", text: "Article 50(4) of the consolidated EU AI Act requires deployers of an AI system that generates or manipulates image, audio or video content constituting a deep fake to disclose that the content has been artificially generated or manipulated, subject to the exceptions in that paragraph."}
  - {id: multimodal-models-provenance-techniques, class: A, sources: [multimodal-models-s12], verified: "2026-11-27", text: "Recital 133 of the EU AI Act names watermarks, metadata identifications, cryptographic methods for proving provenance and authenticity of content, logging methods and fingerprints among the techniques for marking generated content."}
