  - {id: fine-tuning-and-distillation-s6, title: "AWS: Amazon Bedrock User Guide, Customize your model to improve its performance for your use case", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html", kind: primary, vendor: true}
  - {id: fine-tuning-and-distillation-s7, title: "AWS: Amazon Bedrock User Guide, Customize a model with distillation in Amazon Bedrock", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html", kind: primary, vendor: true}
