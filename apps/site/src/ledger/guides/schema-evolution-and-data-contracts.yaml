sources:
  - {id: schema-evolution-and-data-contracts-s1, title: "Apache Avro: Specification, schema resolution", url: "https://avro.apache.org/docs/1.12.0/specification/#schema-resolution", kind: primary, vendor: false}
  - {id: schema-evolution-and-data-contracts-s2, title: "Protocol Buffers: Updating A Message Type", url: "https://protobuf.dev/programming-guides/proto3/#updating", kind: primary, vendor: false}
  - {id: schema-evolution-and-data-contracts-s3, title: "Confluent Platform documentation: Schema Evolution and Compatibility", url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html", kind: primary, vendor: true}
  - {id: schema-evolution-and-data-contracts-s4, title: "Open Data Contract Standard: repository and overview", url: "https://github.com/bitol-io/open-data-contract-standard", kind: primary, vendor: false}
claims:
  - {id: schema-evolution-and-data-contracts-avro-resolution, class: A, sources: [schema-evolution-and-data-contracts-s1], verified: "2026-11-25", text: "Avro schema resolution matches record fields by name. A writer field absent from the reader schema is ignored, while a reader field absent from the writer schema requires a default or resolution signals an error."}
  - {id: schema-evolution-and-data-contracts-protobuf, class: A, sources: [schema-evolution-and-data-contracts-s2], verified: "2026-11-25", text: "Protocol Buffers documents adding a new field as binary wire-safe. When removing a field, its field number must not be reused; reserving the number can prevent future reuse."}
  - {id: schema-evolution-and-data-contracts-compatibility, class: B, sources: [schema-evolution-and-data-contracts-s3], verified: "2026-11-25", text: "Schema compatibility rules describe whether consumers using different schema versions can read data written by producers using those versions. A schema registry can check a new version against previous versions before accepting it."}
  - {id: schema-evolution-and-data-contracts-modes, class: B, sources: [schema-evolution-and-data-contracts-s3], verified: "2026-11-25", text: "Backward compatibility means consumers using the new schema can read data written with the old schema. Forward compatibility means consumers using the old schema can read data written with the new schema. Full compatibility requires both."}
  - {id: schema-evolution-and-data-contracts-odcs, class: B, sources: [schema-evolution-and-data-contracts-s4], verified: "2026-11-25", text: "The Open Data Contract Standard describes an agreement between a data producer and consumers, with sections for schema, data quality, team, roles, and service-level agreement."}
  - {id: schema-evolution-and-data-contracts-governance, class: B, sources: [schema-evolution-and-data-contracts-s4], verified: "2026-11-25", text: "The Open Data Contract Standard includes team and roles, data quality, and service-level agreement sections in a data contract."}
