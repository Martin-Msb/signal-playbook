sources:
  - {id: training-validation-and-test-sets-s1, title: "scikit-learn: Cross-validation, evaluating estimator performance", url: "https://scikit-learn.org/stable/modules/cross_validation.html", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s2, title: "scikit-learn: Common pitfalls and recommended practices", url: "https://scikit-learn.org/stable/common_pitfalls.html", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s3, title: "Google Machine Learning Crash Course: Dividing the original dataset", url: "https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s4, title: "scikit-learn: train_test_split", url: "https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s5, title: "Kapoor and Narayanan: Leakage and the Reproducibility Crisis in ML-based Science, arXiv 2207.07048", url: "https://arxiv.org/abs/2207.07048", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s6, title: "Dwork, Feldman, Hardt, Pitassi, Reingold and Roth: Generalization in Adaptive Data Analysis and Holdout Reuse, arXiv 1506.02629", url: "https://arxiv.org/abs/1506.02629", kind: primary, vendor: false}
  - {id: training-validation-and-test-sets-s7, title: "Google Research: The reusable holdout, preserving validity in adaptive data analysis", url: "https://research.google/blog/the-reusable-holdout-preserving-validity-in-adaptive-data-analysis/", kind: primary, vendor: false}
claims:
  - {id: training-validation-and-test-sets-same-data, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "Learning the parameters of a prediction function and testing it on the same data is a methodological mistake: a model that just repeats the labels of the samples it has seen would have a perfect score but would fail to predict anything useful on yet-unseen data. This situation is called overfitting."}
  - {id: training-validation-and-test-sets-holdout, class: B, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "It is common practice in a supervised machine learning experiment to hold out part of the available data as a test set."}
  - {id: training-validation-and-test-sets-different-examples, class: A, sources: [training-validation-and-test-sets-s3], verified: "2026-11-27", text: "A model should be tested against a different set of examples than those used to train it."}
  - {id: training-validation-and-test-sets-random-split, class: B, sources: [training-validation-and-test-sets-s4], verified: "2026-11-27", text: "The scikit-learn function train_test_split splits arrays or matrices into random train and test subsets."}
  - {id: training-validation-and-test-sets-tuning-leak, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "When hyperparameters are evaluated on the test set there is a risk of overfitting on the test set, because the parameters can be tweaked until the estimator performs optimally. Knowledge about the test set can leak into the model and evaluation metrics no longer report on generalisation performance."}
  - {id: training-validation-and-test-sets-validation, class: A, sources: [training-validation-and-test-sets-s1, training-validation-and-test-sets-s3], verified: "2026-11-27", text: "Another part of the dataset can be held out as a validation set: training proceeds on the training set, evaluation is done on the validation set, and when the experiment seems to be successful, final evaluation can be done on the test set."}
  - {id: training-validation-and-test-sets-three-sets-cost, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "Partitioning the available data into three sets drastically reduces the number of samples which can be used for learning the model, and the results can depend on a particular random choice for the pair of train and validation sets."}
  - {id: training-validation-and-test-sets-kfold, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "In k-fold cross-validation the training set is split into k smaller sets. For each of the k folds a model is trained using k minus 1 of the folds and validated on the remaining part of the data. The performance measure reported is the average of the values computed in the loop. A test set should still be held out for final evaluation."}
  - {id: training-validation-and-test-sets-stratified, class: B, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "StratifiedKFold is a variation of k-fold which returns stratified folds: each set contains approximately the same percentage of samples of each target class as the complete set."}
  - {id: training-validation-and-test-sets-leakage, class: A, sources: [training-validation-and-test-sets-s2], verified: "2026-11-27", text: "Data leakage occurs when information that would not be available at prediction time is used when building the model. This results in overly optimistic performance estimates and poorer performance when the model is used on novel data. A common cause is not keeping the test and train data subsets separate."}
  - {id: training-validation-and-test-sets-fit-train-only, class: A, sources: [training-validation-and-test-sets-s2], verified: "2026-11-27", text: "Preprocessing transformations should only be learnt from the training data, and the general rule is to never call fit on the test data."}
  - {id: training-validation-and-test-sets-split-first, class: B, sources: [training-validation-and-test-sets-s2], verified: "2026-11-27", text: "To avoid data leakage, always split the data into train and test subsets first, particularly before any preprocessing steps. Test data should never be used to make choices about the model."}
  - {id: training-validation-and-test-sets-groups, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "The assumption of independent and identically distributed samples is broken if the underlying generative process yields groups of dependent samples. GroupKFold is a variation of k-fold which ensures that the same group is not represented in both testing and training sets."}
  - {id: training-validation-and-test-sets-time, class: A, sources: [training-validation-and-test-sets-s1], verified: "2026-11-27", text: "Time series data is characterised by correlation between observations that are near in time, so it is very important to evaluate a model for time series data on the future observations least like those used to train it. TimeSeriesSplit returns the first k folds as the train set and the fold that follows as the test set."}
  - {id: training-validation-and-test-sets-wear-out, class: A, sources: [training-validation-and-test-sets-s3], verified: "2026-11-27", text: "Test sets and validation sets wear out with repeated use: the more the same data is used to make decisions about hyperparameter settings or other model improvements, the less confidence that the model will make good predictions on new data."}
  - {id: training-validation-and-test-sets-widespread, class: A, sources: [training-validation-and-test-sets-s5], verified: "2026-11-27", text: "A survey of ML-based science found that data leakage is a widespread problem and has led to severe reproducibility failures."}
  - {id: training-validation-and-test-sets-holdout-reuse, class: A, sources: [training-validation-and-test-sets-s6, training-validation-and-test-sets-s7], verified: "2026-11-27", text: "Reusing a holdout set adaptively multiple times can easily lead to overfitting to the holdout set itself. The reusable holdout method requires that the holdout set be accessed only through a suitable differentially private algorithm."}
