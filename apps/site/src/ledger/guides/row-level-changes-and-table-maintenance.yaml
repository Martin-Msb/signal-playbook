sources:
  - {id: row-level-changes-and-table-maintenance-s1, title: "Apache Hudi documentation: Concepts", url: "https://hudi.apache.org/docs/concepts/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s2, title: "Apache Hudi documentation: Compaction", url: "https://hudi.apache.org/docs/compaction/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s3, title: "Apache Iceberg specification", url: "https://iceberg.apache.org/spec/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s4, title: "Apache Iceberg documentation: Maintenance", url: "https://iceberg.apache.org/docs/latest/maintenance/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s5, title: "Delta Lake documentation: Deletion vectors", url: "https://docs.delta.io/delta-deletion-vectors/", kind: primary, vendor: false}
claims:
  - {id: row-level-changes-and-table-maintenance-files, class: A, sources: [row-level-changes-and-table-maintenance-s1], verified: "2026-11-25", text: "In an Apache Hudi Copy-on-Write table, updates produce new versions of base files; in a Merge-on-Read table, updates are logged to delta files and later compacted into new columnar files."}
  - {id: row-level-changes-and-table-maintenance-deletes, class: A, sources: [row-level-changes-and-table-maintenance-s3], verified: "2026-11-25", text: "Apache Iceberg stores row-level deletes in delete files; deletion vectors encode deleted positions within a single data file as a bitmap."}
  - {id: row-level-changes-and-table-maintenance-compact, class: B, sources: [row-level-changes-and-table-maintenance-s2, row-level-changes-and-table-maintenance-s4], verified: "2026-11-25", text: "Compaction merges updates from log files into a new base file in Hudi Merge-on-Read tables, while Iceberg data-file rewrites combine small files and reduce metadata overhead and file-open cost."}
  - {id: row-level-changes-and-table-maintenance-expiry, class: A, sources: [row-level-changes-and-table-maintenance-s4], verified: "2026-11-25", text: "Iceberg does not delete data files while snapshots that may be used for time travel or rollback still reference them; regularly expiring snapshots deletes unused data files."}
  - {id: row-level-changes-and-table-maintenance-purge, class: A, sources: [row-level-changes-and-table-maintenance-s5], verified: "2026-11-25", text: "In Delta Lake, deletion vectors mark rows as soft-deleted; data files are physically rewritten when a purge operation runs, and the old files may remain until VACUUM removes them after the retention threshold."}
