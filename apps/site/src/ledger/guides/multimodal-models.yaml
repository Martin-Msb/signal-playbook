sources:
  - {id: multimodal-models-s1, title: "OpenAI et al.: GPT-4 Technical Report", url: "https://arxiv.org/abs/2303.08774", kind: primary, vendor: true}
  - {id: multimodal-models-s2, title: "Radford et al.: Learning Transferable Visual Models From Natural Language Supervision", url: "https://arxiv.org/abs/2103.00020", kind: primary, vendor: true}
  - {id: multimodal-models-s3, title: "Radford et al.: Robust Speech Recognition via Large-Scale Weak Supervision", url: "https://arxiv.org/abs/2212.04356", kind: primary, vendor: true}
  - {id: multimodal-models-s4, title: "OpenAI: Audio and voice", url: "https://developers.openai.com/api/docs/guides/audio", kind: primary, vendor: true}
  - {id: multimodal-models-s5, title: "Appalaraju et al.: DocFormer: End-to-End Transformer for Document Understanding", url: "https://arxiv.org/abs/2106.11539", kind: primary, vendor: false}
  - {id: multimodal-models-s6, title: "European Union: General Data Protection Regulation, consolidated text", url: "https://eur-lex.europa.eu/eli/reg/2016/679", kind: primary, vendor: false}
  - {id: multimodal-models-s7, title: "European Union: Artificial Intelligence Act, consolidated text", url: "https://eur-lex.europa.eu/eli/reg/2024/1689/2026-07-27/eng", kind: primary, vendor: false}
claims:
  - {id: multimodal-models-inputs, class: A, sources: [multimodal-models-s1], verified: "2026-11-26", text: "The GPT-4 technical report describes a model that accepts image and text inputs and produces text outputs."}
  - {id: multimodal-models-image-text-alignment, class: A, sources: [multimodal-models-s2], verified: "2026-11-26", text: "CLIP is pretrained by predicting which caption matches an image, learning image representations that natural language can reference."}
  - {id: multimodal-models-speech-recognition, class: A, sources: [multimodal-models-s3], verified: "2026-11-26", text: "Whisper studies speech processing by training models to predict transcripts from audio, including speech recognition and translation tasks."}
  - {id: multimodal-models-audio-workflows, class: B, sources: [multimodal-models-s4], verified: "2026-11-26", text: "OpenAI documents distinct audio workflows for speech-to-speech agents, transcription, live captions, translation and generated speech."}
  - {id: multimodal-models-document-layout, class: A, sources: [multimodal-models-s5], verified: "2026-11-26", text: "DocFormer combines text, visual and spatial features using multimodal self-attention for visual document understanding."}
  - {id: multimodal-models-attention, class: A, sources: [multimodal-models-s5], verified: "2026-11-26", text: "DocFormer uses multimodal self-attention to combine visual, text and spatial features, showing one architecture for relating modalities."}
  - {id: multimodal-models-gdpr-personal-data, class: A, sources: [multimodal-models-s6], verified: "2026-11-26", text: "The GDPR defines personal data as information relating to an identified or identifiable natural person."}
  - {id: multimodal-models-gdpr-biometric-data, class: A, sources: [multimodal-models-s6], verified: "2026-11-26", text: "The GDPR defines biometric data as personal data resulting from specific technical processing of physical, physiological or behavioural characteristics that allows or confirms unique identification, including facial images."}
  - {id: multimodal-models-synthetic-marking, class: A, sources: [multimodal-models-s7], verified: "2026-11-26", text: "Article 50(2) of the consolidated EU AI Act requires providers of AI systems generating synthetic audio, image, video or text content to mark outputs in a machine-readable format and make them detectable as artificially generated or manipulated, subject to the Article's scope and exceptions."}
  - {id: multimodal-models-deepfake-disclosure, class: A, sources: [multimodal-models-s7], verified: "2026-11-26", text: "Article 50(4) of the consolidated EU AI Act requires deployers of AI systems generating or manipulating image, audio or video content constituting a deepfake to disclose that it was artificially generated or manipulated, subject to the Article's exceptions."}
