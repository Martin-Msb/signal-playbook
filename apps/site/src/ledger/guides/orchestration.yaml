sources:
  - {id: orchestration-s1, title: "Apache Airflow documentation: Tasks", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/tasks.html", kind: primary, vendor: false}
  - {id: orchestration-s2, title: "Apache Airflow documentation: Backfill", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/backfill.html", kind: primary, vendor: false}
  - {id: orchestration-s3, title: "Apache Airflow documentation: UI Overview", url: "https://airflow.apache.org/docs/apache-airflow/stable/ui.html", kind: primary, vendor: false}
  - {id: orchestration-s4, title: "Dagster documentation: Defining assets", url: "https://dagster.io/docs/guides/build/assets/defining-assets", kind: primary, vendor: true}
  - {id: orchestration-s5, title: "Prefect documentation: How to automatically rerun your workflow when it fails", url: "https://www.prefect.io/docs/v3/how-to-guides/workflows/retries", kind: primary, vendor: true}
claims:
  - {id: orchestration-tasks, class: A, sources: [orchestration-s1], verified: "2026-11-27", text: "Apache Airflow arranges tasks in DAGs and uses upstream and downstream dependencies to express the order in which they should run. By default, a task runs when its upstream tasks have succeeded."}
  - {id: orchestration-retries, class: A, sources: [orchestration-s1], verified: "2026-11-27", text: "Airflow tasks can retry after failure. A failed task with retry attempts left is in the up-for-retry state and will be rescheduled. By default, Airflow retries failed tasks with a fixed count and delay regardless of the error type."}
  - {id: orchestration-prefect-retries, class: B, sources: [orchestration-s5], verified: "2026-11-27", text: "In Prefect, the retries parameter sets how many times failed work is rerun and retry_delay_seconds adds a wait between retries. Retries can be configured for individual tasks in a workflow to limit the scope of a retry, and a task is retried when the callable passed to retry_condition_fn returns True."}
  - {id: orchestration-backfill, class: B, sources: [orchestration-s2], verified: "2026-11-27", text: "Airflow backfill creates runs for past dates of a Dag with a time-based schedule. A reprocessing option determines whether existing runs are skipped, failed runs are recreated, or completed and failed runs are recreated. Setting max_active_runs on a backfill controls how many of its Dag runs can run concurrently."}
  - {id: orchestration-run-history, class: B, sources: [orchestration-s3], verified: "2026-11-27", text: "The Airflow Dag Run view displays run metadata including logical date, run type, duration and Dag version. Its Task Instances tab lists each task's state, start and end dates, and try number."}
  - {id: orchestration-dagster-assets, class: B, sources: [orchestration-s4], verified: "2026-11-27", text: "A Dagster asset definition includes an asset key, upstream asset keys from which its contents are derived, and a function that computes and stores the asset. Dagster tracks the dependencies and handles asset execution within a pipeline."}
  - {id: orchestration-governance, class: A, sources: [orchestration-s3], verified: "2026-11-27", text: "The Airflow Dag Run view's Details tab includes the run's data interval boundaries and its start and end time, and its Task Instances tab lists the state and try number of each task."}
