claims:
  - {id: warehouses-lakes-and-lakehouses-warehouse, class: B, sources: [warehouses-lakes-and-lakehouses-s1], verified: "2026-11-27", text: "Snowflake uses a central data repository for persisted data that is accessible from all compute nodes. When data is loaded into a Snowflake table, Snowflake reorganises it into its internally optimised, compressed, columnar format and manages all aspects of how the data is stored, including organisation, file size, structure, compression, metadata and statistics. Virtual warehouses, which are independent compute clusters, process SQL statements."}
  - {id: warehouses-lakes-and-lakehouses-two-tier, class: B, sources: [warehouses-lakes-and-lakehouses-s7], verified: "2026-11-27", flags: [vendor-stated], text: "In the two-tier architecture, data in a cloud data lake is loaded into a downstream data warehouse such as Redshift or Snowflake. Users pay double the storage cost for data copied to a warehouse, and commercial warehouses lock data into proprietary formats that increase the cost of migrating data or workloads to other systems."}
  - {id: warehouses-lakes-and-lakehouses-lake, class: B, sources: [warehouses-lakes-and-lakehouses-s4], verified: "2026-11-27", text: "Object storage systems are commonly used to create data lakes, and the objects are files in formats including ORC and Parquet. Trino accesses files directly on object storage through its Delta Lake, Hive, Hudi and Iceberg connectors."}
  - {id: warehouses-lakes-and-lakehouses-parquet, class: A, sources: [warehouses-lakes-and-lakehouses-s3], verified: "2026-11-25", text: "Apache Parquet is an open source, column-oriented data file format designed for efficient data storage and retrieval."}
  - {id: warehouses-lakes-and-lakehouses-lake-limits, class: A, sources: [warehouses-lakes-and-lakehouses-s2, warehouses-lakes-and-lakehouses-s7], verified: "2026-11-27", text: "Data lakes are not databases, and object storage does not provide support for ACID processing semantics. Data lake storage systems provide only a low-level object store or filesystem interface, where even an operation such as updating a table that spans multiple files is not atomic."}
  - {id: warehouses-lakes-and-lakehouses-lakehouse, class: A, sources: [warehouses-lakes-and-lakehouses-s7], verified: "2026-11-27", text: "A lakehouse is a data management system based on low-cost and directly accessible storage that also provides traditional analytical DBMS management features such as ACID transactions and data versioning. It stores data in an object store in a standard file format such as Apache Parquet and implements a transactional metadata layer on top of the object store that defines which objects are part of a table version."}
  - {id: warehouses-lakes-and-lakehouses-iceberg, class: B, sources: [warehouses-lakes-and-lakehouses-s5, warehouses-lakes-and-lakehouses-s6], verified: "2026-11-27", text: "Apache Iceberg is an open table format for huge analytic datasets, designed as an open community standard with a specification, that adds tables to compute engines including Spark and Trino. Table state is maintained in metadata files, a snapshot represents the state of a table at some time, and every change creates a new metadata file that replaces the old metadata with an atomic swap."}
  - {id: warehouses-lakes-and-lakehouses-formats, class: B, sources: [warehouses-lakes-and-lakehouses-s2], verified: "2026-11-27", text: "The three most common open table formats are Apache Hudi, Apache Iceberg and Delta Lake. Open table formats provide additional database-like functionality on data lakes."}
  - {id: warehouses-lakes-and-lakehouses-governance, class: A, sources: [warehouses-lakes-and-lakehouses-s2], verified: "2026-11-27", text: "A modern data architecture should have centralised authorisation and auditing, because configuring access policies in the data lake and across all the data stores can be overly complex and error prone."}
  - {id: warehouses-lakes-and-lakehouses-controls, class: A, sources: [warehouses-lakes-and-lakehouses-s7], verified: "2026-11-27", text: "Metadata layers are a natural place to implement governance features such as access control and audit logging. A metadata layer can check whether a client is allowed to access a table before granting it credentials to read the raw data from a cloud object store, and can log all accesses."}
