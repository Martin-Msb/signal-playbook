sources:
  - {id: observability-and-incident-response-s1, title: "OpenTelemetry: Signals", url: "https://opentelemetry.io/docs/concepts/signals/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s2, title: "dbt Developer Hub: Source freshness", url: "https://docs.getdbt.com/docs/deploy/source-freshness", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s3, title: "Prometheus: Alerting rules", url: "https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s4, title: "Google SRE Book: Incident Management", url: "https://sre.google/sre-book/managing-incidents/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s5, title: "Google SRE Book: Postmortem Culture", url: "https://sre.google/sre-book/postmortem-culture/", kind: primary, vendor: false}
claims:
  - {id: observability-and-incident-response-signals, class: A, sources: [observability-and-incident-response-s1], verified: "2026-11-26", text: "OpenTelemetry defines signals as system outputs describing underlying activity and supports traces, metrics and logs. Metrics are runtime measurements and logs are event records."}
  - {id: observability-and-incident-response-freshness, class: B, sources: [observability-and-incident-response-s2], verified: "2026-11-26", text: "dbt source freshness checks compare observed freshness with an organisation-defined service level agreement. dbt recommends checking at a frequency appropriate to the freshness target."}
  - {id: observability-and-incident-response-alerts, class: B, sources: [observability-and-incident-response-s3], verified: "2026-11-26", text: "Prometheus alerting rules evaluate expressions and can send notifications when an alert fires. A for clause can require a condition to remain active for a duration before firing; labels and annotations can carry context such as a runbook link."}
  - {id: observability-and-incident-response-triage, class: B, sources: [observability-and-incident-response-s4], verified: "2026-11-26", text: "Google SRE describes incident response roles including incident command, operational work, communication and planning, plus a live incident document retained for postmortem analysis."}
  - {id: observability-and-incident-response-record, class: B, sources: [observability-and-incident-response-s5], verified: "2026-11-26", text: "Google SRE describes a postmortem as a written record of incident impact, mitigation or resolution, causes and follow-up actions to reduce recurrence; its purpose is learning and prevention."}
