claims:
  - {id: labels-and-ground-truth-truth, class: A, sources: [labels-and-ground-truth-s2], verified: "2026-11-27", text: "Google's Machine Learning Glossary defines ground truth as reality, the thing that actually happened, and states that model quality is assessed against ground truth. It adds that ground truth is not always completely truthful: records may be incorrect, instruments may not be calibrated identically, and human raters may not evaluate events in the same way."}
  - {id: labels-and-ground-truth-made, class: A, sources: [labels-and-ground-truth-s1, labels-and-ground-truth-s2], verified: "2026-11-27", text: "Some data is human-generated: one or more humans examine some information and provide a value, usually for the label. Other data is automatically generated: software, possibly another machine learning model, determines the value. A rater, also called an annotator, is a human who provides labels for examples."}
  - {id: labels-and-ground-truth-raters, class: B, sources: [labels-and-ground-truth-s1], verified: "2026-11-27", text: "Google's Machine Learning Crash Course states that because humans err, multiple human raters might have to evaluate the same data. It advises always double-checking human raters, for example by labelling 1000 examples yourself and comparing the results, and adding instructions if raters have introduced errors."}
  - {id: labels-and-ground-truth-criteria, class: B, sources: [labels-and-ground-truth-s1], verified: "2026-11-27", text: "Google's Machine Learning Crash Course lists as an advantage of human-generated data that the process forces the owner of the dataset to develop clear and consistent criteria."}
  - {id: labels-and-ground-truth-agreement, class: A, sources: [labels-and-ground-truth-s2], verified: "2026-11-27", text: "Inter-rater agreement, also called inter-annotator agreement, is a measurement of how often human raters agree when doing a task. If raters disagree, the task instructions may need to be improved. Cohen's kappa is one of the most popular inter-rater agreement measurements."}
  - {id: labels-and-ground-truth-kappa, class: A, sources: [labels-and-ground-truth-s3], verified: "2026-11-27", text: "Cohen's kappa expresses the level of agreement between two annotators on a classification problem. It is (p_o - p_e) / (1 - p_e), where p_o is the observed agreement ratio and p_e is the expected agreement when both annotators assign labels randomly. It lies between -1.0 and 1.0: the maximum means complete agreement, and 0.0 means no agreement beyond what would be expected by chance."}
  - {id: labels-and-ground-truth-errors, class: B, sources: [labels-and-ground-truth-s5], verified: "2026-11-27", text: "A 2021 study of the test sets of 10 of the most commonly used computer vision, natural language and audio datasets estimated an average of at least 3.3% label errors across them, and at least 6% in the ImageNet validation set. Its findings advise caution in choosing a model on test accuracy and propose that judging models over correctly labelled test sets may be more useful."}
  - {id: labels-and-ground-truth-delay, class: B, sources: [labels-and-ground-truth-s7], verified: "2026-11-27", text: "In an interview study of 18 machine learning engineers, many participants said that ground-truth labels for live predictions often arrived after a delay, which could vary unpredictably, and that this caused problems for knowing real-time performance or retraining regularly. One participant reported feedback that is always delayed by at least two weeks."}
  - {id: labels-and-ground-truth-proxy, class: A, sources: [labels-and-ground-truth-s1, labels-and-ground-truth-s2], verified: "2026-11-27", text: "A direct label is identical to the prediction the model is trying to make. A proxy label is similar but not identical to it, and is always a compromise: an imperfect approximation of a direct label. Models that use proxy labels are only as useful as the connection between the proxy label and the prediction."}
  - {id: labels-and-ground-truth-bias, class: A, sources: [labels-and-ground-truth-s8], verified: "2026-11-27", text: "A 2019 study in Science found significant racial bias in a widely used commercial algorithm for identifying patients with complex health needs. The bias arose because the algorithm predicted health care costs rather than illness, while unequal access to care meant less money was spent on Black patients. The authors suggest that the choice of convenient, seemingly effective proxies for ground truth can be an important source of algorithmic bias."}
  - {id: labels-and-ground-truth-flipping, class: A, sources: [labels-and-ground-truth-s9], verified: "2026-11-27", text: "NIST AI 100-2 E2025 describes label flipping as a simple black-box poisoning attack strategy in which an adversary generates training examples with incorrect or altered labels, and defines it as a type of data poisoning attack in which an adversary is restricted to changing the training labels."}
  - {id: labels-and-ground-truth-sanitise, class: B, sources: [labels-and-ground-truth-s9], verified: "2026-11-27", text: "Among existing mitigations for availability poisoning attacks, NIST AI 100-2 E2025 lists training data sanitization: techniques designed to clean the training set and remove the poisoned samples before training is performed."}
  - {id: labels-and-ground-truth-weak, class: B, sources: [labels-and-ground-truth-s4], verified: "2026-11-27", text: "Snorkel is a weak supervision system in which users write labelling functions that express arbitrary heuristics, which can have unknown accuracies and correlations, in place of hand labelling training data. Snorkel denoises their outputs without access to ground truth."}
  - {id: labels-and-ground-truth-active, class: A, sources: [labels-and-ground-truth-s6, labels-and-ground-truth-s2], verified: "2026-11-27", text: "In active learning the algorithm chooses some of the data it learns from: an active learner poses queries, usually unlabelled instances to be labelled by an oracle such as a human annotator, aiming for high accuracy with as few labelled instances as possible. In uncertainty sampling it queries the instances about which it is least certain how to label. Active learning is particularly valuable when labelled examples are scarce or expensive to obtain."}
  - {id: labels-and-ground-truth-ai-act, class: C, sources: [labels-and-ground-truth-s10], verified: "2026-11-27", text: "In the consolidated text of 27 July 2026, Article 10 of Regulation (EU) 2024/1689 states that training, validation and testing data sets of high-risk AI systems shall be subject to data governance and management practices. These concern, among other things, data-preparation operations such as annotation and labelling, the formulation of assumptions about what the data are supposed to measure and represent, and examination in view of possible biases. The data sets shall be, to the best extent possible, free of errors."}
  - {id: labels-and-ground-truth-personal, class: A, sources: [labels-and-ground-truth-s11], verified: "2026-11-27", text: "The GDPR defines personal data as any information relating to an identified or identifiable natural person. Its principles require personal data to be collected for specified, explicit and legitimate purposes, and to be accurate and, where necessary, kept up to date."}
