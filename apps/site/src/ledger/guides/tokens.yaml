sources:
  - {id: tokens-s1, title: "Anthropic: Glossary", url: "https://platform.claude.com/docs/en/about-claude/glossary", kind: primary, vendor: true}
  - {id: tokens-s2, title: "Anthropic: Token counting", url: "https://platform.claude.com/docs/en/build-with-claude/token-counting", kind: primary, vendor: true}
  - {id: tokens-s3, title: "Anthropic: Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows", kind: primary, vendor: true}
  - {id: tokens-s4, title: "Anthropic: Pricing", url: "https://platform.claude.com/docs/en/about-claude/pricing", kind: primary, vendor: true}
  - {id: tokens-s5, title: "Anthropic: Rate limits", url: "https://platform.claude.com/docs/en/api/rate-limits", kind: primary, vendor: true}
  - {id: tokens-s6, title: "Anthropic: Models overview", url: "https://platform.claude.com/docs/en/about-claude/models/overview", kind: primary, vendor: true}
  - {id: tokens-s7, title: "Anthropic: Handling stop reasons", url: "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", kind: primary, vendor: true}
  - {id: tokens-s8, title: "Sennrich, Haddow and Birch: Neural Machine Translation of Rare Words with Subword Units", url: "https://arxiv.org/abs/1508.07909", kind: primary, vendor: false}
  - {id: tokens-s9, title: "Radford et al.: Language Models are Unsupervised Multitask Learners", url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf", kind: primary, vendor: false}
  - {id: tokens-s10, title: "OpenAI: tiktoken README", url: "https://github.com/openai/tiktoken/blob/main/README.md", kind: primary, vendor: true}
  - {id: tokens-s11, title: "SentencePiece: README", url: "https://github.com/google/sentencepiece/blob/master/README.md", kind: primary, vendor: false}
  - {id: tokens-s12, title: "Google: Gemini API, Understand and count tokens", url: "https://ai.google.dev/gemini-api/docs/tokens", kind: primary, vendor: true}
claims:
  - {id: tokens-fixed-vocabulary, class: A, sources: [tokens-s8], verified: "2026-11-25", text: "Neural machine translation models typically operate with a fixed vocabulary, and word-level models are unable to translate or generate unseen words."}
  - {id: tokens-subword-units, class: A, sources: [tokens-s8], verified: "2026-11-25", text: "Encoding rare and unknown words as sequences of subword units makes a model capable of open-vocabulary translation. Names, compounds, cognates and loanwords are translatable via units smaller than words."}
  - {id: tokens-bpe, class: A, sources: [tokens-s8], verified: "2026-11-25", text: "Byte pair encoding for word segmentation starts from a vocabulary of characters and iteratively replaces the most frequent pair of symbols with a new symbol, so frequent words are eventually merged into a single symbol. The final vocabulary size equals the initial vocabulary plus the number of merge operations."}
  - {id: tokens-bpe-any-word, class: A, sources: [tokens-s8], verified: "2026-11-25", text: "To segment a new word, it is split into characters and the learned merge operations are applied. This is applicable to any word and allows open-vocabulary networks with fixed symbol vocabularies."}
  - {id: tokens-byte-level, class: A, sources: [tokens-s9], verified: "2026-11-25", text: "Byte pair encoding is a practical middle ground between character and word level language modelling. A byte-level version of BPE only requires a base vocabulary of size 256, and the resulting model can assign a probability to any Unicode string."}
  - {id: tokens-definition, class: A, sources: [tokens-s1], verified: "2026-11-25", text: "Tokens are the smallest individual units of a language model and can correspond to words, subwords, characters or bytes. Larger tokens improve data efficiency, whereas smaller tokens allow a model to handle uncommon or never-before-seen words."}
  - {id: tokens-encoded, class: A, sources: [tokens-s1, tokens-s10], verified: "2026-11-25", text: "Text given to a model is encoded into a series of tokens for the model to process. Language models see a sequence of numbers, known as tokens."}
  - {id: tokens-reversible, class: A, sources: [tokens-s10], verified: "2026-11-25", text: "Byte pair encoding is reversible and lossless, so tokens can be converted back into the original text, and it works on arbitrary text, even text that is not in the tokeniser's training data."}
  - {id: tokens-tools, class: B, sources: [tokens-s10, tokens-s11], verified: "2026-11-25", text: "tiktoken is a BPE tokeniser for use with OpenAI's models. SentencePiece implements subword units, including byte pair encoding and the unigram language model, for systems where the vocabulary size is fixed prior to training."}
  - {id: tokens-size, class: C, sources: [tokens-s10, tokens-s12], verified: "2026-11-25", flags: [vendor-stated], text: "OpenAI states that with BPE each token corresponds to about 4 bytes on average. Google states that for Gemini models a token is equivalent to about 4 characters and 100 tokens equal about 60 to 80 English words."}
  - {id: tokens-count-varies, class: C, sources: [tokens-s1, tokens-s2], verified: "2026-11-25", flags: [vendor-stated], text: "For Claude, the number of characters a token represents depends on the model and the language. Claude 4.7 and later models use a newer tokeniser that produces approximately 30 percent more tokens for the same text than earlier models."}
  - {id: tokens-counting, class: B, sources: [tokens-s2], verified: "2026-11-25", text: "Token counting determines the number of tokens in a message before it is sent to Claude. The count is an estimate and is made under the tokeniser of the model named in the request."}
  - {id: tokens-window, class: A, sources: [tokens-s3], verified: "2026-11-25", text: "The context window is all the text a language model can reference when generating a response, including the response itself. The system prompt, every message, the tool definitions and the output generated for the turn all count toward it."}
  - {id: tokens-turns, class: A, sources: [tokens-s3], verified: "2026-11-25", text: "Each turn's input contains all previous conversation history plus the current user message, and the generated response becomes part of the input for the next turn."}
  - {id: tokens-window-size, class: C, sources: [tokens-s3, tokens-s6], verified: "2026-11-25", text: "Claude Sonnet 5.5 has a 1M-token context window, and a single Messages API request to a model with a 1M-token context window can generate up to 128k output tokens."}
  - {id: tokens-overflow, class: B, sources: [tokens-s3], verified: "2026-11-25", text: "If the input alone exceeds the model's context window, the Claude API returns a 400 invalid_request_error with the message prompt is too long."}
  - {id: tokens-max-output, class: B, sources: [tokens-s7], verified: "2026-11-25", text: "A Claude API response ends with the stop reason max_tokens when it reaches the max_tokens limit specified in the request."}
  - {id: tokens-usage, class: B, sources: [tokens-s3, tokens-s12], verified: "2026-11-25", text: "Every Claude API response reports what the request consumed in its usage field. The Gemini API returns token counts for input and output in the usage of each response."}
  - {id: tokens-rate-limits, class: B, sources: [tokens-s5], verified: "2026-11-25", text: "Rate limits for the Claude Messages API are measured in requests per minute, input tokens per minute and output tokens per minute for each model class. Exceeding a rate limit returns a 429 error."}
  - {id: tokens-spend-limits, class: B, sources: [tokens-s5], verified: "2026-11-25", text: "Spend limits set a maximum monthly cost an organisation can incur for API usage, and custom spend and rate limits can be set for each workspace."}
  - {id: tokens-price-unit, class: B, sources: [tokens-s4, tokens-s12], verified: "2026-11-25", text: "Anthropic lists model prices per million tokens, written MTok, with separate prices for input tokens and output tokens. The cost of a call to the Gemini API is determined in part by the number of input and output tokens."}
  - {id: tokens-price, class: C, sources: [tokens-s4, tokens-s6], verified: "2026-11-25", text: "Claude Sonnet 5.5 is priced at $2 per million input tokens and $10 per million output tokens."}
