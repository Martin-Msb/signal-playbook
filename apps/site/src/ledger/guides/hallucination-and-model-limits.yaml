  - {id: hallucination-and-model-limits-s2, title: "OpenAI: File search", url: "https://developers.openai.com/api/docs/guides/tools-file-search", kind: primary, vendor: true}
  - {id: hallucination-and-model-limits-s3, title: "NIST: Artificial Intelligence Risk Management Framework 1.0 (NIST AI 100-1)", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
  - {id: hallucination-and-model-limits-s4, title: "European Union: Artificial Intelligence Act, consolidated text", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
  - {id: hallucination-and-model-limits-s5, title: "Anthropic: Glossary", url: "https://platform.claude.com/docs/en/about-claude/glossary", kind: primary, vendor: true}
  - {id: hallucination-and-model-limits-s6, title: "Anthropic: Reduce hallucinations", url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", kind: primary, vendor: true}
  - {id: hallucination-and-model-limits-s7, title: "Anthropic: Models overview", url: "https://platform.claude.com/docs/en/about-claude/models/overview", kind: primary, vendor: true}
  - {id: hallucination-and-model-limits-s8, title: "Lewis et al.: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", url: "https://arxiv.org/pdf/2005.11401", kind: primary, vendor: false}
  - {id: hallucination-and-model-limits-s9, title: "Anthropic: Citations", url: "https://platform.claude.com/docs/en/build-with-claude/citations", kind: primary, vendor: true}
claims:
  - {id: hallucination-and-model-limits-confabulation, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-27", text: "NIST uses confabulation for generative AI systems generating and confidently presenting erroneous or false content in response to prompts, and says these phenomena are colloquially also called hallucinations or fabrications. Confabulations also include outputs that diverge from the prompts or other input, or that contradict previously generated statements in the same context."}
  - {id: hallucination-and-model-limits-statistical, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-27", text: "NIST says confabulations are a natural result of the way generative models are designed: they generate outputs that approximate the statistical distribution of their training data, and LLMs predict the next token or word. Such statistical prediction can produce factually accurate and consistent outputs, and it can also produce outputs that are factually inaccurate or internally inconsistent."}
  - {id: hallucination-and-model-limits-risk, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-27", text: "NIST says risks from confabulations may arise when users believe false content, often due to the confident nature of the response, leading them to act upon or promote it. It says these risks may be especially important to monitor when generative AI is integrated into applications involving consequential decision making."}
  - {id: hallucination-and-model-limits-false-citations, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-27", text: "NIST says generative AI outputs may also include confabulated logic or citations that purport to justify or explain the system's answer, which may further mislead humans into inappropriately trusting the output."}
  - {id: hallucination-and-model-limits-nondeterminism, class: B, sources: [hallucination-and-model-limits-s5], verified: "2026-11-27", text: "Anthropic's glossary describes temperature as a parameter that controls the randomness of a model's predictions during text generation. It says that even with temperature set to 0 the results will not be fully deterministic, and identical inputs might produce different outputs across API calls."}
  - {id: hallucination-and-model-limits-compare-runs, class: B, sources: [hallucination-and-model-limits-s6], verified: "2026-11-27", text: "Anthropic's documentation describes best-of-N verification: run the model through the same prompt multiple times and compare the outputs. It says inconsistencies across outputs could indicate hallucinations."}
  - {id: hallucination-and-model-limits-cutoff, class: B, sources: [hallucination-and-model-limits-s7], verified: "2026-11-27", text: "Anthropic's models overview lists a training data cutoff and a reliable knowledge cutoff for each current model. It defines the reliable knowledge cutoff as the date through which the model's knowledge is most extensive and reliable."}
  - {id: hallucination-and-model-limits-parametric, class: A, sources: [hallucination-and-model-limits-s8], verified: "2026-11-27", text: "Lewis et al. (2020) write that pre-trained language models store knowledge in their parameters, cannot easily expand or revise their memory, cannot straightforwardly provide insight into their predictions, and may produce hallucinations. They describe providing provenance for decisions and updating world knowledge as open research problems, and say that combining such models with retrieval-based memory can address some of these issues."}
  - {id: hallucination-and-model-limits-grounding, class: B, sources: [hallucination-and-model-limits-s6, hallucination-and-model-limits-s5], verified: "2026-11-27", text: "Anthropic's documentation lists external knowledge restriction among techniques to minimise hallucinations: explicitly instruct the model to only use information from provided documents and not its general knowledge. Its glossary describes retrieval augmented generation as passing an external knowledge base or a set of documents into the context window to better ground the model's response in evidence."}
  - {id: hallucination-and-model-limits-abstention, class: B, sources: [hallucination-and-model-limits-s6], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic's documentation advises explicitly giving the model permission to admit uncertainty, to say it does not know. Anthropic states that this technique can drastically reduce false information."}
  - {id: hallucination-and-model-limits-citations, class: B, sources: [hallucination-and-model-limits-s9, hallucination-and-model-limits-s6], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic documents a citations feature that returns citations when the model answers questions about provided documents, to help track and verify the sources behind each response. Anthropic states that because the API extracts the cited text directly, citations are guaranteed to contain valid pointers to the provided documents. Its guidance on hallucinations advises making a response auditable by having the model cite quotes and sources for each of its claims."}
  - {id: hallucination-and-model-limits-file-citations, class: B, sources: [hallucination-and-model-limits-s2], verified: "2026-11-27", text: "OpenAI documents that a file search response includes a message output item containing the model's response along with file citations, which appear as annotations in the output text."}
  - {id: hallucination-and-model-limits-not-eliminated, class: B, sources: [hallucination-and-model-limits-s6], verified: "2026-11-27", text: "Anthropic's documentation says its techniques significantly reduce hallucinations but do not eliminate them entirely, and advises always validating critical information, especially for high-stakes decisions."}
  - {id: hallucination-and-model-limits-human-review, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-27", text: "NIST says organisations' use of generative AI systems may warrant additional human review, tracking and documentation, and greater management oversight."}
  - {id: hallucination-and-model-limits-oversight-roles, class: A, sources: [hallucination-and-model-limits-s3], verified: "2026-11-27", text: "NIST's AI Risk Management Framework says human roles and responsibilities in decision making and overseeing AI systems need to be clearly defined and differentiated, and that some AI systems may specifically require human oversight."}
  - {id: hallucination-and-model-limits-disclosure, class: C, sources: [hallucination-and-model-limits-s4], verified: "2026-11-27", text: "Article 50(1) of the EU AI Act, in the consolidated text, requires providers to ensure that AI systems intended to interact directly with natural persons are designed and developed so that the persons concerned are informed that they are interacting with an AI system, unless this is obvious to a reasonably well-informed, observant and circumspect person given the circumstances and context of use."}
