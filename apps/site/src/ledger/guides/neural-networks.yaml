  - {id: neural-networks-s12, title: "NIST AI 100-1: Artificial Intelligence Risk Management Framework (AI RMF 1.0)", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
claims:
  - {id: neural-networks-linear-limit, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "Linear models, such as logistic regression and linear regression, can be fit efficiently and reliably. Their model capacity is limited to linear functions, so the model cannot understand the interaction between any two input variables."}
  - {id: neural-networks-hidden-layer, class: A, sources: [neural-networks-s3], verified: "2026-11-25", text: "Layers between the input layer and the output layer are called hidden layers. The value of each neuron in a hidden layer is the sum of the product of each of its inputs and a unique weight parameter, plus the bias."}
  - {id: neural-networks-parameters, class: A, sources: [neural-networks-s3], verified: "2026-11-25", text: "A network's parameters are its weights and biases. Each node is calculated from one weight for each of its inputs and a bias."}
  - {id: neural-networks-still-linear, class: A, sources: [neural-networks-s3, neural-networks-s1], verified: "2026-11-25", text: "Linear calculations performed on the output of linear calculations are also linear, so a network whose hidden layer is linear remains a linear function of its input and cannot learn nonlinearities."}
  - {id: neural-networks-activation, class: A, sources: [neural-networks-s4], verified: "2026-11-25", text: "An activation function is a nonlinear transform of a neuron's output value before the value is passed as input to the next layer. Stacking nonlinearities on nonlinearities lets a network model very complicated relationships between the inputs and the predicted outputs."}
  - {id: neural-networks-relu, class: A, sources: [neural-networks-s4, neural-networks-s1], verified: "2026-11-25", text: "The rectified linear unit, ReLU, returns 0 if its input is less than 0 and returns the input otherwise: max(0, x). Sigmoid, tanh and ReLU are three functions commonly used as activation functions."}
  - {id: neural-networks-relu-default, class: B, sources: [neural-networks-s1, neural-networks-s4], verified: "2026-11-25", text: "In modern neural networks the default recommendation is to use the rectified linear unit. It is less susceptible to the vanishing gradient problem than sigmoid or tanh and significantly easier to compute."}
  - {id: neural-networks-forward, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "In forward propagation the input provides the initial information, which propagates up to the hidden units at each layer and finally produces the output. During training, forward propagation can continue onward until it produces a scalar cost."}
  - {id: neural-networks-backprop, class: A, sources: [neural-networks-s1, neural-networks-s5], verified: "2026-11-25", text: "The back-propagation algorithm allows the information from the cost to flow backward through the network in order to compute the gradient. It makes gradient descent feasible for multi-layer neural networks."}
  - {id: neural-networks-backprop-scope, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "Back-propagation refers only to the method for computing the gradient. Another algorithm, such as stochastic gradient descent, is used to perform learning using this gradient."}
  - {id: neural-networks-pytorch-autograd, class: B, sources: [neural-networks-s8], verified: "2026-11-25", text: "When training neural networks, the most frequently used algorithm is back propagation. PyTorch has a built-in differentiation engine called torch.autograd, which supports automatic computation of gradient for any computational graph."}
  - {id: neural-networks-pytorch-loop, class: B, sources: [neural-networks-s9], verified: "2026-11-25", text: "In a PyTorch training loop, loss.backward() backpropagates the prediction loss and PyTorch deposits the gradients of the loss with respect to each parameter. optimizer.step() then adjusts the parameters by the gradients collected in the backward pass."}
  - {id: neural-networks-learned-features, class: A, sources: [neural-networks-s2], verified: "2026-11-25", text: "Back-propagation repeatedly adjusts the weights of the connections in the network so as to minimise a measure of the difference between the actual output and the desired output. As a result of the weight adjustments, hidden units which are not part of the input or output come to represent important features of the task domain."}
  - {id: neural-networks-hidden-unspecified, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "The training examples specify directly what the output layer must do. The training data do not say what each of the other layers should do, and because the training data does not show the desired output for these layers they are called hidden layers."}
  - {id: neural-networks-learn-features, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "Manually engineering the features that describe the input was the dominant approach until the advent of deep learning. The strategy of deep learning is to learn them."}
  - {id: neural-networks-output-linear, class: A, sources: [neural-networks-s1], verified: "2026-11-25", text: "In a feedforward network with one hidden layer, the output layer is still just a linear regression model, applied to the hidden units rather than to the input."}
  - {id: neural-networks-overfitting, class: A, sources: [neural-networks-s6], verified: "2026-11-25", text: "Deep neural nets with a large number of parameters are very powerful machine learning systems. However, overfitting is a serious problem in such networks."}
  - {id: neural-networks-dropout, class: A, sources: [neural-networks-s6, neural-networks-s5], verified: "2026-11-25", text: "Dropout randomly drops units, along with their connections, from the neural network during training, for a single gradient step at a time. This prevents units from co-adapting too much. At test time a single unthinned network with smaller weights is used."}
  - {id: neural-networks-batchnorm, class: A, sources: [neural-networks-s7], verified: "2026-11-25", text: "Batch Normalization normalises layer inputs for each training mini-batch. Its authors state that it allows much higher learning rates and less careful initialisation, and that it also acts as a regulariser."}
  - {id: neural-networks-gradients, class: A, sources: [neural-networks-s5], verified: "2026-11-25", text: "The gradients for the layers closer to the input layer can become very small, and layers with vanishing gradients train very slowly or not at all. The ReLU activation function can help prevent vanishing gradients, and batch normalization can help prevent exploding gradients."}
  - {id: neural-networks-pytorch-modes, class: B, sources: [neural-networks-s10, neural-networks-s11, neural-networks-s9], verified: "2026-11-25", text: "PyTorch's nn.Dropout randomly zeroes elements of its input with probability p during training and computes an identity function during evaluation. nn.BatchNorm1d applies Batch Normalization and by default keeps running estimates of mean and variance during training, which are used for normalisation during evaluation. The PyTorch tutorial sets the model to training or evaluation mode because that matters for batch normalization and dropout layers."}
  - {id: neural-networks-opacity, class: A, sources: [neural-networks-s12], verified: "2026-11-25", text: "The NIST AI Risk Management Framework states that inscrutable AI systems can complicate risk measurement, and that inscrutability can be a result of the opaque nature of AI systems, meaning limited explainability or interpretability."}
  - {id: neural-networks-opaque-assurance, class: A, sources: [neural-networks-s12], verified: "2026-11-25", text: "The NIST AI Risk Management Framework states that it is difficult to determine whether an opaque system is accurate, privacy-enhanced, secure or fair, and to do so over time as complex systems evolve. It also states that explainable systems can be debugged and monitored more easily."}
  - {id: neural-networks-validate-monitor, class: B, sources: [neural-networks-s12], verified: "2026-11-25", text: "The MEASURE function of the NIST AI Risk Management Framework includes that the AI model is explained, validated and documented, and that the functionality and behaviour of the AI system and its components are monitored when in production."}
