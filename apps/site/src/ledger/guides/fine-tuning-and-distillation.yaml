  - {id: fine-tuning-and-distillation-s10, title: "Hugging Face: PEFT checkpoint format", url: "https://huggingface.co/docs/peft/developer_guides/checkpoint", kind: primary, vendor: false}
  - {id: fine-tuning-and-distillation-s11, title: "NIST: AI 600-1, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile, July 2024", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
  - {id: fine-tuning-and-distillation-s12, title: "OpenAI: Model optimization", url: "https://developers.openai.com/api/docs/guides/model-optimization", kind: primary, vendor: true}
  - {id: fine-tuning-and-distillation-s13, title: "OpenAI: Supervised fine-tuning", url: "https://developers.openai.com/api/docs/guides/supervised-fine-tuning", kind: primary, vendor: true}
claims:
  - {id: fine-tuning-and-distillation-prompt, class: A, sources: [fine-tuning-and-distillation-s5], verified: "2026-11-27", text: "Prompt engineering does not alter the model's parameters."}
  - {id: fine-tuning-and-distillation-shorter-prompts, class: B, sources: [fine-tuning-and-distillation-s12], verified: "2026-11-27", text: "OpenAI states that fine-tuning lets a developer provide more example inputs and outputs than could fit within the context window of a single request, and use shorter prompts with fewer examples and context data."}
  - {id: fine-tuning-and-distillation-sft, class: A, sources: [fine-tuning-and-distillation-s6, fine-tuning-and-distillation-s5], verified: "2026-11-27", text: "Fine-tuning trains on examples specific to the task an application will perform. In supervised fine-tuning a training dataset of labelled examples teaches the model what types of outputs to generate for certain types of inputs, and the model parameters are adjusted in the process."}
  - {id: fine-tuning-and-distillation-example-count, class: B, sources: [fine-tuning-and-distillation-s5], verified: "2026-11-27", text: "Engineers can sometimes fine-tune a foundation LLM on just a few hundred or a few thousand training examples."}
  - {id: fine-tuning-and-distillation-full-cost, class: A, sources: [fine-tuning-and-distillation-s5, fine-tuning-and-distillation-s1], verified: "2026-11-27", text: "Standard fine-tuning updates the weight and bias of every parameter on each backpropagation iteration and is often computationally expensive. As pre-trained models grow, full fine-tuning, which retrains all model parameters, becomes less feasible. Parameter-efficient tuning adjusts only a subset of parameters."}
  - {id: fine-tuning-and-distillation-lora, class: A, sources: [fine-tuning-and-distillation-s1], verified: "2026-11-27", text: "LoRA freezes the pre-trained model weights and injects trainable rank decomposition matrices into each layer of the Transformer architecture, greatly reducing the number of trainable parameters for downstream tasks."}
  - {id: fine-tuning-and-distillation-lora-results, class: A, sources: [fine-tuning-and-distillation-s1], verified: "2026-11-27", text: "The LoRA paper reports that, compared to GPT-3 175B fine-tuned with Adam, LoRA can reduce the number of trainable parameters by 10,000 times and the GPU memory requirement by 3 times, and that it performs on par or better than fine-tuning in model quality on RoBERTa, DeBERTa, GPT-2 and GPT-3 with no additional inference latency."}
  - {id: fine-tuning-and-distillation-peft, class: B, sources: [fine-tuning-and-distillation-s9, fine-tuning-and-distillation-s10], verified: "2026-11-27", text: "PEFT methods fine-tune only a small number of extra model parameters, which decreases computational and storage costs while yielding performance comparable to a fully fine-tuned model. A PEFT checkpoint contains only the parameters of the adapter module, not the base model, so the original model must be available to load it."}
  - {id: fine-tuning-and-distillation-adapter-config, class: B, sources: [fine-tuning-and-distillation-s10], verified: "2026-11-27", text: "The adapter_config.json file saved with a PEFT adapter contains the adapter module type, information about the base model in base_model_name_or_path, and the revision of the model if any."}
  - {id: fine-tuning-and-distillation-distil, class: A, sources: [fine-tuning-and-distillation-s2, fine-tuning-and-distillation-s6], verified: "2026-11-27", text: "Hinton, Vinyals and Dean distil the knowledge in an ensemble of models into a single model that is much easier to deploy. Distillation transfers knowledge from a larger model, known as the teacher, to a smaller, faster and cost-efficient model, known as the student."}
  - {id: fine-tuning-and-distillation-distil-how, class: B, sources: [fine-tuning-and-distillation-s7], verified: "2026-11-27", text: "Amazon Bedrock Model Distillation generates responses from the teacher model for the prompts provided and uses the responses to fine-tune the student model. Existing teacher responses stored in invocation logs can be used as the training data instead."}
  - {id: fine-tuning-and-distillation-distil-cost, class: A, sources: [fine-tuning-and-distillation-s5, fine-tuning-and-distillation-s3], verified: "2026-11-27", text: "A distilled model's predictions are generally not quite as good as the original LLM's predictions. The DistilBERT paper reports reducing the size of a BERT model by 40%, while retaining 97% of its language understanding capabilities and being 60% faster."}
  - {id: fine-tuning-and-distillation-memorisation, class: A, sources: [fine-tuning-and-distillation-s4, fine-tuning-and-distillation-s11], verified: "2026-11-27", text: "A training data extraction attack on GPT-2 recovered hundreds of verbatim text sequences from the model's training data by querying the model, including names, phone numbers and email addresses, even though each sequence was included in just one document in the training data. NIST calls this problem data memorization and states it may pose privacy risks even for data present only in a small number of training samples."}
  - {id: fine-tuning-and-distillation-rights, class: B, sources: [fine-tuning-and-distillation-s11], verified: "2026-11-27", text: "NIST AI 600-1 suggests conducting appropriate diligence on training data use to assess intellectual property and privacy risks, including examining whether use of proprietary or sensitive training data is consistent with applicable laws."}
  - {id: fine-tuning-and-distillation-inventory, class: B, sources: [fine-tuning-and-distillation-s11], verified: "2026-11-27", text: "NIST AI 600-1 suggests that inventory entries for generative AI systems consider data provenance information, special rights and considerations for intellectual property, licensed works, or personal, privileged, proprietary or sensitive data, and the underlying foundation models and versions of underlying models."}
  - {id: fine-tuning-and-distillation-base-lifetime, class: C, sources: [fine-tuning-and-distillation-s13], verified: "2026-11-27", text: "OpenAI states that it is winding down its fine-tuning platform and that fine-tuned models remain available for inference until their base model shuts down."}
  - {id: fine-tuning-and-distillation-retrieval, class: B, sources: [fine-tuning-and-distillation-s8], verified: "2026-11-27", text: "AWS guidance states that RAG can incorporate the latest documents in a few minutes and provides a reference to the information source, while fine-tuning can take a few hours to days, so it might not be a good solution if custom documents change frequently, and fine-tuned models do not provide a reference to the source in their responses."}
  - {id: fine-tuning-and-distillation-prompt-first, class: B, sources: [fine-tuning-and-distillation-s12], verified: "2026-11-27", text: "OpenAI states that the prompt engineering process may be all that is needed to get great results for a use case, and that fine-tuning can be a time-consuming process. Its guidance is to write evals that measure model output, establishing a baseline for performance and accuracy."}
