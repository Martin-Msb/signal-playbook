sources:
  - {id: model-selection-and-tuning-s1, title: "scikit-learn: Tuning the hyper-parameters of an estimator", url: "https://scikit-learn.org/stable/modules/grid_search.html", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s2, title: "Bergstra and Bengio: Random Search for Hyper-Parameter Optimization, Journal of Machine Learning Research 13, 2012", url: "https://www.jmlr.org/papers/v13/bergstra12a.html", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s3, title: "Snoek, Larochelle and Adams: Practical Bayesian Optimization of Machine Learning Algorithms, arXiv 1206.2944", url: "https://arxiv.org/abs/1206.2944", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s4, title: "Cawley and Talbot: On Over-fitting in Model Selection and Subsequent Selection Bias in Performance Evaluation, Journal of Machine Learning Research 11, 2010", url: "https://www.jmlr.org/papers/v11/cawley10a.html", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s5, title: "scikit-learn: Nested versus non-nested cross-validation", url: "https://scikit-learn.org/stable/auto_examples/model_selection/plot_nested_cross_validation_iris.html", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s6, title: "Erickson et al.: AutoGluon-Tabular, Robust and Accurate AutoML for Structured Data, arXiv 2003.06505", url: "https://arxiv.org/abs/2003.06505", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s7, title: "Erickson et al.: TabArena, A Living Benchmark for Machine Learning on Tabular Data, arXiv 2506.16791", url: "https://arxiv.org/abs/2506.16791", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s8, title: "scikit-learn: Common pitfalls and recommended practices, Controlling randomness", url: "https://scikit-learn.org/stable/common_pitfalls.html", kind: primary, vendor: false}
  - {id: model-selection-and-tuning-s9, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
claims:
  - {id: model-selection-and-tuning-hyper, class: A, sources: [model-selection-and-tuning-s1], verified: "2026-11-27", text: "Hyper-parameters are parameters that are not directly learnt within estimators. It is possible and recommended to search the hyper-parameter space for the best cross validation score."}
  - {id: model-selection-and-tuning-search, class: B, sources: [model-selection-and-tuning-s1], verified: "2026-11-27", text: "A search consists of an estimator, a parameter space, a method for searching or sampling candidates, a cross-validation scheme and a score function."}
  - {id: model-selection-and-tuning-grid-random, class: B, sources: [model-selection-and-tuning-s1], verified: "2026-11-27", text: "For given values, GridSearchCV exhaustively considers all parameter combinations, while RandomizedSearchCV can sample a given number of candidates from a parameter space with a specified distribution. For randomised search a budget can be chosen independent of the number of parameters and possible values, and adding parameters that do not influence the performance does not decrease efficiency."}
  - {id: model-selection-and-tuning-random-efficient, class: A, sources: [model-selection-and-tuning-s2], verified: "2026-11-27", text: "Bergstra and Bengio show empirically and theoretically that randomly chosen trials are more efficient for hyper-parameter optimisation than trials on a grid. For most data sets only a few of the hyper-parameters really matter, but different hyper-parameters are important on different data sets."}
  - {id: model-selection-and-tuning-bayesian, class: A, sources: [model-selection-and-tuning-s3], verified: "2026-11-27", text: "In Bayesian optimisation a learning algorithm's generalisation performance is modelled as a sample from a Gaussian process. The posterior distribution leads to efficient use of the information gathered by previous experiments, enabling optimal choices about what parameters to try next."}
  - {id: model-selection-and-tuning-automl, class: B, sources: [model-selection-and-tuning-s6], verified: "2026-11-27", text: "The AutoGluon-Tabular authors state that existing AutoML frameworks primarily focus on model and hyperparameter selection, while AutoGluon-Tabular ensembles multiple models and stacks them in multiple layers."}
  - {id: model-selection-and-tuning-selection-overfit, class: A, sources: [model-selection-and-tuning-s4], verified: "2026-11-27", text: "Cawley and Talbot demonstrate that a non-negligible variance in a model selection criterion introduces the potential for over-fitting in model selection as well as in training the model. They show that the effects are often of comparable magnitude to differences in performance between learning algorithms, and that the findings apply to any model selection practice involving the optimisation of a model selection criterion evaluated over a finite sample of data."}
  - {id: model-selection-and-tuning-optimistic, class: A, sources: [model-selection-and-tuning-s5], verified: "2026-11-27", text: "Model selection without nested cross-validation uses the same data to tune model parameters and evaluate model performance. Choosing the parameters that maximise non-nested cross-validation biases the model to the dataset, yielding an overly-optimistic score."}
  - {id: model-selection-and-tuning-nested, class: A, sources: [model-selection-and-tuning-s5], verified: "2026-11-27", text: "Nested cross-validation estimates the generalisation error of the underlying model and its hyperparameter search. In the inner loop hyperparameters are selected over the validation set. In the outer loop generalisation error is estimated by averaging test set scores over several dataset splits."}
  - {id: model-selection-and-tuning-held-out, class: B, sources: [model-selection-and-tuning-s1], verified: "2026-11-27", text: "When evaluating the model that a search produced, it is important to do it on held-out samples that were not seen during the search. scikit-learn recommends splitting the data into a development set, fed to the search, and an evaluation set to compute performance metrics."}
  - {id: model-selection-and-tuning-seed, class: B, sources: [model-selection-and-tuning-s8], verified: "2026-11-27", text: "To obtain reproducible results across multiple program executions, scikit-learn advises removing all uses of random_state=None, which is the default. If an integer is passed, calling fit or split multiple times always yields the same results."}
  - {id: model-selection-and-tuning-tabarena-living, class: B, sources: [model-selection-and-tuning-s7], verified: "2026-11-27", text: "TabArena's authors describe it as a continuously maintained living tabular benchmarking system, launched with a public leaderboard, reproducible code and maintenance protocols."}
  - {id: model-selection-and-tuning-tabarena-results, class: C, sources: [model-selection-and-tuning-s7], verified: "2026-11-27", text: "The TabArena launch paper, as revised on 3 November 2025, reports that gradient-boosted trees are still strong contenders on practical tabular datasets, that foundation models excel on smaller datasets, that ensembles across models advance the state of the art, and that some deep learning models are overrepresented in cross-model ensembles due to validation set overfitting."}
  - {id: model-selection-and-tuning-nist-document, class: B, sources: [model-selection-and-tuning-s9], verified: "2026-11-27", text: "MEASURE 2.1 of the NIST AI Risk Management Framework 1.0 states that test sets, metrics, and details about the tools used during test, evaluation, verification and validation are documented."}
  - {id: model-selection-and-tuning-nist-independent, class: B, sources: [model-selection-and-tuning-s9], verified: "2026-11-27", text: "MEASURE 1.3 of the NIST AI Risk Management Framework 1.0 states that internal experts who did not serve as front-line developers for the system and/or independent assessors are involved in regular assessments and updates."}
