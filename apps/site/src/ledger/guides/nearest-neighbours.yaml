sources:
  - {id: nearest-neighbours-s1, title: "scikit-learn user guide: Nearest Neighbors", url: "https://scikit-learn.org/stable/modules/neighbors.html", kind: primary, vendor: false}
  - {id: nearest-neighbours-s2, title: "scikit-learn API reference: KNeighborsClassifier", url: "https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsClassifier.html", kind: primary, vendor: false}
  - {id: nearest-neighbours-s3, title: "scikit-learn examples: Importance of Feature Scaling", url: "https://scikit-learn.org/stable/auto_examples/preprocessing/plot_scaling_importance.html", kind: primary, vendor: false}
  - {id: nearest-neighbours-s4, title: "Faiss wiki: Home", url: "https://github.com/facebookresearch/faiss/wiki", kind: primary, vendor: false}
  - {id: nearest-neighbours-s5, title: "Malkov and Yashunin: Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs", url: "https://arxiv.org/abs/1603.09320", kind: primary, vendor: false}
  - {id: nearest-neighbours-s6, title: "Usynin, Knolle and Kaissis: SoK: Memorisation in machine learning", url: "https://arxiv.org/abs/2311.03075", kind: primary, vendor: false}
  - {id: nearest-neighbours-s7, title: "Shokri, Stronati, Song and Shmatikov: Membership Inference Attacks against Machine Learning Models", url: "https://arxiv.org/abs/1610.05820", kind: primary, vendor: false}
claims:
  - {id: nearest-neighbours-principle, class: A, sources: [nearest-neighbours-s1], verified: "2026-11-27", text: "The principle behind nearest neighbour methods is to find a predefined number of training samples closest in distance to the new point, and predict the label from these."}
  - {id: nearest-neighbours-remember, class: A, sources: [nearest-neighbours-s1, nearest-neighbours-s6], verified: "2026-11-27", text: "Neighbours-based methods are known as non-generalising machine learning methods, since they simply remember all of their training data; the learning process of k-nearest neighbours is in its entirety based on storing data samples, followed by a look-up process."}
  - {id: nearest-neighbours-vote, class: A, sources: [nearest-neighbours-s1], verified: "2026-11-27", text: "Neighbours-based classification is computed from a simple majority vote of the nearest neighbours of each point: a query point is assigned the data class which has the most representatives within its nearest neighbours."}
  - {id: nearest-neighbours-k, class: A, sources: [nearest-neighbours-s1], verified: "2026-11-27", text: "The optimal choice of the value k is highly data-dependent: in general a larger k suppresses the effects of noise, but makes the classification boundaries less distinct."}
  - {id: nearest-neighbours-weights, class: B, sources: [nearest-neighbours-s2], verified: "2026-11-27", text: "scikit-learn's KNeighborsClassifier uses 5 neighbours by default and uniform weights, where all points in each neighbourhood are weighted equally; with weights set to distance, closer neighbours of a query point have a greater influence than neighbours which are further away."}
  - {id: nearest-neighbours-metric, class: B, sources: [nearest-neighbours-s1, nearest-neighbours-s2], verified: "2026-11-27", text: "The distance can, in general, be any metric measure, and standard Euclidean distance is the most common choice; the default metric of scikit-learn's KNeighborsClassifier is Minkowski with p = 2, which results in the standard Euclidean distance, and p = 1 is equivalent to Manhattan distance."}
  - {id: nearest-neighbours-scale, class: A, sources: [nearest-neighbours-s3], verified: "2026-11-27", text: "In scikit-learn's feature scaling example, a k-nearest neighbours model fitted on scaled data and on non-scaled data gives completely different models: one variable varies between 0 and 1,000 and another between 1 and 10, so distances between samples are mostly impacted by the first while the second is comparatively ignored; after StandardScaler the neighbours structure is impacted more or less equivalently by both variables."}
  - {id: nearest-neighbours-brute, class: A, sources: [nearest-neighbours-s1], verified: "2026-11-27", text: "Brute force query time grows as O[D N] for N samples in D dimensions; the KD tree is a binary tree structure which recursively partitions the parameter space along the data axes, dividing it into nested regions into which data points are filed, and it is very fast for low-dimensional neighbours searches but becomes inefficient as D grows very large."}
  - {id: nearest-neighbours-approximate, class: B, sources: [nearest-neighbours-s4, nearest-neighbours-s5], verified: "2026-11-27", text: "Faiss is a library for efficient similarity search and clustering of dense vectors, and it can trade precision for speed; Hierarchical Navigable Small World (HNSW) is a fully graph-based method for approximate K-nearest neighbour search."}
  - {id: nearest-neighbours-indices, class: A, sources: [nearest-neighbours-s2], verified: "2026-11-27", text: "The kneighbors method of scikit-learn's KNeighborsClassifier finds the K-neighbours of a point and returns indices of and distances to the neighbours of each point."}
  - {id: nearest-neighbours-leak, class: A, sources: [nearest-neighbours-s7], verified: "2026-11-27", text: "Shokri and co-authors investigate how machine learning models leak information about the individual data records on which they were trained, and show a membership inference attack that determines whether a given record was part of a model's training set with only black-box access to the model."}
