sources:
  - {id: evaluating-model-output-s1, title: "OpenAI: Evaluation best practices", url: "https://developers.openai.com/api/docs/guides/evaluation-best-practices", kind: primary, vendor: true}
  - {id: evaluating-model-output-s2, title: "Anthropic: Define success criteria and build evaluations", url: "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", kind: primary, vendor: true}
  - {id: evaluating-model-output-s3, title: "Anthropic: Demystifying evals for AI agents", url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", kind: primary, vendor: true}
  - {id: evaluating-model-output-s4, title: "UK AI Security Institute: Inspect", url: "https://inspect.aisi.org.uk/", kind: primary, vendor: false}
  - {id: evaluating-model-output-s5, title: "Promptfoo: CI/CD integration for LLM eval and security", url: "https://www.promptfoo.dev/docs/integrations/ci-cd/", kind: primary, vendor: true}
  - {id: evaluating-model-output-s6, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
claims:
  - {id: evaluating-model-output-variable, class: A, sources: [evaluating-model-output-s1], verified: "2026-11-27", text: "Generative AI is variable: models sometimes produce different output from the same input. Evaluations are a way to test an AI system despite this variability."}
  - {id: evaluating-model-output-vibes, class: B, sources: [evaluating-model-output-s1], verified: "2026-11-27", text: "OpenAI lists vibe-based evals as an anti-pattern: using \"it seems like it's working\" as an evaluation strategy, or waiting until after shipping to implement any evals."}
  - {id: evaluating-model-output-eval, class: A, sources: [evaluating-model-output-s3], verified: "2026-11-27", text: "An evaluation is a test for an AI system: give an AI an input, then apply grading logic to its output to measure success. A task, also called a test case, is a single test with defined inputs and success criteria, and a grader is logic that scores some aspect of the performance."}
  - {id: evaluating-model-output-dataset, class: B, sources: [evaluating-model-output-s4], verified: "2026-11-27", text: "In Inspect, the open-source evaluation framework developed by the UK AI Security Institute and Meridian Labs, a dataset is typically a table with input and target columns, where input is the prompt and target is the ideal answer or grading guidance. A scorer evaluates the output using text comparisons, model grading or other custom schemes."}
  - {id: evaluating-model-output-criteria, class: B, sources: [evaluating-model-output-s2, evaluating-model-output-s1], verified: "2026-11-27", text: "Good success criteria are specific and measurable, using quantitative metrics or well-defined qualitative scales. Evals should mirror the real-world task distribution and include edge cases, and a dataset that does not faithfully reproduce production traffic patterns is a biased design."}
  - {id: evaluating-model-output-code-grader, class: B, sources: [evaluating-model-output-s2, evaluating-model-output-s3], verified: "2026-11-27", flags: [vendor-stated], text: "Code-based grading is the fastest and most reliable method and extremely scalable, but lacks nuance for more complex judgements. Code-based graders are fast, cheap, objective and reproducible, and brittle to valid variations that do not match the expected pattern exactly."}
  - {id: evaluating-model-output-model-grader, class: B, sources: [evaluating-model-output-s2, evaluating-model-output-s1], verified: "2026-11-27", flags: [vendor-stated], text: "LLM-based grading is fast, flexible, scalable and suitable for complex judgement, and should be tested for reliability first, then scaled. It works from detailed, clear rubrics. Using models to judge output is cheaper to run and more scalable than human evaluation."}
  - {id: evaluating-model-output-calibration, class: B, sources: [evaluating-model-output-s3, evaluating-model-output-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Model-based graders are non-deterministic and require calibration with human graders for accuracy. Human graders are the gold standard and are expensive and slow. OpenAI advises using human feedback to calibrate automated scoring and scaling up an LLM judge once it consistently agrees with human annotations."}
  - {id: evaluating-model-output-human, class: B, sources: [evaluating-model-output-s2], verified: "2026-11-27", flags: [vendor-stated], text: "Human grading is the most flexible and high quality method, but slow and expensive. More questions with slightly lower signal automated grading is better than fewer questions with high-quality human hand-graded evals."}
  - {id: evaluating-model-output-every-change, class: B, sources: [evaluating-model-output-s1, evaluating-model-output-s3], verified: "2026-11-27", text: "OpenAI advises setting up continuous evaluation to run evals on every change. Anthropic states that automated evals are especially useful pre-launch and in CI/CD, running on each agent change and model upgrade."}
  - {id: evaluating-model-output-regression, class: B, sources: [evaluating-model-output-s3], verified: "2026-11-27", flags: [vendor-stated], text: "Regression evals ask whether the system still handles all the tasks it used to and should have a nearly 100% pass rate. They protect against backsliding: a decline in score signals that something is broken and needs to be improved."}
  - {id: evaluating-model-output-ci-gate, class: B, sources: [evaluating-model-output-s5], verified: "2026-11-27", text: "Promptfoo documents running evals in CI/CD to test prompt changes before they reach production: a workflow runs the eval on pull requests that change the prompt files, and the build fails when quality thresholds are not met."}
  - {id: evaluating-model-output-nist-measure, class: B, sources: [evaluating-model-output-s6], verified: "2026-11-27", text: "The NIST AI Risk Management Framework 1.0 states that AI systems should be tested before their deployment and regularly while in operation. Its MEASURE 2.1 outcome is that test sets, metrics and details about the tools used during test, evaluation, verification and validation are documented."}
  - {id: evaluating-model-output-nist-manage, class: B, sources: [evaluating-model-output-s6], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, measurement provides a traceable basis to inform management decisions, and the MANAGE 1.1 outcome is a determination of whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed."}
