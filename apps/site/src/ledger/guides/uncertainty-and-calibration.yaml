sources:
  - {id: uncertainty-and-calibration-s1, title: "scikit-learn User Guide: Probability calibration", url: "https://scikit-learn.org/stable/modules/calibration.html", kind: primary, vendor: false}
  - {id: uncertainty-and-calibration-s2, title: "scikit-learn User Guide: Linear models, Quantile regression", url: "https://scikit-learn.org/stable/modules/linear_model.html", kind: primary, vendor: false}
  - {id: uncertainty-and-calibration-s3, title: "Angelopoulos and Bates: A Gentle Introduction to Conformal Prediction and Distribution-Free Uncertainty Quantification (arXiv 2107.07511)", url: "https://arxiv.org/abs/2107.07511", kind: primary, vendor: false}
  - {id: uncertainty-and-calibration-s4, title: "Romano, Patterson and Candès: Conformalized Quantile Regression (arXiv 1905.03222)", url: "https://arxiv.org/abs/1905.03222", kind: primary, vendor: false}
  - {id: uncertainty-and-calibration-s5, title: "NIST AI Resource Center: AI Risk Management Framework 1.0, Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
claims:
  - {id: uncertainty-and-calibration-calibrated, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "Well calibrated classifiers are probabilistic classifiers whose predicted probability can be directly interpreted as a confidence level. Among the samples to which a well calibrated binary classifier gave a probability close to 0.8, approximately 80% actually belong to the positive class."}
  - {id: uncertainty-and-calibration-curve, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "Calibration curves, also referred to as reliability diagrams, plot the frequency of the positive label on the y-axis against the predicted probability of a model on the x-axis. In scikit-learn the predictions are binned: the x-axis is the average predicted probability in each bin and the y-axis is the fraction of positives in that bin."}
  - {id: uncertainty-and-calibration-shapes, class: B, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "In the scikit-learn comparison, LogisticRegression is more likely to return well calibrated predictions by itself, while GaussianNB tends to push probabilities to 0 or 1."}
  - {id: uncertainty-and-calibration-platt, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "The sigmoid calibration method is based on Platt's logistic model, whose two parameters are determined by maximum likelihood. It assumes the calibration curve can be corrected by applying a sigmoid function to the raw predictions, and is most effective for small sample sizes."}
  - {id: uncertainty-and-calibration-isotonic, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "Isotonic calibration fits a non-parametric regressor that outputs a step-wise non-decreasing function. It can correct any monotonic distortion of the uncalibrated model, is more prone to overfitting, especially on small datasets, and performs as well as or better than the sigmoid method when there are more than about 1000 samples."}
  - {id: uncertainty-and-calibration-heldout, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "Ideally the calibrator is fit on a dataset independent of the training data used to fit the classifier. Using the classifier's output on training data results in a biased calibrator that maps to probabilities closer to 0 and 1 than it should. scikit-learn's CalibratedClassifierCV uses cross-validation to ensure unbiased data is always used to fit the calibrator."}
  - {id: uncertainty-and-calibration-ranking, class: A, sources: [uncertainty-and-calibration-s1], verified: "2026-11-27", text: "It is generally expected that calibration does not affect ranking metrics such as ROC-AUC. The sigmoid method is a strictly monotonic transformation and keeps the ranking, while isotonic regression introduces ties in the predicted probabilities."}
  - {id: uncertainty-and-calibration-quantile, class: A, sources: [uncertainty-and-calibration-s2], verified: "2026-11-27", text: "Quantile regression estimates the median or other quantiles of the target conditional on the features, by minimising the pinball loss. It may be useful for predicting an interval instead of a point, and provides sensible prediction intervals even for errors with non-constant but predictable variance."}
  - {id: uncertainty-and-calibration-nominal, class: A, sources: [uncertainty-and-calibration-s3], verified: "2026-11-27", text: "The interval between a fitted 5% quantile and a fitted 95% quantile would be expected to have approximately 90% coverage, but the fitted quantiles may be inaccurate."}
  - {id: uncertainty-and-calibration-conformal, class: A, sources: [uncertainty-and-calibration-s3], verified: "2026-11-27", text: "Conformal prediction starts from a fitted model and a small amount of calibration data unseen during training. It computes a score on each calibration example, takes a quantile of those scores, and forms prediction sets that contain the true value with a user-chosen probability such as 90%, without distributional or model assumptions. The coverage is marginal: averaged over the calibration and test points, which are assumed i.i.d."}
  - {id: uncertainty-and-calibration-cqr, class: A, sources: [uncertainty-and-calibration-s3, uncertainty-and-calibration-s4], verified: "2026-11-27", text: "Conformalized quantile regression combines conformal prediction with classical quantile regression. It grows or shrinks the distance between the fitted quantiles by a constant picked during the calibration step, and is adaptive to heteroscedasticity."}
  - {id: uncertainty-and-calibration-size, class: A, sources: [uncertainty-and-calibration-s3], verified: "2026-11-27", text: "Conformal prediction sets become larger when the model is uncertain or the input is intrinsically hard, so the size of the set is an indicator of the model's certainty."}
  - {id: uncertainty-and-calibration-oversight, class: B, sources: [uncertainty-and-calibration-s5], verified: "2026-11-27", text: "The NIST AI Risk Management Framework 1.0 has information about an AI system's knowledge limits, and how its output may be utilized and overseen by humans, documented. It has processes for human oversight defined, assessed and documented in accordance with organizational policies."}
