  - {id: observability-and-feedback-s14, title: "EUR-Lex: Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
claims:
  - {id: observability-and-feedback-reactive, class: B, sources: [observability-and-feedback-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic lists the limits of user feedback as a way to understand an AI system: it is sparse and self-selected, it skews toward severe issues, users rarely explain why something failed, it is not automated, and relying primarily on users to catch issues can have negative user impact."}
  - {id: observability-and-feedback-trace, class: A, sources: [observability-and-feedback-s1], verified: "2026-11-27", text: "Traces give the big picture of what happens when a request is made to an application. A span represents a unit of work or operation. Spans can be nested: child spans represent sub-operations."}
  - {id: observability-and-feedback-genai-status, class: C, sources: [observability-and-feedback-s2], verified: "2026-11-27", text: "The OpenTelemetry semantic conventions for generative AI systems have the status Development. They are defined for inference, embeddings, tool execution, retrieval and agent operations, as spans, events and metrics, and are maintained in the OpenTelemetry GenAI semantic conventions repository."}
  - {id: observability-and-feedback-span-names, class: B, sources: [observability-and-feedback-s4, observability-and-feedback-s5, observability-and-feedback-s6], verified: "2026-11-27", text: "In the OpenTelemetry generative AI conventions the inference span name should be the operation name followed by the request model, with operation names such as chat. The tool execution span name should be execute_tool followed by the tool name. The agent span uses the operation name invoke_agent when an LLM drives the control flow through tool calls, followed by the agent name when it is readily available. Recommended attributes of the inference span include gen_ai.usage.input_tokens and gen_ai.usage.output_tokens."}
  - {id: observability-and-feedback-content-opt-in, class: B, sources: [observability-and-feedback-s3, observability-and-feedback-s4], verified: "2026-11-27", text: "The OpenTelemetry generative AI conventions state that model instructions, user messages and model outputs are considered sensitive and are often large in size. OpenTelemetry instrumentations should not capture them by default, and should provide an option for users to opt in. The gen_ai.input.messages attribute carries the warning that it is likely to contain sensitive information including user/PII data."}
  - {id: observability-and-feedback-external, class: B, sources: [observability-and-feedback-s3], verified: "2026-11-27", text: "The OpenTelemetry generative AI conventions recommend storing content externally and recording references on the spans in production environments where telemetry volume is a concern or sensitive data needs to be handled securely. Using external storage enables separate access controls. Recording large or sensitive content in telemetry may be problematic due to high storage costs, regulatory requirements, or the need to enforce different access models for operational and user data."}
  - {id: observability-and-feedback-redaction, class: B, sources: [observability-and-feedback-s9], verified: "2026-11-27", text: "OpenTelemetry states that collecting telemetry always carries the risk of inadvertently capturing sensitive or personal information, and that the implementer is responsible for compliance with applicable privacy laws. The OpenTelemetry Collector provides processors that help manage sensitive data: the attribute processor removes or modifies specific attributes, with a documented example that hashes user.email, and the redaction processor deletes attributes that do not match a list of allowed attributes."}
  - {id: observability-and-feedback-sampling, class: A, sources: [observability-and-feedback-s8], verified: "2026-11-27", text: "Sampling is one of the most effective ways to reduce the costs of observability without losing visibility. Head sampling makes a sampling decision as early as possible. Tail sampling makes the decision by considering all or most of the spans within the trace, for example always sampling traces that contain an error."}
  - {id: observability-and-feedback-online-eval, class: B, sources: [observability-and-feedback-s11], verified: "2026-11-27", text: "LangSmith documents online evaluations as real-time feedback on production traces, used to monitor an application continuously. An LLM-as-a-judge evaluator uses an LLM to evaluate traces. A filter can be applied to the runs that trigger the evaluator, and a sampling rate controls the percentage of filtered runs it is applied to, for example 10% of traces to control costs."}
  - {id: observability-and-feedback-no-reference, class: B, sources: [observability-and-feedback-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic lists the limits of production monitoring: it is reactive, its signals can be noisy, it requires investment in instrumentation, and it lacks ground truth for grading."}
  - {id: observability-and-feedback-eval-event, class: B, sources: [observability-and-feedback-s7], verified: "2026-11-27", text: "The OpenTelemetry generative AI conventions define the event gen_ai.evaluation.result, which captures the result of evaluating GenAI output for quality, accuracy or other characteristics. Its attributes include the evaluation name, a score value and a score label such as pass or fail. The event should be parented to the GenAI operation span being evaluated when possible. The event has the status Development."}
  - {id: observability-and-feedback-drift, class: B, sources: [observability-and-feedback-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that production monitoring kicks in post-launch to detect distribution drift and unanticipated real-world failures. It reveals real user behaviour at scale and catches issues that synthetic evals miss."}
  - {id: observability-and-feedback-feedback, class: B, sources: [observability-and-feedback-s12], verified: "2026-11-27", text: "Langfuse documents two kinds of user feedback. With explicit feedback users directly rate responses through thumbs up or down, star ratings or comments. Implicit feedback is derived from user behaviour such as time spent reading, copying output, accepting suggestions or retrying queries. In Langfuse, feedback is captured as scores and linked to traces."}
  - {id: observability-and-feedback-loop, class: B, sources: [observability-and-feedback-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic advises triaging feedback constantly and sampling transcripts to read weekly, and states that converting user-reported failures into test cases ensures the suite reflects actual usage. It describes the most effective teams as combining automated evals for fast iteration, production monitoring for ground truth and periodic human review for calibration."}
  - {id: observability-and-feedback-nist, class: B, sources: [observability-and-feedback-s13], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, the MEASURE 2.4 outcome is that the functionality and behaviour of the AI system and its components are monitored when in production, and the MANAGE 4.1 outcome is that post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors."}
  - {id: observability-and-feedback-eu-monitoring, class: B, sources: [observability-and-feedback-s14], verified: "2026-11-27", text: "Under Article 72 of the EU AI Act, providers of high-risk AI systems shall establish and document a post-market monitoring system that actively and systematically collects, documents and analyses relevant data on the performance of high-risk AI systems throughout their lifetime. Under Article 26(5), deployers shall monitor the operation of the high-risk AI system on the basis of the instructions for use."}
  - {id: observability-and-feedback-eu-logs, class: B, sources: [observability-and-feedback-s14], verified: "2026-11-27", text: "Under Article 12 of the EU AI Act, high-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system, including events relevant for facilitating post-market monitoring. Under Article 26(6), deployers shall keep the automatically generated logs under their control for a period appropriate to the intended purpose, of at least six months, unless provided otherwise in applicable Union or national law, in particular in Union law on the protection of personal data."}
  - {id: observability-and-feedback-eu-dates, class: C, sources: [observability-and-feedback-s14], verified: "2026-11-27", text: "In the consolidated text of the EU AI Act of 27 July 2026, as amended by Regulation (EU) 2026/1744, Chapter III, Sections 1, 2 and 3, which contain Articles 12 and 26, apply from 2 December 2027 for AI systems classified as high-risk under Article 6(2) and Annex III, and from 2 August 2028 for those classified under Article 6(1) and Annex I. Article 72(3) requires the Commission to adopt guidance, including a template, on the post-market monitoring plan by 2 September 2027."}
