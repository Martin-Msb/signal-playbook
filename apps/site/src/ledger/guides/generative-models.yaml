  - {id: generative-models-s10, title: "C2PA: C2PA and Content Credentials Explainer, version 2.2", url: "https://spec.c2pa.org/specifications/specifications/2.2/explainer/Explainer.html", kind: primary, vendor: false}
claims:
  - {id: generative-models-generative, class: A, sources: [generative-models-s1], verified: "2026-11-27", text: "Generative models can generate new data instances. They capture the joint probability p(X, Y), or just p(X) if there are no labels."}
  - {id: generative-models-distribution, class: A, sources: [generative-models-s1], verified: "2026-11-27", text: "A generative model includes the distribution of the data itself, and tells you how likely a given example is."}
  - {id: generative-models-discriminative, class: A, sources: [generative-models-s1], verified: "2026-11-27", text: "Discriminative models discriminate between different kinds of data instances and capture the conditional probability p(Y | X). A discriminative model ignores the question of whether a given instance is likely."}
  - {id: generative-models-autoencoder, class: A, sources: [generative-models-s2], verified: "2026-11-27", text: "An autoencoder is a neural network that is trained to attempt to copy its input to its output. It has a hidden layer that describes a code used to represent the input, and consists of an encoder function and a decoder that produces a reconstruction."}
  - {id: generative-models-vae-sample, class: A, sources: [generative-models-s3], verified: "2026-11-27", text: "To generate a sample from the model, a variational autoencoder first draws a sample from the code distribution. The sample is then run through a differentiable generator network."}
  - {id: generative-models-diffusion, class: A, sources: [generative-models-s4], verified: "2026-11-27", text: "A diffusion probabilistic model is a parameterised Markov chain trained to produce samples matching the data after finite time. Its transitions are learned to reverse a diffusion process, a Markov chain that gradually adds noise to the data until signal is destroyed. The reverse process starts at a standard Gaussian."}
  - {id: generative-models-autoregressive, class: A, sources: [generative-models-s3, generative-models-s5], verified: "2026-11-27", text: "Auto-regressive networks decompose a joint probability over the observed variables using the chain rule of probability to obtain a product of conditionals. PixelRNN is a deep neural network that sequentially predicts the pixels in an image along the two spatial dimensions."}
  - {id: generative-models-tabular, class: B, sources: [generative-models-s6], verified: "2026-11-27", text: "Modelling the probability distribution of rows in tabular data and generating realistic synthetic data is a non-trivial task, because tabular data usually contains a mix of discrete and continuous columns. The paper designs a conditional generative adversarial network to address these challenges."}
  - {id: generative-models-sdv, class: B, sources: [generative-models-s7], verified: "2026-11-27", text: "The CTGAN Synthesizer of the Synthetic Data Vault uses GAN-based, deep learning methods to train a model and generate synthetic data."}
  - {id: generative-models-privacy, class: A, sources: [generative-models-s8], verified: "2026-11-27", text: "An evaluation of a wide range of generative models found that synthetic data either does not prevent inference attacks or does not retain data utility. Synthetic data leads to a highly variable privacy gain and unpredictable utility loss."}
  - {id: generative-models-marking, class: B, sources: [generative-models-s9], verified: "2026-11-27", text: "Article 50(2) of the EU AI Act, in the text consolidated on 27 July 2026, requires providers of AI systems generating synthetic audio, image, video or text content to ensure that the outputs are marked in a machine-readable format and detectable as artificially generated or manipulated."}
  - {id: generative-models-provenance, class: B, sources: [generative-models-s10], verified: "2026-11-27", text: "C2PA defines provenance as the facts about the history of a piece of digital content. A Content Credential is a cryptographically bound structure that records an asset's provenance, with assertions such as its origin, modifications and use of AI."}
