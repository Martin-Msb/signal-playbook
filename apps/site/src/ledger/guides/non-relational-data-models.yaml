claims:
  - {id: non-relational-data-models-joins, class: A, sources: [non-relational-data-models-s1, non-relational-data-models-s13], verified: "2026-11-25", text: "With a relational schema you often need to join data from several different tables to return the data an application needs. Joins are computed at query time by matching primary and foreign keys of the rows in the connected tables."}
  - {id: non-relational-data-models-get, class: A, sources: [non-relational-data-models-s4, non-relational-data-models-s5, non-relational-data-models-s6], verified: "2026-11-25", text: "Valkey is an open source, in-memory data structure store. GET returns the value of a key, or nil if the key does not exist, with time complexity O(1). The keyspace documentation suggests key names of the form object-type:id, such as user:1000."}
  - {id: non-relational-data-models-ttl, class: A, sources: [non-relational-data-models-s6], verified: "2026-11-25", text: "Key expiration in Valkey sets a timeout for a key, also known as a time to live. When the time to live elapses, the key is automatically destroyed."}
  - {id: non-relational-data-models-dynamodb, class: B, sources: [non-relational-data-models-s7, non-relational-data-models-s8], verified: "2026-11-25", text: "DynamoDB supports both key-value and document data models. It does not support a JOIN operator, and AWS recommends denormalising the data model. An item in a table with a simple primary key can be accessed directly by providing its key value."}
  - {id: non-relational-data-models-schemaless, class: A, sources: [non-relational-data-models-s8], verified: "2026-11-25", text: "Other than the primary key, a DynamoDB table is schemaless: neither the attributes nor their data types need to be defined beforehand, and each item can have its own distinct attributes."}
  - {id: non-relational-data-models-document, class: A, sources: [non-relational-data-models-s2], verified: "2026-11-25", text: "MongoDB stores data records as BSON documents, composed of field-and-value pairs. The value of a field can be any of the BSON data types, including other documents, arrays, and arrays of documents. Each document stored in a standard collection requires a unique _id field that acts as a primary key."}
  - {id: non-relational-data-models-together, class: A, sources: [non-relational-data-models-s1], verified: "2026-11-25", text: "A core principle of data modeling in MongoDB is that data that is accessed together should be stored together. Embedding data allows an application to avoid complex joins across multiple collections, and related information can be returned in a single query."}
  - {id: non-relational-data-models-flexible, class: A, sources: [non-relational-data-models-s1, non-relational-data-models-s3], verified: "2026-11-25", text: "MongoDB uses a flexible schema model: by default, documents within a single collection are not required to have the same set of fields or data types. Schema validation lets you create validation rules for fields, such as allowed data types and value ranges. After rules are added to a collection, MongoDB by default rejects any insert or update operation that would produce an invalid document."}
  - {id: non-relational-data-models-wide, class: A, sources: [non-relational-data-models-s9, non-relational-data-models-s10], verified: "2026-11-25", text: "Cassandra implements a partitioned wide-column storage model. A partition key is generated from the first field of a primary key, and the remaining fields are the clustering keys that are used to sort data within a partition. Using clustering keys to sort data makes retrieval of adjacent data more efficient."}
  - {id: non-relational-data-models-query-first, class: A, sources: [non-relational-data-models-s10, non-relational-data-models-s11], verified: "2026-11-25", text: "In Cassandra, data modeling is query-driven: you start with the query model. Joins are not supported, so all required columns must be grouped together in a single table. Since each query is backed by a table, data is duplicated across multiple tables in a process known as denormalization. Cassandra has no concept of referential integrity across tables."}
  - {id: non-relational-data-models-graph, class: A, sources: [non-relational-data-models-s12], verified: "2026-11-25", text: "Neo4j uses a property graph database model. Nodes describe entities of a domain, relationships describe a connection between a source node and a target node, and properties are key-value pairs used for storing data on nodes and relationships. Traversing a graph means visiting nodes by following relationships according to some rules."}
  - {id: non-relational-data-models-graph-joins, class: B, sources: [non-relational-data-models-s13], verified: "2026-11-25", flags: [vendor-stated], text: "Neo4j states that a many-to-many relationship in a relational database needs a join table holding the foreign keys of both tables, that a graph pre-materialises relationships into the database structure so the database can directly access the connected nodes, and that this improves performance for join-heavy queries."}
  - {id: non-relational-data-models-gql, class: C, sources: [non-relational-data-models-s14], verified: "2026-11-25", text: "The GQL standard, ISO/IEC 39075:2024 Information technology, Database languages, GQL, was published on 17 April 2024."}
  - {id: non-relational-data-models-variant, class: B, sources: [non-relational-data-models-s15, non-relational-data-models-s16], verified: "2026-11-25", text: "A Snowflake VARIANT value can store a value of any other type, including OBJECT and ARRAY values, and data loaded from JSON can be stored in a VARIANT column. The Apache Parquet Variant encoding allows representation of semi-structured data such as JSON: a Variant contains a primitive, an array of Variant values, or an object of key and value pairs."}
  - {id: non-relational-data-models-unenforced, class: A, sources: [non-relational-data-models-s17], verified: "2026-11-25", text: "The PostgreSQL documentation states that representing data as JSON can be considerably more flexible than the traditional relational data model, recommends that JSON documents still have a somewhat fixed structure, and notes that the structure is typically unenforced, though enforcing some business rules declaratively is possible."}
  - {id: non-relational-data-models-json-schema, class: A, sources: [non-relational-data-models-s18], verified: "2026-11-25", text: "JSON Schema is a declarative language for defining structure and constraints for JSON data. A validator checks whether JSON documents conform to the schema, and JSON Schema establishes a common language for data exchange."}
