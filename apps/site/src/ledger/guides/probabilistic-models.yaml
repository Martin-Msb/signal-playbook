sources:
  - {id: probabilistic-models-s1, title: "scikit-learn User Guide: Naive Bayes", url: "https://scikit-learn.org/stable/modules/naive_bayes.html", kind: primary, vendor: false}
  - {id: probabilistic-models-s2, title: "scikit-learn User Guide: Gaussian Processes", url: "https://scikit-learn.org/stable/modules/gaussian_process.html", kind: primary, vendor: false}
  - {id: probabilistic-models-s3, title: "scikit-learn User Guide: Linear Models, Bayesian Regression", url: "https://scikit-learn.org/stable/modules/linear_model.html", kind: primary, vendor: false}
  - {id: probabilistic-models-s4, title: "U.S. Food and Drug Administration: Guidance for the Use of Bayesian Statistics in Medical Device Clinical Trials, issued 5 February 2010", url: "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/guidance-use-bayesian-statistics-medical-device-clinical-trials", kind: primary, vendor: false}
claims:
  - {id: probabilistic-models-learning, class: A, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "Bayesian statistics is an approach for learning from evidence as it accumulates. It uses Bayes' theorem to formally combine prior information with current information on a quantity of interest."}
  - {id: probabilistic-models-prior, class: A, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "Before data are obtained, probabilities are given to all the possible values of an unknown quantity of interest. Taken together, these probabilities constitute the prior distribution for that quantity."}
  - {id: probabilistic-models-posterior, class: A, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "After data become available, the prior distribution is updated according to Bayes' theorem. The updated distribution is called the posterior distribution."}
  - {id: probabilistic-models-iterate, class: A, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "The Bayesian approach can be used iteratively as knowledge accumulates: today's posterior probabilities become tomorrow's prior probabilities. As more information is collected, the influence of the original prior distribution is usually less."}
  - {id: probabilistic-models-document, class: B, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "FDA guidance on Bayesian statistics in medical device clinical trials recommends indicating all prior information used and the assumptions made, and being prepared to clinically and statistically justify the choices of prior information."}
  - {id: probabilistic-models-sensitivity, class: B, sources: [probabilistic-models-s4], verified: "2026-11-27", text: "FDA guidance on Bayesian statistics in medical device clinical trials recommends sensitivity analysis to check the robustness of models to different choices of prior distributions."}
  - {id: probabilistic-models-naive-bayes, class: A, sources: [probabilistic-models-s1], verified: "2026-11-27", text: "Naive Bayes methods are supervised learning algorithms that apply Bayes' theorem with the naive assumption of conditional independence between every pair of features given the value of the class variable."}
  - {id: probabilistic-models-nb-practice, class: B, sources: [probabilistic-models-s1], verified: "2026-11-27", text: "Naive Bayes classifiers require a small amount of training data to estimate the necessary parameters and can be extremely fast compared to more sophisticated methods."}
  - {id: probabilistic-models-nb-estimator, class: B, sources: [probabilistic-models-s1], verified: "2026-11-27", text: "Naive Bayes is known as a decent classifier but a bad estimator, so its probability outputs are not to be taken too seriously."}
  - {id: probabilistic-models-gp, class: B, sources: [probabilistic-models-s2], verified: "2026-11-27", text: "Gaussian processes are a nonparametric supervised learning method for regression and probabilistic classification. The prediction is probabilistic (Gaussian), so empirical confidence intervals can be computed."}
  - {id: probabilistic-models-gp-prior, class: B, sources: [probabilistic-models-s2], verified: "2026-11-27", text: "For Gaussian process regression the prior of the process needs to be specified, and the prior's covariance is specified by passing a kernel object. Gaussian processes lose efficiency in high dimensional spaces, namely when the number of features exceeds a few dozens."}
  - {id: probabilistic-models-bayes-linear, class: B, sources: [probabilistic-models-s3], verified: "2026-11-27", text: "To obtain a fully probabilistic model, Bayesian regression assumes the output is Gaussian distributed around the linear prediction. In scikit-learn's BayesianRidge the prior for the coefficients is a spherical Gaussian."}
