sources:
  - {id: generation-and-sampling-s1, title: "Brown et al.: Language Models are Few-Shot Learners", url: "https://arxiv.org/pdf/2005.14165", kind: primary, vendor: false}
  - {id: generation-and-sampling-s2, title: "Hugging Face: Generation", url: "https://huggingface.co/docs/transformers/main_classes/text_generation", kind: primary, vendor: false}
  - {id: generation-and-sampling-s3, title: "Holtzman et al.: The Curious Case of Neural Text Degeneration", url: "https://arxiv.org/pdf/1904.09751", kind: primary, vendor: false}
  - {id: generation-and-sampling-s4, title: "Hugging Face: Utilities for Generation", url: "https://huggingface.co/docs/transformers/en/internal/generation_utils", kind: primary, vendor: false}
  - {id: generation-and-sampling-s5, title: "OpenAI: Reasoning models", url: "https://developers.openai.com/api/docs/guides/reasoning", kind: primary, vendor: true}
  - {id: generation-and-sampling-s6, title: "OpenAI: Streaming API responses", url: "https://developers.openai.com/api/docs/guides/streaming-responses", kind: primary, vendor: true}
  - {id: generation-and-sampling-s7, title: "Vaswani et al.: Attention Is All You Need", url: "https://arxiv.org/pdf/1706.03762", kind: primary, vendor: false}
claims:
  - {id: generation-and-sampling-autoregressive, class: A, sources: [generation-and-sampling-s7, generation-and-sampling-s1], verified: "2026-11-27", text: "The Transformer decoder generates an output sequence one element at a time, consuming the previously generated symbols as additional input, and a softmax converts decoder output to predicted next-token probabilities; GPT-3 is an autoregressive language model."}
  - {id: generation-and-sampling-sampling, class: A, sources: [generation-and-sampling-s2, generation-and-sampling-s3], verified: "2026-11-27", text: "Transformers generation uses sampling when do_sample is set and greedy decoding otherwise; Holtzman and colleagues describe pure sampling as sampling directly from the probabilities predicted by the model, which includes a tail of low-probability tokens."}
  - {id: generation-and-sampling-settings, class: B, sources: [generation-and-sampling-s2, generation-and-sampling-s3], verified: "2026-11-27", text: "Transformers exposes temperature to modulate next-token probabilities and top-p to keep only the smallest set of most probable tokens whose probabilities add up to top_p or higher; Holtzman and colleagues state that a temperature below 1 skews the distribution towards high-probability events."}
  - {id: generation-and-sampling-diversity, class: A, sources: [generation-and-sampling-s3, generation-and-sampling-s1], verified: "2026-11-27", text: "Holtzman and colleagues report that decoding strategies affect diversity and repetition; the GPT-3 paper reports generating multiple samples with temperature and nucleus sampling."}
  - {id: generation-and-sampling-limits, class: B, sources: [generation-and-sampling-s5, generation-and-sampling-s4], verified: "2026-11-27", text: "OpenAI documents max_output_tokens as a cap that includes reasoning, visible output and non-visible formatting tokens; Transformers provides maximum-token generation limits."}
  - {id: generation-and-sampling-stop, class: B, sources: [generation-and-sampling-s4], verified: "2026-11-27", text: "Transformers stop-string criteria end generation when a specified string is completed by generated tokens."}
  - {id: generation-and-sampling-streaming, class: B, sources: [generation-and-sampling-s6], verified: "2026-11-27", text: "The Responses API can stream output over server-sent events while the model continues generating, and lists response.completed among the common events to listen for."}
  - {id: generation-and-sampling-reasoning, class: B, sources: [generation-and-sampling-s5], verified: "2026-11-27", text: "Reasoning models use reasoning tokens to break down the prompt and consider approaches to a response; those tokens are not visible through the API but occupy the context window and are billed as output tokens, and an output limit can be reached before any visible output is produced."}
  - {id: generation-and-sampling-governance, class: A, sources: [generation-and-sampling-s3, generation-and-sampling-s6], verified: "2026-11-27", text: "Holtzman and colleagues report that the decoding strategy and its settings change the diversity and repetition of generated text; OpenAI states that streaming makes completions more difficult to moderate because partial completions may be more difficult to evaluate."}
