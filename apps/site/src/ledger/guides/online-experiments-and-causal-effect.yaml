sources:
  - {id: online-experiments-and-causal-effect-s1, title: "Kohavi, Longbotham, Sommerfield and Henne: Controlled experiments on the web, survey and practical guide (Data Mining and Knowledge Discovery, 2009)", url: "https://ai.stanford.edu/~ronnyk/2009controlledExperimentsOnTheWebSurvey.pdf", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s2, title: "Microsoft Research Experimentation Platform: Patterns of Trustworthy Experimentation, During-Experiment Stage", url: "https://www.microsoft.com/en-us/research/group/experimentation-platform-exp/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s3, title: "GrowthBook Docs: Holdouts", url: "https://docs.growthbook.io/app/holdouts", kind: primary, vendor: true}
  - {id: online-experiments-and-causal-effect-s4, title: "scikit-uplift User Guide: Causal Inference, Basics", url: "https://www.uplift-modeling.com/en/latest/user_guide/introduction/cate.html", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s5, title: "scikit-uplift User Guide: Uplift vs other models", url: "https://www.uplift-modeling.com/en/latest/user_guide/introduction/comparison.html", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s6, title: "scikit-uplift User Guide: Types of customers", url: "https://www.uplift-modeling.com/en/latest/user_guide/introduction/clients.html", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s7, title: "CausalML documentation: About CausalML", url: "https://causalml.readthedocs.io/en/latest/about.html", kind: primary, vendor: false}
  - {id: online-experiments-and-causal-effect-s8, title: "The Menlo Report: Ethical Principles Guiding Information and Communication Technology Research (August 2012), copy published by CAIDA", url: "https://www.caida.org/catalog/papers/2012_menlo_report_actual_formatted/menlo_report_actual_formatted.pdf", kind: primary, vendor: false}
claims:
  - {id: online-experiments-and-causal-effect-correlational, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "Patterns discovered by classical knowledge discovery and data mining are correlational, which poses challenges in separating useful actionable patterns from others."}
  - {id: online-experiments-and-causal-effect-counterfactual, class: A, sources: [online-experiments-and-causal-effect-s4], verified: "2026-11-27", text: "The causal effect of a treatment on a person is the difference between the outcome with the treatment and the outcome without it. Both cannot be observed for the same person, because a communication cannot be both made and not made."}
  - {id: online-experiments-and-causal-effect-ab, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "In the simplest controlled experiment, often referred to as an A/B test, users are randomly exposed to one of two variants: Control (A) or Treatment (B). The key is random: no factor can influence the decision."}
  - {id: online-experiments-and-causal-effect-confounding, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "Controlled experiments neutralise confounding variables by distributing them equally over all values through random assignment, thus establishing a causal relationship between the changes made in the variants and the measures of interest."}
  - {id: online-experiments-and-causal-effect-hash, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "It is important that the user receive a consistent experience throughout the experiment. In the hash and partition method a hash function is applied to the combination of the user identifier and the experiment identifier, and a good hash function produces randomly distributed numbers as a function of a specific input."}
  - {id: online-experiments-and-causal-effect-causality, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "If the experiment was designed and executed properly, the only thing consistently different between the two variants is the change between the Control and Treatment, so any differences in the Overall Evaluation Criterion are the result of this assignment, establishing causality."}
  - {id: online-experiments-and-causal-effect-oec, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "The Overall Evaluation Criterion is a quantitative measure of the experiment's objective. A good one should not be short-term focused, such as clicks, and should include factors that predict long-term goals."}
  - {id: online-experiments-and-causal-effect-null, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "The null hypothesis is that the Overall Evaluation Criteria for the variants are not different and that any observed differences during the experiment are due to random fluctuations."}
  - {id: online-experiments-and-causal-effect-interval, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "The confidence interval for the absolute effect can be used to conduct a hypothesis test: if zero is in the interval the null hypothesis is not rejected, otherwise it is rejected and the Treatment is concluded to have an effect."}
  - {id: online-experiments-and-causal-effect-level, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "The confidence level is commonly set to 95%, which implies that 5% of the time a difference is incorrectly concluded when there is none. The standard error of a mean is inversely proportional to the square root of the sample size, so increasing the sample size, which usually implies running the experiment longer, increases the power for most metrics."}
  - {id: online-experiments-and-causal-effect-aa, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "An A/A test assigns users to one of two groups but exposes them to exactly the same experience. It can be used to collect data and assess its variability for power calculations, and to test the experimentation system: the null hypothesis should be rejected about 5% of the time when a 95% confidence level is used."}
  - {id: online-experiments-and-causal-effect-sample, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "From the statistical power, the effect to detect and the variability of the Overall Evaluation Criterion, the minimum sample size and hence the running time can be computed. A common mistake is to run experiments that are underpowered."}
  - {id: online-experiments-and-causal-effect-guardrail, class: B, sources: [online-experiments-and-causal-effect-s2], verified: "2026-11-27", text: "Guardrail metrics measure aspects of the product that should not degrade but will not necessarily improve. Microsoft's Experimentation Platform recommends that a feature crew set up alerts for business-critical metrics, and auto-shutdown for A/B tests that significantly degrade the product or the user experience."}
  - {id: online-experiments-and-causal-effect-rampup, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "An experiment can be initiated with a small percentage of users assigned to the Treatment, and that percentage then gradually increased, so that egregious problems are caught and the experiment can be aborted before many users are exposed to a bad Treatment."}
  - {id: online-experiments-and-causal-effect-srm, class: B, sources: [online-experiments-and-causal-effect-s2], verified: "2026-11-27", text: "Sample ratio mismatches typically invalidate the A/B test and make any results and metric movements untrustworthy. It is essential to have them tested early and to have alerts set up if one is detected."}
  - {id: online-experiments-and-causal-effect-holdout, class: B, sources: [online-experiments-and-causal-effect-s3], verified: "2026-11-27", text: "In a holdout a small percentage of users remains on the original version, providing a baseline to measure cumulative effects over time. A holdout measures the cumulative impact of all changes over time by comparing the general population to the holdout group."}
  - {id: online-experiments-and-causal-effect-holdout-default, class: C, sources: [online-experiments-and-causal-effect-s3], verified: "2026-11-27", text: "In GrowthBook the holdout size defaults to 5%, meaning 5% of traffic is placed in the holdout."}
  - {id: online-experiments-and-causal-effect-uplift, class: A, sources: [online-experiments-and-causal-effect-s5], verified: "2026-11-27", text: "An uplift model evaluates the net effect of communication: it predicts the difference between the customer's behaviour when there is a treatment and when there is no treatment."}
  - {id: online-experiments-and-causal-effect-types, class: A, sources: [online-experiments-and-causal-effect-s6], verified: "2026-11-27", text: "Persuadables purchase only if contacted. Do-Not-Disturbs, also known as sleeping dogs, have a strong negative response to marketing communication. Uplift modelling tries to find the persuadables."}
  - {id: online-experiments-and-causal-effect-causalml, class: B, sources: [online-experiments-and-causal-effect-s7], verified: "2026-11-27", text: "CausalML is a Python package that provides a suite of uplift modelling and causal inference methods. It can estimate the Conditional Average Treatment Effect from experimental or observational data."}
  - {id: online-experiments-and-causal-effect-limits, class: A, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "Controlled experiments show which variant is better and by how much, but not why. They measure the effect on the Overall Evaluation Criterion during the experimentation period, typically a few weeks."}
  - {id: online-experiments-and-causal-effect-consent, class: B, sources: [online-experiments-and-causal-effect-s8], verified: "2026-11-27", text: "Under the Menlo Report's principle of Respect for Persons, participation as a research subject is voluntary and follows from informed consent. Informed consent is a process in which the researcher accurately describes the project and its risks to subjects, and they accept the risks and agree to participate or decline."}
  - {id: online-experiments-and-causal-effect-waiver, class: B, sources: [online-experiments-and-causal-effect-s8], verified: "2026-11-27", text: "When a researcher believes that obtaining informed consent makes the pursuit of research objectives impossible, the application process allows researchers to seek waivers from an ethical review board."}
  - {id: online-experiments-and-causal-effect-hippo, class: B, sources: [online-experiments-and-causal-effect-s1], verified: "2026-11-27", text: "Kohavi and colleagues report that significant learning and return on investment are seen when development teams listen to their customers, not to the Highest Paid Person's Opinion."}
