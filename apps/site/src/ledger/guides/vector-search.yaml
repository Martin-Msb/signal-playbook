sources:
  - {id: vector-search-s1, title: "Sentence Transformers: Semantic Search", url: "https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html", kind: primary, vendor: false}
  - {id: vector-search-s2, title: "pgvector: README", url: "https://github.com/pgvector/pgvector/blob/master/README.md", kind: primary, vendor: false}
  - {id: vector-search-s3, title: "Faiss wiki: Faiss indexes", url: "https://github.com/facebookresearch/faiss/wiki/Faiss-indexes", kind: primary, vendor: false}
  - {id: vector-search-s4, title: "Malkov and Yashunin: Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs", url: "https://arxiv.org/abs/1603.09320", kind: primary, vendor: false}
  - {id: vector-search-s5, title: "Qdrant: Multitenancy", url: "https://qdrant.tech/documentation/guides/multitenancy/", kind: primary, vendor: true}
  - {id: vector-search-s6, title: "OWASP: LLM08:2025 Vector and Embedding Weaknesses", url: "https://genai.owasp.org/llmrisk/llm082025-vector-and-embedding-weaknesses/", kind: primary, vendor: false}
claims:
  - {id: vector-search-embed, class: A, sources: [vector-search-s1], verified: "2026-11-27", text: "Semantic search embeds all entries in a corpus, whether sentences, paragraphs or documents, into a vector space; at search time the query is embedded into the same vector space and the closest embeddings from the corpus are found."}
  - {id: vector-search-exact, class: A, sources: [vector-search-s2, vector-search-s3], verified: "2026-11-27", text: "By default pgvector performs exact nearest neighbour search, which provides perfect recall; in a Faiss flat index all the indexed vectors are compared to the query vectors at search time."}
  - {id: vector-search-approximate, class: A, sources: [vector-search-s2, vector-search-s1], verified: "2026-11-27", text: "An index in pgvector uses approximate nearest neighbour search, which trades some recall for speed; approximate nearest neighbour methods have one or more parameters that determine the recall-speed trade-off."}
  - {id: vector-search-ivf, class: A, sources: [vector-search-s2, vector-search-s3], verified: "2026-11-27", text: "An IVFFlat index divides vectors into lists and then searches a subset of those lists that are closest to the query vector; Faiss partitions the feature space into nlist cells and selects a set of nprobe inverted lists at query time."}
  - {id: vector-search-probes, class: B, sources: [vector-search-s2], verified: "2026-11-27", text: "In pgvector the number of IVFFlat probes is 1 by default; a higher value provides better recall at the cost of speed, and it can be set to the number of lists for exact nearest neighbour search."}
  - {id: vector-search-hnsw, class: A, sources: [vector-search-s2, vector-search-s4], verified: "2026-11-27", text: "An HNSW index creates a multilayer graph and search starts from the upper layer; in pgvector it has better query performance than IVFFlat in terms of the speed-recall trade-off, but slower build times and more memory use, and a higher hnsw.ef_search provides better recall at the cost of speed."}
  - {id: vector-search-quantisation, class: B, sources: [vector-search-s2, vector-search-s3], verified: "2026-11-27", text: "pgvector can index vectors at half precision for smaller indexes and can use binary quantisation with re-ranking by the original vectors for better recall; Faiss product quantisation splits vectors into sub-vectors that are each quantised to a few bits."}
  - {id: vector-search-filter, class: B, sources: [vector-search-s2], verified: "2026-11-27", text: "With approximate indexes in pgvector, filtering is applied after the index is scanned, so fewer rows than requested can match; iterative index scans automatically scan more of the index when needed, and partial indexing or partitioning is suggested for filtered columns."}
  - {id: vector-search-tenant, class: B, sources: [vector-search-s5], verified: "2026-11-27", text: "Qdrant's multitenancy guide keeps all tenants in a single collection and filters by a payload field that identifies the tenant, so that each tenant only sees their own data."}
  - {id: vector-search-access, class: A, sources: [vector-search-s6], verified: "2026-11-27", text: "OWASP LLM08:2025 states that inadequate or misaligned access controls can lead to unauthorised access to embeddings containing sensitive information, and recommends fine-grained access controls, permission-aware vector and embedding stores, and strict logical and access partitioning of datasets in the vector database."}
