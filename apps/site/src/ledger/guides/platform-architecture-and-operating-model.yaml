sources:
  - {id: platform-architecture-and-operating-model-s1, title: "CIDR: Lakehouse: A New Generation of Open Platforms that Unify Data Warehousing and Advanced Analytics", url: "https://www.databricks.com/sites/default/files/2020/12/cidr_lakehouse.pdf", kind: primary, vendor: true}
  - {id: platform-architecture-and-operating-model-s2, title: "Zhamak Dehghani: Data Mesh Principles and Logical Architecture", url: "https://martinfowler.com/articles/data-mesh-principles.html", kind: primary, vendor: false}
  - {id: platform-architecture-and-operating-model-s3, title: "Google Cloud Architecture Center: Architecture and functions in a data mesh", url: "https://docs.cloud.google.com/architecture/data-mesh", kind: primary, vendor: true}
  - {id: platform-architecture-and-operating-model-s4, title: "Databricks: Lakehouse reference architectures", url: "https://docs.databricks.com/aws/en/lakehouse-architecture/reference", kind: primary, vendor: true}
claims:
  - {id: platform-architecture-and-operating-model-lakehouse-architecture, class: A, sources: [platform-architecture-and-operating-model-s1], verified: "2026-11-27", text: "A lakehouse design stores data in a low-cost object store in a standard file format such as Apache Parquet and places a transactional metadata layer on top that defines which objects are part of a table version, as Delta Lake and Apache Iceberg do; the layer can support transactions, versioning, access control and audit logging, including checking whether a client may access a table before granting credentials to read it."}
  - {id: platform-architecture-and-operating-model-reference-architecture, class: B, sources: [platform-architecture-and-operating-model-s4], verified: "2026-11-27", text: "The Databricks lakehouse reference architecture is structured along swim lanes that include Source, Ingest, Transform, Query/Process, Serve and Storage; curated data is stored in cloud storage as Delta or Apache Iceberg tables, and Unity Catalog is the central governance system, a single place to manage data access policies."}
  - {id: platform-architecture-and-operating-model-mesh-principles, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-27", text: "Data mesh is based on domain-oriented decentralised ownership, data as a product, self-serve data infrastructure as a platform, and federated computational governance."}
  - {id: platform-architecture-and-operating-model-mesh-ownership, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-27", text: "Data mesh assigns ownership of analytical data and its serving to the business domains closest to that data."}
  - {id: platform-architecture-and-operating-model-platform, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-27", text: "The skills needed to provision data infrastructure are specialised and would be difficult to replicate in each domain; a self-serve data platform is meant to enable domain autonomy and lower the cost and specialisation needed to build data products."}
  - {id: platform-architecture-and-operating-model-federated-governance, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-27", text: "Federated computational governance is a decision-making model led by a federation of domain data product owners and data platform product owners, with automated execution of decisions by the platform."}
  - {id: platform-architecture-and-operating-model-mesh-functions, class: B, sources: [platform-architecture-and-operating-model-s3], verified: "2026-11-27", text: "In Google's data mesh architecture, domain producer teams create and maintain data products; central governance and platform teams provide cross-domain oversight, governance, services and self-service infrastructure."}
  - {id: platform-architecture-and-operating-model-central-governance, class: B, sources: [platform-architecture-and-operating-model-s3], verified: "2026-11-27", text: "In Google's data mesh architecture, a central data governance team defines and enforces data governance policies among data producers."}
  - {id: platform-architecture-and-operating-model-bottleneck, class: B, sources: [platform-architecture-and-operating-model-s3], verified: "2026-11-27", text: "Google's data mesh guidance states that limiting domain autonomy risks creating a bottleneck at the central data platform team."}
