sources:
  - {id: structured-output-s1, title: "Anthropic: Structured outputs", url: "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", kind: primary, vendor: true}
  - {id: structured-output-s2, title: "OpenAI: Structured model outputs", url: "https://developers.openai.com/api/docs/guides/structured-outputs", kind: primary, vendor: true}
  - {id: structured-output-s3, title: "JSON Schema: A Media Type for Describing JSON Documents, draft 2020-12", url: "https://json-schema.org/draft/2020-12/json-schema-core", kind: primary, vendor: false}
  - {id: structured-output-s4, title: "JSON Schema Validation: A Vocabulary for Structural Validation of JSON, draft 2020-12", url: "https://json-schema.org/draft/2020-12/json-schema-validation", kind: primary, vendor: false}
  - {id: structured-output-s5, title: "OpenAI: Introducing Structured Outputs in the API", url: "https://openai.com/index/introducing-structured-outputs-in-the-api/", kind: primary, vendor: true}
  - {id: structured-output-s6, title: "Willard and Louf: Efficient Guided Generation for Large Language Models", url: "https://arxiv.org/abs/2307.09702", kind: primary, vendor: false}
  - {id: structured-output-s7, title: "OWASP: LLM05:2025 Improper Output Handling", url: "https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/", kind: primary, vendor: false}
  - {id: structured-output-s8, title: "Instructor: Validation and reasking", url: "https://python.useinstructor.com/concepts/reask_validation/", kind: primary, vendor: false}
claims:
  - {id: structured-output-without, class: B, sources: [structured-output-s1], verified: "2026-11-27", text: "Without structured outputs, Claude can generate malformed JSON responses or invalid tool inputs that break applications. Even with careful prompting, parsing errors from invalid JSON syntax, missing required fields, inconsistent data types and schema violations requiring error handling and retries can occur."}
  - {id: structured-output-definition, class: B, sources: [structured-output-s1, structured-output-s2], verified: "2026-11-27", text: "Structured outputs constrain Claude's responses to follow a specific schema, ensuring valid, parseable output for downstream processing. OpenAI's Structured Outputs constrains completed, non-refusal model output to the supplied JSON Schema."}
  - {id: structured-output-json-schema, class: A, sources: [structured-output-s3], verified: "2026-11-27", text: "JSON Schema is a JSON media type for defining the structure of JSON data. It can be used to assert constraints on a JSON document, which either passes or fails the assertions."}
  - {id: structured-output-keywords, class: A, sources: [structured-output-s4], verified: "2026-11-27", text: "An object instance is valid against the required keyword if every item in the array is the name of a property in the instance. An instance validates against a type given as a string if its type matches the type that string represents, and against enum if its value is equal to one of the elements in the keyword's array."}
  - {id: structured-output-json-mode, class: B, sources: [structured-output-s2], verified: "2026-11-27", text: "OpenAI's JSON mode and Structured Outputs both ensure valid JSON is produced, but only Structured Outputs ensures schema adherence."}
  - {id: structured-output-constrained-decoding, class: A, sources: [structured-output-s5, structured-output-s1], verified: "2026-11-27", text: "OpenAI converts the supplied JSON Schema into a context-free grammar, constrains the model to only tokens that would be valid according to the schema, and masks the next sampling step, which effectively lowers the probability of invalid tokens to 0. Anthropic states that structured outputs work by compiling JSON schemas into a grammar that constrains Claude's output."}
  - {id: structured-output-guided-generation, class: A, sources: [structured-output-s6], verified: "2026-11-27", text: "Neural text generation can be formulated as transitions between the states of a finite-state machine. This allows guiding text generation with regular expressions and context-free grammars through an index over a language model's vocabulary, and guarantees the structure of the generated text. An implementation is provided in the open source Python library Outlines."}
  - {id: structured-output-guarantee, class: B, sources: [structured-output-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that structured outputs guarantee schema-compliant responses through constrained decoding: no JSON parsing errors, guaranteed field types and required fields, and no retries needed for schema violations."}
  - {id: structured-output-grammar-cache, class: C, sources: [structured-output-s1], verified: "2026-11-27", text: "On the Claude API, the first request with a specific schema has additional latency while the grammar compiles, and compiled grammars are cached for 24 hours from last use. Structured outputs support standard JSON Schema with some limitations, and an unsupported feature returns a 400 error."}
  - {id: structured-output-invalid, class: B, sources: [structured-output-s1, structured-output-s2], verified: "2026-11-27", text: "On the Claude API, a refusal has the stop reason refusal and its output might not match the schema, and a response cut off at the max_tokens limit has the stop reason max_tokens and might be incomplete and not match the schema. OpenAI states that an application still needs to handle refusals, incomplete responses and API errors."}
  - {id: structured-output-values, class: B, sources: [structured-output-s5], verified: "2026-11-27", text: "OpenAI states that with Structured Outputs the model may still make mistakes within the values of the JSON object."}
  - {id: structured-output-retry, class: B, sources: [structured-output-s8], verified: "2026-11-27", text: "Instructor provides a reasking mechanism for correcting LLM outputs based on validation errors. The validation error is appended to the conversation as a user message, and the max_retries parameter sets the number of times the model can be asked again to correct the output."}
  - {id: structured-output-untrusted, class: A, sources: [structured-output-s7], verified: "2026-11-27", text: "Improper Output Handling refers to insufficient validation, sanitisation and handling of the outputs generated by large language models before they are passed downstream to other components and systems. Successful exploitation can result in XSS and CSRF in web browsers, as well as SSRF, privilege escalation or remote code execution on backend systems."}
  - {id: structured-output-zero-trust, class: B, sources: [structured-output-s7], verified: "2026-11-27", text: "OWASP advises treating the model as any other user, adopting a zero-trust approach, and applying proper input validation on responses coming from the model to backend functions. It advises parameterised queries or prepared statements for all database operations involving LLM output."}
