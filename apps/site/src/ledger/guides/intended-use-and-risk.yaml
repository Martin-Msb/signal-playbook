sources:
  - {id: intended-use-and-risk-s1, title: "NIST: AI RMF Playbook, Map", url: "https://airc.nist.gov/airmf-resources/playbook/map/", kind: primary, vendor: false}
  - {id: intended-use-and-risk-s2, title: "EUR-Lex: Regulation (EU) 2024/1689, Artificial Intelligence Act, consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
  - {id: intended-use-and-risk-s3, title: "NIST: AI RMF Playbook, Govern", url: "https://airc.nist.gov/airmf-resources/playbook/govern/", kind: primary, vendor: false}
claims:
  - {id: intended-use-and-risk-purpose, class: A, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "Article 3 of the EU AI Act defines intended purpose as the use for which an AI system is intended by the provider, including the specific context and conditions of use, and defines risk as the combination of the probability of an occurrence of harm and the severity of that harm."}
  - {id: intended-use-and-risk-context, class: A, sources: [intended-use-and-risk-s1], verified: "2026-11-27", text: "MAP 1.1 of the NIST AI RMF Playbook has intended purpose, potentially beneficial uses, context-specific laws, norms and expectations, and the prospective settings in which the AI system will be deployed understood and documented. Considerations include the specific set or types of users and the potential positive and negative impacts of system uses to individuals, communities, organizations, society and the planet. The Playbook adds that organizations should expect broadly deployed AI tools to be reused, repurposed and potentially misused regardless of intentions."}
  - {id: intended-use-and-risk-inventory, class: B, sources: [intended-use-and-risk-s3], verified: "2026-11-27", text: "GOVERN 1.6 of the NIST AI RMF Playbook has mechanisms in place to inventory AI systems, resourced according to organizational risk priorities. It describes an AI system inventory as an organized database of artifacts relating to an AI system or model, and suggests policies that define which models or systems are inventoried, with preference to inventorying all of them, or minimally high risk models or systems, or systems deployed in high-stakes settings."}
  - {id: intended-use-and-risk-impact, class: A, sources: [intended-use-and-risk-s1], verified: "2026-11-27", text: "MAP 5.1 of the NIST AI RMF Playbook has the likelihood and magnitude of each identified impact, both potentially beneficial and harmful, identified and documented based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback from those external to the team that developed or deployed the AI system, or other data. Assessment scales may be qualitative, such as red-amber-green, and are applied uniformly across the organization's AI portfolio. If the organization proceeds with deployment, the likelihood and magnitude estimates can be used to assign TEVV resources appropriate for the risk level. The page spells TEVV out as test, evaluation, validation and verification."}
  - {id: intended-use-and-risk-tolerance, class: A, sources: [intended-use-and-risk-s1], verified: "2026-11-27", text: "MAP 1.5 of the NIST AI RMF Playbook has organizational risk tolerances determined and documented. Its suggested actions are to establish risk tolerance levels for AI systems and allocate the appropriate oversight resources to each level, and to identify the maximum allowable risk tolerance above which the system will not be deployed."}
  - {id: intended-use-and-risk-tiers, class: A, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "The EU AI Act lays down prohibitions of certain AI practices, specific requirements for high-risk AI systems and harmonised transparency rules for certain AI systems. Under Article 50, providers ensure that AI systems intended to interact directly with natural persons are designed so that those persons are informed that they are interacting with an AI system, unless this is obvious."}
  - {id: intended-use-and-risk-high-risk, class: A, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "Under Article 6(2) and Annex III, point 5(b), of the EU AI Act, AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score are high-risk, with the exception of AI systems used for the purpose of detecting financial fraud."}
  - {id: intended-use-and-risk-exception, class: A, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "Under Article 6(3) of the EU AI Act, an AI system referred to in Annex III is not considered high-risk where it does not pose a significant risk of harm to the health, safety or fundamental rights of natural persons, for example where it is intended to perform a narrow procedural task, but it is always considered high-risk where it performs profiling of natural persons. Under Article 6(4), a provider who considers that such a system is not high-risk documents its assessment before the system is placed on the market or put into service."}
  - {id: intended-use-and-risk-requirements, class: A, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "For high-risk AI systems the EU AI Act requires a risk management system to be established, implemented, documented and maintained (Article 9), technical documentation to be drawn up before the system is placed on the market or put into service and kept up to date (Article 11), and a design that lets natural persons effectively oversee the system during the period in which it is in use (Article 14)."}
  - {id: intended-use-and-risk-dates, class: C, sources: [intended-use-and-risk-s2], verified: "2026-11-27", text: "As amended by Regulation (EU) 2026/1744, Article 113 of the EU AI Act applies Chapter III, Sections 1 to 3, which contain Articles 9, 11 and 14, from 2 December 2027 for AI systems classified as high-risk under Article 6(2) and Annex III, and from 2 August 2028 for those classified under Article 6(1) and Annex I."}
