sources:
  - {id: loss-and-optimisation-s1, title: "Google Machine Learning Crash Course: Linear regression, Loss", url: "https://developers.google.com/machine-learning/crash-course/linear-regression/loss", kind: primary, vendor: false}
  - {id: loss-and-optimisation-s2, title: "Google Machine Learning Crash Course: Linear regression, Gradient descent", url: "https://developers.google.com/machine-learning/crash-course/linear-regression/gradient-descent", kind: primary, vendor: false}
  - {id: loss-and-optimisation-s3, title: "Google Machine Learning Crash Course: Linear regression, Hyperparameters", url: "https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters", kind: primary, vendor: false}
  - {id: loss-and-optimisation-s4, title: "Kingma and Ba: Adam, A Method for Stochastic Optimization, arXiv 1412.6980", url: "https://arxiv.org/abs/1412.6980", kind: primary, vendor: false}
claims:
  - {id: loss-and-optimisation-loss, class: A, sources: [loss-and-optimisation-s1], verified: "2026-11-25", text: "Loss is a numerical metric that describes how wrong a model's predictions are."}
  - {id: loss-and-optimisation-mse, class: A, sources: [loss-and-optimisation-s1], verified: "2026-11-25", text: "Mean squared error is the average, across a set of examples, of the squared difference between the predicted and the actual values."}
  - {id: loss-and-optimisation-outliers, class: A, sources: [loss-and-optimisation-s1], verified: "2026-11-25", text: "L2 loss incurs a much higher penalty for an outlier than L1 loss, so the choice of loss function depends on how the model should treat outliers."}
  - {id: loss-and-optimisation-descent, class: A, sources: [loss-and-optimisation-s2], verified: "2026-11-25", text: "Gradient descent is a technique that iteratively finds the weights and bias that produce the model with the lowest loss."}
  - {id: loss-and-optimisation-step, class: A, sources: [loss-and-optimisation-s2], verified: "2026-11-25", text: "Each iteration moves the weight and bias a small amount in the direction of the negative slope, the direction that reduces loss."}
  - {id: loss-and-optimisation-rate, class: A, sources: [loss-and-optimisation-s3], verified: "2026-11-25", text: "The learning rate determines the magnitude of the changes made to the weights and bias at each step. If it is too low the model can take a long time to converge. If it is too high the model never converges."}
  - {id: loss-and-optimisation-batch, class: A, sources: [loss-and-optimisation-s3], verified: "2026-11-25", text: "Stochastic gradient descent uses a single example per iteration. Mini-batch stochastic gradient descent uses a batch size greater than one and less than the number of data points."}
  - {id: loss-and-optimisation-adam, class: A, sources: [loss-and-optimisation-s4], verified: "2026-11-25", text: "Adam is an algorithm for first-order gradient-based optimisation of stochastic objective functions, based on adaptive estimates of lower-order moments."}
