sources:
  - {id: embeddings-s1, title: "PyTorch: torch.nn.Embedding", url: "https://docs.pytorch.org/docs/2.15/generated/torch.nn.Embedding.html", kind: primary, vendor: true}
  - {id: embeddings-s2, title: "Mikolov et al.: Efficient Estimation of Word Representations in Vector Space", url: "https://arxiv.org/pdf/1301.3781", kind: primary, vendor: false}
  - {id: embeddings-s3, title: "Vaswani et al.: Attention Is All You Need", url: "https://proceedings.neurips.cc/paper/7181-attentionis-all-you-need.pdf", kind: primary, vendor: false}
  - {id: embeddings-s4, title: "Sentence Transformers: Semantic Search", url: "https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html", kind: primary, vendor: false}
  - {id: embeddings-s5, title: "European Union: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng", kind: primary, vendor: false}
claims:
  - {id: embeddings-lookup, class: A, sources: [embeddings-s1, embeddings-s3], verified: "2026-11-27", text: "A neural embedding layer is a lookup table that stores a vector for each entry, and a Transformer uses learned embeddings to convert input tokens to vectors."}
  - {id: embeddings-vectors, class: A, sources: [embeddings-s3], verified: "2026-11-27", text: "The Transformer uses learned embeddings to convert input and output tokens to vectors of the model dimension."}
  - {id: embeddings-geometry, class: A, sources: [embeddings-s2], verified: "2026-11-27", text: "Mikolov and colleagues expect similar words to be close to each other in the vector space, show that many syntactic and semantic regularities can be learned and recovered with a word offset technique, and discuss how accuracy depends on vector dimensionality and the amount of training data."}
  - {id: embeddings-position, class: A, sources: [embeddings-s3], verified: "2026-11-27", text: "The original Transformer adds positional encodings to input embeddings so it can use the order of tokens in the sequence."}
  - {id: embeddings-cosine, class: A, sources: [embeddings-s4], verified: "2026-11-27", text: "Sentence Transformers semantic search uses cosine similarity by default to compare query and corpus embeddings."}
  - {id: embeddings-search, class: B, sources: [embeddings-s4], verified: "2026-11-27", text: "For asymmetric semantic search, Sentence Transformers recommends encoding queries and documents with their task-specific methods; approximate nearest-neighbour retrieval may miss some high-similarity results."}
  - {id: embeddings-personal-data, class: A, sources: [embeddings-s5], verified: "2026-11-27", text: "The GDPR defines personal data as information relating to an identified or identifiable natural person, and Article 17 provides a right to erasure when one of its specified grounds applies."}
