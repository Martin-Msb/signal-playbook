sources:
  - {id: catalogs-and-metadata-s1, title: "Apache Iceberg documentation: REST Catalog API Specification", url: "https://iceberg.apache.org/rest-catalog-spec/", kind: primary, vendor: false}
  - {id: catalogs-and-metadata-s2, title: "Apache Iceberg documentation: REST Catalog Protocol", url: "https://iceberg.apache.org/docs/nightly/rest-protocol/", kind: primary, vendor: false}
  - {id: catalogs-and-metadata-s3, title: "Apache Polaris documentation: Apache Polaris 1.8.0", url: "https://polaris.apache.org/releases/1.8.0/", kind: primary, vendor: false}
  - {id: catalogs-and-metadata-s4, title: "W3C: Data Catalog Vocabulary (DCAT) Version 3", url: "https://www.w3.org/TR/vocab-dcat-3/", kind: primary, vendor: false}
  - {id: catalogs-and-metadata-s5, title: "Databricks documentation: Data discovery in Unity Catalog", url: "https://docs.databricks.com/gcp/en/data-governance/unity-catalog/data-discovery", kind: primary, vendor: true}
  - {id: catalogs-and-metadata-s7, title: "AWS Glue documentation: Business glossaries for AWS Glue Data Catalog", url: "https://docs.aws.amazon.com/glue/latest/dg/catalog-business-glossaries.html", kind: primary, vendor: true}
  - {id: catalogs-and-metadata-s6, title: "Databricks documentation: Unity Catalog privileges reference", url: "https://docs.databricks.com/gcp/en/data-governance/unity-catalog/access-control/privileges-reference", kind: primary, vendor: true}
claims:
  - {id: catalogs-and-metadata-pointer, class: A, sources: [catalogs-and-metadata-s3], verified: "2026-11-27", text: "An Iceberg catalog stores the current metadata pointer for one or more Iceberg tables. A metadata pointer maps a table name to the location of that table's current metadata file."}
  - {id: catalogs-and-metadata-rest, class: A, sources: [catalogs-and-metadata-s1], verified: "2026-11-27", text: "Iceberg defines a REST-based Catalog API for managing table metadata and performing catalog operations. The REST catalog protocol is a common API for interacting with any Iceberg catalog."}
  - {id: catalogs-and-metadata-polaris, class: B, sources: [catalogs-and-metadata-s3], verified: "2026-11-27", text: "Apache Polaris is a catalog implementation for Apache Iceberg tables, built on the Iceberg REST protocol. In Polaris, catalog resources organize Iceberg tables and namespaces logically group tables within a catalog. Polaris provides centralized, secure read and write access to Iceberg tables across REST-compatible query engines."}
  - {id: catalogs-and-metadata-commit, class: A, sources: [catalogs-and-metadata-s2], verified: "2026-11-27", text: "In the Iceberg REST protocol, requirements state what must still be true of current table metadata and updates describe metadata changes. The server validates requirements against current metadata, applies valid updates and writes new metadata; if a requirement fails, the commit is rejected."}
  - {id: catalogs-and-metadata-dcat, class: A, sources: [catalogs-and-metadata-s4], verified: "2026-11-27", text: "W3C DCAT is an RDF vocabulary for representing data catalogs. It provides a standard model and vocabulary for describing datasets and data services, which facilitates metadata consumption and aggregation across catalogs and can enable federated search across catalogs in multiple sites."}
  - {id: catalogs-and-metadata-discovery, class: B, sources: [catalogs-and-metadata-s5], verified: "2026-11-27", text: "Unity Catalog data discovery is described as enabling people to find, understand and trust data assets. Domains organize assets by business area, and governed Pages define business concepts for people to reference."}
  - {id: catalogs-and-metadata-tags, class: B, sources: [catalogs-and-metadata-s5], verified: "2026-11-27", text: "Unity Catalog tags are attributes applied to securable objects to organize and categorize them, making data easier to search or filter. Governed tags let administrators define allowed values for specified tag keys."}
  - {id: catalogs-and-metadata-glossary, class: B, sources: [catalogs-and-metadata-s7], verified: "2026-11-27", text: "An AWS Glue Data Catalog business glossary is a container for controlled vocabulary terms that define business concepts. Glossary terms can be associated with Data Catalog assets to enrich them with business meaning and improve discoverability through semantic search. AWS documents the feature as in preview and subject to change."}
  - {id: catalogs-and-metadata-browse, class: B, sources: [catalogs-and-metadata-s6], verified: "2026-11-27", text: "Unity Catalog's BROWSE privilege allows users to discover objects, view their metadata and request access without needing USE CATALOG or USE SCHEMA, and without granting access to the underlying data."}
