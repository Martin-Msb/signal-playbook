sources:
  - {id: multi-agent-systems-s1, title: "Anthropic: How we built our multi-agent research system", url: "https://www.anthropic.com/engineering/multi-agent-research-system", kind: primary, vendor: true}
  - {id: multi-agent-systems-s2, title: "Claude Code Docs: Create custom subagents", url: "https://code.claude.com/docs/en/sub-agents", kind: primary, vendor: true}
  - {id: multi-agent-systems-s3, title: "OpenAI Agents SDK: Agent orchestration", url: "https://openai.github.io/openai-agents-python/multi_agent/", kind: primary, vendor: true}
  - {id: multi-agent-systems-s4, title: "OWASP GenAI Security Project: Top 10 for Agentic Applications for 2026", url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", kind: primary, vendor: false}
  - {id: multi-agent-systems-s5, title: "OWASP GenAI Security Project: LLM06:2025 Excessive Agency", url: "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/", kind: primary, vendor: false}
  - {id: multi-agent-systems-s6, title: "NIST: AI Risk Management Framework 1.0, Core, Govern", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
claims:
  - {id: multi-agent-systems-fit, class: B, sources: [multi-agent-systems-s1, multi-agent-systems-s2], verified: "2026-11-27", text: "Multi-agent systems excel at valuable tasks that involve heavy parallelisation, information that exceeds single context windows, and interfacing with numerous complex tools. A side task can flood a main conversation with search results, logs or file contents."}
  - {id: multi-agent-systems-orchestrator, class: A, sources: [multi-agent-systems-s1, multi-agent-systems-s3], verified: "2026-11-27", text: "In the orchestrator-worker pattern a lead agent coordinates the process while delegating to specialised subagents. In the OpenAI Agents SDK a manager agent keeps control of the conversation and calls specialist agents as tools."}
  - {id: multi-agent-systems-brief, class: B, sources: [multi-agent-systems-s1], verified: "2026-11-27", text: "Each subagent needs an objective, an output format, guidance on the tools and sources to use, and clear task boundaries. Without detailed task descriptions, agents duplicate work, leave gaps, or fail to find necessary information."}
  - {id: multi-agent-systems-isolation, class: A, sources: [multi-agent-systems-s1, multi-agent-systems-s2], verified: "2026-11-27", text: "Subagents operate in parallel with their own context windows and condense the most important tokens for the lead agent. In Claude Code each subagent runs in its own context window with a custom system prompt, specific tool access and independent permissions, does its work in its own context and returns only the summary."}
  - {id: multi-agent-systems-parallel, class: B, sources: [multi-agent-systems-s1, multi-agent-systems-s3], verified: "2026-11-27", text: "In Anthropic's research system the lead agent spins up 3 to 5 subagents in parallel rather than serially, then synthesises their results and decides whether more research is needed. The OpenAI Agents SDK documents running multiple agents in parallel with Python primitives such as asyncio.gather."}
  - {id: multi-agent-systems-tokens, class: C, sources: [multi-agent-systems-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic reported on 13 June 2025 that in its data agents typically use about 4 times more tokens than chat interactions and multi-agent systems about 15 times more tokens than chats, and that multi-agent systems require tasks where the value of the task is high enough to pay for the increased performance."}
  - {id: multi-agent-systems-coordination, class: B, sources: [multi-agent-systems-s1, multi-agent-systems-s2], verified: "2026-11-27", text: "Multi-agent systems bring a rapid growth in coordination complexity. Domains that require all agents to share the same context or involve many dependencies between agents are not a good fit for multi-agent systems today. Each subagent spends tokens of its own while it runs."}
  - {id: multi-agent-systems-privilege, class: B, sources: [multi-agent-systems-s4], verified: "2026-11-27", text: "The OWASP Top 10 for Agentic Applications 2026 lists un-scoped privilege inheritance under Identity and Privilege Abuse: a high-privilege manager delegates tasks without least-privilege scoping and a narrow worker receives excessive rights. Its mitigations include task-scoped, time-bound permissions with per-agent identities and short-lived credentials, and human approval for high-privilege or irreversible actions."}
  - {id: multi-agent-systems-peer, class: A, sources: [multi-agent-systems-s5], verified: "2026-11-27", text: "OWASP names a malicious or compromised peer agent in multi-agent systems among the triggers of Excessive Agency, and advises limiting the permissions that extensions are granted to other systems to the minimum necessary."}
  - {id: multi-agent-systems-trace, class: B, sources: [multi-agent-systems-s4], verified: "2026-11-27", text: "OWASP describes cascading failures as a single fault that propagates across autonomous agents and compounds into system-wide harm. It advises recording all inter-agent messages, policy decisions and execution outcomes in tamper-evident, time-stamped logs bound to cryptographic agent identities, to support traceability and accountability."}
  - {id: multi-agent-systems-accountable, class: A, sources: [multi-agent-systems-s6], verified: "2026-11-27", text: "NIST AI RMF 1.0, GOVERN 2.1: roles and responsibilities and lines of communication related to mapping, measuring and managing AI risks are documented and are clear to individuals and teams throughout the organisation."}
