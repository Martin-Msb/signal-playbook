sources:
  - {id: features-labels-and-datasets-s1, title: "Google for Developers: Machine Learning Glossary", url: "https://developers.google.com/machine-learning/glossary", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s2, title: "scikit-learn 1.9.1: Glossary of common terms and API elements", url: "https://scikit-learn.org/stable/glossary.html", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s3, title: "scikit-learn: Getting started", url: "https://scikit-learn.org/stable/getting_started.html", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s4, title: "scikit-learn: Common pitfalls and recommended practices", url: "https://scikit-learn.org/stable/common_pitfalls.html", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s5, title: "Gebru et al.: Datasheets for Datasets (arXiv 1803.09010, version 8)", url: "https://arxiv.org/abs/1803.09010", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s6, title: "Hugging Face Hub documentation: Dataset Cards", url: "https://huggingface.co/docs/hub/datasets-cards", kind: primary, vendor: true}
  - {id: features-labels-and-datasets-s7, title: "EUR-Lex: Regulation (EU) 2016/679 (General Data Protection Regulation), text", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s8, title: "EUR-Lex: Regulation (EU) 2016/679, document information and amendments", url: "https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32016R0679", kind: primary, vendor: false}
  - {id: features-labels-and-datasets-s9, title: "EUR-Lex: Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
claims:
  - {id: features-labels-and-datasets-row, class: A, sources: [features-labels-and-datasets-s1], verified: "2026-11-27", text: "A dataset is a collection of raw data, commonly organised as a spreadsheet or a file of comma-separated values. The row of a dataset is typically the raw source for an example, and an example typically consists of a subset of the columns in the dataset."}
  - {id: features-labels-and-datasets-example, class: A, sources: [features-labels-and-datasets-s1], verified: "2026-11-27", text: "An example is the values of one row of features and possibly a label. A labelled example consists of one or more features and a label, and labelled examples are used during training."}
  - {id: features-labels-and-datasets-label, class: A, sources: [features-labels-and-datasets-s1, features-labels-and-datasets-s2], verified: "2026-11-27", text: "In supervised machine learning the label is the answer or result portion of an example. scikit-learn calls it the target, also known as the dependent variable, outcome variable, response variable, ground truth or label."}
  - {id: features-labels-and-datasets-feature, class: A, sources: [features-labels-and-datasets-s1, features-labels-and-datasets-s2], verified: "2026-11-27", text: "A feature is an input variable to a machine learning model. In a data matrix, features are represented as columns. Elsewhere features are known as attributes, predictors, regressors or independent variables."}
  - {id: features-labels-and-datasets-xy, class: A, sources: [features-labels-and-datasets-s3], verified: "2026-11-27", text: "In scikit-learn the samples matrix X typically has the size (n_samples, n_features): samples are represented as rows and features as columns. The target values y are usually a one-dimensional array in which the i-th entry is the target of the i-th row of X."}
  - {id: features-labels-and-datasets-proxy-label, class: A, sources: [features-labels-and-datasets-s1], verified: "2026-11-27", text: "Proxy labels are data used to approximate labels that are not directly available in a dataset."}
  - {id: features-labels-and-datasets-leakage, class: A, sources: [features-labels-and-datasets-s4, features-labels-and-datasets-s1], verified: "2026-11-27", text: "Data leakage occurs when information that would not be available at prediction time is used when building the model. It results in overly optimistic performance estimates and poorer performance on novel data. Label leakage is a model design flaw in which a feature is a proxy for the label."}
  - {id: features-labels-and-datasets-datasheet, class: B, sources: [features-labels-and-datasets-s5], verified: "2026-11-27", text: "Datasheets for Datasets proposes that every dataset be accompanied with a datasheet that documents its motivation, composition, collection process and recommended uses. Its questions ask what the instances represent, whether there is a label or target associated with each instance, whether the dataset identifies subpopulations such as age or gender, whether it contains data that might be considered sensitive, and whether there are tasks for which it should not be used."}
  - {id: features-labels-and-datasets-card, class: B, sources: [features-labels-and-datasets-s6], verified: "2026-11-27", text: "On the Hugging Face Hub a dataset may be documented by the README.md file in its repository. This file is called a dataset card, and the documentation advises including information about any potential biases within the dataset."}
  - {id: features-labels-and-datasets-special, class: C, sources: [features-labels-and-datasets-s7, features-labels-and-datasets-s8], verified: "2026-11-27", text: "Article 9(1) of the GDPR prohibits processing personal data revealing racial or ethnic origin, political opinions, religious or philosophical beliefs or trade union membership, and processing genetic data, biometric data for uniquely identifying a person, data concerning health, or data concerning a person's sex life or sexual orientation. Article 9(2) lists the cases in which the prohibition does not apply, such as explicit consent. On 27 November 2026 EUR-Lex lists corrigenda and no amending act for the regulation."}
  - {id: features-labels-and-datasets-proxy, class: A, sources: [features-labels-and-datasets-s1], verified: "2026-11-27", text: "A sensitive attribute is a human attribute that may be given special consideration for legal, ethical, social or personal reasons. A proxy is an attribute used as a stand-in for a sensitive attribute: an individual's postal code might be used as a proxy for their income, race or ethnicity."}
  - {id: features-labels-and-datasets-ai-act-data, class: C, sources: [features-labels-and-datasets-s9], verified: "2026-11-27", text: "In the text consolidated on 27 July 2026, Article 10(2) of the EU Artificial Intelligence Act requires the training, validation and testing data sets of high-risk AI systems to be subject to data governance and management practices. These concern, among other things, data preparation such as annotation and labelling, the formulation of assumptions about what the data are supposed to measure and represent, and examination in view of possible biases that are likely to lead to discrimination prohibited under Union law."}
  - {id: features-labels-and-datasets-ai-act-bias, class: C, sources: [features-labels-and-datasets-s9], verified: "2026-11-27", text: "Regulation (EU) 2026/1744 of 8 July 2026 deleted Article 10(5) of the EU Artificial Intelligence Act and added Article 4a. Under Article 4a, special categories of personal data may exceptionally be processed to the extent strictly necessary for bias detection and correction, under conditions that include that other data cannot do the job and that the data are deleted once the bias has been corrected or their retention period ends."}
