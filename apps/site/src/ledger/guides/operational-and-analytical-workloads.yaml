  - {id: operational-and-analytical-workloads-s2, title: "Microsoft Learn, Azure Architecture Center: Online analytical processing", url: "https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-analytical-processing", kind: primary, vendor: true}
