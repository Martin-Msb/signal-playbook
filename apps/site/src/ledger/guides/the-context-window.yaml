sources:
  - {id: the-context-window-s1, title: "Anthropic: Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows", kind: primary, vendor: true}
  - {id: the-context-window-s2, title: "Anthropic: Prompt caching", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", kind: primary, vendor: true}
  - {id: the-context-window-s3, title: "European Union: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng", kind: primary, vendor: false}
  - {id: the-context-window-s4, title: "Anthropic: Using the Messages API", url: "https://platform.claude.com/docs/en/build-with-claude/working-with-messages", kind: primary, vendor: true}
claims:
  - {id: the-context-window-contents, class: B, sources: [the-context-window-s1], verified: "2026-11-27", text: "Anthropic defines the context window as all the text a language model can reference when generating a response, including the response itself, and describes it as a working memory distinct from the training data. In its API everything in the request counts toward the context window: the system prompt, every message including tool results, images and documents, and the tool definitions. The output generated for the turn counts too."}
  - {id: the-context-window-limit, class: C, sources: [the-context-window-s1], verified: "2026-11-27", text: "Anthropic lists the models that have a 1M-token context window and states that other Claude models have a 200k-token context window. If the input alone exceeds the model's context window, the API returns a 400 invalid request error. A larger context window allows the model to handle more complex and lengthy prompts."}
  - {id: the-context-window-stateless, class: B, sources: [the-context-window-s4], verified: "2026-11-27", text: "The Anthropic Messages API is stateless, which means that the full conversational history is always sent to the API."}
  - {id: the-context-window-history, class: B, sources: [the-context-window-s1], verified: "2026-11-27", text: "In the standard context window behaviour for Anthropic API requests, each turn's input contains all previous conversation history plus the current user message, previous turns are preserved completely, and the generated response becomes part of the input for the next turn."}
  - {id: the-context-window-interface, class: B, sources: [the-context-window-s1], verified: "2026-11-27", text: "Anthropic states that chat interfaces such as claude.ai can also manage the context window on a rolling first in, first out basis."}
  - {id: the-context-window-cache, class: B, sources: [the-context-window-s1, the-context-window-s2], verified: "2026-11-27", text: "Anthropic states that prompt caching lets the API resume from specific prefixes in a prompt, which reduces processing time and costs for repetitive tasks or prompts with consistent elements, and that the cache covers the prefix in the order tools, system, messages. Cached prompt prefixes still occupy the context window: caching changes what those tokens cost, not whether they count."}
  - {id: the-context-window-rot, class: B, sources: [the-context-window-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that more context is not automatically better: as token count grows, accuracy and recall degrade, a phenomenon known as context rot, which makes curating what is in context as important as how much space is available."}
  - {id: the-context-window-gdpr, class: A, sources: [the-context-window-s3], verified: "2026-11-27", text: "EU GDPR Article 5(1) requires personal data to be adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed (point c), kept in a form which permits identification of data subjects for no longer than is necessary for those purposes (point e), and processed in a manner that ensures appropriate security of the personal data (point f)."}
