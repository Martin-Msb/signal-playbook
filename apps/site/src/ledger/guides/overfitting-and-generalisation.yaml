sources:
  - {id: overfitting-and-generalisation-s1, title: "Google Machine Learning Crash Course: Overfitting", url: "https://developers.google.com/machine-learning/crash-course/overfitting/overfitting", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s2, title: "Google Machine Learning Crash Course: Overfitting, Model complexity", url: "https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s3, title: "Google Machine Learning Crash Course: Overfitting, L2 regularization", url: "https://developers.google.com/machine-learning/crash-course/overfitting/regularization", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s4, title: "scikit-learn: Validation curves, plotting scores to evaluate models", url: "https://scikit-learn.org/stable/modules/learning_curve.html", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s5, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s6, title: "Shokri, Stronati, Song and Shmatikov: Membership Inference Attacks against Machine Learning Models, arXiv 1610.05820", url: "https://arxiv.org/abs/1610.05820", kind: primary, vendor: false}
  - {id: overfitting-and-generalisation-s7, title: "Yeom, Giacomelli, Fredrikson and Jha: Privacy Risk in Machine Learning, Analyzing the Connection to Overfitting, arXiv 1709.01604", url: "https://arxiv.org/abs/1709.01604", kind: primary, vendor: false}
claims:
  - {id: overfitting-and-generalisation-overfit, class: A, sources: [overfitting-and-generalisation-s1], verified: "2026-11-27", text: "Overfitting means creating a model that matches (memorises) the training set so closely that the model fails to make correct predictions on new data."}
  - {id: overfitting-and-generalisation-generalise, class: A, sources: [overfitting-and-generalisation-s1], verified: "2026-11-27", text: "Generalisation is the opposite of overfitting. A model that generalises well makes good predictions on new data."}
  - {id: overfitting-and-generalisation-underfit, class: A, sources: [overfitting-and-generalisation-s1], verified: "2026-11-27", text: "An underfit model does not even make good predictions on the training data."}
  - {id: overfitting-and-generalisation-diverge, class: A, sources: [overfitting-and-generalisation-s1], verified: "2026-11-27", text: "When the loss curves for the training set and the validation set behave similarly at first and then diverge, with loss declining or holding steady for the training set and increasing for the validation set, this suggests overfitting."}
  - {id: overfitting-and-generalisation-complexity, class: A, sources: [overfitting-and-generalisation-s2], verified: "2026-11-27", text: "Complex models typically outperform simple models on the training set. Simple models typically outperform complex models on the test set."}
  - {id: overfitting-and-generalisation-regularise, class: A, sources: [overfitting-and-generalisation-s2, overfitting-and-generalisation-s3], verified: "2026-11-27", text: "Penalising complex models is one form of regularisation. L2 regularisation encourages weights toward 0 but never pushes them all the way to zero. Raising the regularisation rate strengthens the influence of regularisation, thereby reducing the chances of overfitting."}
  - {id: overfitting-and-generalisation-early, class: B, sources: [overfitting-and-generalisation-s3], verified: "2026-11-27", text: "Early stopping means ending training before the model fully converges, for example when the loss curve for the validation set starts to increase. It is a quick, but rarely optimal, form of regularisation."}
  - {id: overfitting-and-generalisation-bias-variance, class: A, sources: [overfitting-and-generalisation-s4], verified: "2026-11-27", text: "The generalisation error of an estimator can be decomposed in terms of bias, variance and noise. The bias of an estimator is its average error for different training sets. The variance indicates how sensitive it is to varying training sets. Noise is a property of the data."}
  - {id: overfitting-and-generalisation-scores, class: A, sources: [overfitting-and-generalisation-s4], verified: "2026-11-27", text: "If the training score and the validation score are both low, the estimator is underfitting. If the training score is high and the validation score is low, the estimator is overfitting."}
  - {id: overfitting-and-generalisation-poly, class: A, sources: [overfitting-and-generalisation-s4], verified: "2026-11-27", text: "In scikit-learn's polynomial example, the first estimator can at best provide only a poor fit to the samples and the true function because it is too simple (high bias). The last estimator approximates the training data perfectly but does not fit the true function very well: it is very sensitive to varying training data (high variance)."}
  - {id: overfitting-and-generalisation-learning-curve, class: B, sources: [overfitting-and-generalisation-s4], verified: "2026-11-27", text: "A learning curve shows the validation and training score of an estimator for varying numbers of training samples. It is a tool to find out how much we benefit from adding more training data and whether the estimator suffers more from a variance error or a bias error."}
  - {id: overfitting-and-generalisation-more-data, class: B, sources: [overfitting-and-generalisation-s4], verified: "2026-11-27", text: "In scikit-learn's learning curve example, the training score of the SVM is much greater than the validation score for small amounts of data, and adding more training samples will most likely increase generalisation."}
  - {id: overfitting-and-generalisation-nist, class: B, sources: [overfitting-and-generalisation-s5], verified: "2026-11-27", text: "MEASURE 2.5 of the NIST AI Risk Management Framework 1.0 states that the AI system to be deployed is demonstrated to be valid and reliable, and that limitations of the generalisability beyond the conditions under which the technology was developed are documented."}
  - {id: overfitting-and-generalisation-membership, class: A, sources: [overfitting-and-generalisation-s6], verified: "2026-11-27", text: "The basic membership inference attack is: given a data record and black-box access to a model, determine if the record was in the model's training dataset."}
  - {id: overfitting-and-generalisation-leak, class: A, sources: [overfitting-and-generalisation-s7], verified: "2026-11-27", text: "Overfitting is sufficient to allow an attacker to perform membership inference. Overfitting is not necessary for these attacks."}
