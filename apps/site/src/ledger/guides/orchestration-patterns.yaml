sources:
  - {id: orchestration-patterns-s1, title: "Anthropic: Building effective agents", url: "https://www.anthropic.com/engineering/building-effective-agents", kind: primary, vendor: true}
  - {id: orchestration-patterns-s2, title: "OpenAI Agents SDK: Agent orchestration", url: "https://openai.github.io/openai-agents-python/multi_agent/", kind: primary, vendor: true}
  - {id: orchestration-patterns-s3, title: "LangChain: Workflows and agents", url: "https://docs.langchain.com/oss/python/langgraph/workflows-agents", kind: primary, vendor: true}
  - {id: orchestration-patterns-s4, title: "OWASP GenAI Security Project: LLM03:2026 Excessive Agency", url: "https://genai.owasp.org/llm2026/llm032026-excessive-agency/", kind: primary, vendor: false}
  - {id: orchestration-patterns-s5, title: "EUR-Lex: Regulation (EU) 2024/1689, consolidated version of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
claims:
  - {id: orchestration-patterns-workflow-agent, class: A, sources: [orchestration-patterns-s1, orchestration-patterns-s3], verified: "2026-11-27", text: "Workflows are systems where LLMs and tools are orchestrated through predefined code paths. Agents are systems where LLMs dynamically direct their own processes and tool usage."}
  - {id: orchestration-patterns-agent-cost, class: B, sources: [orchestration-patterns-s1], verified: "2026-11-27", text: "The autonomous nature of agents means higher costs and the potential for compounding errors. Anthropic recommends extensive testing in sandboxed environments, along with appropriate guardrails."}
  - {id: orchestration-patterns-tradeoff, class: B, sources: [orchestration-patterns-s1, orchestration-patterns-s2], verified: "2026-11-27", text: "Agentic systems often trade latency and cost for better task performance. Orchestrating via code makes tasks more deterministic and predictable in terms of speed, cost and performance."}
  - {id: orchestration-patterns-simplest, class: B, sources: [orchestration-patterns-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic recommends finding the simplest solution possible and only increasing complexity when needed. For many applications, optimising single LLM calls with retrieval and in-context examples is usually enough."}
  - {id: orchestration-patterns-chaining, class: A, sources: [orchestration-patterns-s1, orchestration-patterns-s3], verified: "2026-11-27", text: "Prompt chaining decomposes a task into a sequence of steps, where each LLM call processes the output of the previous one. Programmatic checks, called gates, can be placed on intermediate steps. It suits tasks that decompose cleanly into fixed subtasks, and it trades latency for higher accuracy by making each LLM call an easier task."}
  - {id: orchestration-patterns-routing, class: A, sources: [orchestration-patterns-s1, orchestration-patterns-s3], verified: "2026-11-27", text: "Routing classifies an input and directs it to a specialised follow-up task. Customer service queries such as general questions, refund requests and technical support can be directed to different downstream processes, prompts and tools, and simple queries can be routed to smaller, cheaper models."}
  - {id: orchestration-patterns-parallel, class: A, sources: [orchestration-patterns-s1, orchestration-patterns-s2], verified: "2026-11-27", text: "In parallelisation, LLMs work simultaneously on a task and their outputs are aggregated programmatically. Sectioning breaks a task into independent subtasks run in parallel. Voting runs the same task multiple times to get diverse outputs. In one example, one model instance handles the user's query while another screens it for inappropriate content."}
  - {id: orchestration-patterns-orchestrator, class: A, sources: [orchestration-patterns-s1], verified: "2026-11-27", text: "In the orchestrator-workers workflow, a central LLM dynamically breaks down tasks, delegates them to worker LLMs and synthesises their results. Unlike parallelisation, the subtasks are not predefined: the orchestrator determines them from the input."}
  - {id: orchestration-patterns-evaluator, class: A, sources: [orchestration-patterns-s1, orchestration-patterns-s2], verified: "2026-11-27", text: "In the evaluator-optimizer workflow, one LLM call generates a response while another provides evaluation and feedback in a loop. In code, each iteration of a while loop runs the task agent and then an evaluator, and stops when the evaluator says the output passes the required criteria. The pattern fits when evaluation criteria are clear and iteration adds measurable value."}
  - {id: orchestration-patterns-when-agent, class: B, sources: [orchestration-patterns-s1], verified: "2026-11-27", text: "Workflows offer predictability on well-defined tasks. Agents suit open-ended problems where the number of steps cannot be predicted in advance and a fixed path cannot be hardcoded."}
  - {id: orchestration-patterns-checkpoints, class: B, sources: [orchestration-patterns-s1], verified: "2026-11-27", text: "Agents can pause for human feedback at checkpoints or when encountering blockers, and it is common to include stopping conditions such as a maximum number of iterations to maintain control."}
  - {id: orchestration-patterns-excessive-autonomy, class: A, sources: [orchestration-patterns-s4], verified: "2026-11-27", text: "OWASP names excessive autonomy as a root cause of Excessive Agency, alongside excessive functionality and excessive permissions: an LLM-based application fails to independently verify and approve high-impact actions. OWASP advises human-in-the-loop control to require a human to approve high-impact actions before they are taken."}
  - {id: orchestration-patterns-oversight-law, class: C, sources: [orchestration-patterns-s5], verified: "2026-11-27", text: "Article 14(3) of Regulation (EU) 2024/1689, the EU AI Act, in the consolidated version of 27 July 2026, states that oversight measures shall be commensurate with the risks, level of autonomy and context of use of the high-risk AI system."}
