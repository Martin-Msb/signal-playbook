claims:
  - {id: time-and-history-two-times, class: A, sources: [time-and-history-s1, time-and-history-s2], verified: "2026-11-25", text: "In Apache Flink, processing time refers to the system time of the machine that is executing the respective operation, and event time is the time that each individual event occurred on its producing device. Apache Beam describes event time as determined by the timestamp on the data element itself and processing time as determined by the clock on the system processing the element, with a certain amount of lag between the time a data event occurs and the time it is processed."}
  - {id: time-and-history-late, class: A, sources: [time-and-history-s2, time-and-history-s1], verified: "2026-11-25", text: "Data is not always guaranteed to arrive in a pipeline in time order, or to always arrive at predictable intervals. In Beam a watermark is a guess as to when all data in a certain window is expected to have arrived in the pipeline, and an element that arrives after the watermark has progressed past the end of its window is considered late data. In Flink, watermarks flow as part of the data stream and carry a timestamp."}
  - {id: time-and-history-type1, class: A, sources: [time-and-history-s3], verified: "2026-11-25", text: "With slowly changing dimension type 1, the old attribute value in the dimension row is overwritten with the new value. Type 1 attributes always reflect the most recent assignment, and therefore this technique destroys history. The approach is easy to implement and does not create additional dimension rows, but aggregate fact tables and OLAP cubes affected by the change must be recomputed."}
  - {id: time-and-history-type2, class: A, sources: [time-and-history-s4], verified: "2026-11-25", text: "Slowly changing dimension type 2 changes add a new row in the dimension with the updated attribute values. Because there will potentially be multiple rows describing each member, a new primary surrogate key is assigned when a new row is created. A minimum of three additional columns should be added to the dimension row: a row effective date or date/time stamp, a row expiration date or date/time stamp, and a current row indicator."}
  - {id: time-and-history-dbt, class: B, sources: [time-and-history-s6], verified: "2026-11-25", text: "dbt snapshots record changes to a mutable table over time and implement type-2 Slowly Changing Dimensions over mutable source tables. dbt_valid_from is the timestamp when the snapshot row became valid, and dbt_valid_to is the timestamp when the row became invalidated, which for current records is NULL by default."}
  - {id: time-and-history-system-versioned, class: A, sources: [time-and-history-s7, time-and-history-s9], verified: "2026-11-25", text: "A system-versioned temporal table in SQL Server is designed to keep a full history of data changes, and the system manages the period of validity for each row. On an update the system stores the previous value of the row in the history table and sets its period end to the begin time of the current transaction, in UTC, based on the system clock. MariaDB states that system-versioned tables store the history of all changes and were first introduced in the SQL:2011 standard."}
  - {id: time-and-history-as-of, class: A, sources: [time-and-history-s7, time-and-history-s9], verified: "2026-11-25", text: "In SQL Server, FOR SYSTEM_TIME AS OF returns a table with rows containing the values that were current at the specified point in time in the past. In MariaDB, AS OF is used to see the table as it was at a specific point in time in the past."}
  - {id: time-and-history-periodic, class: A, sources: [time-and-history-s5], verified: "2026-11-25", text: "A row in a periodic snapshot fact table summarizes many measurement events occurring over a standard period, such as a day, a week, or a month. The grain is the period, not the individual transaction. Even if no activity takes place during the period, a row is typically inserted in the fact table containing a zero or null for each fact."}
  - {id: time-and-history-table-snapshots, class: B, sources: [time-and-history-s13, time-and-history-s14], verified: "2026-11-25", text: "Each write to an Apache Iceberg table creates a new snapshot, or version, of a table. Snapshots can be used for time-travel queries, or the table can be rolled back to any valid snapshot. Delta Lake time travel allows you to query an older snapshot of a Delta table, selected with TIMESTAMP AS OF or VERSION AS OF."}
  - {id: time-and-history-bitemporal, class: A, sources: [time-and-history-s11, time-and-history-s10], verified: "2026-11-25", text: "In MariaDB, application-time period tables define a time period between two temporal columns, for application-level data versioning. Bitemporal tables combine system-versioning and application-time periods, versioning data at both levels."}
  - {id: time-and-history-temporal-key, class: C, sources: [time-and-history-s12], verified: "2026-11-25", text: "In the PostgreSQL 19 documentation, a PRIMARY KEY or UNIQUE constraint may mark its last column WITHOUT OVERLAPS, so that the column is checked for overlaps instead of equality. This is sometimes called a temporal key, if the column is a range of dates or timestamps."}
  - {id: time-and-history-audit, class: B, sources: [time-and-history-s7, time-and-history-s9], verified: "2026-11-25", text: "Microsoft lists auditing all data changes and performing data forensics when necessary, and reconstructing the state of the data as of any time in the past, among the use cases for temporal tables. MariaDB lists forensic analysis and legal requirements to store data for N years among the uses of system-versioned tables, and its DELETE HISTORY statement requires a special DELETE HISTORY privilege to protect the integrity of the history."}
  - {id: time-and-history-retention, class: B, sources: [time-and-history-s8, time-and-history-s13], verified: "2026-11-25", text: "Microsoft states that developing a data retention policy for the history table is an important part of planning and managing the lifecycle of every temporal table. With HISTORY_RETENTION_PERIOD set, a background task removes historical rows whose end of period value is older than the retention period, and without it the retention defaults to INFINITE. Iceberg snapshots accumulate until they are expired by the expireSnapshots operation, and expiring old snapshots removes them from metadata, so they are no longer available for time travel queries."}
  - {id: time-and-history-time-travel-limits, class: C, sources: [time-and-history-s14, time-and-history-s15], verified: "2026-11-25", text: "By default Delta Lake time travel reaches up to 30 days back, unless VACUUM has been run or the retention settings have been changed. The standard retention period of Snowflake Time Travel is 1 day, and Enterprise Edition and higher allow up to 90 days for permanent objects."}
  - {id: time-and-history-storage-limitation, class: C, sources: [time-and-history-s16, time-and-history-s17], verified: "2026-11-26", text: "The European Data Protection Board states that the storage of individuals' personal data must be limited in time, and that the data is to be deleted or anonymised once it is no longer necessary. Article 5(1)(e) of Regulation (EU) 2016/679 requires personal data to be kept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed."}
  - {id: time-and-history-omnibus, class: C, sources: [time-and-history-s18], verified: "2026-11-25", text: "The European Parliament's Legislative Train page, updated as of 25 October 2026, lists the Digital Omnibus regulation proposal, which would amend the GDPR, with the status Tabled. The Council adopted its negotiating mandate on 21 October 2026."}
