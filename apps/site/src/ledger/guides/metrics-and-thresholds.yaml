sources:
  - {id: metrics-and-thresholds-s1, title: "Google Machine Learning Crash Course: Classification, Accuracy, recall, precision and related metrics", url: "https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s2, title: "Google Machine Learning Crash Course: Classification, Thresholds and the confusion matrix", url: "https://developers.google.com/machine-learning/crash-course/classification/thresholding", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s3, title: "Google Machine Learning Crash Course: Classification, ROC and AUC", url: "https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s4, title: "scikit-learn User Guide: Tuning the decision threshold for class prediction", url: "https://scikit-learn.org/stable/modules/classification_threshold.html", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s5, title: "scikit-learn User Guide: Metrics and scoring", url: "https://scikit-learn.org/stable/modules/model_evaluation.html", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s6, title: "Google Machine Learning Crash Course: Datasets, Class-imbalanced datasets", url: "https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets", kind: primary, vendor: false}
  - {id: metrics-and-thresholds-s7, title: "NIST AI Resource Center: AI Risk Management Framework 1.0, Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
claims:
  - {id: metrics-and-thresholds-accuracy, class: A, sources: [metrics-and-thresholds-s1], verified: "2026-11-27", text: "Accuracy is the proportion of all classifications that were correct, whether positive or negative."}
  - {id: metrics-and-thresholds-imbalance, class: A, sources: [metrics-and-thresholds-s1, metrics-and-thresholds-s6], verified: "2026-11-27", text: "In a class-imbalanced dataset one label is considerably more common than the other. On a heavily imbalanced dataset where one class appears 1% of the time, a model that predicts negative 100% of the time scores 99% on accuracy despite being useless."}
  - {id: metrics-and-thresholds-handling, class: B, sources: [metrics-and-thresholds-s6, metrics-and-thresholds-s5], verified: "2026-11-27", text: "Downsampling means training on a disproportionately low percentage of majority class examples. Balanced accuracy avoids inflated performance estimates on imbalanced datasets."}
  - {id: metrics-and-thresholds-threshold, class: A, sources: [metrics-and-thresholds-s2], verified: "2026-11-27", text: "A classification threshold is the probability chosen to convert a model's output into a class. A negative example classified as positive is a false positive, and a positive example classified as negative is a false negative."}
  - {id: metrics-and-thresholds-default, class: B, sources: [metrics-and-thresholds-s4], verified: "2026-11-27", text: "For binary classification in scikit-learn, the positive class is predicted when the conditional probability is greater than 0.5. The documentation states that these hard-coded rules are not ideal for most use cases."}
  - {id: metrics-and-thresholds-recall, class: A, sources: [metrics-and-thresholds-s1], verified: "2026-11-27", text: "Recall, or the true positive rate, is the proportion of all actual positives that were classified correctly as positives."}
  - {id: metrics-and-thresholds-precision, class: A, sources: [metrics-and-thresholds-s1], verified: "2026-11-27", text: "Precision is the proportion of all the model's positive classifications that are actually positive."}
  - {id: metrics-and-thresholds-curves, class: A, sources: [metrics-and-thresholds-s3], verified: "2026-11-27", text: "The ROC curve is a visual representation of model performance across all thresholds. Precision-recall curves plot precision on the y-axis and recall on the x-axis across all thresholds, and may offer a better comparison than ROC when the dataset is imbalanced."}
  - {id: metrics-and-thresholds-trade, class: A, sources: [metrics-and-thresholds-s1, metrics-and-thresholds-s2], verified: "2026-11-27", text: "As the threshold increases, the model will likely predict fewer positives overall, both true and false. Precision and recall often show an inverse relationship, where improving one of them worsens the other."}
  - {id: metrics-and-thresholds-choose, class: A, sources: [metrics-and-thresholds-s1], verified: "2026-11-27", text: "When the dataset is imbalanced, or one kind of mistake is more costly than the other, it is better to optimise for a metric other than accuracy. Recall is the metric to use when false negatives are more expensive than false positives."}
  - {id: metrics-and-thresholds-cost, class: A, sources: [metrics-and-thresholds-s2, metrics-and-thresholds-s4], verified: "2026-11-27", text: "A threshold of 0.5 is not a good idea if the cost of one type of wrong classification is greater than the other. A decision threshold can optimise a utility metric defined by the business."}
  - {id: metrics-and-thresholds-tuned, class: B, sources: [metrics-and-thresholds-s4], verified: "2026-11-27", text: "scikit-learn's TunedThresholdClassifierCV tunes the decision threshold using an internal cross-validation and chooses the threshold that maximises a given metric. The same data should never be used for training the classifier and tuning the decision threshold."}
  - {id: metrics-and-thresholds-regression, class: A, sources: [metrics-and-thresholds-s5], verified: "2026-11-27", text: "Mean absolute error is a risk metric corresponding to the expected value of the absolute error loss. The root mean squared error is the square root of the mean squared error and provides a measure in the same units as the target variable."}
  - {id: metrics-and-thresholds-owner, class: B, sources: [metrics-and-thresholds-s7], verified: "2026-11-27", text: "The NIST AI Risk Management Framework 1.0 has the potential costs, including non-monetary costs, that result from expected or realised AI errors examined and documented, and has executive leadership take responsibility for decisions about risks associated with AI system development and deployment."}
