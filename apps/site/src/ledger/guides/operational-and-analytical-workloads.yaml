  - {id: operational-and-analytical-workloads-s4, title: "PostgreSQL 19 documentation: Logical replication", url: "https://www.postgresql.org/docs/current/logical-replication.html", kind: primary, vendor: false}
  - {id: operational-and-analytical-workloads-s5, title: "DuckDB: Why DuckDB", url: "https://duckdb.org/why_duckdb", kind: primary, vendor: false}
