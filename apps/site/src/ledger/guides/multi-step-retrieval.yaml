claims:
  - {id: multi-step-retrieval-one-step, class: A, sources: [multi-step-retrieval-s1], verified: "2026-11-27", text: "Using the question to retrieve text in one step, then reading it, is insufficient for multi-step question answering: what to retrieve depends on what has already been derived, which in turn may depend on what was previously retrieved."}
  - {id: multi-step-retrieval-bridge, class: A, sources: [multi-step-retrieval-s1], verified: "2026-11-27", text: "For a multi-step question, without generating the first reasoning step, the text supporting the second step cannot be identified easily, given the lack of lexical or even semantic overlap with the question."}
  - {id: multi-step-retrieval-rewrite, class: B, sources: [multi-step-retrieval-s2, multi-step-retrieval-s5], verified: "2026-11-27", text: "Ma et al. propose Rewrite-Retrieve-Read in place of retrieve-then-read for retrieval-augmented language models, adding a query rewriting step before retrieval. The OpenAI vector store search enables query rewriting with rewrite_query=true and returns the rewritten query in the search_query field of the result."}
  - {id: multi-step-retrieval-decompose, class: A, sources: [multi-step-retrieval-s3, multi-step-retrieval-s1], verified: "2026-11-27", text: "In self-ask, the model explicitly asks itself, and answers, follow-up questions before answering the initial question, and its structured prompting lets a search engine be plugged in to answer the follow-up questions. Trivedi et al. describe self-ask as prompting a language model to decompose a question into subquestions."}
  - {id: multi-step-retrieval-interleave, class: A, sources: [multi-step-retrieval-s1], verified: "2026-11-27", text: "IRCoT begins by retrieving a base set of paragraphs using the question as the query, then alternates two steps: it generates the next reasoning sentence from the question, the paragraphs collected so far and the sentences generated so far, and it uses the last generated sentence as a query to retrieve additional paragraphs."}
  - {id: multi-step-retrieval-ircot-stop, class: A, sources: [multi-step-retrieval-s1], verified: "2026-11-27", text: "IRCoT repeats its steps until the reasoning reports an answer or the maximum allowed number of reasoning steps is reached. In the authors' experiments the maximum is 8 steps and the collected paragraphs are capped at 15."}
  - {id: multi-step-retrieval-agentic, class: B, sources: [multi-step-retrieval-s4, multi-step-retrieval-s6], verified: "2026-11-27", flags: [vendor-stated], text: "With the Claude web search tool, the model determines when to search based on the prompt, the API runs the searches and provides the results, and this process can repeat multiple times throughout a single request. Anthropic reports that many applications use embedding-based retrieval before inference, and that teams increasingly augment it with just in time strategies in which agents use tools to load data into context at runtime."}
  - {id: multi-step-retrieval-cost, class: B, sources: [multi-step-retrieval-s6, multi-step-retrieval-s12], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that runtime exploration is slower than retrieving pre-computed data, and that agentic systems often trade latency and cost for better task performance."}
  - {id: multi-step-retrieval-search-price, class: C, sources: [multi-step-retrieval-s4], verified: "2026-11-27", flags: [vendor-stated], text: "On the Claude API, web search costs 10 US dollars per 1,000 searches plus standard token costs for search-generated content. Search results count as input tokens, both while the model keeps searching within a turn and in later conversation turns."}
  - {id: multi-step-retrieval-max-uses, class: B, sources: [multi-step-retrieval-s4, multi-step-retrieval-s13], verified: "2026-11-27", text: "The max_uses parameter of the Claude web search tool limits the number of searches in a single turn, and a direct search beyond the limit returns the max_uses_exceeded error code. The OpenAI Agents SDK raises a MaxTurnsExceeded exception when a run exceeds the max_turns passed to it."}
  - {id: multi-step-retrieval-context-rot, class: B, sources: [multi-step-retrieval-s6], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that as the number of tokens in the context window increases, the model's ability to accurately recall information from that context decreases."}
  - {id: multi-step-retrieval-injection, class: A, sources: [multi-step-retrieval-s10], verified: "2026-11-27", text: "In indirect prompt injection the model ingests content from an external source, and attacker instructions ride in a RAG passage, web page, document or email. Tool outputs re-enter the context window, enabling chained effects. OWASP advises passing external content through a structurally separate, provenance-labelled channel, and notes that this reduces attack success only in non-adaptive tests."}
  - {id: multi-step-retrieval-step-limits, class: A, sources: [multi-step-retrieval-s11], verified: "2026-11-27", text: "OWASP lists forcing an LLM-based application into recursive or infinite tool-calling loops under Unbounded Consumption, and advises enforcing step limits, recursion depth limits, time limits and per-run cost ceilings on all agent executions."}
  - {id: multi-step-retrieval-graph, class: B, sources: [multi-step-retrieval-s7, multi-step-retrieval-s8], verified: "2026-11-27", text: "GraphRAG uses an LLM to build a graph index in two stages: an entity knowledge graph derived from the source documents, then community summaries pregenerated for all groups of closely related entities. Its authors state that RAG fails on global questions directed at an entire text corpus, and the GraphRAG documentation states that baseline RAG struggles to connect the dots when an answer requires linking separate pieces of information through shared attributes."}
  - {id: multi-step-retrieval-long-context, class: C, sources: [multi-step-retrieval-s9], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic stated on 19 September 2024 that a knowledge base smaller than 200,000 tokens, about 500 pages of material, can be included whole in the prompt with no need for RAG or similar methods, and that prompt caching makes this approach significantly faster and more cost-effective."}
  - {id: multi-step-retrieval-simplest, class: B, sources: [multi-step-retrieval-s12], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic recommends finding the simplest solution possible and only increasing complexity when needed, and notes that it is common for agents to include stopping conditions such as a maximum number of iterations."}
