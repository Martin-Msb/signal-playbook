sources:
  - {id: row-level-changes-and-table-maintenance-s1, title: "Apache Hudi documentation: Concepts", url: "https://hudi.apache.org/docs/concepts/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s2, title: "Apache Hudi documentation: Compaction", url: "https://hudi.apache.org/docs/compaction/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s3, title: "Apache Iceberg specification", url: "https://iceberg.apache.org/spec/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s4, title: "Apache Iceberg documentation: Maintenance", url: "https://iceberg.apache.org/docs/latest/maintenance/", kind: primary, vendor: false}
  - {id: row-level-changes-and-table-maintenance-s5, title: "Delta Lake documentation: Deletion vectors", url: "https://docs.delta.io/delta-deletion-vectors/", kind: primary, vendor: false}
claims:
  - {id: row-level-changes-and-table-maintenance-files, class: A, sources: [row-level-changes-and-table-maintenance-s1], verified: "2026-11-27", text: "In an Apache Hudi Copy-on-Write table, updates produce new versions of base files; in a Merge-on-Read table, updates are logged to delta files and later compacted into new columnar files."}
  - {id: row-level-changes-and-table-maintenance-deletes, class: A, sources: [row-level-changes-and-table-maintenance-s3], verified: "2026-11-27", text: "In Apache Iceberg, data files are immutable once written, and row-level deletes are stored in delete files. The current representation, deletion vectors in format version 3 or above, encodes the deleted positions of a single file in a bitmap."}
  - {id: row-level-changes-and-table-maintenance-compact, class: B, sources: [row-level-changes-and-table-maintenance-s2, row-level-changes-and-table-maintenance-s4], verified: "2026-11-27", text: "Compaction merges updates from log files into a new base file in Hudi Merge-on-Read tables, while Iceberg data-file rewrites combine small files and reduce metadata overhead and file-open cost."}
  - {id: row-level-changes-and-table-maintenance-expiry, class: A, sources: [row-level-changes-and-table-maintenance-s4], verified: "2026-11-27", text: "Iceberg does not delete data files while snapshots that may be used for time travel or rollback still reference them; regularly expiring snapshots deletes unused data files."}
  - {id: row-level-changes-and-table-maintenance-purge, class: A, sources: [row-level-changes-and-table-maintenance-s5], verified: "2026-11-27", text: "In Delta Lake, deleting a row by default rewrites the whole Parquet file that contains it. Deletion vectors instead mark rows as soft-deleted; the change is applied physically when data files are rewritten, for example by REORG TABLE with APPLY (PURGE), and soft-deleted data may still exist in the old files until VACUUM deletes them, subject to its retention threshold."}
