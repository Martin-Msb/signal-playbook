  - {id: operational-and-analytical-workloads-s8, title: "Snowflake documentation: Hybrid tables", url: "https://docs.snowflake.com/en/user-guide/tables-hybrid", kind: primary, vendor: true}
  - {id: operational-and-analytical-workloads-s9, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679", kind: primary, vendor: false, note: "Official EU GDPR text. Checked 26 November 2026."}
claims:
  - {id: operational-and-analytical-workloads-oltp, class: A, sources: [operational-and-analytical-workloads-s1], verified: "2026-11-25", text: "OLTP systems record business interactions as they occur in the day-to-day operation of the organization. Transactional data tends to be highly normalized, with ACID guarantees, primary and secondary indexes, and a workload of heavy writes and moderate reads. Normalization enables an OLTP system to process large numbers of transactions independently. OLTP is the choice when any tangible delay in processing has a negative effect on the day-to-day operations of the business."}
  - {id: operational-and-analytical-workloads-contention, class: A, sources: [operational-and-analytical-workloads-s1], verified: "2026-11-25", text: "Analytics that rely on aggregate calculations over millions of individual transactions are very resource-intensive for an OLTP system. They can be slow to run and can cause a slow-down by blocking other transactions in the database."}
  - {id: operational-and-analytical-workloads-index, class: A, sources: [operational-and-analytical-workloads-s3], verified: "2026-11-25", text: "With no advance preparation, PostgreSQL has to scan the entire table, row by row, to find all matching entries. With an index on the column it can use a more efficient method for locating matching rows, and might only have to walk a few levels deep into a search tree."}
  - {id: operational-and-analytical-workloads-layout, class: A, sources: [operational-and-analytical-workloads-s7, operational-and-analytical-workloads-s6], verified: "2026-11-25", text: "Row-oriented databases are efficient at looking up individual records. Column-oriented databases are particularly efficient at scanning individual columns over an entire dataset. In a column-oriented database only the columns required for a query are read from disk."}
  - {id: operational-and-analytical-workloads-analytical, class: A, sources: [operational-and-analytical-workloads-s5], verified: "2026-11-25", text: "Analytical workloads are characterized by complex, relatively long-running queries that process significant portions of the stored dataset, for example aggregations over entire tables or joins between several large tables."}
  - {id: operational-and-analytical-workloads-scale, class: B, sources: [operational-and-analytical-workloads-s6], verified: "2026-11-25", flags: [vendor-stated], text: "ClickHouse states that analytics queries routinely process billions and trillions of rows."}
  - {id: operational-and-analytical-workloads-engines, class: B, sources: [operational-and-analytical-workloads-s5, operational-and-analytical-workloads-s7, operational-and-analytical-workloads-s6], verified: "2026-11-25", text: "DuckDB uses a columnar-vectorized query execution engine in which a large batch of values is processed in one operation, and contrasts this with traditional systems such as PostgreSQL, MySQL or SQLite, which process each row sequentially. BigQuery stores table data in columnar format, meaning it stores each column separately. ClickHouse is a column-oriented database."}
  - {id: operational-and-analytical-workloads-olap, class: A, sources: [operational-and-analytical-workloads-s2], verified: "2026-11-25", text: "OLAP organizes large business databases to perform complex calculations and trend analysis, and enables intricate queries without disrupting transactional systems. OLAP databases are optimized for heavy-read and low-write tasks and often preserve historical data for time-series analysis."}
  - {id: operational-and-analytical-workloads-copy, class: B, sources: [operational-and-analytical-workloads-s2, operational-and-analytical-workloads-s4], verified: "2026-11-25", text: "In Azure, data in OLTP systems such as Azure SQL Database is copied into OLAP systems. PostgreSQL logical replication sends changes on the publisher to the subscriber continually, and its typical use cases include consolidating multiple databases into a single one, for example for analytics."}
  - {id: operational-and-analytical-workloads-refresh, class: A, sources: [operational-and-analytical-workloads-s2], verified: "2026-11-25", text: "Transactions that flow in from various sources constantly update data in OLTP systems. OLAP data stores typically refresh at much slower intervals, depending on business needs."}
  - {id: operational-and-analytical-workloads-access, class: B, sources: [operational-and-analytical-workloads-s2], verified: "2026-11-25", text: "Giving business users direct access to a database has drawbacks, including security management and access control. A semantic model whose data comes from a data warehouse can enforce row-level security."}
  - {id: operational-and-analytical-workloads-htap, class: B, sources: [operational-and-analytical-workloads-s2, operational-and-analytical-workloads-s1, operational-and-analytical-workloads-s8], verified: "2026-11-25", text: "Hybrid transactional and analytical processing (HTAP) performs OLTP and OLAP processing on the same platform, which eliminates the need for multiple copies of the data and separate OLTP and OLAP systems. Snowflake hybrid tables use a row store as the primary data store and are optimized for low latency and high throughput using index-based random reads and writes, while Snowflake standard tables use columnar micro-partitions and are expected to offer better performance on large analytical queries."}
  - {id: operational-and-analytical-workloads-duties, class: C, sources: [operational-and-analytical-workloads-s9], verified: "2026-11-26", text: "Regulation (EU) 2016/679 defines processing as any operation performed on personal data, including storage (Article 4(2)). Personal data is kept in identifiable form no longer than necessary for its purposes (Article 5(1)(e)) and processed with appropriate security, including protection against unauthorised or unlawful processing and accidental loss, destruction or damage (Article 5(1)(f)). A data subject has the right to obtain erasure without undue delay where a listed ground applies (Article 17(1))."}
