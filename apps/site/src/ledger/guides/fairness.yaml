  - {id: fairness-s2, title: "Fairlearn User Guide: Performing a fairness assessment", url: "https://fairlearn.org/main/user_guide/assessment/perform_fairness_assessment.html", kind: primary, vendor: false}
  - {id: fairness-s3, title: "Fairlearn User Guide: Mitigations", url: "https://fairlearn.org/main/user_guide/mitigation/index.html", kind: primary, vendor: false}
  - {id: fairness-s4, title: "Fairlearn User Guide: Postprocessing", url: "https://fairlearn.org/main/user_guide/mitigation/postprocessing.html", kind: primary, vendor: false}
  - {id: fairness-s5, title: "Fairlearn User Guide: Reductions", url: "https://fairlearn.org/main/user_guide/mitigation/reductions.html", kind: primary, vendor: false}
  - {id: fairness-s6, title: "Barocas, Hardt and Narayanan: Fairness and Machine Learning, Classification", url: "https://fairmlbook.org/classification.html", kind: primary, vendor: false}
  - {id: fairness-s7, title: "Kleinberg, Mullainathan and Raghavan: Inherent Trade-Offs in the Fair Determination of Risk Scores", url: "https://arxiv.org/abs/1609.05807", kind: primary, vendor: false}
  - {id: fairness-s8, title: "NIST AI Resource Center: AI Risk Management Framework 1.0, Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: fairness-s9, title: "NIST AI Resource Center: AI Risk Management Framework 1.0, AI risks and trustworthiness", url: "https://airc.nist.gov/airmf-resources/airmf/3-sec-characteristics/", kind: primary, vendor: false}
  - {id: fairness-s10, title: "EUR-Lex: Charter of Fundamental Rights of the European Union", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:12012P/TXT", kind: primary, vendor: false}
  - {id: fairness-s11, title: "EUR-Lex: Regulation (EU) 2024/1689, consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
  - {id: fairness-s12, title: "NYC Department of Consumer and Worker Protection: Automated Employment Decision Tools", url: "https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page", kind: primary, vendor: false}
claims:
  - {id: fairness-assessment, class: B, sources: [fairness-s2], verified: "2026-11-27", text: "The goal of fairness assessment is to answer the question of which groups of people may be disproportionately negatively impacted by an AI system and in what ways. Fairlearn's guide lists the steps: identify types of harms, identify the groups that might be harmed, quantify harms, and compare quantified harms across the groups."}
  - {id: fairness-disaggregated, class: A, sources: [fairness-s2, fairness-s1], verified: "2026-11-27", text: "Disaggregated metrics are metrics evaluated on slices of data, and they are the centrepiece of fairness assessment in Fairlearn. Simply aggregating outcomes across high-level categories can be misleading when the data can be further disaggregated."}
  - {id: fairness-metricframe, class: B, sources: [fairness-s2], verified: "2026-11-27", text: "Fairlearn's MetricFrame gives the metrics evaluated on each group and computes differences and ratios between groups. In every case the largest difference and the smallest ratio are returned."}
  - {id: fairness-bias-audit, class: B, sources: [fairness-s12], verified: "2026-11-27", text: "New York City Local Law 144 prohibits employers and employment agencies from using an automated employment decision tool unless the tool has been subject to a bias audit within one year of the use of the tool and information about the bias audit is publicly available."}
  - {id: fairness-proxy, class: A, sources: [fairness-s6], verified: "2026-11-27", text: "In large feature spaces sensitive attributes are generally redundant given the other features. If a classifier trained on the original data uses the sensitive attribute and the attribute is removed, the classifier will find a redundant encoding in terms of the other features."}
  - {id: fairness-parity, class: A, sources: [fairness-s1, fairness-s6], verified: "2026-11-27", text: "In the binary classification scenario, demographic parity refers to equal selection rates across groups. The condition requires the acceptance rate to be the same in all groups. As with any fairness metric, achieving demographic parity does not automatically mean that the classifier is fair."}
  - {id: fairness-odds, class: A, sources: [fairness-s1, fairness-s6], verified: "2026-11-27", text: "Equalised odds requires that the true positive rate and the false positive rate be equal across groups, so that all groups experience the same false negative rate and the same false positive rate. Equal opportunity is a relaxed version of equalised odds that only considers positive labels. Equalised odds may be useful if historical data does not contain measurement bias or historical bias that needs to be taken into account and true and false positives are considered to be roughly of the same importance."}
  - {id: fairness-conflict, class: A, sources: [fairness-s6], verified: "2026-11-27", text: "Independence is often referred to as demographic parity, and the separation criterion appeared under the name equalised odds. Assume the target Y is binary, the sensitive attribute A is not independent of Y, and the score R is not independent of Y. Then independence and separation cannot both hold."}
  - {id: fairness-tradeoffs, class: A, sources: [fairness-s7], verified: "2026-11-27", text: "Kleinberg, Mullainathan and Raghavan formalise three fairness conditions and prove that, except in highly constrained special cases, there is no method that can satisfy these three conditions simultaneously."}
  - {id: fairness-mitigation, class: B, sources: [fairness-s6, fairness-s3, fairness-s5], verified: "2026-11-27", text: "Pre-processing adjusts the feature space to be uncorrelated with the sensitive attribute, in-training methods work the constraint into the optimisation process that constructs a classifier from training data, and post-processing adjusts a learned classifier. In Fairlearn, CorrelationRemover is a preprocessing algorithm that removes correlation between sensitive features and non-sensitive features, and ExponentiatedGradient creates a sequence of re-weighted datasets and retrains the wrapped classifier on each of them."}
  - {id: fairness-postprocessing, class: B, sources: [fairness-s4], verified: "2026-11-27", text: "Fairlearn's ThresholdOptimizer is a postprocessing algorithm that applies a separate threshold for each sensitive feature value to the scores of an existing classifier, and it requires the sensitive features to be available at deployment time. Its documentation notes that using different thresholds per group might be considered disparate treatment under US anti-discrimination law or direct discrimination under EU non-discrimination law in contexts those laws cover."}
  - {id: fairness-nist, class: B, sources: [fairness-s8, fairness-s9], verified: "2026-11-27", text: "NIST AI Risk Management Framework 1.0, MEASURE 2.11: fairness and bias, as identified in the map function, are evaluated and results are documented. The framework states that standards of fairness can be complex and difficult to define because perceptions of fairness differ among cultures and may shift depending on application."}
  - {id: fairness-charter, class: A, sources: [fairness-s10], verified: "2026-11-27", text: "Article 21(1) of the Charter of Fundamental Rights of the European Union: any discrimination based on any ground such as sex, race, colour, ethnic or social origin, genetic features, language, religion or belief, political or any other opinion, membership of a national minority, property, birth, disability, age or sexual orientation shall be prohibited. Under Article 51(1) the Charter is addressed to the institutions and bodies of the Union and to the Member States only when they are implementing Union law."}
  - {id: fairness-ai-act, class: C, sources: [fairness-s11], verified: "2026-11-27", text: "In the consolidated text of 27 July 2026, Article 10(2) of Regulation (EU) 2024/1689 lists among the data governance practices for high-risk AI systems an examination in view of possible biases that are likely to affect the health and safety of persons, have a negative impact on fundamental rights or lead to discrimination prohibited under Union law, and appropriate measures to detect, prevent and mitigate the biases identified."}
