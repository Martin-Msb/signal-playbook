  - {id: linear-and-logistic-regression-s10, title: "Consumer Financial Protection Bureau: 12 CFR 1002.9 Notifications (Regulation B)", url: "https://www.consumerfinance.gov/rules-policy/regulations/1002/9/", kind: primary, vendor: false, note: "Shown by the Bureau as the current regulation. The eCFR lists the latest amendment of the section as 29 August 2023, with Title 12 up to date as of 24 November 2026. Checked 27 November 2026."}
  - {id: linear-and-logistic-regression-s11, title: "MathWorks Financial Toolbox documentation: creditscorecard", url: "https://www.mathworks.com/help/finance/creditscorecard.html", kind: primary, vendor: true}
  - {id: linear-and-logistic-regression-s12, title: "MathWorks Financial Toolbox documentation: Case Study for Credit Scorecard Analysis", url: "https://www.mathworks.com/help/finance/case-study-for-a-credit-scorecard-analysis.html", kind: primary, vendor: true}
claims:
  - {id: linear-and-logistic-regression-relationship, class: A, sources: [linear-and-logistic-regression-s1], verified: "2026-11-27", text: "In an ML context, linear regression finds the relationship between features and a label."}
  - {id: linear-and-logistic-regression-weights, class: A, sources: [linear-and-logistic-regression-s1], verified: "2026-11-27", text: "A linear regression model can rely on multiple features, each having a separate weight. The prediction is the bias plus the sum of each weight times its feature value."}
  - {id: linear-and-logistic-regression-combination, class: A, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "scikit-learn's linear models are a set of methods intended for regression in which the target value is expected to be a linear combination of the features. The weights are designated coef_ and the constant term intercept_."}
  - {id: linear-and-logistic-regression-least-squares, class: A, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "LinearRegression fits a linear model with coefficients that minimise the residual sum of squares between the observed targets in the dataset and the targets predicted by the linear approximation."}
  - {id: linear-and-logistic-regression-conditional, class: A, sources: [linear-and-logistic-regression-s6], verified: "2026-11-27", text: "Coefficients in multivariate linear models represent the dependency between a given feature and the target, conditional on the other features."}
  - {id: linear-and-logistic-regression-scale, class: A, sources: [linear-and-logistic-regression-s6], verified: "2026-11-27", text: "Coefficients must be scaled to the same unit of measure to retrieve feature importance. Scaling them with the standard deviation of the feature is a useful proxy."}
  - {id: linear-and-logistic-regression-correlated, class: A, sources: [linear-and-logistic-regression-s6], verified: "2026-11-27", text: "Correlated features induce instabilities in the coefficients of linear models and their effects cannot be well teased apart."}
  - {id: linear-and-logistic-regression-causal, class: A, sources: [linear-and-logistic-regression-s6], verified: "2026-11-27", text: "Linear models are a tool for measuring statistical association. Interpreting causality is difficult when there are confounding effects."}
  - {id: linear-and-logistic-regression-debug, class: B, sources: [linear-and-logistic-regression-s7], verified: "2026-11-27", text: "Google's Rules of Machine Learning state that starting with an interpretable model makes debugging easier. Linear regression, logistic regression and Poisson regression are directly motivated by a probabilistic model, and each prediction is interpretable as a probability or an expected value."}
  - {id: linear-and-logistic-regression-ridge, class: A, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "Ridge regression addresses some of the problems of ordinary least squares by imposing a penalty on the size of the coefficients. The larger the penalty parameter alpha, the greater the shrinkage and the more robust the coefficients become to collinearity."}
  - {id: linear-and-logistic-regression-lasso, class: A, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "The Lasso is a linear model that estimates sparse coefficients: it is able to set coefficients exactly to zero, effectively reducing the number of features upon which the solution depends."}
  - {id: linear-and-logistic-regression-sigmoid, class: A, sources: [linear-and-logistic-regression-s2], verified: "2026-11-27", text: "The linear component of a logistic regression model is z, the bias plus the sum of each learned weight times its feature value. z is also called the log odds. To obtain the prediction, z is passed to the sigmoid function, yielding a probability between 0 and 1."}
  - {id: linear-and-logistic-regression-log-loss, class: A, sources: [linear-and-logistic-regression-s3], verified: "2026-11-27", text: "Logistic regression models are trained using the same process as linear regression models, with two distinctions: they use Log Loss as the loss function instead of squared loss, and applying regularisation is critical to prevent overfitting."}
  - {id: linear-and-logistic-regression-default, class: B, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "In scikit-learn's LogisticRegression, regularisation is applied by default, which is common in machine learning but not in statistics."}
  - {id: linear-and-logistic-regression-glm, class: A, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "Generalised linear models extend linear models in two ways: the predicted values are linked to a linear combination of the input variables via an inverse link function, and the squared loss is replaced by the unit deviance of a distribution in the exponential family. Logistic regression is a special case with a Binomial or Bernoulli conditional distribution and a logit link."}
  - {id: linear-and-logistic-regression-poisson, class: B, sources: [linear-and-logistic-regression-s4], verified: "2026-11-27", text: "scikit-learn's guidance on choosing a distribution for a generalised linear model: if the target values are counts or relative frequencies, you might use a Poisson distribution with a log link."}
  - {id: linear-and-logistic-regression-scorecard, class: B, sources: [linear-and-logistic-regression-s11, linear-and-logistic-regression-s12], verified: "2026-11-27", flags: [vendor-stated], text: "The MathWorks creditscorecard workflow bins the data, fits a logistic regression model and then reviews and formats the credit scorecard points. By default the points are unscaled and come directly from the combination of weight of evidence values and model coefficients."}
  - {id: linear-and-logistic-regression-baseline, class: B, sources: [linear-and-logistic-regression-s7], verified: "2026-11-27", text: "Google's Rules of Machine Learning: a simple model provides baseline metrics and a baseline behaviour that can be used to test more complex models."}
  - {id: linear-and-logistic-regression-justified, class: B, sources: [linear-and-logistic-regression-s8], verified: "2026-11-27", text: "Simple models provide a good baseline, even if they are not launched. Starting simple helps to determine whether or not a complex model is even justified."}
  - {id: linear-and-logistic-regression-svm, class: A, sources: [linear-and-logistic-regression-s5], verified: "2026-11-27", text: "A support vector machine constructs a hyperplane or set of hyperplanes in a high or infinite dimensional space. A good separation is achieved by the hyperplane that has the largest distance to the nearest training data points of any class."}
  - {id: linear-and-logistic-regression-kernels, class: A, sources: [linear-and-logistic-regression-s5], verified: "2026-11-27", text: "Support vector machines are versatile: different kernel functions can be specified for the decision function. Common kernels are provided, and custom kernels can be specified."}
  - {id: linear-and-logistic-regression-inherent, class: A, sources: [linear-and-logistic-regression-s9], verified: "2026-11-27", text: "Rudin argues that trying to explain black box models, rather than creating models that are interpretable in the first place, is likely to perpetuate bad practices, and that the way forward is to design models that are inherently interpretable. The paper gives reasons why explainable black boxes should be avoided in high-stakes decisions."}
  - {id: linear-and-logistic-regression-reasons, class: C, sources: [linear-and-logistic-regression-s10], verified: "2026-11-27", text: "12 CFR 1002.9(b)(2) states that the statement of reasons for adverse action must be specific and indicate the principal reason or reasons for the adverse action. Statements that the applicant failed to achieve a qualifying score on the creditor's credit scoring system are insufficient."}
