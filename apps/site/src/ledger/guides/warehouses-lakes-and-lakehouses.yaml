sources:
  - {id: warehouses-lakes-and-lakehouses-s1, title: "Snowflake Documentation: Key concepts and architecture", url: "https://docs.snowflake.com/en/user-guide/intro-key-concepts", kind: primary, vendor: true}
  - {id: warehouses-lakes-and-lakehouses-s2, title: "AWS Well-Architected Framework: Data Analytics Lens, Characteristics", url: "https://docs.aws.amazon.com/wellarchitected/latest/analytics-lens/characteristics-1.html", kind: primary, vendor: true}
  - {id: warehouses-lakes-and-lakehouses-s3, title: "Apache Parquet: Overview", url: "https://parquet.apache.org/docs/overview/", kind: primary, vendor: false}
  - {id: warehouses-lakes-and-lakehouses-s4, title: "Trino Documentation: Object storage", url: "https://trino.io/docs/current/object-storage.html", kind: primary, vendor: false}
  - {id: warehouses-lakes-and-lakehouses-s5, title: "Apache Iceberg: Documentation", url: "https://iceberg.apache.org/docs/latest/", kind: primary, vendor: false}
  - {id: warehouses-lakes-and-lakehouses-s6, title: "Apache Iceberg: Table specification", url: "https://iceberg.apache.org/spec/", kind: primary, vendor: false}
claims:
  - {id: warehouses-lakes-and-lakehouses-problem, class: A, sources: [warehouses-lakes-and-lakehouses-s2], verified: "2026-11-25", text: "A data lake supports diverse data formats for analytical workloads."}
  - {id: warehouses-lakes-and-lakehouses-warehouse, class: B, sources: [warehouses-lakes-and-lakehouses-s1], verified: "2026-11-25", text: "Snowflake hosts virtual compute instances and persistent data storage on public cloud infrastructure. Snowflake manages storage organisation, file size, structure, compression, metadata, and statistics for Snowflake tables, and its virtual warehouses provide query compute."}
  - {id: warehouses-lakes-and-lakehouses-lake, class: B, sources: [warehouses-lakes-and-lakehouses-s2, warehouses-lakes-and-lakehouses-s4], verified: "2026-11-25", text: "Object storage holds files in formats such as Parquet and is commonly used to create data lakes. Trino accesses files directly on object storage through connectors including Hive, Delta Lake, Hudi, and Iceberg."}
  - {id: warehouses-lakes-and-lakehouses-parquet, class: A, sources: [warehouses-lakes-and-lakehouses-s3], verified: "2026-11-25", text: "Apache Parquet is an open source, column-oriented data file format designed for efficient data storage and retrieval."}
  - {id: warehouses-lakes-and-lakehouses-iceberg, class: B, sources: [warehouses-lakes-and-lakehouses-s5, warehouses-lakes-and-lakehouses-s6], verified: "2026-11-25", text: "Apache Iceberg is an open table format for analytic datasets. Its table metadata tracks schema, partitioning, snapshots and data files, and a metadata replacement makes table changes atomic. Compute engines including Spark and Trino can work with Iceberg tables."}
  - {id: warehouses-lakes-and-lakehouses-formats, class: B, sources: [warehouses-lakes-and-lakehouses-s2], verified: "2026-11-25", text: "Apache Hudi, Apache Iceberg, and Delta Lake are open table formats that provide database-like functionality on data lakes."}
  - {id: warehouses-lakes-and-lakehouses-governance, class: A, sources: [warehouses-lakes-and-lakehouses-s2], verified: "2026-11-25", text: "A modern data architecture should use centralised authorisation and auditing because configuring access policies across data stores can be complex and error-prone."}
