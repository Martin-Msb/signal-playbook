  - {id: exploring-data-s4, title: "NIST/SEMATECH e-Handbook of Statistical Methods: What are outliers in the data?", url: "https://www.itl.nist.gov/div898/handbook/prc/section1/prc16.htm", kind: primary, vendor: false}
  - {id: exploring-data-s5, title: "NIST/SEMATECH e-Handbook of Statistical Methods: An EDA/Graphics Example", url: "https://www.itl.nist.gov/div898/handbook/eda/section1/eda16.htm", kind: primary, vendor: false}
