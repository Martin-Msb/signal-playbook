sources:
  - {id: platform-architecture-and-operating-model-s1, title: "CIDR: Lakehouse: A New Generation of Open Platforms that Unify Data Warehousing and Advanced Analytics", url: "https://www.databricks.com/sites/default/files/2020/12/cidr_lakehouse.pdf", kind: primary, vendor: true}
  - {id: platform-architecture-and-operating-model-s2, title: "Zhamak Dehghani: Data Mesh Principles and Logical Architecture", url: "https://martinfowler.com/articles/data-mesh-principles.html", kind: primary, vendor: false}
  - {id: platform-architecture-and-operating-model-s3, title: "Google Cloud Architecture Center: Architecture and functions in a data mesh", url: "https://docs.cloud.google.com/architecture/data-mesh", kind: primary, vendor: true}
claims:
  - {id: platform-architecture-and-operating-model-lakehouse-architecture, class: A, sources: [platform-architecture-and-operating-model-s1], verified: "2026-11-26", text: "A lakehouse design can place a transactional metadata layer over open-format files in object storage; the layer can support table versions, transactions, governance and access controls."}
  - {id: platform-architecture-and-operating-model-mesh-principles, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-26", text: "Data mesh is based on domain-oriented decentralised ownership, data as a product, self-serve data infrastructure as a platform, and federated computational governance."}
  - {id: platform-architecture-and-operating-model-mesh-ownership, class: A, sources: [platform-architecture-and-operating-model-s2], verified: "2026-11-26", text: "Data mesh assigns ownership of analytical data and its serving to the business domains closest to that data."}
  - {id: platform-architecture-and-operating-model-mesh-functions, class: B, sources: [platform-architecture-and-operating-model-s3], verified: "2026-11-26", text: "In Google's data mesh architecture, domain producer teams create and maintain data products; central governance and platform teams provide cross-domain oversight, governance, services and self-service infrastructure."}
