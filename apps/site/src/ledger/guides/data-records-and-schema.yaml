sources:
  - {id: data-records-and-schema-s1, title: "PostgreSQL documentation: Table basics", url: "https://www.postgresql.org/docs/current/ddl-basics.html", kind: primary, vendor: false}
  - {id: data-records-and-schema-s2, title: "PostgreSQL documentation: Constraints", url: "https://www.postgresql.org/docs/current/ddl-constraints.html", kind: primary, vendor: false}
  - {id: data-records-and-schema-s3, title: "Apache Avro 1.12.0: Specification", url: "https://avro.apache.org/docs/1.12.0/specification/", kind: primary, vendor: false}
  - {id: data-records-and-schema-s4, title: "Apache Avro 1.12.0: Documentation overview", url: "https://avro.apache.org/docs/1.12.0/", kind: primary, vendor: false}
  - {id: data-records-and-schema-s5, title: "Confluent documentation: Schema Registry concepts", url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html", kind: primary, vendor: true}
  - {id: data-records-and-schema-s6, title: "Delta Lake documentation: Table batch reads and writes", url: "https://docs.delta.io/latest/delta-batch.html", kind: primary, vendor: false}
  - {id: data-records-and-schema-s7, title: "Microsoft Azure Architecture Center: What is a data lake?", url: "https://learn.microsoft.com/en-us/azure/architecture/data-guide/scenarios/data-lake", kind: primary, vendor: true}
  - {id: data-records-and-schema-s8, title: "Amazon Athena user guide: Create tables in Athena", url: "https://docs.aws.amazon.com/athena/latest/ug/creating-tables.html", kind: primary, vendor: true}
  - {id: data-records-and-schema-s9, title: "JSON Schema: Understanding JSON Schema, object", url: "https://json-schema.org/understanding-json-schema/reference/object", kind: primary, vendor: false}
  - {id: data-records-and-schema-s10, title: "Google Cloud BigQuery documentation: Introduction to column-level access control", url: "https://docs.cloud.google.com/bigquery/docs/column-level-security-intro", kind: primary, vendor: true}
  - {id: data-records-and-schema-s11, title: "Snowflake documentation: Introduction to sensitive data classification", url: "https://docs.snowflake.com/en/user-guide/classify-intro", kind: primary, vendor: true}
  - {id: data-records-and-schema-s12, title: "European Data Protection Board: Data protection basics", url: "https://www.edpb.europa.eu/sme-data-protection-guide/data-protection-basics_en", kind: primary, vendor: false}
  - {id: data-records-and-schema-s13, title: "European Parliament Legislative Train: The Digital Omnibus regulation proposal", url: "https://www.europarl.europa.eu/legislative-train/theme-a-new-plan-for-europe-s-sustainable-prosperity-and-competitiveness/file-digital-package", kind: primary, vendor: false}
claims:
  - {id: data-records-and-schema-table, class: A, sources: [data-records-and-schema-s1], verified: "2026-11-25", text: "A table in a relational database consists of rows and columns. The number and order of the columns is fixed, and each column has a name."}
  - {id: data-records-and-schema-type, class: A, sources: [data-records-and-schema-s1], verified: "2026-11-25", text: "In PostgreSQL each column has a data type. The data type constrains the set of possible values that can be assigned to a column and assigns semantics to the data stored in the column so that it can be used for computations."}
  - {id: data-records-and-schema-constraint, class: A, sources: [data-records-and-schema-s2], verified: "2026-11-25", text: "In PostgreSQL, data types are a way to limit the kind of data that can be stored in a table. If a user attempts to store data in a column that would violate a constraint, an error is raised."}
  - {id: data-records-and-schema-avro-record, class: A, sources: [data-records-and-schema-s3], verified: "2026-11-25", text: "An Avro schema is represented in JSON. A record has a required name and a list of fields, and each field has a required name and a type, which is a schema."}
  - {id: data-records-and-schema-avro-types, class: A, sources: [data-records-and-schema-s3], verified: "2026-11-25", text: "The primitive type names of Avro are null, boolean, int, long, float, double, bytes and string."}
  - {id: data-records-and-schema-avro-metadata, class: A, sources: [data-records-and-schema-s3], verified: "2026-11-25", text: "Attributes not defined in the Avro specification are permitted as metadata, but must not affect the format of serialized data."}
  - {id: data-records-and-schema-avro-resolution, class: A, sources: [data-records-and-schema-s3, data-records-and-schema-s4], verified: "2026-11-25", text: "When Avro data is read, the schema used when writing it is always present. If the writer's record has a field the reader's record lacks, the writer's value for that field is ignored. If the reader's record has a field with no default value that the writer's schema lacks, an error is signalled."}
  - {id: data-records-and-schema-contract, class: B, sources: [data-records-and-schema-s5], verified: "2026-11-25", text: "Without a formal schema, what is missing is a contract for data between the producers and the consumers. A schema provides that contract."}
  - {id: data-records-and-schema-delta, class: A, sources: [data-records-and-schema-s6], verified: "2026-11-25", text: "Delta Lake automatically validates that the schema of the DataFrame being written is compatible with the schema of the table. All DataFrame columns must exist in the target table and their data types must match the table's, and a write that breaks either rule raises an exception."}
  - {id: data-records-and-schema-terms, class: B, sources: [data-records-and-schema-s7], verified: "2026-11-25", text: "Data lakes store data in its original state and apply transformation only when the data is needed, an approach known as schema-on-read. A data warehouse enforces structure and applies transformations as it ingests data, an approach known as schema-on-write."}
  - {id: data-records-and-schema-athena, class: B, sources: [data-records-and-schema-s8], verified: "2026-11-25", text: "Athena stores the schema in the AWS Glue Data Catalog and uses it to read the data when the table is queried. This schema-on-read approach projects a schema onto the data when a query runs, eliminates the need for data loading or transformation, and does not modify the data in Amazon S3."}
  - {id: data-records-and-schema-json-schema, class: A, sources: [data-records-and-schema-s9], verified: "2026-11-25", text: "In JSON Schema, the properties defined by the properties keyword are not required by default, and by default any additional properties are allowed."}
  - {id: data-records-and-schema-policy-tags, class: B, sources: [data-records-and-schema-s10], verified: "2026-11-25", text: "In BigQuery, schema annotations assign a policy tag to each column where access is restricted, with one policy tag per column. At query time BigQuery checks the column policy tag and its policy to see whether the user is authorised, and for a user without the Fine-Grained Reader role the column data is not available."}
  - {id: data-records-and-schema-classification, class: B, sources: [data-records-and-schema-s11], verified: "2026-11-25", text: "In Snowflake sensitive data classification, every column identified as containing sensitive data is assigned a semantic category, which identifies the type of personal attribute, and a privacy category, which identifies its sensitivity. System-defined tags identify the classified columns."}
  - {id: data-records-and-schema-personal, class: B, sources: [data-records-and-schema-s12], verified: "2026-11-25", text: "Personal data means any information relating to an identified or identifiable individual, and email addresses are among the examples. Some types of personal data, usually called sensitive data, belong to special categories which deserve more protection."}
  - {id: data-records-and-schema-omnibus, class: C, sources: [data-records-and-schema-s13], verified: "2026-11-25", text: "The Digital Omnibus regulation proposal, which would amend the GDPR, had the status Tabled and was not adopted. The Council adopted its negotiating mandate on 21 October 2026, and its position keeps the current definition of personal data."}
