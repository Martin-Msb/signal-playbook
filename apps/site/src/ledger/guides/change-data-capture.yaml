sources:
  - {id: change-data-capture-s1, title: "PostgreSQL: Logical Decoding", url: "https://www.postgresql.org/docs/19/logicaldecoding-explanation.html", kind: primary, vendor: false}
  - {id: change-data-capture-s2, title: "Debezium: PostgreSQL connector", url: "https://debezium.io/documentation/reference/stable/connectors/postgresql.html", kind: primary, vendor: true}
  - {id: change-data-capture-s3, title: "Debezium: Outbox Event Router documentation source", url: "https://github.com/debezium/debezium/blob/main/documentation/modules/ROOT/pages/transformations/outbox-event-router.adoc", kind: primary, vendor: true}
  - {id: change-data-capture-s4, title: "EUR-Lex: Regulation (EU) 2016/679", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj", kind: primary, vendor: false}
claims:
  - {id: change-data-capture-log, class: A, sources: [change-data-capture-s1], verified: "2026-11-25", text: "PostgreSQL logical decoding decodes the write-ahead log into an application-specific form such as tuples or SQL statements. A logical replication slot represents a stream of changes that can be replayed in the order they were made."}
  - {id: change-data-capture-operations, class: B, sources: [change-data-capture-s2], verified: "2026-11-25", text: "The Debezium PostgreSQL connector captures committed row-level inserts, updates and deletes from the transaction log and produces change event records. A PostgreSQL delete event has an operation value of d and provides a consumer with the information needed to process the row's removal."}
  - {id: change-data-capture-snapshot, class: B, sources: [change-data-capture-s2], verified: "2026-11-25", text: "Because PostgreSQL may purge write-ahead log segments, the Debezium PostgreSQL connector first takes a consistent snapshot and then streams changes from the position recorded for that snapshot, so changes made during the snapshot are not omitted."}
  - {id: change-data-capture-outbox, class: B, sources: [change-data-capture-s3], verified: "2026-11-25", text: "The outbox pattern avoids inconsistencies between a service's internal database state and events consumed by other services. A Debezium connector can capture changes in an outbox table and apply the outbox event router transformation."}
  - {id: change-data-capture-erasure, class: A, sources: [change-data-capture-s4], verified: "2026-11-25", text: "Under Regulation (EU) 2016/679, Article 17, a data subject has a right to obtain erasure without undue delay when one of the listed grounds applies, subject to the listed exceptions. Where the controller made personal data public and must erase it, the controller must take reasonable steps to inform controllers processing it about requests to erase links, copies or replications."}
