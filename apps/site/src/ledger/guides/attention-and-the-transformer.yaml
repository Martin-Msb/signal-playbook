sources:
  - {id: attention-and-the-transformer-s1, title: "Vaswani et al.: Attention Is All You Need", url: "https://arxiv.org/pdf/1706.03762", kind: primary, vendor: false}
  - {id: attention-and-the-transformer-s2, title: "Brown et al.: Language Models are Few-Shot Learners", url: "https://arxiv.org/pdf/2005.14165", kind: primary, vendor: false}
  - {id: attention-and-the-transformer-s3, title: "NIST: Artificial Intelligence Risk Management Framework 1.0", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
  - {id: attention-and-the-transformer-s4, title: "Hugging Face: GPT-2", url: "https://huggingface.co/docs/transformers/model_doc/gpt2", kind: primary, vendor: false}
  - {id: attention-and-the-transformer-s5, title: "Jain and Wallace: Attention is not Explanation", url: "https://arxiv.org/abs/1902.10186", kind: primary, vendor: false}
claims:
  - {id: attention-and-the-transformer-self-attention, class: A, sources: [attention-and-the-transformer-s1], verified: "2026-11-27", text: "Self-attention relates different positions of a single sequence to compute a representation of that sequence."}
  - {id: attention-and-the-transformer-causal-mask, class: A, sources: [attention-and-the-transformer-s1, attention-and-the-transformer-s4], verified: "2026-11-27", text: "The Transformer decoder modifies self-attention to prevent positions from attending to subsequent positions, so a prediction depends only on known outputs at earlier positions; GPT-2 is a causal transformer language model, pretrained to predict the next word from all the previous words, in which each token can only attend to previous tokens."}
  - {id: attention-and-the-transformer-attention-weights, class: A, sources: [attention-and-the-transformer-s1], verified: "2026-11-27", text: "Scaled dot-product attention computes query-key dot products, divides by the square root of key dimension, applies softmax to obtain weights, and applies those weights to value vectors; multi-head attention lets the model jointly attend to information from different representation subspaces at different positions."}
  - {id: attention-and-the-transformer-transformer-layers, class: A, sources: [attention-and-the-transformer-s1], verified: "2026-11-27", text: "The Transformer stacks self-attention and point-wise fully connected sublayers, with residual connections and layer normalisation around sublayers."}
  - {id: attention-and-the-transformer-context-limit, class: A, sources: [attention-and-the-transformer-s2], verified: "2026-11-27", text: "All GPT-3 models use a context window of 2048 tokens, and the number of few-shot examples given in context is limited to as many as fit in that window."}
  - {id: attention-and-the-transformer-evaluation, class: A, sources: [attention-and-the-transformer-s3], verified: "2026-11-27", text: "NIST says AI systems should be tested before deployment and regularly while in operation, that measurement processes should include rigorous software testing and performance assessment with measures of uncertainty, benchmark comparisons and documented results, that performance is demonstrated for conditions similar to deployment settings, and that limits of generalisability are documented."}
  - {id: attention-and-the-transformer-explanation, class: A, sources: [attention-and-the-transformer-s5], verified: "2026-11-27", text: "Jain and Wallace report that learned attention weights are frequently uncorrelated with gradient-based measures of feature importance, and conclude that standard attention modules do not provide meaningful explanations."}
