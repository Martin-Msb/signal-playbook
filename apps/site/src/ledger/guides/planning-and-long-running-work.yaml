sources:
  - {id: planning-and-long-running-work-s1, title: "Anthropic: Effective harnesses for long-running agents", url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents", kind: primary, vendor: true}
  - {id: planning-and-long-running-work-s2, title: "Anthropic: Effective context engineering for AI agents", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", kind: primary, vendor: true}
  - {id: planning-and-long-running-work-s3, title: "LangChain: LangGraph persistence", url: "https://docs.langchain.com/oss/python/langgraph/persistence", kind: primary, vendor: true}
  - {id: planning-and-long-running-work-s4, title: "LangChain: LangGraph interrupts", url: "https://docs.langchain.com/oss/python/langgraph/interrupts", kind: primary, vendor: true}
  - {id: planning-and-long-running-work-s5, title: "Anthropic: Claude Agent SDK, how the agent loop works", url: "https://code.claude.com/docs/en/agent-sdk/agent-loop", kind: primary, vendor: true}
  - {id: planning-and-long-running-work-s6, title: "OpenAI: Agents SDK, running agents", url: "https://openai.github.io/openai-agents-python/running_agents/", kind: primary, vendor: true}
claims:
  - {id: planning-and-long-running-work-sessions, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that long-running agents must work in discrete sessions, and each new session begins with no memory of what came before."}
  - {id: planning-and-long-running-work-plan-file, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "In Anthropic's harness the very first agent session uses a specialised prompt that asks the model to set up the initial environment. That initialiser agent writes a comprehensive file of feature requirements, and the features are all initially marked as failing."}
  - {id: planning-and-long-running-work-one-at-a-time, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Later sessions of the coding agent were asked to work on only one feature at a time. Anthropic reports that this incremental approach turned out to be critical to addressing the agent's tendency to do too much at once."}
  - {id: planning-and-long-running-work-progress-file, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "The harness keeps a claude-progress.txt file that logs what agents have done, alongside the git history, and asks the model to commit its progress to git with descriptive commit messages."}
  - {id: planning-and-long-running-work-notes, class: B, sources: [planning-and-long-running-work-s2], verified: "2026-11-27", flags: [vendor-stated], text: "In structured note-taking the agent regularly writes notes persisted to memory outside of the context window, and these notes get pulled back into the context window at later times. A to-do list or a NOTES.md file are examples."}
  - {id: planning-and-long-running-work-bearings, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Every coding agent session is prompted to run through a series of steps to get its bearings, including reading the git logs and progress files to get up to speed on what was recently worked on."}
  - {id: planning-and-long-running-work-failure-modes, class: B, sources: [planning-and-long-running-work-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic observed two failure modes: the agent tended to try to do too much at once, and a later agent instance would look around, see that progress had been made, and declare the job done."}
  - {id: planning-and-long-running-work-checkpointer, class: B, sources: [planning-and-long-running-work-s3], verified: "2026-11-27", text: "LangGraph checkpointers persist a thread's graph state as checkpoints. They serve conversation continuity, human-in-the-loop workflows, time travel and fault tolerance, and persistence lets an application resume after an interruption or recover from a failure."}
  - {id: planning-and-long-running-work-interrupt, class: B, sources: [planning-and-long-running-work-s4], verified: "2026-11-27", text: "LangGraph interrupts pause graph execution at specific points and wait for external input before continuing. When an interrupt is triggered, LangGraph saves the graph state and waits indefinitely until execution is resumed. One of the most common uses is to pause before a critical action and ask for approval."}
  - {id: planning-and-long-running-work-resume, class: B, sources: [planning-and-long-running-work-s5], verified: "2026-11-27", text: "In the Claude Agent SDK the session ID from the result message can be captured to resume a session later. When a session is resumed, the full context from previous turns is restored."}
  - {id: planning-and-long-running-work-budget, class: B, sources: [planning-and-long-running-work-s5], verified: "2026-11-27", text: "The Claude Agent SDK can cap the loop with max_turns and with max_budget_usd, the estimated spend at which the loop stops. Both default to no limit, and the documentation calls setting a budget a good default for production agents."}
  - {id: planning-and-long-running-work-max-turns, class: B, sources: [planning-and-long-running-work-s6], verified: "2026-11-27", text: "In the OpenAI Agents SDK a run that exceeds the max_turns passed raises a MaxTurnsExceeded exception. A turn is one LLM call in the agent loop."}
