  - {id: preparing-knowledge-s6, title: "AWS: Sync your data with your Amazon Bedrock knowledge base", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html", kind: primary, vendor: true}
