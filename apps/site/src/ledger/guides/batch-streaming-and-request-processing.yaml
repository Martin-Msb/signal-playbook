sources:
  - {id: batch-streaming-and-request-processing-s1, title: "Apache Flink 2.3 documentation: Learn Flink overview", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/learn-flink/overview/", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s2, title: "Apache Airflow documentation: Cron and time intervals", url: "https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/cron.html", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s3, title: "Google: The Site Reliability Workbook, Data Processing Pipelines", url: "https://sre.google/workbook/data-processing/", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s4, title: "Apache Spark 4.3.0 documentation: Structured Streaming overview", url: "https://spark.apache.org/docs/latest/streaming/index.html", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s5, title: "Apache Spark 4.3.0 documentation: Structured Streaming APIs on DataFrames and Datasets", url: "https://spark.apache.org/docs/latest/streaming/apis-on-dataframes-and-datasets.html", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s6, title: "Apache Spark 4.3.0 documentation: Structured Streaming performance tips", url: "https://spark.apache.org/docs/latest/streaming/performance-tips.html", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s7, title: "Apache Flink 2.3 documentation: Stateful stream processing", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s8, title: "Apache Flink 2.3 documentation: Timely stream processing", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s9, title: "IETF: RFC 9110, HTTP Semantics", url: "https://www.rfc-editor.org/rfc/rfc9110.html", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s10, title: "Google: Site Reliability Engineering, Service Level Objectives", url: "https://sre.google/sre-book/service-level-objectives/", kind: primary, vendor: false}
  - {id: batch-streaming-and-request-processing-s11, title: "dbt documentation: freshness", url: "https://docs.getdbt.com/reference/resource-properties/freshness", kind: primary, vendor: true}
claims:
  - {id: batch-streaming-and-request-processing-bounded, class: A, sources: [batch-streaming-and-request-processing-s1], verified: "2026-11-25", text: "Batch processing is the paradigm at work when you process a bounded data stream, and in this mode you can choose to ingest the entire dataset before producing any results. Stream processing involves unbounded data streams: conceptually the input may never end, so you are forced to continuously process the data as it arrives."}
  - {id: batch-streaming-and-request-processing-schedule, class: B, sources: [batch-streaming-and-request-processing-s2], verified: "2026-11-25", text: "In Apache Airflow a Dag can be set to run on a simple schedule by setting its schedule argument to a cron expression, a datetime.timedelta or a cron preset. The preset @daily means run once a day at midnight and corresponds to the cron expression 0 0 * * *."}
  - {id: batch-streaming-and-request-processing-stages, class: A, sources: [batch-streaming-and-request-processing-s3], verified: "2026-11-25", text: "In batch processing pipelines, each stage waits for its predecessor to finish before it begins. Streaming processing is generally better than batch processing at supporting lower-latency applications."}
  - {id: batch-streaming-and-request-processing-microbatch, class: B, sources: [batch-streaming-and-request-processing-s4], verified: "2026-11-25", text: "By default, Spark Structured Streaming queries are processed using a micro-batch processing engine, which processes data streams as a series of small batch jobs, achieving end-to-end latencies as low as 100 milliseconds and exactly-once fault-tolerance guarantees. A streaming computation is expressed the same way as a batch computation on static data."}
  - {id: batch-streaming-and-request-processing-trigger, class: B, sources: [batch-streaming-and-request-processing-s5], verified: "2026-11-25", text: "With a fixed interval trigger, Spark micro-batches are kicked off at the user-specified intervals, and if no new data is available no micro-batch is kicked off. The one-time and available-now triggers process all the available data and then stop on their own. The documentation describes this as useful to periodically spin up a cluster, process everything available since the last period and shut the cluster down, which in some cases may lead to significant cost savings."}
  - {id: batch-streaming-and-request-processing-continuous, class: B, sources: [batch-streaming-and-request-processing-s4, batch-streaming-and-request-processing-s6], verified: "2026-11-25", text: "Spark's continuous processing is an experimental streaming execution mode that can achieve end-to-end latencies as low as 1 millisecond with at-least-once guarantees, compared with the default micro-batch engine, which can achieve exactly-once guarantees but latencies of about 100 milliseconds at best."}
  - {id: batch-streaming-and-request-processing-state, class: A, sources: [batch-streaming-and-request-processing-s7], verified: "2026-11-25", text: "Stateful operations remember information across multiple events. When aggregating events per minute, hour or day, the state holds the pending aggregates. Flink implements fault tolerance using a combination of stream replay and checkpointing, and recovers by restoring the state of the operators and replaying the records from the point of the checkpoint."}
  - {id: batch-streaming-and-request-processing-time, class: A, sources: [batch-streaming-and-request-processing-s8], verified: "2026-11-25", text: "Event time is the time that each individual event occurred on its producing device, and processing time is the system time of the machine executing the operation. A Watermark(t) declares that event time has reached time t in that stream, so all events up to that timestamp should have arrived. Late elements arrive after the system's event time clock, as signalled by the watermarks, has passed their timestamp. Event time processing incurs some latency while waiting for out-of-order events, and delaying the watermarks by too much causes too much delay in the evaluation of event time windows."}
  - {id: batch-streaming-and-request-processing-request, class: A, sources: [batch-streaming-and-request-processing-s9], verified: "2026-11-25", text: "HTTP is a family of stateless, application-level, request/response protocols. A client constructs request messages and sends them toward an origin server, and the server interprets each request and responds with one or more response messages. Each request can be understood in isolation."}
  - {id: batch-streaming-and-request-processing-serving, class: A, sources: [batch-streaming-and-request-processing-s10], verified: "2026-11-25", text: "User-facing serving systems generally care about availability, latency and throughput, where request latency is how long it takes to return a response to a request. Big data systems, such as data processing pipelines, tend to care about throughput and end-to-end latency. All systems should care about correctness: was the right answer returned, the right data retrieved, the right analysis done."}
  - {id: batch-streaming-and-request-processing-slo, class: A, sources: [batch-streaming-and-request-processing-s10], verified: "2026-11-25", text: "A service level indicator is a carefully defined quantitative measure of some aspect of the level of service that is provided. A service level objective is a target value or range of values for a service level that is measured by an indicator. For maximum clarity, objectives should specify how they are measured and the conditions under which they are valid, and publishing them sets expectations for system behaviour."}
  - {id: batch-streaming-and-request-processing-freshness, class: B, sources: [batch-streaming-and-request-processing-s3], verified: "2026-11-25", text: "Most pipeline data freshness SLOs are in one of these formats: X% of data processed in Y seconds, days or minutes; the oldest data is no older than Y; or the pipeline job has completed successfully within Y. SLOs for data correctness ensure that you are alerted about potential data errors in the pipeline, for example a target that no more than 0.1% of invoices are incorrect per quarter. Customers only care about the SLO for the sum of all stages."}
  - {id: batch-streaming-and-request-processing-dbt, class: B, sources: [batch-streaming-and-request-processing-s11], verified: "2026-11-25", flags: [vendor-stated], text: "In a dbt freshness block, warn_after is how old the most recent data can be before a freshness check reports a warning and error_after is how old it can be before the check reports an error. Each takes a count and a period of minute, hour or day."}
