claims:
  - id: serving-data-to-ml-and-ai-historical-and-online-retrieval
    class: A
    sources: [serving-data-to-ml-and-ai-s2]
    verified: "2026-11-26"
    text: "Feast supports historical feature retrieval for training datasets and online feature retrieval for real-time inference."
  - id: serving-data-to-ml-and-ai-point-in-time-join
    class: A
    sources: [serving-data-to-ml-and-ai-s1]
    verified: "2026-11-26"
    text: "A point-in-time join reproduces feature state at a past time, and created-timestamp filtering can exclude values unavailable at the entity timestamp."
  - id: serving-data-to-ml-and-ai-offline-online-stores
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-26"
    text: "Feast describes offline stores for historical feature extraction and online stores for low-latency production feature serving."
  - id: serving-data-to-ml-and-ai-online-serving-push
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-26"
    text: "Feast pushes feature values to the online store to reduce retrieval latency."
  - id: serving-data-to-ml-and-ai-pipeline-keeps-features-current
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-26"
    text: "Feast relies on upstream data pipelines to make feature values consistently available."
  - id: serving-data-to-ml-and-ai-vector-record-updates
    class: A
    sources: [serving-data-to-ml-and-ai-s4]
    verified: "2026-11-26"
    text: "Qdrant points contain a vector and optional payload, and its point operations support inserting, updating and deleting records."
  - id: serving-data-to-ml-and-ai-vector-filtering
    class: A
    sources: [serving-data-to-ml-and-ai-s5]
    verified: "2026-11-26"
    text: "Qdrant can apply payload and point identifier conditions when searching or retrieving points."
  - id: serving-data-to-ml-and-ai-erasure-recipients
    class: A
    sources: [serving-data-to-ml-and-ai-s6]
    verified: "2026-11-26"
    text: "Under specified conditions, the GDPR requires controllers to communicate erasure to recipients and take reasonable steps concerning copies or replications of personal data."
