  - {id: transactions-and-consistency-s3, title: "PostgreSQL 19 documentation: Concurrency control, introduction", url: "https://www.postgresql.org/docs/current/mvcc-intro.html", kind: primary, vendor: false}
  - {id: transactions-and-consistency-s4, title: "PostgreSQL 19 documentation: Transaction isolation", url: "https://www.postgresql.org/docs/current/transaction-iso.html", kind: primary, vendor: false}
  - {id: transactions-and-consistency-s5, title: "PostgreSQL 19 documentation: Write-ahead logging", url: "https://www.postgresql.org/docs/current/wal-intro.html", kind: primary, vendor: false}
  - {id: transactions-and-consistency-s6, title: "PostgreSQL 19 documentation: Replication settings", url: "https://www.postgresql.org/docs/current/runtime-config-replication.html", kind: primary, vendor: false}
