  - {id: warehouses-lakes-and-lakehouses-s4, title: "Trino Documentation: Object storage", url: "https://trino.io/docs/current/object-storage.html", kind: primary, vendor: false}
  - {id: warehouses-lakes-and-lakehouses-s5, title: "Apache Iceberg: Documentation", url: "https://iceberg.apache.org/docs/latest/", kind: primary, vendor: false}
