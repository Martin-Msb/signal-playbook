claims:
  - {id: file-formats-and-encoding-csv, class: A, sources: [file-formats-and-encoding-s1], verified: "2026-11-25", text: "In CSV each record is on a separate line and fields are separated by commas. A header line is optional. RFC 4180 states that no formal specification exists, which allows a wide variety of interpretations of CSV files."}
  - {id: file-formats-and-encoding-json, class: A, sources: [file-formats-and-encoding-s2], verified: "2026-11-25", text: "JSON is a text format for the serialization of structured data. An object is an unordered collection of name/value pairs, and JSON can represent four primitive types: strings, numbers, booleans and null."}
  - {id: file-formats-and-encoding-avro-binary, class: A, sources: [file-formats-and-encoding-s3], verified: "2026-11-25", text: "Binary encoded Avro data does not include type information or field names. The serialized data is small, but a schema must always be used in order to read Avro data correctly. A record is encoded as the values of its fields in the order they are declared."}
  - {id: file-formats-and-encoding-avro-file, class: A, sources: [file-formats-and-encoding-s3], verified: "2026-11-25", text: "An Avro object container file header consists of four magic bytes, file metadata including the schema, and a 16-byte randomly generated sync marker. The metadata also names the compression codec used for the blocks."}
  - {id: file-formats-and-encoding-avro-resolution, class: A, sources: [file-formats-and-encoding-s3], verified: "2026-11-25", text: "In Avro schema resolution, a writer's field whose name is not in the reader's record is ignored, and a reader's field that the writer's record lacks takes the default value from the reader's schema when it has one."}
  - {id: file-formats-and-encoding-proto-wire, class: A, sources: [file-formats-and-encoding-s4], verified: "2026-11-25", text: "A Protobuf message is a series of key-value pairs. Each pair is turned into a record consisting of the field number, a wire type and a payload. The name and declared type of each field can only be determined on the decoding end."}
  - {id: file-formats-and-encoding-proto-schema, class: A, sources: [file-formats-and-encoding-s6], verified: "2026-11-25", text: "Protobuf messages are described by .proto files and do not inherently self-describe their data: a message cannot be fully interpreted without access to its corresponding .proto file."}
  - {id: file-formats-and-encoding-proto-evolve, class: A, sources: [file-formats-and-encoding-s5], verified: "2026-11-25", text: "In Protobuf, adding new fields is safe: old binaries ignore the new field when parsing. Changing the field number of an existing field is not safe."}
  - {id: file-formats-and-encoding-columnar, class: A, sources: [file-formats-and-encoding-s11, file-formats-and-encoding-s13], verified: "2026-11-25", text: "Apache Parquet is a column-oriented data file format. ORC is a self-describing, type-aware columnar file format."}
  - {id: file-formats-and-encoding-footer, class: A, sources: [file-formats-and-encoding-s7, file-formats-and-encoding-s8, file-formats-and-encoding-s12], verified: "2026-11-25", text: "Parquet file metadata is written after the data to allow single pass writing. It holds the schema of the file and the start locations of all column chunks, and readers read it first. The ORC file footer holds the type schema information, the number of rows and statistics about each column."}
  - {id: file-formats-and-encoding-codecs, class: B, sources: [file-formats-and-encoding-s10, file-formats-and-encoding-s12, file-formats-and-encoding-s3], verified: "2026-11-25", text: "Parquet allows the data inside pages to be compressed with codecs that include Snappy, Gzip, LZ4 and Zstandard. ORC compression kinds include zlib, Snappy, LZ4 and Zstandard. Avro implementations must support the null and deflate codecs, and Snappy and Zstandard are optional."}
  - {id: file-formats-and-encoding-checksums, class: A, sources: [file-formats-and-encoding-s9, file-formats-and-encoding-s8, file-formats-and-encoding-s3], verified: "2026-11-25", text: "Parquet pages of all kinds can be individually checksummed with the standard CRC32 algorithm. In an Avro file, the combination of block size, object counts and sync markers enables detection of corrupt blocks."}
  - {id: file-formats-and-encoding-arrow, class: A, sources: [file-formats-and-encoding-s14], verified: "2026-11-25", text: "The Arrow columnar format includes a language-agnostic in-memory data structure specification. Its features include data adjacency for sequential access and zero-copy access in shared memory."}
  - {id: file-formats-and-encoding-validation, class: B, sources: [file-formats-and-encoding-s15], verified: "2026-11-25", text: "OWASP advises validating data from partner feeds, queues and stored records when it crosses a trust boundary, checking both syntax (the expected type and format) and semantics, with a schema validator to enforce field rules."}
