sources:
  - {id: hallucination-and-model-limits-s1, title: "NIST: Artificial Intelligence Risk Management Framework, Generative AI Profile", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
  - {id: hallucination-and-model-limits-s2, title: "OpenAI: File search", url: "https://developers.openai.com/api/docs/guides/tools-file-search", kind: primary, vendor: true}
  - {id: hallucination-and-model-limits-s3, title: "NIST: Artificial Intelligence Risk Management Framework 1.0", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
  - {id: hallucination-and-model-limits-s4, title: "European Union: Artificial Intelligence Act, consolidated text", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
claims:
  - {id: hallucination-definition, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-26", text: "NIST defines confabulations, also called hallucinations, as confidently presented erroneous or false content, content that diverges from prompts or other input, or content that contradicts earlier generated statements. It says statistical prediction can produce factually inaccurate or internally inconsistent output."}
  - {id: hallucination-risk, class: A, sources: [hallucination-and-model-limits-s1], verified: "2026-11-26", text: "NIST says confident false content may lead users to believe and act on it, and recommends particular attention to confabulation risk in applications involving consequential decisions."}
  - {id: retrieval-practice, class: B, sources: [hallucination-and-model-limits-s2], verified: "2026-11-26", text: "OpenAI documents file search as retrieving relevant information from uploaded files in a vector store before generating a response, to augment the model's inherent knowledge."}
  - {id: citation-practice, class: B, sources: [hallucination-and-model-limits-s2], verified: "2026-11-26", text: "OpenAI documents that a file search response can include the assistant message with file citations."}
  - {id: human-oversight, class: A, sources: [hallucination-and-model-limits-s3], verified: "2026-11-26", text: "NIST says human roles and responsibilities in decision making and oversight of AI systems need to be clearly defined and differentiated, and that some systems may specifically require human oversight."}
  - {id: ai-disclosure, class: C, sources: [hallucination-and-model-limits-s4], verified: "2026-11-26", text: "Article 50 of the consolidated EU AI Act requires providers to ensure that AI systems intended to interact directly with natural persons inform them they are interacting with an AI system, unless this is obvious in context."}
