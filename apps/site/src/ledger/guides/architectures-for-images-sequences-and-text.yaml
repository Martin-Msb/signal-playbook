claims:
  - {id: architectures-for-images-sequences-and-text-dense, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "Traditional neural network layers use matrix multiplication by a matrix of parameters with a separate parameter describing the interaction between each input unit and each output unit. This means that every output unit interacts with every input unit."}
  - {id: architectures-for-images-sequences-and-text-each-position, class: A, sources: [architectures-for-images-sequences-and-text-s2], verified: "2026-11-27", text: "A traditional fully connected feedforward network would have separate parameters for each input feature, so it would need to learn all the rules of the language separately at each position in the sentence."}
  - {id: architectures-for-images-sequences-and-text-grid, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "Convolutional networks are a specialised kind of neural network for processing data that has a known grid-like topology, such as time-series data, a 1-D grid of samples, and image data, a 2-D grid of pixels. They use convolution in place of general matrix multiplication in at least one of their layers."}
  - {id: architectures-for-images-sequences-and-text-sparse, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "Convolutional networks typically have sparse interactions, accomplished by making the kernel smaller than the input. An input image might have thousands or millions of pixels, but small, meaningful features such as edges can be detected with kernels that occupy only tens or hundreds of pixels. Fewer parameters need to be stored, which reduces the memory requirements of the model and improves its statistical efficiency."}
  - {id: architectures-for-images-sequences-and-text-sharing, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "In a convolutional neural net each member of the kernel is used at every position of the input. Rather than learning a separate set of parameters for every location, only one set is learned."}
  - {id: architectures-for-images-sequences-and-text-equivariance, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "The form of parameter sharing used by convolution causes the layer to be equivariant to translation: if the input shifts, the output shifts in the same way. Convolution is not naturally equivariant to some other transformations, such as changes in the scale or rotation of an image."}
  - {id: architectures-for-images-sequences-and-text-receptive-field, class: A, sources: [architectures-for-images-sequences-and-text-s1, architectures-for-images-sequences-and-text-s3], verified: "2026-11-27", text: "The receptive field of the units in the deeper layers of a convolutional network is larger than that of the units in the shallow layers, so units in the deeper layers can be indirectly connected to all or most of the input image. A single convolutional layer with a kernel narrower than the input does not connect all pairs of input and output positions."}
  - {id: architectures-for-images-sequences-and-text-prior, class: A, sources: [architectures-for-images-sequences-and-text-s1], verified: "2026-11-27", text: "A convolutional net can be thought of as a fully connected net with an infinitely strong prior, which says that the function the layer should learn contains only local interactions and is equivariant to translation. Like any prior, convolution and pooling are only useful when the assumptions made by the prior are reasonably accurate, and they can cause underfitting. When a task involves incorporating information from very distant locations in the input, the prior imposed by convolution may be inappropriate."}
  - {id: architectures-for-images-sequences-and-text-conv2d, class: B, sources: [architectures-for-images-sequences-and-text-s5, architectures-for-images-sequences-and-text-s8], verified: "2026-11-27", text: "PyTorch's nn.Conv2d applies a 2D convolution over an input signal composed of several input planes, and its kernel_size parameter is the size of the convolving kernel. The torchvision.models subpackage lists image classification models that include ResNet, ConvNeXt, EfficientNet, SwinTransformer and VisionTransformer, available with or without pre-trained weights."}
  - {id: architectures-for-images-sequences-and-text-recurrent, class: A, sources: [architectures-for-images-sequences-and-text-s2], verified: "2026-11-27", text: "Recurrent neural networks are a family of neural networks for processing sequential data, specialised for processing a sequence of values. Most recurrent networks can also process sequences of variable length."}
  - {id: architectures-for-images-sequences-and-text-same-rule, class: A, sources: [architectures-for-images-sequences-and-text-s2], verified: "2026-11-27", text: "A recurrent neural network shares the same weights across several time steps. Each member of the output is produced using the same update rule applied to the previous outputs. With separate parameters for each value of the time index, a model could not generalise to sequence lengths not seen during training, nor share statistical strength across different positions in time."}
  - {id: architectures-for-images-sequences-and-text-state, class: A, sources: [architectures-for-images-sequences-and-text-s2], verified: "2026-11-27", text: "A recurrent network trained to predict the future from the past typically learns to use its state as a kind of lossy summary of the task-relevant aspects of the past sequence of inputs. The summary is necessarily lossy, since it maps an arbitrary length sequence to a fixed length vector."}
  - {id: architectures-for-images-sequences-and-text-long-term, class: A, sources: [architectures-for-images-sequences-and-text-s2], verified: "2026-11-27", text: "In recurrent networks, gradients propagated over many stages tend to either vanish, most of the time, or explode. The difficulty with long-term dependencies arises from the exponentially smaller weights given to long-term interactions compared to short-term ones."}
  - {id: architectures-for-images-sequences-and-text-lstm, class: B, sources: [architectures-for-images-sequences-and-text-s6], verified: "2026-11-27", text: "PyTorch's nn.LSTM applies a multi-layer long short-term memory (LSTM) RNN to an input sequence."}
  - {id: architectures-for-images-sequences-and-text-attention, class: A, sources: [architectures-for-images-sequences-and-text-s3], verified: "2026-11-27", text: "The Transformer is based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Self-attention relates different positions of a single sequence in order to compute a representation of the sequence."}
  - {id: architectures-for-images-sequences-and-text-path, class: A, sources: [architectures-for-images-sequences-and-text-s3], verified: "2026-11-27", text: "The shorter the paths between any combination of positions in the input and output sequences, the easier it is to learn long-range dependencies. A self-attention layer connects all positions with a constant number of sequentially executed operations, whereas a recurrent layer requires a number of sequential operations that grows with the sequence length."}
  - {id: architectures-for-images-sequences-and-text-position, class: A, sources: [architectures-for-images-sequences-and-text-s3], verified: "2026-11-27", text: "Since the Transformer contains no recurrence and no convolution, information about the relative or absolute position of the tokens must be injected for the model to make use of the order of the sequence. Positional encodings are added to the input embeddings."}
  - {id: architectures-for-images-sequences-and-text-encoder-layer, class: B, sources: [architectures-for-images-sequences-and-text-s7], verified: "2026-11-27", text: "PyTorch's nn.TransformerEncoderLayer is made up of self-attention and a feedforward network and implements the original architecture described in Attention Is All You Need. Its documentation describes it as a reference implementation with limited features relative to newer Transformer architectures."}
  - {id: architectures-for-images-sequences-and-text-patches, class: A, sources: [architectures-for-images-sequences-and-text-s4], verified: "2026-11-27", text: "The Vision Transformer splits an image into patches and provides the sequence of linear embeddings of these patches as an input to a Transformer. Image patches are treated the same way as tokens in a natural language processing application."}
  - {id: architectures-for-images-sequences-and-text-less-bias, class: A, sources: [architectures-for-images-sequences-and-text-s4], verified: "2026-11-27", text: "The Vision Transformer has much less image-specific inductive bias than convolutional networks. In convolutional networks, locality, two-dimensional neighbourhood structure and translation equivariance are baked into each layer throughout the whole model. In the Vision Transformer the self-attention layers are global, and all spatial relations between the patches have to be learned from scratch."}
  - {id: architectures-for-images-sequences-and-text-data-scale, class: A, sources: [architectures-for-images-sequences-and-text-s4], verified: "2026-11-27", text: "The authors of the Vision Transformer report that Transformers lack some of the inductive biases inherent to convolutional networks, such as translation equivariance and locality, and therefore do not generalise well when trained on insufficient amounts of data. Trained on mid-sized datasets such as ImageNet without strong regularisation, the models were a few percentage points below ResNets of comparable size. The authors find that large scale training trumps inductive bias, and that the Vision Transformer attains excellent results when pre-trained at sufficient scale and transferred to tasks with fewer datapoints."}
  - {id: architectures-for-images-sequences-and-text-biometric, class: C, sources: [architectures-for-images-sequences-and-text-s9], verified: "2026-11-27", text: "Article 4(14) of Regulation (EU) 2016/679 defines biometric data as personal data resulting from specific technical processing relating to the physical, physiological or behavioural characteristics of a natural person, which allow or confirm the unique identification of that natural person, such as facial images or dactyloscopic data. Article 9(1) prohibits the processing of biometric data for the purpose of uniquely identifying a natural person, and Article 9(2) lists the cases in which the prohibition does not apply."}
  - {id: architectures-for-images-sequences-and-text-voice, class: C, sources: [architectures-for-images-sequences-and-text-s10], verified: "2026-11-27", text: "Recital 15 of Regulation (EU) 2024/1689 describes biometric identification as the automated recognition of physical, physiological and behavioural human features such as the face, eye movement, body shape, voice, prosody and gait, for the purpose of establishing an individual's identity by comparing biometric data of that individual to stored biometric data."}
  - {id: architectures-for-images-sequences-and-text-face-errors, class: C, sources: [architectures-for-images-sequences-and-text-s11], verified: "2026-11-27", text: "In December 2019 NIST reported a test of 189 mostly commercial face recognition algorithms from 99 developers on 18.27 million images of 8.49 million people. Across demographics, false positive rates often vary by factors of 10 to beyond 100 times, and false negatives vary often by factors below 3."}
  - {id: architectures-for-images-sequences-and-text-measure-groups, class: B, sources: [architectures-for-images-sequences-and-text-s11], verified: "2026-11-27", text: "NIST states that it is incumbent upon the system owner to know their algorithm, and that it will usually be informative to specifically measure accuracy of the operational algorithm on the operational image data. As most systems are configured with a fixed threshold, it is necessary to report both false negative and false positive rates for each demographic group at that threshold."}
  - {id: architectures-for-images-sequences-and-text-speech-errors, class: C, sources: [architectures-for-images-sequences-and-text-s12], verified: "2026-11-27", text: "A 2020 study of five automated speech recognition systems found an average word error rate of 0.35 for black speakers compared with 0.19 for white speakers. The authors trace the disparities to the underlying acoustic models and propose more diverse training datasets."}
  - {id: architectures-for-images-sequences-and-text-dataset-skew, class: C, sources: [architectures-for-images-sequences-and-text-s13], verified: "2026-11-27", text: "A 2018 study found two facial analysis benchmarks to be overwhelmingly composed of lighter-skinned subjects, 79.6% for IJB-A and 86.2% for Adience. In three commercial gender classification systems, darker-skinned females were the most misclassified group, with error rates of up to 34.7%, against a maximum of 0.8% for lighter-skinned males."}
