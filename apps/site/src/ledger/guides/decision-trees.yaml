sources:
  - {id: decision-trees-s1, title: "scikit-learn user guide: Decision Trees", url: "https://scikit-learn.org/stable/modules/tree.html", kind: primary, vendor: false}
  - {id: decision-trees-s2, title: "scikit-learn API reference: DecisionTreeClassifier", url: "https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html", kind: primary, vendor: false}
  - {id: decision-trees-s3, title: "scikit-learn API reference: export_text", url: "https://scikit-learn.org/stable/modules/generated/sklearn.tree.export_text.html", kind: primary, vendor: false}
  - {id: decision-trees-s4, title: "Google Machine Learning, Decision Forests course: Decision trees", url: "https://developers.google.com/machine-learning/decision-forests/decision-trees", kind: primary, vendor: false}
  - {id: decision-trees-s5, title: "Google Machine Learning, Decision Forests course: Types of conditions", url: "https://developers.google.com/machine-learning/decision-forests/conditions", kind: primary, vendor: false}
  - {id: decision-trees-s6, title: "Google Machine Learning, Decision Forests course: Growing decision trees", url: "https://developers.google.com/machine-learning/decision-forests/growing", kind: primary, vendor: false}
  - {id: decision-trees-s7, title: "Google Machine Learning, Decision Forests course: Overfitting and pruning", url: "https://developers.google.com/machine-learning/decision-forests/overfitting-and-pruning", kind: primary, vendor: false}
  - {id: decision-trees-s8, title: "EUR-Lex: Regulation (EU) 2024/1689, the Artificial Intelligence Act", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689", kind: primary, vendor: false, note: "Official Journal text of 12 July 2024. Later amendments and application dates were not checked."}
claims:
  - {id: decision-trees-rules, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "Decision trees are a non-parametric supervised learning method used for classification and regression. The goal is to create a model that predicts the value of a target variable by learning simple decision rules inferred from the data features."}
  - {id: decision-trees-nodes, class: A, sources: [decision-trees-s4], verified: "2026-11-25", text: "A decision tree is a model composed of a collection of questions organised hierarchically in the shape of a tree. Each non-leaf node contains a condition, and each leaf node contains a prediction."}
  - {id: decision-trees-one-feature, class: A, sources: [decision-trees-s5], verified: "2026-11-25", text: "An axis-aligned condition involves only a single feature, and decision trees are often trained with only axis-aligned conditions. The most common type of condition is the threshold condition, which compares a feature with a threshold."}
  - {id: decision-trees-cart, class: B, sources: [decision-trees-s1], verified: "2026-11-25", text: "CART constructs binary trees using the feature and threshold that yield the largest information gain at each node. scikit-learn uses an optimised version of the CART algorithm."}
  - {id: decision-trees-search, class: B, sources: [decision-trees-s1], verified: "2026-11-25", text: "With scikit-learn's default best splitter, the split is found by a greedy exhaustive search over all available features and all possible thresholds, which are the midpoints between sorted, distinct feature values."}
  - {id: decision-trees-impurity, class: A, sources: [decision-trees-s1, decision-trees-s2], verified: "2026-11-25", text: "The quality of a candidate split is computed with an impurity function on the two partitions, each weighted by its share of the node's samples, and the split that minimises the impurity is selected. Gini and entropy are common measures of impurity for classification, and Gini is the default criterion of scikit-learn's DecisionTreeClassifier."}
  - {id: decision-trees-recursive, class: A, sources: [decision-trees-s6], verified: "2026-11-25", text: "Most algorithms used to train decision trees work with a greedy divide and conquer strategy: the algorithm creates a root, selects the best condition, and repeats recursively and independently on both children nodes. When no satisfying conditions are found, the node becomes a leaf."}
  - {id: decision-trees-partition, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "A decision tree recursively partitions the feature space such that the samples with the same labels or similar target values are grouped together."}
  - {id: decision-trees-leaf, class: B, sources: [decision-trees-s1, decision-trees-s2], verified: "2026-11-25", text: "In scikit-learn the predicted class probability is the fraction of training samples of the same class in a leaf, and the predict method takes the class with the highest predicted probability."}
  - {id: decision-trees-path, class: A, sources: [decision-trees-s4], verified: "2026-11-25", text: "Inference of a decision tree routes an example from the root to one of the leaf nodes according to the conditions. The value of the reached leaf is the prediction, and the set of visited nodes is called the inference path."}
  - {id: decision-trees-white-box, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "A decision tree uses a white box model: if a given situation is observable in a model, the explanation for the condition is easily explained by boolean logic. Trees are simple to understand and to interpret, and can be visualised."}
  - {id: decision-trees-export, class: B, sources: [decision-trees-s3, decision-trees-s2], verified: "2026-11-25", text: "scikit-learn's export_text function builds a text report showing the rules of a decision tree, and the decision_path method of a fitted tree returns the decision path in the tree."}
  - {id: decision-trees-explanation, class: B, sources: [decision-trees-s8], verified: "2026-11-25", text: "Article 86 of Regulation (EU) 2024/1689 states that a person subject to a decision taken on the basis of the output of a high-risk AI system listed in Annex III, except those under point 2, which produces legal effects or similarly significantly affects that person in a way they consider to have an adverse impact on their health, safety or fundamental rights, has the right to obtain clear and meaningful explanations of the role of the AI system in the decision-making procedure and the main elements of the decision taken."}
  - {id: decision-trees-defaults, class: B, sources: [decision-trees-s2], verified: "2026-11-25", text: "In scikit-learn max_depth defaults to None, in which case nodes are expanded until all leaves are pure or until all leaves contain less than min_samples_split samples. The default values of the parameters controlling tree size lead to fully grown and unpruned trees."}
  - {id: decision-trees-overfit, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "Decision-tree learners can create over-complex trees that do not generalise the data well, which is called overfitting. Mechanisms such as pruning, setting the minimum number of samples required at a leaf node or setting the maximum depth of the tree are necessary to avoid this problem."}
  - {id: decision-trees-noise, class: A, sources: [decision-trees-s7], verified: "2026-11-25", text: "A decision tree can be trained to classify training examples perfectly, assuming the examples are separable. If the dataset contains noise, this tree will overfit to the data and show poor test accuracy."}
  - {id: decision-trees-max-depth, class: B, sources: [decision-trees-s1, decision-trees-s2], verified: "2026-11-25", text: "scikit-learn's guidance is to use max_depth to control the size of the tree to prevent overfitting. The depth of a tree is the maximum distance between the root and any leaf."}
  - {id: decision-trees-min-leaf, class: B, sources: [decision-trees-s1, decision-trees-s2], verified: "2026-11-25", text: "min_samples_leaf is the minimum number of samples required to be at a leaf node: a split point is only considered if it leaves at least min_samples_leaf training samples in each of the left and right branches, which guarantees that each leaf has a minimum size. A very small number will usually mean the tree will overfit, whereas a large number will prevent the tree from learning the data."}
  - {id: decision-trees-depth-fit, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "The deeper the tree, the more complex the decision rules and the fitter the model."}
  - {id: decision-trees-start, class: B, sources: [decision-trees-s1], verified: "2026-11-25", text: "scikit-learn's tips on practical use suggest max_depth=3 as an initial tree depth, to be increased after seeing how the tree fits the data, and min_samples_leaf=5 as an initial value."}
  - {id: decision-trees-pruning, class: B, sources: [decision-trees-s7], verified: "2026-11-25", text: "A decision tree can also be regularised after training by pruning, which converts certain non-leaf nodes to leaves. A common solution is to use a validation dataset: if removing a branch improves the quality of the model on the validation dataset, the branch is removed."}
  - {id: decision-trees-unstable, class: A, sources: [decision-trees-s1], verified: "2026-11-25", text: "Decision trees can be unstable because small variations in the data might result in a completely different tree being generated. This problem is mitigated by using decision trees within an ensemble."}
  - {id: decision-trees-oversight, class: B, sources: [decision-trees-s8], verified: "2026-11-25", text: "Article 14 of Regulation (EU) 2024/1689 states that a high-risk AI system shall be provided in such a way that the natural persons assigned to human oversight are enabled, as appropriate and proportionate, to correctly interpret its output and to decide to disregard, override or reverse that output."}
