claims:
  - {id: event-logs-and-streams-queue, class: A, sources: [event-logs-and-streams-s2, event-logs-and-streams-s1], verified: "2026-11-25", text: "Most messaging systems keep metadata on the broker about what messages have been consumed, and since the broker knows what is consumed it can immediately delete it, keeping the data size small. In Kafka, unlike traditional messaging systems, events are not deleted after consumption."}
  - {id: event-logs-and-streams-kept, class: A, sources: [event-logs-and-streams-s1], verified: "2026-11-25", text: "Events are organized and durably stored in topics. A topic can have zero, one or many producers and consumers, and events in a topic can be read as often as needed because they are not deleted after consumption."}
  - {id: event-logs-and-streams-offset, class: A, sources: [event-logs-and-streams-s1, event-logs-and-streams-s2], verified: "2026-11-25", text: "A new event published to a topic is appended to one of the topic's partitions. A Kafka log has dense, sequential offsets, and the offset for a message never changes: it is the permanent identifier for a position in the log."}
  - {id: event-logs-and-streams-event, class: A, sources: [event-logs-and-streams-s1], verified: "2026-11-25", text: "Conceptually, an event has a key, value, timestamp, and optional metadata headers."}
  - {id: event-logs-and-streams-partitions, class: A, sources: [event-logs-and-streams-s1], verified: "2026-11-25", text: "Topics are partitioned, meaning a topic is spread over a number of buckets located on different Kafka brokers, which allows client applications to read and write data from and to many brokers at the same time. Events with the same event key are written to the same partition, and Kafka guarantees that any consumer of a given topic-partition will always read that partition's events in exactly the same order as they were written."}
  - {id: event-logs-and-streams-key, class: A, sources: [event-logs-and-streams-s2], verified: "2026-11-25", text: "The client controls which partition it publishes messages to. The user can specify a key to partition by, and the key is hashed to a partition."}
  - {id: event-logs-and-streams-replication, class: A, sources: [event-logs-and-streams-s2], verified: "2026-11-25", text: "The unit of replication is the topic partition."}
  - {id: event-logs-and-streams-position, class: A, sources: [event-logs-and-streams-s2], verified: "2026-11-25", text: "A Kafka topic is divided into a set of totally ordered partitions, each of which is consumed by exactly one consumer within each subscribing consumer group at any given time. The position of a consumer in each partition is a single integer, the offset of the next message to consume. The consumer specifies its offset in the log with each fetch request and receives back a chunk of log beginning from that position."}
  - {id: event-logs-and-streams-pull, class: A, sources: [event-logs-and-streams-s2], verified: "2026-11-25", text: "In Kafka, data is pushed to the broker from the producer and pulled from the broker by the consumer. In a pull-based system the consumer simply falls behind and catches up when it can."}
  - {id: event-logs-and-streams-rewind, class: A, sources: [event-logs-and-streams-s2], verified: "2026-11-25", text: "A consumer can deliberately rewind back to an old offset and re-consume data. This violates the common contract of a queue. If the consumer code has a bug that is discovered after some messages are consumed, the consumer can re-consume those messages once the bug is fixed."}
  - {id: event-logs-and-streams-pulsar, class: B, sources: [event-logs-and-streams-s9], verified: "2026-11-25", text: "Apache Pulsar is built on the publish-subscribe pattern. A partitioned topic is implemented as N internal topics, where N is the number of partitions, and when a subscription is created an associated cursor is created to record the last consumed position."}
  - {id: event-logs-and-streams-retention, class: A, sources: [event-logs-and-streams-s1, event-logs-and-streams-s3], verified: "2026-11-25", text: "Kafka retains events for a period defined through a per-topic configuration setting, after which old events are discarded. The retention.ms setting represents an SLA on how soon consumers must read their data."}
  - {id: event-logs-and-streams-retention-default, class: C, sources: [event-logs-and-streams-s3], verified: "2026-11-25", text: "In the Apache Kafka 4.4 documentation the topic setting retention.ms has the default 604800000 milliseconds (7 days), and the default cleanup.policy is delete."}
  - {id: event-logs-and-streams-acl, class: A, sources: [event-logs-and-streams-s4], verified: "2026-11-25", text: "Kafka ACLs are defined in the general format: principal P is allowed or denied operation O from host H on any resource R matching a resource pattern. An ACL can allow a principal the operations Read and Write on a topic. If a resource has no ACLs defined, Kafka restricts access to it and only super users are allowed to access it."}
  - {id: event-logs-and-streams-encryption, class: B, sources: [event-logs-and-streams-s5, event-logs-and-streams-s6, event-logs-and-streams-s2], verified: "2026-11-25", text: "Kafka supports encryption of data transferred between brokers and clients, between brokers, and between brokers and tools using SSL. Security is optional, and by default SSL is disabled but can be turned on. The design documentation refers to the libraries as TLS/SSL."}
  - {id: event-logs-and-streams-tiered, class: B, sources: [event-logs-and-streams-s7], verified: "2026-11-25", text: "In Kafka's tiered storage approach a cluster has a local tier on the brokers' disks and a remote tier that uses external storage systems, such as HDFS or S3, to store the completed log segments."}
  - {id: event-logs-and-streams-pulsar-tiered, class: B, sources: [event-logs-and-streams-s10], verified: "2026-11-25", text: "With Pulsar tiered storage, older messages in the backlog can be moved from BookKeeper to a cheaper storage mechanism, with backends that include Amazon S3, Google Cloud Storage and Azure Blob Storage, while clients still access the backlog as if nothing had changed."}
  - {id: event-logs-and-streams-diskless, class: C, sources: [event-logs-and-streams-s8], verified: "2026-11-25", text: "The Kafka improvement proposal KIP-1150, Diskless Topics, has the current state Accepted on a page last updated on 2 March 2026. It lets Kafka operators write through to object storage, using local disks for caching instead of durable storage."}
  - {id: event-logs-and-streams-compatible, class: B, sources: [event-logs-and-streams-s11, event-logs-and-streams-s12, event-logs-and-streams-s13], verified: "2026-11-25", flags: [vendor-stated], text: "Azure Event Hubs provides an Apache Kafka endpoint on an event hub, which lets users connect using the Kafka protocol. Redpanda states that it is compatible with the Kafka protocol, with listed exceptions. WarpStream describes itself as a diskless data streaming platform that integrates with cloud object stores while remaining compatible with Apache Kafka."}
