sources:
  - {id: delivery-guarantees-s1, title: "Apache Flink: Fault Tolerance via State Snapshots", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/learn-flink/fault_tolerance/", kind: primary, vendor: false}
  - {id: delivery-guarantees-s2, title: "Apache Kafka: Design, Message Delivery Semantics", url: "https://kafka.apache.org/44/design/design/", kind: primary, vendor: false}
  - {id: delivery-guarantees-s3, title: "Google Cloud Dataflow: Exactly-once in Dataflow", url: "https://docs.cloud.google.com/dataflow/docs/concepts/exactly-once", kind: primary, vendor: true}
  - {id: delivery-guarantees-s4, title: "Stripe API reference: Idempotent requests", url: "https://docs.stripe.com/api/idempotent_requests", kind: primary, vendor: true}
  - {id: delivery-guarantees-s5, title: "Apache Flink: Kafka connector", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/connectors/datastream/kafka/", kind: primary, vendor: false}
  - {id: delivery-guarantees-s6, title: "Apache Pulsar: Messaging concepts", url: "https://pulsar.apache.org/docs/next/concepts-messaging/", kind: primary, vendor: false}
  - {id: delivery-guarantees-s7, title: "AWS Database Migration Service: AWS DMS data validation", url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Validating.html", kind: primary, vendor: true}
claims:
  - {id: delivery-guarantees-uncertain, class: A, sources: [delivery-guarantees-s2], verified: "2026-11-27", text: "If a Kafka producer attempts to publish a message and experiences a network error, it cannot be sure whether the error happened before or after the message was committed."}
  - {id: delivery-guarantees-semantics, class: A, sources: [delivery-guarantees-s2], verified: "2026-11-27", text: "Kafka defines at most once as messages that may be lost but are never redelivered, and at least once as messages that are never lost but may be redelivered."}
  - {id: delivery-guarantees-modes, class: A, sources: [delivery-guarantees-s1], verified: "2026-11-27", text: "Flink lists three outcomes after a failure: it makes no effort to recover (at most once), nothing is lost but results may be duplicated (at least once), or nothing is lost or duplicated (exactly once)."}
  - {id: delivery-guarantees-retry, class: A, sources: [delivery-guarantees-s3], verified: "2026-11-27", text: "In Dataflow the worker that sends records retries RPCs until it receives positive acknowledgement. Because these retries might create duplicates, every message is tagged with a unique ID, and a record whose ID has already been received and committed is dropped as a duplicate."}
  - {id: delivery-guarantees-idempotency-key, class: B, sources: [delivery-guarantees-s4], verified: "2026-11-27", text: "Stripe's API accepts an idempotency key, a unique key generated by the client that the server uses to recognise retries of the same request, so a request can be repeated after a connection error without creating a second object or performing the update twice."}
  - {id: delivery-guarantees-idempotent-producer, class: A, sources: [delivery-guarantees-s2], verified: "2026-11-27", text: "The Kafka producer supports an idempotent delivery option which guarantees that resending will not result in duplicate entries in the log: the broker assigns each producer an ID and deduplicates messages using a sequence number sent with every message."}
  - {id: delivery-guarantees-effectively-once, class: A, sources: [delivery-guarantees-s6], verified: "2026-11-27", text: "Pulsar message deduplication ensures that each message produced on a topic is persisted to disk only once, even if the message is produced more than once. Pulsar describes this under effectively-once semantics."}
  - {id: delivery-guarantees-offset-with-output, class: A, sources: [delivery-guarantees-s2], verified: "2026-11-27", text: "A Kafka consumer can store its offset in the same place as its output. Its position is stored as a message in an internal topic, so the offset can be written to Kafka in the same transaction as the output topics."}
  - {id: delivery-guarantees-transactions, class: A, sources: [delivery-guarantees-s2], verified: "2026-11-27", text: "The Kafka producer can send messages atomically to multiple topic partitions using transactions, so that either all messages are successfully written or none of them are."}
  - {id: delivery-guarantees-end-to-end, class: A, sources: [delivery-guarantees-s1], verified: "2026-11-27", text: "Flink states that exactly once end-to-end requires sources that are replayable and sinks that are transactional or idempotent."}
  - {id: delivery-guarantees-processing, class: A, sources: [delivery-guarantees-s1], verified: "2026-11-27", text: "Flink recovers from faults by rewinding and replaying the source streams. Exactly once does not mean that every event is processed exactly once. It means that every event affects the state managed by Flink exactly once."}
  - {id: delivery-guarantees-kafka-sink, class: B, sources: [delivery-guarantees-s5], verified: "2026-11-27", text: "With the exactly-once delivery guarantee, Flink's KafkaSink writes all messages in a Kafka transaction that is committed to Kafka on a checkpoint."}
  - {id: delivery-guarantees-side-effects, class: A, sources: [delivery-guarantees-s3], verified: "2026-11-27", text: "In Dataflow, side effects are not guaranteed to have exactly-once semantics. This includes writing output to an external store, unless the sink also implements exactly-once semantics."}
  - {id: delivery-guarantees-idempotent, class: B, sources: [delivery-guarantees-s3], verified: "2026-11-27", text: "For a sink you write yourself, Dataflow's documentation says the best approach is to make the function object idempotent so that it can be retried as often as necessary without causing unintended side effects."}
  - {id: delivery-guarantees-reconciliation, class: B, sources: [delivery-guarantees-s7], verified: "2026-11-27", text: "AWS DMS data validation compares each row in the source with its corresponding row at the target, verifies the rows contain the same data, and reports any mismatches. Its failure types include MISSING_TARGET."}
