sources:
  - {id: generation-and-sampling-s1, title: "Brown et al.: Language Models are Few-Shot Learners", url: "https://arxiv.org/abs/2005.14165", kind: primary, vendor: false}
  - {id: generation-and-sampling-s2, title: "Hugging Face: Generation", url: "https://huggingface.co/docs/transformers/main_classes/text_generation", kind: primary, vendor: false}
  - {id: generation-and-sampling-s3, title: "Holtzman et al.: The Curious Case of Neural Text Degeneration", url: "https://arxiv.org/abs/1904.09751", kind: primary, vendor: false}
  - {id: generation-and-sampling-s4, title: "Hugging Face: Utilities for Generation", url: "https://huggingface.co/docs/transformers/en/internal/generation_utils", kind: primary, vendor: false}
  - {id: generation-and-sampling-s5, title: "OpenAI: Reasoning models", url: "https://developers.openai.com/api/docs/guides/reasoning", kind: primary, vendor: true}
  - {id: generation-and-sampling-s6, title: "OpenAI: Streaming API responses", url: "https://developers.openai.com/api/docs/guides/streaming-responses", kind: primary, vendor: true}
claims:
  - {id: generation-and-sampling-autoregressive, class: A, sources: [generation-and-sampling-s1], verified: "2026-11-26", text: "GPT-3 is an autoregressive language model, and the paper describes generation as a conditional completion from a context."}
  - {id: generation-and-sampling-sampling, class: A, sources: [generation-and-sampling-s2], verified: "2026-11-26", text: "Generation can sample from next-token probabilities rather than always selecting the single most probable token."}
  - {id: generation-and-sampling-settings, class: B, sources: [generation-and-sampling-s2], verified: "2026-11-26", text: "Transformers exposes temperature to modulate next-token probabilities and top-p to retain a smallest set of likely tokens reaching a cumulative probability threshold."}
  - {id: generation-and-sampling-diversity, class: A, sources: [generation-and-sampling-s3, generation-and-sampling-s1], verified: "2026-11-26", text: "Holtzman and colleagues report that decoding strategies affect diversity and repetition; the GPT-3 paper reports generating multiple samples with temperature and nucleus sampling."}
  - {id: generation-and-sampling-limits, class: B, sources: [generation-and-sampling-s5, generation-and-sampling-s4], verified: "2026-11-26", text: "OpenAI documents max_output_tokens as a cap that includes reasoning, visible output and non-visible formatting tokens; Transformers provides maximum-token generation limits."}
  - {id: generation-and-sampling-stop, class: B, sources: [generation-and-sampling-s4], verified: "2026-11-26", text: "Transformers stop-string criteria end generation when a specified string is completed by generated tokens."}
  - {id: generation-and-sampling-streaming, class: B, sources: [generation-and-sampling-s6], verified: "2026-11-26", text: "The Responses API can stream output events while the response is being generated and emits a response.completed event when generation is complete."}
  - {id: generation-and-sampling-reasoning, class: B, sources: [generation-and-sampling-s5], verified: "2026-11-26", text: "Reasoning models can generate internal reasoning tokens before the response; those tokens are not visible through the API but use context and count as output tokens."}
  - {id: generation-and-sampling-governance, class: A, sources: [generation-and-sampling-s3, generation-and-sampling-s6], verified: "2026-11-26", text: "Holtzman and colleagues report that sampling changes output diversity; OpenAI warns that streaming partial output makes moderation harder. Vinterhus should evaluate repeated completed outputs with settings held constant before using generated text in refund decisions."}
