  - {id: feature-engineering-s11, title: "NIST Special Publication 1270: Towards a Standard for Identifying and Managing Bias in Artificial Intelligence", url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.1270.pdf", kind: primary, vendor: false, note: "Published March 2022."}
  - {id: feature-engineering-s12, title: "EUR-Lex: Consolidated Artificial Intelligence Act", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false, note: "Consolidated text dated 27 July 2026, incorporating Regulation (EU) 2026/1744. Checked 27 November 2026."}
claims:
  - {id: feature-engineering-missing, class: A, sources: [feature-engineering-s3], verified: "2026-11-27", text: "Datasets with missing values, often encoded as blanks, NaNs or other placeholders, are incompatible with scikit-learn estimators, which assume that all values in an array are numerical and that all have and hold meaning. A basic strategy is to discard entire rows or columns containing missing values, at the price of losing data which may be valuable. A better strategy is to impute the missing values, that is, to infer them from the known part of the data."}
  - {id: feature-engineering-vector, class: A, sources: [feature-engineering-s7], verified: "2026-11-27", text: "A feature vector can be thought of as the floating-point values comprising one example. Google's Machine Learning Crash Course calls feature engineering a vital part of machine learning and names normalization, converting numerical values into a standard range, and binning, converting numerical values into buckets of ranges, as the most common feature engineering techniques."}
  - {id: feature-engineering-imputer, class: B, sources: [feature-engineering-s3], verified: "2026-11-27", text: "scikit-learn's SimpleImputer imputes missing values with a provided constant value or with the mean, median or most frequent value of each column in which the missing values are located. Its add_indicator parameter, False by default, stacks the output of MissingIndicator, a binary matrix indicating the presence of missing values, with the output of the imputer."}
  - {id: feature-engineering-ordinal, class: A, sources: [feature-engineering-s2, feature-engineering-s9], verified: "2026-11-27", text: "An integer representation of categories cannot be used directly with all scikit-learn estimators, as these expect continuous input and would interpret the categories as being ordered, which is often not desired. A model loaded with indexed integers would treat the indexed values as continuous floating-point numbers."}
  - {id: feature-engineering-one-hot, class: A, sources: [feature-engineering-s2], verified: "2026-11-27", text: "One-of-K encoding, also known as one-hot or dummy encoding, can be obtained with scikit-learn's OneHotEncoder, which transforms each categorical feature with n_categories possible values into n_categories binary features, with one of them 1 and all others 0."}
  - {id: feature-engineering-target-encoder, class: B, sources: [feature-engineering-s2], verified: "2026-11-27", text: "scikit-learn's TargetEncoder uses the target mean conditioned on the categorical feature for encoding unordered categories. This encoding scheme is useful with categorical features with high cardinality, where one-hot encoding would inflate the feature space, making it more expensive for a downstream model to process."}
  - {id: feature-engineering-scale-why, class: A, sources: [feature-engineering-s2], verified: "2026-11-27", text: "Many elements used in the objective function of a learning algorithm may assume that all features are centred around zero or have variance in the same order. If a feature has a variance that is orders of magnitude larger than others, it might dominate the objective function and make the estimator unable to learn from other features correctly as expected."}
  - {id: feature-engineering-scaler, class: B, sources: [feature-engineering-s2], verified: "2026-11-27", text: "scikit-learn's StandardScaler computes the mean and standard deviation on a training set so as to be able to later re-apply the same transformation on the testing set. An alternative standardisation is scaling features to lie between a given minimum and maximum value, often between zero and one, which can be achieved using MinMaxScaler."}
  - {id: feature-engineering-combine, class: A, sources: [feature-engineering-s2, feature-engineering-s10], verified: "2026-11-27", text: "Polynomial features are a simple and common method to get features' high-order and interaction terms, implemented in scikit-learn's PolynomialFeatures. Feature crosses are created by crossing, that is taking the Cartesian product of, two or more categorical or bucketed features of the dataset. Like polynomial transforms, feature crosses allow linear models to handle nonlinearities."}
  - {id: feature-engineering-selection, class: B, sources: [feature-engineering-s5], verified: "2026-11-27", text: "The classes in scikit-learn's feature_selection module can be used for feature selection or dimensionality reduction on sample sets, either to improve estimators' accuracy scores or to boost their performance on very high-dimensional datasets. VarianceThreshold removes all features whose variance does not meet some threshold, and SelectKBest removes all but the k highest scoring features."}
  - {id: feature-engineering-gains, class: B, sources: [feature-engineering-s6], verified: "2026-11-27", text: "Google's Rules of Machine Learning state that most of the problems a practitioner will face are engineering problems, and that even with all the resources of a great machine learning expert, most of the gains come from great features, not great machine learning algorithms."}
  - {id: feature-engineering-train-only, class: A, sources: [feature-engineering-s1], verified: "2026-11-27", text: "Both train and test data subsets should receive the same preprocessing transformation, and it is important that these transformations are only learnt from the training data: for a normalisation step that divides by the average value, the average should be the average of the train subset, not of all the data. scikit-learn's tips are to always split the data into train and test subsets first, particularly before any preprocessing steps, never to include test data when using the fit and fit_transform methods, and to use fit_transform on the train subset and transform on the test subset."}
  - {id: feature-engineering-pipeline, class: B, sources: [feature-engineering-s4, feature-engineering-s1], verified: "2026-11-27", text: "With a scikit-learn Pipeline, fit and predict are called once to fit a whole sequence of estimators. Pipelines help avoid leaking statistics from test data into the trained model in cross-validation, by ensuring that the same samples are used to train the transformers and predictors. ColumnTransformer helps perform different transformations for different columns of the data, within a Pipeline that is safe from data leakage."}
  - {id: feature-engineering-same-transform, class: A, sources: [feature-engineering-s1], verified: "2026-11-27", text: "If data transforms are used when training a model, they also must be used on subsequent datasets, whether it is test data or data in a production system. Otherwise, the feature space will change, and the model will not be able to perform effectively."}
  - {id: feature-engineering-normalise-serve, class: A, sources: [feature-engineering-s8], verified: "2026-11-27", text: "The goal of normalization is to transform features to be on a similar scale. A feature that is normalized during training must also be normalized when making predictions."}
  - {id: feature-engineering-leakage, class: A, sources: [feature-engineering-s1], verified: "2026-11-27", text: "Data leakage occurs when information that would not be available at prediction time is used when building the model. This results in overly optimistic performance estimates and thus poorer performance when the model is used on actually novel data. A common cause is not keeping the test and train data subsets separate."}
  - {id: feature-engineering-selection-leak, class: B, sources: [feature-engineering-s1], verified: "2026-11-27", text: "In scikit-learn's example with 10,000 randomly generated features and random targets, the expected accuracy is around 0.5. Using all the data for feature selection before the split gives an accuracy of 0.76, and performing feature selection on the train subset only gives 0.5. The documentation notes that this risk of leakage is relevant with almost all transformations in scikit-learn, including StandardScaler, SimpleImputer and PCA."}
  - {id: feature-engineering-proxy, class: A, sources: [feature-engineering-s11], verified: "2026-11-27", text: "NIST Special Publication 1270 states that developers sometimes exclude protected attributes, and that this does not remedy the problem, since the information can be inadvertently inferred in other ways through proxy or latent variables. It gives the examples that gender can be inferred through browsing history and race through zip code, so models based on such variables can still negatively impact individuals or classes of individuals."}
  - {id: feature-engineering-proxy-mitigation, class: B, sources: [feature-engineering-s11], verified: "2026-11-27", text: "NIST Special Publication 1270 states that, until causal methods are more widely available and adopted, minimising the number of input variables, and ensuring that there is no strong correlation amongst them and a logical relationship to the prediction target, is a mitigation tactic for proxy discrimination and other AI risks."}
  - {id: feature-engineering-data-governance, class: C, sources: [feature-engineering-s12], verified: "2026-11-27", text: "Article 10(2) of Regulation (EU) 2024/1689 states that the training, validation and testing data sets of high-risk AI systems shall be subject to data governance and management practices appropriate for the intended purpose of the system. Those practices concern in particular relevant data-preparation processing operations, an examination in view of possible biases that are likely to affect the health and safety of persons, have a negative impact on fundamental rights or lead to discrimination prohibited under Union law, and appropriate measures to detect, prevent and mitigate the biases identified."}
