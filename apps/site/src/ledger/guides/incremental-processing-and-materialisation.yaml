sources:
  - {id: incremental-processing-and-materialisation-s1, title: "dbt documentation: Configure incremental models", url: "https://docs.getdbt.com/docs/build/incremental-models", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s2, title: "dbt documentation: Idempotence in dbt", url: "https://docs.getdbt.com/best-practices/idempotence", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s3, title: "dbt documentation: Incremental strategy", url: "https://docs.getdbt.com/docs/build/incremental-strategy", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s4, title: "PostgreSQL documentation: Materialized views", url: "https://www.postgresql.org/docs/current/rules-materializedviews.html", kind: primary, vendor: false}
  - {id: incremental-processing-and-materialisation-s5, title: "Snowflake documentation: Dynamic table refresh modes", url: "https://docs.snowflake.com/en/user-guide/dynamic-tables/refresh-modes", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s6, title: "PostgreSQL documentation: REFRESH MATERIALIZED VIEW", url: "https://www.postgresql.org/docs/current/sql-refreshmaterializedview.html", kind: primary, vendor: false}
  - {id: incremental-processing-and-materialisation-s7, title: "dbt documentation: Apache Spark configurations", url: "https://docs.getdbt.com/reference/resource-configs/spark-configs", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s8, title: "dbt documentation: About microbatch incremental models", url: "https://docs.getdbt.com/docs/build/incremental-microbatch", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s9, title: "Apache Airflow documentation: Backfill", url: "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/backfill.html", kind: primary, vendor: false}
claims:
  - {id: incremental-processing-and-materialisation-cost, class: B, sources: [incremental-processing-and-materialisation-s1], verified: "2026-11-27", text: "dbt incremental models transform selected new or changed rows on later runs instead of transforming the entire source dataset each time."}
  - {id: incremental-processing-and-materialisation-key, class: B, sources: [incremental-processing-and-materialisation-s1, incremental-processing-and-materialisation-s2], verified: "2026-11-27", text: "In dbt, a unique_key lets an incremental model replace a matching existing row rather than append another row; appending without a reliable key can create duplicates on a rerun."}
  - {id: incremental-processing-and-materialisation-overwrite, class: B, sources: [incremental-processing-and-materialisation-s3, incremental-processing-and-materialisation-s7], verified: "2026-11-27", text: "dbt's insert_overwrite strategy replaces affected partitions with new data, and the model must select all relevant data for a partition being replaced."}
  - {id: incremental-processing-and-materialisation-backfill, class: B, sources: [incremental-processing-and-materialisation-s1, incremental-processing-and-materialisation-s2], verified: "2026-11-27", text: "dbt's full-refresh option rebuilds an incremental model from all available data; dbt describes idempotent transformations as safe to rerun and backfill without double-counting or drift."}
  - {id: incremental-processing-and-materialisation-materialised-view, class: B, sources: [incremental-processing-and-materialisation-s4, incremental-processing-and-materialisation-s6], verified: "2026-11-27", text: "A PostgreSQL materialized view stores the result of its defining query, and REFRESH MATERIALIZED VIEW completely replaces its contents by executing that query."}
  - {id: incremental-processing-and-materialisation-dynamic-table, class: B, sources: [incremental-processing-and-materialisation-s5], verified: "2026-11-27", text: "Snowflake incremental dynamic table refresh processes data changed since the previous refresh; a full refresh reruns the full definition against current base tables and replaces the materialized output."}
  - {id: incremental-processing-and-materialisation-microbatch, class: B, sources: [incremental-processing-and-materialisation-s8], verified: "2026-11-27", text: "dbt's microbatch strategy treats each batch as an independent, idempotent unit that can be built or replaced on its own; a backfill processes the batches between a given event-time start and end as independent queries, and the lookback setting processes batches before the latest one to capture late-arriving records."}
  - {id: incremental-processing-and-materialisation-airflow-backfill, class: B, sources: [incremental-processing-and-materialisation-s9], verified: "2026-11-27", text: "In Apache Airflow, a backfill creates runs for past dates of a Dag."}
