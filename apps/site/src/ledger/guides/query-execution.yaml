sources:
  - {id: query-execution-s1, title: "PostgreSQL documentation: Planner/Optimizer", url: "https://www.postgresql.org/docs/current/planner-optimizer.html", kind: primary, vendor: false}
  - {id: query-execution-s2, title: "PostgreSQL documentation: Using EXPLAIN", url: "https://www.postgresql.org/docs/current/using-explain.html", kind: primary, vendor: false}
  - {id: query-execution-s3, title: "PostgreSQL documentation: Statistics used by the planner", url: "https://www.postgresql.org/docs/current/planner-stats.html", kind: primary, vendor: false}
  - {id: query-execution-s4, title: "PostgreSQL documentation: Parallel query", url: "https://www.postgresql.org/docs/current/parallel-query.html", kind: primary, vendor: false}
  - {id: query-execution-s5, title: "PostgreSQL documentation: How parallel query works", url: "https://www.postgresql.org/docs/current/how-parallel-query-works.html", kind: primary, vendor: false}
  - {id: query-execution-s6, title: "DuckDB documentation: Overview of DuckDB internals", url: "https://duckdb.org/docs/2.0/internals/overview.html", kind: primary, vendor: false}
  - {id: query-execution-s7, title: "DuckDB: Why DuckDB", url: "https://duckdb.org/why_duckdb", kind: primary, vendor: false}
  - {id: query-execution-s8, title: "Polars user guide: Lazy API optimizations", url: "https://docs.pola.rs/user-guide/lazy/optimizations/", kind: primary, vendor: false}
  - {id: query-execution-s9, title: "Polars user guide: Index", url: "https://docs.pola.rs/", kind: primary, vendor: false}
  - {id: query-execution-s10, title: "Trino documentation: Trino concepts", url: "https://trino.io/docs/current/overview/concepts.html", kind: primary, vendor: false}
  - {id: query-execution-s11, title: "Trino documentation: Cost-based optimizations", url: "https://trino.io/docs/current/optimizer/cost-based-optimizations.html", kind: primary, vendor: false}
  - {id: query-execution-s12, title: "Trino documentation: EXPLAIN ANALYZE", url: "https://trino.io/docs/current/sql/explain-analyze.html", kind: primary, vendor: false}
  - {id: query-execution-s13, title: "Trino documentation: Resource groups", url: "https://trino.io/docs/current/admin/resource-groups.html", kind: primary, vendor: false}
  - {id: query-execution-s14, title: "Apache Spark documentation: RDD programming guide, Shuffle operations", url: "https://spark.apache.org/docs/latest/rdd-programming-guide.html", kind: primary, vendor: false}
  - {id: query-execution-s15, title: "Apache Spark documentation: Spark SQL performance tuning", url: "https://spark.apache.org/docs/latest/sql-performance-tuning.html", kind: primary, vendor: false}
claims:
  - {id: query-execution-many-ways, class: A, sources: [query-execution-s1], verified: "2026-11-25", text: "A given SQL query can be executed in a wide variety of different ways, each of which will produce the same set of results."}
  - {id: query-execution-nested-loop, class: A, sources: [query-execution-s1], verified: "2026-11-25", text: "In a nested loop join the right relation is scanned once for every row found in the left relation. This strategy is easy to implement but can be very time consuming."}
  - {id: query-execution-cheapest, class: A, sources: [query-execution-s1], verified: "2026-11-25", text: "If it is computationally feasible, the PostgreSQL query optimizer examines each possible execution plan and selects the one that is expected to run the fastest."}
  - {id: query-execution-hash-join, class: A, sources: [query-execution-s1], verified: "2026-11-25", text: "In a hash join one relation is first scanned and loaded into a hash table, using its join attributes as hash keys. The other relation is then scanned and the values of every row found are used as hash keys to locate the matching rows in the table."}
  - {id: query-execution-plan-tree, class: A, sources: [query-execution-s2], verified: "2026-11-25", text: "The structure of a query plan is a tree of plan nodes. Nodes at the bottom level are scan nodes that return raw rows from a table, and joining, aggregation, sorting or other operations on the raw rows are additional nodes above the scan nodes."}
  - {id: query-execution-critical, class: A, sources: [query-execution-s2], verified: "2026-11-25", text: "Choosing the right plan to match the query structure and the properties of the data is absolutely critical for good performance."}
  - {id: query-execution-explain-analyze, class: A, sources: [query-execution-s2], verified: "2026-11-25", text: "With the ANALYZE option, EXPLAIN actually executes the query and displays the true row counts and true run time accumulated within each plan node, along with the same estimates that a plain EXPLAIN shows."}
  - {id: query-execution-estimates, class: A, sources: [query-execution-s2], verified: "2026-11-25", text: "The thing that is usually most important to look for in EXPLAIN ANALYZE output is whether the estimated row counts are reasonably close to reality."}
  - {id: query-execution-stats-approx, class: A, sources: [query-execution-s3], verified: "2026-11-25", text: "The query planner needs to estimate the number of rows retrieved by a query in order to make good choices of query plans. Entries in pg_statistic are always approximate even when freshly updated, and the table row counts usually contain somewhat out-of-date values."}
  - {id: query-execution-pg-parallel, class: A, sources: [query-execution-s4, query-execution-s5], verified: "2026-11-25", text: "PostgreSQL can devise query plans that can leverage multiple CPUs in order to answer queries faster. Every background worker process started for a parallel query executes the parallel portion of the plan."}
  - {id: query-execution-duckdb-phases, class: B, sources: [query-execution-s6], verified: "2026-11-25", text: "DuckDB processes a query through a parser, a binder that resolves tables and columns using the catalog, a logical planner, an optimizer, and a physical plan generator that converts the logical operator tree into a PhysicalOperator tree."}
  - {id: query-execution-duckdb-optimiser, class: B, sources: [query-execution-s6], verified: "2026-11-25", text: "DuckDB's optimizer pushes filters down into the query plan and reorders joins using dynamic programming."}
  - {id: query-execution-push, class: B, sources: [query-execution-s6], verified: "2026-11-25", text: "DuckDB uses a push-based vectorized model, where DataChunks are pushed through the operator tree."}
  - {id: query-execution-vectorised, class: B, sources: [query-execution-s7], verified: "2026-11-25", flags: [vendor-stated], text: "DuckDB uses a columnar-vectorized query execution engine in which a large batch of values, a vector, is processed in one operation. DuckDB states that this greatly reduces overhead present in systems that process each row sequentially."}
  - {id: query-execution-duckdb-embedded, class: B, sources: [query-execution-s7], verified: "2026-11-25", text: "By default, DuckDB does not run as a separate process but is completely embedded within a host process."}
  - {id: query-execution-polars-pushdown, class: B, sources: [query-execution-s8], verified: "2026-11-25", text: "The Polars lazy API runs optimizations on a query, including predicate pushdown, which applies filters as early as possible at scan level, and projection pushdown, which selects only the columns that are needed at the scan level."}
  - {id: query-execution-polars-cores, class: B, sources: [query-execution-s9], verified: "2026-11-25", text: "Polars divides the workload among the available CPU cores without any additional configuration."}
  - {id: query-execution-trino-coordinator, class: B, sources: [query-execution-s10], verified: "2026-11-25", text: "The Trino coordinator is the server that is responsible for parsing statements, planning queries, and managing Trino worker nodes."}
  - {id: query-execution-trino-stages, class: B, sources: [query-execution-s10], verified: "2026-11-25", text: "Trino executes a query by breaking up the execution into a hierarchy of stages. A stage is implemented as a series of tasks distributed over a network of Trino workers, and tasks operate on splits, which are sections of a larger data set."}
  - {id: query-execution-trino-exchange, class: B, sources: [query-execution-s10], verified: "2026-11-25", text: "Exchanges transfer data between Trino nodes for different stages of a query."}
  - {id: query-execution-trino-cbo, class: B, sources: [query-execution-s11], verified: "2026-11-25", text: "The order in which joins are executed in a query can have a significant impact on the query's performance. With cost-based join enumeration, Trino uses table statistics provided by connectors to estimate the costs for different join orders and picks the join order with the lowest computed costs."}
  - {id: query-execution-trino-explain, class: B, sources: [query-execution-s12], verified: "2026-11-25", text: "Trino's EXPLAIN ANALYZE executes the statement and shows the distributed execution plan of the statement along with the cost of each operation."}
  - {id: query-execution-resource-groups, class: B, sources: [query-execution-s13], verified: "2026-11-25", text: "In Trino, resource groups place limits on resource usage and can enforce queueing policies on queries that run within them. A query belongs to a single resource group and consumes resources from that group. Except for the limit on queued queries, when a resource group runs out of a resource it does not cause running queries to fail; instead new queries become queued."}
  - {id: query-execution-shuffle, class: B, sources: [query-execution-s14], verified: "2026-11-25", text: "The shuffle is Spark's mechanism for re-distributing data so that it is grouped differently across partitions. It is an expensive operation since it involves disk I/O, data serialization, and network I/O."}
  - {id: query-execution-aqe, class: B, sources: [query-execution-s15], verified: "2026-11-25", text: "Adaptive Query Execution is an optimization technique in Spark SQL that makes use of runtime statistics to choose the most efficient query execution plan."}
  - {id: query-execution-skew, class: B, sources: [query-execution-s15], verified: "2026-11-25", text: "Data skew can severely downgrade the performance of join queries."}
