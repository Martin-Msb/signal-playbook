claims:
  - {id: data-modelling-redundancy, class: A, sources: [data-modelling-s1], verified: "2026-11-25", text: "Kent's example of a design that is not normalised repeats a warehouse address in every record that refers to a part stored in that warehouse. If the address changes, every such record must be updated, and because of the redundancy the data might become inconsistent."}
  - {id: data-modelling-purpose, class: A, sources: [data-modelling-s1], verified: "2026-11-25", text: "The normalization rules are designed to prevent update anomalies and data inconsistencies. A normalized design enhances the integrity of the data by minimizing redundancy and inconsistency, and the rules tend to penalize retrieval, since data held in one unnormalized record may have to be retrieved from several normalized records."}
  - {id: data-modelling-2nf, class: A, sources: [data-modelling-s1], verified: "2026-11-25", text: "Second normal form is violated when a non-key field is a fact about a subset of a key."}
  - {id: data-modelling-3nf, class: A, sources: [data-modelling-s1], verified: "2026-11-25", text: "Third normal form is violated when a non-key field is a fact about another non-key field. Kent's example is an employee record that also holds the location of the employee's department."}
  - {id: data-modelling-key-rule, class: A, sources: [data-modelling-s1], verified: "2026-11-25", text: "Kent summarises second and third normal form: a non-key field must provide a fact about the key, the whole key, and nothing but the key."}
  - {id: data-modelling-conceptual, class: B, sources: [data-modelling-s3], verified: "2026-11-25", text: "A conceptual data model helps analyse the conceptual structure of an information system, to identify the principal entities to be represented, their attributes and the relationships between them. It is more abstract than a logical or physical data model."}
  - {id: data-modelling-logical, class: B, sources: [data-modelling-s4, data-modelling-s3], verified: "2026-11-25", text: "A logical data model is not specific to a database. It describes things about which an organisation wants to collect data and the relationships among these things, and it contains entities and attributes, relationships and unique identifiers. In PowerDesigner a logical data model has migrated entity identifiers and is less abstract than a conceptual data model."}
  - {id: data-modelling-physical, class: B, sources: [data-modelling-s5, data-modelling-s4], verified: "2026-11-25", text: "A physical data model is a database-specific model that represents relational data objects such as tables, columns, primary and foreign keys. In IBM InfoSphere Data Architect a logical data model can be transformed into a physical data model, storage objects, indexes and views are added as needed, and the physical model is used to generate DDL."}
  - {id: data-modelling-keys, class: A, sources: [data-modelling-s2], verified: "2026-11-25", text: "In PostgreSQL a primary key constraint indicates that a column, or group of columns, can be used as a unique identifier for rows in the table. A foreign key constraint specifies that the values in a column or group of columns must match the values appearing in some row of another table."}
  - {id: data-modelling-many-to-many, class: A, sources: [data-modelling-s2], verified: "2026-11-25", text: "A table can have more than one foreign key constraint, which is used to implement many-to-many relationships between tables. The PostgreSQL example lets one order contain many products through an order_items table whose primary key spans two columns and overlaps with its two foreign keys."}
  - {id: data-modelling-owner, class: B, sources: [data-modelling-s6], verified: "2026-11-25", text: "In the UK government's data ownership model a data owner is a senior individual with dedicated accountabilities for data. Data owners work with business requirements to define centralised data definitions for their subject areas, and data stewards maintain and implement data standards and process documentation, for example a business glossary."}
  - {id: data-modelling-ownership-layer, class: B, sources: [data-modelling-s6], verified: "2026-11-25", text: "The UK government's data ownership model includes establishing an enterprise data model with data ownership agreed at a conceptual data model layer."}
  - {id: data-modelling-glossary, class: B, sources: [data-modelling-s7], verified: "2026-11-25", text: "The DataHub Business Glossary is a framework for defining a standardised set of data concepts and associating them with the physical assets in a data ecosystem. A term is a word or phrase with a specific business definition assigned to it, terms can be attached to data assets, and terms and term groups can carry documentation and owners."}
  - {id: data-modelling-comment, class: A, sources: [data-modelling-s8], verified: "2026-11-25", text: "In PostgreSQL, COMMENT stores, replaces or removes the comment on a database object, and tables and columns are among the objects that can carry one. Only one comment string is stored for each object."}
