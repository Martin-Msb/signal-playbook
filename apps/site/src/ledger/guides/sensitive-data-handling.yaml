sources:
  - {id: sensitive-data-handling-s1, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng/", kind: primary, vendor: false}
  - {id: sensitive-data-handling-s2, title: "European Data Protection Board: Guidelines 01/2025 on Pseudonymisation", url: "https://www.edpb.europa.eu/documents/guideline/guidelines-012025-on-pseudonymisation_en", kind: primary, vendor: false}
  - {id: sensitive-data-handling-s3, title: "Google Cloud documentation: Best practices for using policy tags in BigQuery", url: "https://cloud.google.com/bigquery/docs/best-practices-policy-tags", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s4, title: "Google Cloud documentation: Mask column data", url: "https://cloud.google.com/bigquery/docs/column-data-masking", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s5, title: "Google Cloud documentation: Transformation reference for Sensitive Data Protection", url: "https://cloud.google.com/sensitive-data-protection/docs/transformations-reference", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s6, title: "Google Cloud documentation: Pseudonymization for Sensitive Data Protection", url: "https://cloud.google.com/sensitive-data-protection/docs/pseudonymization", kind: primary, vendor: true}
claims:
  - {id: sensitive-data-handling-purpose, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-25", text: "The GDPR requires personal data to be collected for specified, explicit and legitimate purposes and not further processed incompatibly; to be adequate, relevant and limited to what is necessary; and to be kept in identifiable form no longer than necessary for its purposes."}
  - {id: sensitive-data-handling-erasure, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-25", text: "Under GDPR Article 17, a person has the right to obtain erasure without undue delay when specified grounds apply, including when data are no longer necessary for their purposes. The right has exceptions, including processing required by law or for legal claims. Where a controller made data public, it must take reasonable steps to inform other controllers processing it about the erasure request."}
  - {id: sensitive-data-handling-design, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-25", text: "GDPR Article 25 requires controllers to implement appropriate technical and organisational measures, such as pseudonymisation, designed to implement data protection principles effectively and integrate safeguards into processing."}
  - {id: sensitive-data-handling-tags, class: B, sources: [sensitive-data-handling-s3], verified: "2026-11-25", text: "BigQuery policy tags can classify columns and enforce column-level access control and dynamic data masking. A data class can be applied to multiple columns through a policy tag."}
  - {id: sensitive-data-handling-masking, class: B, sources: [sensitive-data-handling-s4], verified: "2026-11-25", text: "BigQuery data masking can selectively obscure column values for user groups while still allowing access to the column; results can be unmasked, masked or denied according to policy and role."}
  - {id: sensitive-data-handling-tokenisation, class: B, sources: [sensitive-data-handling-s5, sensitive-data-handling-s6], verified: "2026-11-25", text: "Google Sensitive Data Protection describes masking as replacing characters with surrogate characters and crypto-based tokenisation as encrypting an original sensitive value with a cryptographic key. Its pseudonymisation documentation describes replacing sensitive values with cryptographically generated tokens, with one-way or reversible token options."}
  - {id: sensitive-data-handling-pseudonymised, class: A, sources: [sensitive-data-handling-s2], verified: "2026-11-25", text: "The EDPB explains that pseudonymisation reduces the linkability of data to a person without aiming to cut the link completely. Pseudonymised data that can be attributed to a person using additional information remains personal data."}
