claims:
  - {id: features-in-production-skew, class: A, sources: [features-in-production-s1], verified: "2026-11-27", text: "Google's Rules of Machine Learning define training-serving skew as a difference between performance during training and performance during serving. It can be caused by a discrepancy between how data is handled in the training and serving pipelines, a change in the data between training and serving, or a feedback loop between the model and the algorithm. The best solution is to explicitly monitor it so that system and data changes do not introduce skew unnoticed."}
  - {id: features-in-production-reuse-code, class: B, sources: [features-in-production-s1], verified: "2026-11-27", text: "Rule 32 of Google's Rules of Machine Learning is to re-use code between the training pipeline and the serving pipeline whenever possible. Batch processing is different from online processing: in online processing each request is handled as it arrives, whereas in batch processing tasks can be combined, for example by making a join. Serving is online processing and training is a batch processing task. Running a common method in both eliminates a source of training-serving skew, and the rule advises against using two different programming languages between training and serving."}
  - {id: features-in-production-table-changes, class: A, sources: [features-in-production-s1], verified: "2026-11-27", text: "Rule 31 of Google's Rules of Machine Learning warns that if data is joined from a table at training and serving time, the data in the table may change, so the model's prediction for the same item may differ between training and serving. The easiest way to avoid this is to log features at serving time. A slowly changing table can also be snapshotted hourly or daily to get reasonably close data, which still does not completely resolve the issue."}
  - {id: features-in-production-log-features, class: B, sources: [features-in-production-s1], verified: "2026-11-27", text: "Rule 29 of Google's Rules of Machine Learning states that the best way to make sure that you train like you serve is to save the set of features used at serving time, and then pipe those features to a log to use them at training time. Even if this cannot be done for every example, doing it for a small fraction allows the consistency between serving and training to be verified."}
  - {id: features-in-production-same-result, class: A, sources: [features-in-production-s1], verified: "2026-11-27", text: "Rule 37 of Google's Rules of Machine Learning is to measure training-serving skew. If a model is applied to an example in the training data and to the same example at serving, it should give exactly the same result, so a difference between performance on next-day data and on live data probably indicates an engineering error. Rule 5 adds that the model in the training environment should give the same score as the model in the serving environment."}
  - {id: features-in-production-stale, class: B, sources: [features-in-production-s1], verified: "2026-11-27", text: "Rule 10 of Google's Rules of Machine Learning is to watch for silent failures. If a table that is being joined is no longer being updated, the machine learning system will adjust and behaviour will continue to be reasonably good, decaying gradually. Tracking statistics of the data, and manually inspecting the data on occasion, reduces these kinds of failures."}
  - {id: features-in-production-store, class: B, sources: [features-in-production-s3, features-in-production-s5], verified: "2026-11-27", text: "In Feast, the registry persists feature definitions that are registered with the feature store, and the user or CI publishes version controlled feature definitions with feast apply. An offline store is an interface for working with historical time-series feature values. Offline stores are primarily used for building training datasets from time-series features and for materialising features into an online store to serve them at low latency in production."}
  - {id: features-in-production-feature-view, class: B, sources: [features-in-production-s6], verified: "2026-11-27", text: "A Feast feature view is an object representing a logical group of time-series feature data as it is found in a data source. On demand feature views, marked alpha, let users define Python transformation logic which is executed in both the historical retrieval and online retrieval paths."}
  - {id: features-in-production-point-in-time, class: A, sources: [features-in-production-s2, features-in-production-s3], verified: "2026-11-27", text: "Feast joins features from one or more feature views onto an entity dataframe in a point-in-time correct way, which means it is able to reproduce the state of features at a specific point in the past. The timestamps in the entity dataframe are the events at which the state of the world is reproduced. For each row, Feast scans backward in time from the entity dataframe timestamp up to a maximum of the TTL specified, and the TTL is relative to each timestamp in the entity dataframe, not to the time the query runs. Feast exports a point-in-time correct training dataset to the model training pipeline."}
  - {id: features-in-production-online-latest, class: A, sources: [features-in-production-s4, features-in-production-s3], verified: "2026-11-27", text: "Feast uses online stores to serve features at low latency. Feature values are loaded from data sources into the online store through materialisation. For each entity key only the latest feature values are stored, and no historical values are stored. At prediction time the online serving service retrieves the latest feature values from the online store and returns them to the model serving service."}
  - {id: features-in-production-created-time, class: B, sources: [features-in-production-s2], verified: "2026-11-27", text: "By default, Feast point-in-time joins only constrain the feature's event timestamp, so a value that was backfilled or corrected after an entity dataframe timestamp can still be returned for it. Passing filter_by_created_timestamp=True adds a condition that the created timestamp is at or before the entity timestamp. Feast describes this as useful to keep backfilled values from leaking into training data and to reproduce what the online store would have served at each event time. Not all offline stores support the flag yet."}
  - {id: features-in-production-leakage, class: A, sources: [features-in-production-s10], verified: "2026-11-27", text: "Data leakage occurs when information that would not be available at prediction time is used when building the model. This results in overly optimistic performance estimates, for example from cross-validation, and thus poorer performance when the model is used on actually novel data, for example during production."}
  - {id: features-in-production-skew-detection, class: B, sources: [features-in-production-s8, features-in-production-s9], verified: "2026-11-27", text: "TensorFlow Data Validation can detect training-serving skew by comparing examples in training and serving data. Distribution skew occurs when the distribution of feature values for training data is significantly different from serving data. A skew comparator on a feature sets a threshold, as an L-infinity norm for categorical features or a Jensen-Shannon divergence for numeric and categorical features, and a difference above it is reported as a skew anomaly."}
  - {id: features-in-production-permissions, class: B, sources: [features-in-production-s7], verified: "2026-11-27", text: "The Feast permissions model configures granular permission policies on the resources defined in a feature store. Its actions include read_online, to read the online store, and read_offline, to read the offline store, and a role-based policy grants or denies the requested actions using the user's roles. Enforcement is performed when requests are executed through the Feast online feature server, offline feature server or registry server, and there is no permission enforcement when accessing the Feast API with a local provider. Resources that do not match any configured permission are not secured by any authorisation policy."}
