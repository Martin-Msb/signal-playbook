claims:
  - {id: replication-and-sharding-together, class: A, sources: [replication-and-sharding-s1], verified: "2026-11-25", text: "Database servers can work together to allow a second server to take over quickly if the primary server fails (high availability), or to allow several computers to serve the same data (load balancing). A write to any server has to be propagated to all servers so that future read requests to those servers return consistent results."}
  - {id: replication-and-sharding-vertical, class: A, sources: [replication-and-sharding-s7], verified: "2026-11-25", text: "Vertical scaling increases the capacity of a single server, and available technology and cloud provider hardware configurations impose a practical maximum for it. Horizontal scaling divides the dataset and load over multiple servers, adding more servers to increase capacity as required, at the cost of increased complexity in infrastructure and maintenance."}
  - {id: replication-and-sharding-leader, class: A, sources: [replication-and-sharding-s5, replication-and-sharding-s6], verified: "2026-11-25", text: "Under non-failure conditions each partition in Kafka has a single leader and zero or more followers. All writes go to the leader, reads can go to the leader or the followers of the partition, and followers consume messages from the leader and apply them to their own log. In a MongoDB replica set the primary node receives all write operations and the secondaries replicate the primary's oplog and apply the operations to their data sets."}
  - {id: replication-and-sharding-failover, class: A, sources: [replication-and-sharding-s3, replication-and-sharding-s6], verified: "2026-11-25", text: "If the PostgreSQL primary server fails, the standby server should begin failover procedures. PostgreSQL does not provide the system software required to identify a failure on the primary and notify the standby, and a mechanism must inform a restarted old primary that it is no longer the primary, to avoid both systems thinking they are the primary. In MongoDB, if the primary is unavailable, an eligible secondary holds an election to select a new primary."}
  - {id: replication-and-sharding-async, class: A, sources: [replication-and-sharding-s2], verified: "2026-11-25", text: "PostgreSQL streaming replication is asynchronous by default, in which case there is a small delay between committing a transaction in the primary and the changes becoming visible in the standby. Because WAL records are shipped after transaction commit, there is a window for data loss should the primary suffer a catastrophic failure: transactions not yet shipped will be lost."}
  - {id: replication-and-sharding-stale, class: A, sources: [replication-and-sharding-s4, replication-and-sharding-s6], verified: "2026-11-25", text: "Connections to a PostgreSQL hot standby are strictly read-only. Running the same query nearly simultaneously on both primary and standby might return differing results, and the data on the standby is said to be eventually consistent with the primary. In MongoDB, asynchronous replication to secondaries means that reads from secondaries may return data that does not reflect the state of the data on the primary."}
  - {id: replication-and-sharding-sync, class: A, sources: [replication-and-sharding-s2], verified: "2026-11-25", text: "With PostgreSQL synchronous replication the application does not receive explicit acknowledgment of a successful commit until the WAL data is known to be safely received by all the synchronous standbys. Each commit of a write transaction waits until confirmation is received. The method ANY specifies quorum-based synchronous replication: commits wait until their WAL records are replicated to at least the requested number of synchronous standbys in the list."}
  - {id: replication-and-sharding-quorum, class: A, sources: [replication-and-sharding-s8, replication-and-sharding-s9], verified: "2026-11-25", text: "In Dynamo each data item is replicated at N hosts, R is the minimum number of nodes that must participate in a successful read and W the minimum for a successful write, and setting R and W such that R + W > N yields a quorum-like system. Cassandra supports a per-operation tradeoff between consistency and availability through consistency levels: QUORUM needs a majority of the replicas to respond, which is at least 2 of 3 replicas at a replication factor of 3, and with QUORUM for both reads and writes the quorums overlap and the write is visible to the read."}
  - {id: replication-and-sharding-majority, class: A, sources: [replication-and-sharding-s5], verified: "2026-11-25", text: "With a majority vote, tolerating one failure requires three copies of the data, and tolerating two failures requires five copies. Kafka instead tracks a set of in-sync replicas: a write is not considered committed until all in-sync replicas have received it, and with f+1 replicas a topic can tolerate f failures without losing committed messages."}
  - {id: replication-and-sharding-sharding, class: A, sources: [replication-and-sharding-s7], verified: "2026-11-25", text: "Sharding is a method for distributing data across multiple machines. MongoDB uses the shard key, a field or multiple fields in the documents, to distribute a collection's documents across shards. Each shard must be deployed as a replica set, and the mongos acts as a query router between client applications and the sharded cluster. Hashed sharding computes a hash of the shard key field's value, and ranged sharding divides data into ranges based on the shard key values."}
  - {id: replication-and-sharding-scatter, class: A, sources: [replication-and-sharding-s7], verified: "2026-11-25", text: "If queries do not include the shard key or the prefix of a compound shard key, mongos performs a broadcast operation, querying all shards in the sharded cluster. These scatter/gather queries can be long running operations."}
  - {id: replication-and-sharding-ring, class: A, sources: [replication-and-sharding-s8, replication-and-sharding-s9], verified: "2026-11-25", text: "In consistent hashing the output range of a hash function is treated as a fixed circular space or ring. Each node is assigned a position on the ring, and a data item is assigned to a node by hashing its key to a position and walking the ring clockwise to the first node with a larger position. The principal advantage is that the departure or arrival of a node only affects its immediate neighbours. Cassandra partitions data over storage nodes with consistent hashing, which only has to move a small fraction of the keys when the number of nodes changes, where naive hashing might invalidate almost all of the mappings."}
  - {id: replication-and-sharding-levels, class: B, sources: [replication-and-sharding-s10, replication-and-sharding-s11], verified: "2026-11-25", flags: [vendor-stated], text: "DynamoDB offers eventually consistent reads, the default, whose responses might not reflect the results of a recently completed write, and strongly consistent reads, which return the most up-to-date data. Azure Cosmos DB offers five levels, from strongest to weakest: strong, bounded staleness, session, consistent prefix and eventual. Its documentation states that strong consistency offers a linearizability guarantee, increases write latencies and reduces availability during failures, and that eventual consistency offers higher availability and better performance."}
  - {id: replication-and-sharding-recovery, class: B, sources: [replication-and-sharding-s12], verified: "2026-11-25", text: "NIST SP 800-34 Rev. 1 states that contingency strategies for high-impact information systems should consider high-availability and redundancy options in their design, and that options may include fully redundant load balanced systems at alternate sites, data mirroring, and offsite database replication."}
  - {id: replication-and-sharding-residency, class: B, sources: [replication-and-sharding-s9, replication-and-sharding-s13, replication-and-sharding-s14], verified: "2026-11-25", flags: [vendor-stated], text: "Cassandra's NetworkTopologyStrategy requires a specified replication factor for each datacenter in the cluster. AWS states that the customer chooses the AWS Regions in which content is stored, can replicate content in more than one Region, and that AWS will not move or replicate content outside the chosen Regions without the customer's agreement. CockroachDB's documentation calls keeping specific data on servers in specific geographic locations data domiciling."}
  - {id: replication-and-sharding-transfers, class: B, sources: [replication-and-sharding-s15], verified: "2026-11-25", text: "The European Data Protection Board states that the GDPR imposes restrictions on the transfer of personal data outside the EEA, and that such data may only be transferred outside the EEA in compliance with conditions."}
