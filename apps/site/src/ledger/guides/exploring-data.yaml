claims:
  - {id: exploring-data-eda, class: A, sources: [exploring-data-s1], verified: "2026-11-27", text: "Exploratory data analysis is an approach to data analysis that employs a variety of techniques, mostly graphical, to maximise insight into a data set, uncover underlying structure, and detect outliers and anomalies."}
  - {id: exploring-data-look-first, class: B, sources: [exploring-data-s6], verified: "2026-11-27", text: "Graphs can help find anomalies or patterns hiding in the data, so the data should be looked at graphically, as scatter plots or histograms, before getting far into analysis. Outliers often cause problems in model training, so finding outliers is important."}
  - {id: exploring-data-histogram, class: A, sources: [exploring-data-s2], verified: "2026-11-27", text: "A histogram graphically summarises the distribution of a univariate data set. It shows the centre, the spread and the skewness of the data, the presence of outliers and the presence of multiple modes."}
  - {id: exploring-data-describe, class: B, sources: [exploring-data-s8], verified: "2026-11-27", text: "pandas DataFrame.describe summarises the central tendency, dispersion and shape of each analysed column's distribution, excluding NaN values. For numeric columns the result includes count, mean, std, min, max and percentiles, and the 50th percentile is the same as the median."}
  - {id: exploring-data-incomplete, class: A, sources: [exploring-data-s5], verified: "2026-11-27", text: "Quantitative statistics are not wrong per se, but they are incomplete: they reduce the data to a few numbers and filter out other, sometimes crucial, information. Four data sets with identical quantitative summaries look clearly different when plotted."}
  - {id: exploring-data-outlier, class: A, sources: [exploring-data-s4], verified: "2026-11-27", text: "An outlier is an observation that lies an abnormal distance from other values in a random sample from a population."}
  - {id: exploring-data-fences, class: A, sources: [exploring-data-s4], verified: "2026-11-27", text: "The inner fences lie 1.5 times the interquartile range below the lower quartile and above the upper quartile, and the outer fences lie 3 times that range beyond them. A point beyond an inner fence is considered a mild outlier and a point beyond an outer fence an extreme outlier."}
  - {id: exploring-data-investigate, class: A, sources: [exploring-data-s4], verified: "2026-11-27", text: "Outliers should be investigated carefully. They often contain valuable information about the process under investigation or the data gathering and recording process, and they are often bad data points. Before considering their elimination, one should try to understand why they appeared and whether similar values are likely to continue to appear."}
  - {id: exploring-data-missing, class: A, sources: [exploring-data-s10], verified: "2026-11-27", text: "Many real world datasets contain missing values, often encoded as blanks, NaNs or other placeholders. Discarding entire rows or columns that contain missing values comes at the price of losing data which may be valuable."}
  - {id: exploring-data-impute, class: B, sources: [exploring-data-s10], verified: "2026-11-27", text: "Imputing missing values means inferring them from the known part of the data. The scikit-learn MissingIndicator transformer produces a binary matrix indicating the presence of missing values in a dataset."}
  - {id: exploring-data-gaps, class: A, sources: [exploring-data-s7], verified: "2026-11-27", text: "If a dataset has features with missing values for a large number of examples, that could be an indicator that certain key characteristics of the dataset are under-represented. A thorough review is needed to rule out other explanations before assuming data gaps are random."}
  - {id: exploring-data-skew, class: A, sources: [exploring-data-s7], verified: "2026-11-27", text: "Any sort of skew in the data, where certain groups or characteristics may be under-represented or over-represented relative to their real-world prevalence, can introduce bias into a model."}
  - {id: exploring-data-scatter, class: A, sources: [exploring-data-s3], verified: "2026-11-27", text: "A scatter plot can answer whether two variables are related, whether they are linearly or non-linearly related, whether the variation in one changes depending on the other, and whether there are outliers."}
  - {id: exploring-data-causality, class: A, sources: [exploring-data-s3], verified: "2026-11-27", text: "Association does not imply causality. A scatter plot can never prove cause and effect."}
  - {id: exploring-data-corr, class: B, sources: [exploring-data-s9], verified: "2026-11-27", text: "pandas DataFrame.corr computes the pairwise correlation of columns, excluding NA and null values. Pearson, the standard correlation coefficient, is the default, and the Kendall Tau and Spearman rank correlations are also supported."}
  - {id: exploring-data-profiling, class: B, sources: [exploring-data-s11], verified: "2026-11-27", flags: [vendor-stated], text: "ydata-profiling is a package for data profiling that automates and standardises the generation of detailed reports with statistics and visualisations, and helps identify missing data, duplicate entries and outliers."}
