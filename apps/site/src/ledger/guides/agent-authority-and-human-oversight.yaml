claims:
  - {id: agent-authority-and-human-oversight-excessive-agency, class: A, sources: [agent-authority-and-human-oversight-s1], verified: "2026-11-27", text: "OWASP defines excessive agency as the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM. It names three root causes: excessive functionality, excessive permissions and excessive autonomy."}
  - {id: agent-authority-and-human-oversight-autonomy-cost, class: B, sources: [agent-authority-and-human-oversight-s10], verified: "2026-11-27", text: "Anthropic states that the autonomous nature of agents means higher costs and the potential for compounding errors, and recommends extensive testing in sandboxed environments along with the appropriate guardrails."}
  - {id: agent-authority-and-human-oversight-least-privilege, class: A, sources: [agent-authority-and-human-oversight-s4], verified: "2026-11-27", text: "Least privilege is the principle that a security architecture is designed so that each entity is granted the minimum system authorisations and resources needed to carry out its role."}
  - {id: agent-authority-and-human-oversight-minimise, class: B, sources: [agent-authority-and-human-oversight-s1], verified: "2026-11-27", text: "OWASP's mitigations for excessive agency limit the extensions an agent may call to the minimum necessary, limit each extension's functions and permissions, and act on downstream systems in the user's context with the narrowest scope. Its example is a mail-summarising extension that reads mail and cannot delete or send it."}
  - {id: agent-authority-and-human-oversight-tool-profiles, class: B, sources: [agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "The OWASP Top 10 for Agentic Applications advises per-tool least-privilege profiles covering scopes, maximum rate and egress allowlists, short-lived and narrowly scoped tokens issued per task, and temporary credentials that expire immediately after use."}
  - {id: agent-authority-and-human-oversight-least-agency, class: B, sources: [agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "The OWASP Top 10 for Agentic Applications extends least privilege and excessive agency with least agency: avoid unnecessary autonomy, because deploying agentic behaviour where it is not needed expands the attack surface without adding value."}
  - {id: agent-authority-and-human-oversight-mediation, class: A, sources: [agent-authority-and-human-oversight-s1, agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "OWASP calls for complete mediation: authorisation is enforced in downstream systems rather than left to the LLM to decide. Its agentic list treats LLM or planner outputs as untrusted and places a policy enforcement point before execution that validates intent and arguments and enforces schemas and rate limits."}
  - {id: agent-authority-and-human-oversight-permission-order, class: B, sources: [agent-authority-and-human-oversight-s9], verified: "2026-11-27", text: "In the Claude Agent SDK a requested tool call is checked in order by hooks, deny rules, ask rules, the permission mode, allow rules and the canUseTool callback. A matching deny rule denies the call even in bypassPermissions mode, and a matching ask rule sends the call to the callback for confirmation."}
  - {id: agent-authority-and-human-oversight-dual-split, class: B, sources: [agent-authority-and-human-oversight-s7], verified: "2026-11-27", text: "In the dual LLM pattern the privileged model accepts input from trusted sources and acts on it, the quarantined model handles untrusted content and has no access to tools, and the controller that executes actions on behalf of the privileged model is regular software, not a language model."}
  - {id: agent-authority-and-human-oversight-camel, class: B, sources: [agent-authority-and-human-oversight-s8], verified: "2026-11-27", text: "CaMeL places a protective system layer around the LLM. It separates the control and data flows taken from the trusted query, so untrusted retrieved data cannot change the program flow, and it uses capabilities to enforce security policies when tools are called."}
  - {id: agent-authority-and-human-oversight-approval, class: B, sources: [agent-authority-and-human-oversight-s2, agent-authority-and-human-oversight-s1], verified: "2026-11-27", text: "The OWASP Top 10 for Agentic Applications requires human confirmation for high-impact or destructive actions such as delete, transfer and publish, with a pre-execution plan or dry-run diff shown before approval, and human approval for high-privilege, irreversible or goal-changing actions. OWASP's excessive agency entry requires user approval of high-impact actions."}
  - {id: agent-authority-and-human-oversight-rule-of-two, class: B, sources: [agent-authority-and-human-oversight-s5], verified: "2026-11-27", text: "Meta's Agents Rule of Two states that, until robustness research allows prompt injection to be reliably detected and refused, an agent must satisfy no more than two of three properties within a session: processing untrustworthy inputs, access to sensitive systems or private data, and changing state or communicating externally. An agent that needs all three without starting a new session should not operate autonomously and at a minimum requires supervision, through human-in-the-loop approval or another reliable means of validation."}
  - {id: agent-authority-and-human-oversight-trifecta, class: B, sources: [agent-authority-and-human-oversight-s6], verified: "2026-11-27", text: "The lethal trifecta is the combination of access to private data, exposure to untrusted content and the ability to communicate externally in a way that could be used to steal data. Simon Willison, who named it, states that an attacker can easily trick an agent that combines the three into accessing private data."}
  - {id: agent-authority-and-human-oversight-checkpoints, class: B, sources: [agent-authority-and-human-oversight-s10], verified: "2026-11-27", text: "Anthropic describes agents that pause for human feedback at checkpoints or when encountering blockers, and stopping conditions such as a maximum number of iterations to maintain control."}
  - {id: agent-authority-and-human-oversight-trust-exploitation, class: B, sources: [agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "The OWASP entry Human-Agent Trust Exploitation states that the risk is amplified when humans over-rely on autonomous recommendations or unverifiable rationales and approve actions without independent validation. One of its scenarios is a finance copilot that ingests a poisoned invoice and suggests an urgent payment, which the finance manager approves."}
  - {id: agent-authority-and-human-oversight-rule-limits, class: B, sources: [agent-authority-and-human-oversight-s5], verified: "2026-11-27", text: "Meta states that the Rule of Two is not sufficient against other threat vectors common to agents, that it supplements security principles such as least privilege, and that a design which satisfies it can still fail, for example when a user blindly confirms a warning."}
  - {id: agent-authority-and-human-oversight-owasp-agentic, class: C, sources: [agent-authority-and-human-oversight-s3, agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "OWASP published the Top 10 for Agentic Applications 2026 on 9 December 2025. Its entries include Agent Goal Hijack, Tool Misuse and Exploitation, Identity and Privilege Abuse, Human-Agent Trust Exploitation and Rogue Agents."}
  - {id: agent-authority-and-human-oversight-limit-damage, class: B, sources: [agent-authority-and-human-oversight-s1, agent-authority-and-human-oversight-s2], verified: "2026-11-27", text: "OWASP states that logging and monitoring and rate limiting do not prevent excessive agency but limit the damage. Its agentic list adds immutable logs of all tool invocations and usage ceilings with automatic revocation or throttling when exceeded."}
  - {id: agent-authority-and-human-oversight-eu-oversight, class: C, sources: [agent-authority-and-human-oversight-s11], verified: "2026-11-27", text: "In the consolidated text of the EU Artificial Intelligence Act dated 27 July 2026, Article 14 requires high-risk AI systems to be designed so that they can be effectively overseen by natural persons during the period in which they are in use. Oversight measures are commensurate with the risks, level of autonomy and context of use, and the persons assigned to oversight are enabled to remain aware of the tendency to over-rely on the output, to decide not to use the system, and to intervene or interrupt it through a stop button."}
