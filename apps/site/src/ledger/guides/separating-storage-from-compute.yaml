claims:
  - {id: separating-storage-from-compute-coupled, class: A, sources: [separating-storage-from-compute-s1], verified: "2026-11-25", text: "Dremel first ran on shared-nothing servers, each keeping a disjoint subset of the data on local disks. Storing replicated data on local disks meant that storage and processing were coupled: the serving system could not be resized without shifting data around, and scaling storage required adding servers and scaling CPU as well."}
  - {id: separating-storage-from-compute-decoupled, class: A, sources: [separating-storage-from-compute-s1], verified: "2026-11-25", text: "The industry has converged on an architecture that uses elastic compute services to analyze data in cloud storage. This architecture decouples compute from storage, so each can scale independently."}
  - {id: separating-storage-from-compute-objects, class: A, sources: [separating-storage-from-compute-s2], verified: "2026-11-25", text: "Amazon S3 is an object storage service that stores data as objects within buckets. An object is a file and any metadata that describes the file, a bucket is a container for objects, and each object has a key, which is the unique identifier for the object within the bucket."}
  - {id: separating-storage-from-compute-zones, class: B, sources: [separating-storage-from-compute-s3], verified: "2026-11-25", flags: [vendor-stated], text: "S3 Standard and five other S3 storage classes redundantly store objects on multiple devices across a minimum of three Availability Zones in an AWS Region, and are designed to sustain data in the event of the loss of an entire Availability Zone."}
  - {id: separating-storage-from-compute-s3-api, class: B, sources: [separating-storage-from-compute-s4, separating-storage-from-compute-s5, separating-storage-from-compute-s6], verified: "2026-11-25", text: "Ceph supports a RESTful API that is compatible with the basic data access model of the Amazon S3 API. Cloudflare R2 implements the S3 API. Trino includes a native implementation to access Amazon S3 and compatible storage systems with its Delta Lake, Hive, Hudi and Iceberg connectors, and states that only AWS S3 and MinIO are tested for compatibility."}
  - {id: separating-storage-from-compute-central, class: A, sources: [separating-storage-from-compute-s7], verified: "2026-11-25", text: "Snowflake uses a central data repository for persisted data that is accessible from all compute nodes in the platform. Each virtual warehouse is an independent compute cluster that does not share compute resources with other virtual warehouses, so it has no effect on their performance."}
  - {id: separating-storage-from-compute-on-demand, class: B, sources: [separating-storage-from-compute-s8], verified: "2026-11-25", text: "Snowflake warehouses can be started and stopped at any time and resized at any time, even while running. With auto-suspend, Snowflake automatically suspends a warehouse that is inactive for the specified period of time."}
  - {id: separating-storage-from-compute-per-second, class: C, sources: [separating-storage-from-compute-s8], verified: "2026-11-25", text: "Snowflake uses per-second billing for warehouses, with a 60-second minimum each time the warehouse starts."}
  - {id: separating-storage-from-compute-billing, class: B, sources: [separating-storage-from-compute-s9, separating-storage-from-compute-s12], verified: "2026-11-25", text: "The total cost of using Snowflake is the aggregate of the cost of data transfer, storage and compute resources: storage is charged at a flat rate per terabyte, and warehouses are billed only for the credits they consume when they are actively working. The BigQuery pricing model charges for compute and storage separately."}
  - {id: separating-storage-from-compute-elastic, class: B, sources: [separating-storage-from-compute-s10], verified: "2026-11-25", text: "In the auto-scale mode of a Snowflake multi-cluster warehouse, Snowflake starts and stops clusters as needed to dynamically manage the load on the warehouse."}
  - {id: separating-storage-from-compute-bigquery, class: B, sources: [separating-storage-from-compute-s12], verified: "2026-11-25", text: "One of the key features of BigQuery's architecture is the separation of storage and compute, which allows BigQuery to scale both storage and compute independently, based on demand."}
  - {id: separating-storage-from-compute-serverless, class: B, sources: [separating-storage-from-compute-s13, separating-storage-from-compute-s1], verified: "2026-11-25", text: "Amazon Athena is an interactive query service that analyses data directly in Amazon S3 using standard SQL. Athena is serverless, so there is no infrastructure to set up or manage, and you pay only for the queries you run. The Dremel authors describe serverless computing as on-demand resources offered as an alternative to provisioned resources."}
  - {id: separating-storage-from-compute-latency, class: A, sources: [separating-storage-from-compute-s1], verified: "2026-11-25", text: "When Dremel moved to disaggregated storage, the obvious blocking issue was data access latency, and the first experiment showed an order-of-magnitude performance degradation. It took fine-tuning of the storage format, metadata representation, query affinity and prefetching, after which Dremel on disaggregated storage outperformed the local-disk based system for typical workloads."}
  - {id: separating-storage-from-compute-cache, class: B, sources: [separating-storage-from-compute-s11], verified: "2026-11-25", text: "Each Snowflake warehouse, when running, maintains a cache of table data accessed as queries are processed. This cache is dropped when the warehouse is suspended, which might result in slower initial performance for some queries after the warehouse is resumed."}
  - {id: separating-storage-from-compute-encryption, class: C, sources: [separating-storage-from-compute-s14], verified: "2026-11-25", text: "Amazon S3 applies server-side encryption with Amazon S3 managed keys (SSE-S3) as the base level of encryption for every bucket. Starting January 5, 2023, all new object uploads to Amazon S3 are automatically encrypted."}
  - {id: separating-storage-from-compute-logging, class: B, sources: [separating-storage-from-compute-s15], verified: "2026-11-25", text: "Actions taken by users, roles or AWS services on Amazon S3 resources can be recorded for auditing and compliance with server access logging, AWS CloudTrail logging, or both. Both record object operations made through the Amazon S3 APIs."}
  - {id: separating-storage-from-compute-retention, class: B, sources: [separating-storage-from-compute-s16, separating-storage-from-compute-s17], verified: "2026-11-25", text: "S3 Object Lock uses a write-once-read-many model and can prevent objects from being deleted or overwritten for a retention period. An S3 Lifecycle expiration action defines when objects expire, and Amazon S3 deletes expired objects."}
  - {id: separating-storage-from-compute-private, class: B, sources: [separating-storage-from-compute-s2], verified: "2026-11-25", text: "Amazon S3 buckets and the objects in them are private and can be accessed only if access permissions are explicitly granted, through bucket policies, IAM policies, access control lists and S3 Access Points."}
