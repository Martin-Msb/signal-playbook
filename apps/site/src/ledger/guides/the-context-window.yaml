sources:
  - {id: the-context-window-s1, title: "Anthropic: Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows", kind: primary, vendor: true}
  - {id: the-context-window-s2, title: "Anthropic: Prompt caching", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", kind: primary, vendor: true}
  - {id: the-context-window-s3, title: "European Union: General Data Protection Regulation, consolidated text", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng/", kind: primary, vendor: false}
claims:
  - {id: the-context-window-contents, class: B, sources: [the-context-window-s1], verified: "2026-11-26", flags: [vendor-stated], text: "Anthropic defines the context window as the text a model can reference when generating a response, including the response itself. In its Messages API, system prompts, messages, tool definitions, tool results and generated output count toward the context window."}
  - {id: the-context-window-history, class: B, sources: [the-context-window-s1], verified: "2026-11-26", flags: [vendor-stated], text: "In the Anthropic Messages API, each turn's input contains previous conversation history and the current user message, and the generated response becomes part of a later turn's input."}
  - {id: the-context-window-interface, class: B, sources: [the-context-window-s1], verified: "2026-11-26", flags: [vendor-stated], text: "Anthropic states that chat interfaces such as claude.ai can manage context on a rolling first-in, first-out basis."}
  - {id: the-context-window-cache, class: B, sources: [the-context-window-s1, the-context-window-s2], verified: "2026-11-26", flags: [vendor-stated], text: "Anthropic says prompt caching can reduce processing time and costs by reusing consistent prompt prefixes. Cached prompt prefixes still occupy the context window."}
  - {id: the-context-window-rot, class: B, sources: [the-context-window-s1], verified: "2026-11-26", flags: [vendor-stated], text: "Anthropic states that accuracy and recall can degrade as token count grows, a phenomenon it calls context rot, and recommends curating context as well as considering context window capacity."}
  - {id: the-context-window-gdpr, class: A, sources: [the-context-window-s3], verified: "2026-11-26", text: "EU GDPR Article 5(1)(c) requires personal data to be adequate, relevant and limited to what is necessary for its purposes. Article 5(1)(e) requires personal data to be kept in identifiable form no longer than necessary for its purposes."}
