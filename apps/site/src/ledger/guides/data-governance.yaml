claims:
  - {id: data-governance-ownership, class: A, sources: [data-governance-s1], verified: "2026-11-25", text: "Data ownership does not deal with possession of data. It is about formalising the roles of people responsible for the management of data throughout its life cycle, and it establishes accountability for data access and usage. The lack of a shared understanding of roles, accountabilities and responsibilities prevents effective data sharing and reuse."}
  - {id: data-governance-owner, class: A, sources: [data-governance-s1], verified: "2026-11-25", text: "A data owner is a senior individual with dedicated accountabilities for data. Data owners are accountable for assets, making decisions on major changes and being answerable for them. Their accountabilities include understanding how their data is being used, who by and where, limiting access to data to those authorised to do so, and ensuring an appropriate retention schedule is in place."}
  - {id: data-governance-steward, class: A, sources: [data-governance-s1], verified: "2026-11-25", text: "Data stewards are responsible for day-to-day operational activities in their data domain that support data owners' decisions, and for implementing policies, standards and processes. Data custodians are responsible for capturing, storing and disposing of data in line with the data owner's requirements, and they implement user access policies specified by the data owner."}
  - {id: data-governance-named-owner, class: C, sources: [data-governance-s2, data-governance-s1], verified: "2026-11-25", text: "The UK government's data asset management policy, published on 27 May 2026, states that all identified data assets must have a named data owner, so that an appropriate individual is accountable for making decisions about the data. The data ownership model it refers to was published on 16 April 2026."}
  - {id: data-governance-classification, class: B, sources: [data-governance-s3], verified: "2026-11-25", text: "In the UK Government Security Classifications Policy, a classification indicates the sensitivity of information in terms of the likely impact resulting from compromise, loss or misuse, and each tier provides a minimum set of security controls and baseline behaviours. The three classification tiers are OFFICIAL, SECRET and TOP SECRET."}
  - {id: data-governance-column-labels, class: B, sources: [data-governance-s8, data-governance-s9], verified: "2026-11-25", text: "Snowflake's sensitive data classification assigns every column identified as containing sensitive data a semantic category and a privacy category, recorded as tags on the column. In BigQuery's documentation a data steward creates a taxonomy of policy tags and assigns a policy tag to specific table columns."}
  - {id: data-governance-label-policy, class: B, sources: [data-governance-s6, data-governance-s9], verified: "2026-11-25", text: "A Snowflake tag-based masking policy sets a masking policy on a tag, and a tagged column is automatically protected by the conditions in the masking policy without a policy being applied to the column by hand. In BigQuery, when a user tries to access column data at query time, BigQuery checks the column policy tag and its policy to see whether the user is authorised."}
  - {id: data-governance-policy-as-code, class: A, sources: [data-governance-s4], verified: "2026-11-25", text: "Open Policy Agent is an open source, general-purpose policy engine with a high-level declarative language, Rego, that lets you specify policy as code. OPA decouples policy decision-making from policy enforcement: software that needs a policy decision queries OPA and supplies structured data as input, and OPA generates the decision by evaluating the query input against policies and data."}
  - {id: data-governance-rego-default, class: A, sources: [data-governance-s5], verified: "2026-11-25", text: "In Rego the default keyword defines a default value for a rule, used when all the rules sharing the same name are undefined. The documentation's examples write default allow := false followed by allow if rules."}
  - {id: data-governance-propagation, class: B, sources: [data-governance-s7], verified: "2026-11-25", text: "Snowflake tag propagation automatically assigns a tag to target objects, such as a view or another table created from the source object, and ensures that any policies associated with the tags are applied to the targets. It is enabled by setting the PROPAGATE property on the tag, for object dependencies, data movement such as CREATE TABLE AS SELECT, or both."}
  - {id: data-governance-dmbok, class: B, sources: [data-governance-s11, data-governance-s10], verified: "2026-11-25", text: "The DAMA Wheel published by DAMA International places Data Governance at the centre, surrounded by Data Architecture, Data Modeling and Design, Data Storage and Operations, Data Security, Data Integration and Interoperability, Document and Content Management, Reference and Master Data, Data Warehousing and Business Intelligence, Metadata and Data Quality. DAMA states that the DAMA-DMBOK defines principles and best practices and does not prescribe specific tools, technologies or methodologies."}
  - {id: data-governance-dmbok-edition, class: C, sources: [data-governance-s11, data-governance-s10], verified: "2026-11-25", text: "DAMA International's approved citation is the DAMA-DMBOK second edition, revised, published by Technics Publications in 2024. DAMA states that the DAMA-DMBOK 3.0 project started in 2025."}
