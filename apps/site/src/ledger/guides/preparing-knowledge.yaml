  - {id: preparing-knowledge-s4, title: "Microsoft Learn: Chunk and vectorize by document layout, Foundry IQ (Azure AI Search)", url: "https://learn.microsoft.com/en-us/azure/search/search-how-to-semantic-chunking", kind: primary, vendor: true}
