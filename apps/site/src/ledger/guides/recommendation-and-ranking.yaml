sources:
  - {id: recommendation-and-ranking-s1, title: "Google for Developers: Recommendation systems overview", url: "https://developers.google.com/machine-learning/recommendation/overview/types", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s2, title: "Google for Developers: Collaborative filtering", url: "https://developers.google.com/machine-learning/recommendation/collaborative/basics", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s3, title: "Google for Developers: Scoring", url: "https://developers.google.com/machine-learning/recommendation/dnn/scoring", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s4, title: "Google for Developers: Re-ranking", url: "https://developers.google.com/machine-learning/recommendation/dnn/re-ranking", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s5, title: "TensorFlow Recommenders: Recommending movies, retrieval", url: "https://www.tensorflow.org/recommenders/examples/basic_retrieval", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s6, title: "Burges: From RankNet to LambdaRank to LambdaMART, An Overview", url: "https://www.microsoft.com/en-us/research/publication/from-ranknet-to-lambdarank-to-lambdamart-an-overview/", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s7, title: "LightGBM: Parameters", url: "https://lightgbm.readthedocs.io/en/stable/Parameters.html", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s8, title: "Google for Developers: Rules of Machine Learning", url: "https://developers.google.com/machine-learning/guides/rules-of-ml", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s9, title: "Chaney, Stewart and Engelhardt: How Algorithmic Confounding in Recommendation Systems Increases Homogeneity and Decreases Utility", url: "https://arxiv.org/abs/1710.11214", kind: primary, vendor: false}
  - {id: recommendation-and-ranking-s10, title: "EUR-Lex: Regulation (EU) 2022/2065, Digital Services Act", url: "https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng", kind: primary, vendor: false, note: "Status in force. The only consolidated version listed is dated 27 October 2022. Checked 27 November 2026."}
claims:
  - {id: recommendation-and-ranking-feedback, class: A, sources: [recommendation-and-ranking-s2, recommendation-and-ranking-s5], verified: "2026-11-27", text: "With explicit feedback users specify how much they liked an item by giving a numerical rating; with implicit feedback, if a user watches a movie the system infers that the user is interested. A retrieval tutorial that treats its data as implicit takes every movie a user watched as a positive example and every movie they have not seen as an implicit negative example."}
  - {id: recommendation-and-ranking-collaborative, class: A, sources: [recommendation-and-ranking-s2], verified: "2026-11-27", text: "Collaborative filtering uses similarities between users and items simultaneously to provide recommendations. Its training data is a feedback matrix, and the embeddings can be learned automatically, without relying on hand-engineering of features."}
  - {id: recommendation-and-ranking-stages, class: B, sources: [recommendation-and-ranking-s1, recommendation-and-ranking-s5], verified: "2026-11-27", text: "Candidate generation starts from a potentially huge corpus and generates a much smaller subset of candidates; another model then scores and ranks the candidates to select the items to show, and re-ranking takes additional constraints into account. TensorFlow Recommenders describes a retrieval stage that selects an initial set of hundreds of candidates and a ranking stage that selects the best possible handful."}
  - {id: recommendation-and-ranking-two-tower, class: B, sources: [recommendation-and-ranking-s5], verified: "2026-11-27", text: "Retrieval models are often composed of a query model and a candidate model that compute embedding vectors of equal size; the outputs of the two models are multiplied to give a query-candidate affinity score. In a two-tower retrieval model the serving candidate model most often takes the form of an approximate nearest neighbours index."}
  - {id: recommendation-and-ranking-learning-to-rank, class: B, sources: [recommendation-and-ranking-s6, recommendation-and-ranking-s7], verified: "2026-11-27", text: "LambdaMART is the boosted tree version of LambdaRank, which is based on RankNet. LightGBM provides a lambdarank objective; for it the label is an integer where a larger number represents higher relevance, and learning to rank needs query information for the training data."}
  - {id: recommendation-and-ranking-objective, class: A, sources: [recommendation-and-ranking-s3], verified: "2026-11-27", text: "The choice of scoring function can dramatically affect the ranking of items: if the scoring function optimises for clicks, the system may recommend click-bait videos."}
  - {id: recommendation-and-ranking-position, class: A, sources: [recommendation-and-ranking-s3, recommendation-and-ranking-s8], verified: "2026-11-27", text: "Items that appear lower on the screen are less likely to be clicked than items appearing higher on the screen. Google's Rules of Machine Learning advise training with positional features and, at serving, giving no instance the positional feature or giving them all the same default feature."}
  - {id: recommendation-and-ranking-loop, class: A, sources: [recommendation-and-ranking-s8, recommendation-and-ranking-s9], verified: "2026-11-27", text: "A ranking change that brings up different results effectively changes the data the algorithm will see in the future. Recommendation systems are often evaluated or trained on data from users already exposed to their recommendations, which creates a feedback loop; in simulations this confounded data homogenises user behaviour without increasing utility."}
  - {id: recommendation-and-ranking-diversity, class: B, sources: [recommendation-and-ranking-s4], verified: "2026-11-27", text: "If the system always recommends items that are closest to the query embedding, the candidates tend to be very similar to each other. The system can re-rank the candidates to consider additional criteria or constraints."}
  - {id: recommendation-and-ranking-dsa-27, class: C, sources: [recommendation-and-ranking-s10], verified: "2026-11-27", text: "Article 27 of Regulation (EU) 2022/2065, listed on EUR-Lex on 27 November 2026 as in force with one consolidated version dated 27 October 2022, requires providers of online platforms that use recommender systems to set out in their terms and conditions, in plain and intelligible language, the main parameters used in their recommender systems and any options for recipients of the service to modify or influence those parameters. The parameters include at least the criteria most significant in determining the information suggested and the reasons for their relative importance."}
  - {id: recommendation-and-ranking-dsa-38, class: C, sources: [recommendation-and-ranking-s10], verified: "2026-11-27", text: "Article 38 of Regulation (EU) 2022/2065 requires providers of very large online platforms and very large online search engines that use recommender systems to provide at least one option for each of their recommender systems which is not based on profiling as defined in Article 4, point (4), of Regulation (EU) 2016/679. Article 3 defines a recommender system as a fully or partially automated system used by an online platform to suggest or prioritise information, including by determining the relative order or prominence of information displayed."}
