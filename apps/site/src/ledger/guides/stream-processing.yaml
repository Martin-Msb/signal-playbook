sources:
  - {id: stream-processing-s1, title: "Apache Flink: Timely Stream Processing", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/", kind: primary, vendor: false}
  - {id: stream-processing-s2, title: "Apache Flink: Windows", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", kind: primary, vendor: false}
  - {id: stream-processing-s3, title: "Apache Kafka: Kafka Streams Core Concepts", url: "https://kafka.apache.org/43/streams/core-concepts/", kind: primary, vendor: false}
  - {id: stream-processing-s4, title: "Apache Spark: Structured Streaming Programming Guide, APIs on DataFrames and Datasets", url: "https://spark.apache.org/docs/latest/streaming/apis-on-dataframes-and-datasets.html", kind: primary, vendor: false}
  - {id: stream-processing-s5, title: "Apache Flink: Window Aggregation in SQL", url: "https://nightlies.apache.org/flink/flink-docs-release-2.0/docs/dev/table/sql/queries/window-agg/", kind: primary, vendor: false}
  - {id: stream-processing-s6, title: "Apache Flink: Stateful Stream Processing", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/", kind: primary, vendor: false}
  - {id: stream-processing-s7, title: "Apache Flink: Builtin Watermark Generators", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/event-time/built_in/", kind: primary, vendor: false}
claims:
  - {id: stream-processing-time, class: A, sources: [stream-processing-s1], verified: "2026-11-27", text: "Apache Flink defines processing time as the system time of the machine that is executing the respective operation, and event time as the time that each individual event occurred on its producing device."}
  - {id: stream-processing-windows, class: A, sources: [stream-processing-s1, stream-processing-s2], verified: "2026-11-27", text: "It is impossible to count all elements in a stream, because streams are in general infinite, so aggregates on streams such as counts and sums are scoped by windows. A Flink WindowAssigner assigns each incoming element to one or more windows. Tumbling windows have a fixed size and do not overlap, and sliding windows can overlap if the slide is smaller than the window size."}
  - {id: stream-processing-state, class: A, sources: [stream-processing-s6, stream-processing-s2], verified: "2026-11-27", text: "In Flink, operations that remember information across multiple events, for example window operators, are called stateful. When aggregating events per minute, hour or day, the state holds the pending aggregates. A window is created as soon as the first element that should belong to it arrives."}
  - {id: stream-processing-watermark, class: A, sources: [stream-processing-s1], verified: "2026-11-27", text: "The mechanism in Flink to measure progress in event time is watermarks. A Watermark(t) declares that event time has reached time t in that stream, meaning that there should be no more elements with a timestamp less than or equal to t. A window operator needs to be notified when event time has passed the end of its window, so that it can close the window in progress."}
  - {id: stream-processing-trigger, class: A, sources: [stream-processing-s2, stream-processing-s7], verified: "2026-11-27", text: "Flink's event-time trigger fires once the watermark passes the end of a window. Flink's built-in generator for a fixed amount of lateness emits watermarks that lag behind the maximum event-time timestamp seen in the stream by a fixed amount of time."}
  - {id: stream-processing-late, class: A, sources: [stream-processing-s1, stream-processing-s2], verified: "2026-11-27", text: "In Flink, late elements are elements that arrive after the system's event time clock, as signalled by the watermarks, has already passed the time of their timestamp. By default, late elements are dropped when the watermark is past the end of the window, and the default allowed lateness is 0. Flink's side output feature gives a stream of the data that was discarded as late."}
  - {id: stream-processing-lateness, class: A, sources: [stream-processing-s2], verified: "2026-11-27", text: "With an allowed lateness, elements that arrive after the watermark has passed the end of the window but before the end of the window plus the allowed lateness are still added to the window, and depending on the trigger a late but not dropped element may cause the window to fire again. Flink keeps the state of windows until their allowed lateness expires."}
  - {id: stream-processing-kafka-grace, class: A, sources: [stream-processing-s3], verified: "2026-11-27", text: "Kafka Streams windowing groups records that have the same key for stateful operations such as aggregations or joins. A window's grace period controls how long Kafka Streams will wait for out-of-order data records, and a record that arrives after the grace period has passed is discarded and not processed in that window. Out-of-order records are always possible in the real world and can only be considered as such for event time."}
  - {id: stream-processing-spark-watermark, class: A, sources: [stream-processing-s4], verified: "2026-11-27", text: "Spark Structured Streaming watermarking lets the engine track the current event time in the data and attempt to clean up old state. withWatermark defines the event time column and the threshold on how late the data is expected to be. Late data within the threshold is aggregated, and data later than the threshold starts getting dropped."}
  - {id: stream-processing-sql-window, class: B, sources: [stream-processing-s5], verified: "2026-11-27", text: "Flink SQL supports TUMBLE, HOP, CUMULATE and SESSION types of window aggregations. Unlike other aggregations on continuous tables, a window aggregation emits only a final result at the end of the window and purges intermediate state when it is no longer needed."}
  - {id: stream-processing-policy, class: A, sources: [stream-processing-s2], verified: "2026-11-27", text: "Flink's allowed lateness specifies by how much time elements can be late before they are dropped. The elements emitted by a late firing should be treated as updated results of a previous computation, and applications need to take these duplicated results into account or deduplicate them."}
