  - {id: preparing-knowledge-s10, title: "Zou et al.: PoisonedRAG, Knowledge Corruption Attacks to Retrieval-Augmented Generation of Large Language Models", url: "https://arxiv.org/abs/2402.07867", kind: primary, vendor: false}
claims:
  - {id: preparing-knowledge-why-chunk, class: A, sources: [preparing-knowledge-s2, preparing-knowledge-s5], verified: "2026-11-27", text: "Partitioning large documents into smaller chunks keeps content under the maximum input limits of embedding and chat completion models, and it is also beneficial if content is poorly represented as a single vector. During ingestion, Amazon Bedrock splits documents into chunks, converts the chunks to embeddings and writes them to a vector index while maintaining a mapping to the original document."}
  - {id: preparing-knowledge-choices, class: B, sources: [preparing-knowledge-s1, preparing-knowledge-s2], verified: "2026-11-27", text: "The choice of chunk size, chunk boundary and chunk overlap can affect retrieval performance. Fixed-size chunking can overlap a small amount of text between chunks to help maintain continuity and context."}
  - {id: preparing-knowledge-layout, class: B, sources: [preparing-knowledge-s3, preparing-knowledge-s4], verified: "2026-11-27", text: "The Document Layout skill in Azure AI Search uses a layout model to analyse a document, detect its structure and produce a representation in Markdown or text, and it supports image extraction with location metadata that preserves image position within the document. Content can then be chunked based on document structure, capturing headings and chunking the body by paragraphs and sentences."}
  - {id: preparing-knowledge-elements, class: B, sources: [preparing-knowledge-s8], verified: "2026-11-27", text: "In the Unstructured library, chunking is performed on document elements, and text is split only when a single element exceeds the maximum chunk size. A Table element is always isolated and never combined with another element, and with the by_title strategy a single chunk never contains text that occurred in two different sections."}
  - {id: preparing-knowledge-strategies, class: B, sources: [preparing-knowledge-s2, preparing-knowledge-s5], verified: "2026-11-27", text: "Common chunking techniques are fixed-size chunks with some overlap, variable-sized chunks based on content characteristics such as end-of-sentence punctuation or heading syntax, and semantic chunks that preserve context and semantic relationships across sentences and paragraphs. Hierarchical chunking in Amazon Bedrock Knowledge Bases retrieves child chunks and replaces them with broader parent chunks."}
  - {id: preparing-knowledge-sizes, class: C, sources: [preparing-knowledge-s2, preparing-knowledge-s5], verified: "2026-11-27", text: "Microsoft recommends starting with a chunk size of 512 tokens and an initial overlap of 25% for fixed-size chunking. Default chunking in Amazon Bedrock Knowledge Bases splits content into text chunks of approximately 300 tokens and honours sentence boundaries."}
  - {id: preparing-knowledge-size-trade, class: A, sources: [preparing-knowledge-s5], verified: "2026-11-27", text: "Small text embeddings are more precise, but retrieval aims for comprehensive context."}
  - {id: preparing-knowledge-context-loss, class: A, sources: [preparing-knowledge-s1], verified: "2026-11-27", text: "Traditional RAG systems often destroy context when they split documents. A chunk such as 'The company's revenue grew by 3% over the previous quarter' does not on its own specify which company it refers to or the relevant time period."}
  - {id: preparing-knowledge-contextual, class: B, sources: [preparing-knowledge-s1], verified: "2026-11-27", flags: [vendor-stated], text: "Contextual Retrieval prepends chunk-specific explanatory context, usually 50 to 100 tokens generated by a model from the whole document, to each chunk before embedding. Anthropic reports that contextual embeddings reduced the top-20-chunk retrieval failure rate by 35%."}
  - {id: preparing-knowledge-metadata, class: B, sources: [preparing-knowledge-s7], verified: "2026-11-27", text: "In Amazon Bedrock Knowledge Bases, the metadataAttributes in a metadata file are document-level metadata applied to every chunk from that file, and metadata fields can be treated as filterable metadata for queries."}
  - {id: preparing-knowledge-access, class: A, sources: [preparing-knowledge-s9], verified: "2026-11-27", text: "OWASP advises applying access control at the chunk level, because a mostly-public document can contain a confidential paragraph, and enforcing tenant scoping inside the index query, not as a post-retrieval filter."}
  - {id: preparing-knowledge-provenance, class: A, sources: [preparing-knowledge-s9], verified: "2026-11-27", text: "OWASP advises tracking provenance for every embedding (source, ingestion time, trust tier, pipeline version) so compromised batches can be invalidated and audited."}
  - {id: preparing-knowledge-deletion, class: A, sources: [preparing-knowledge-s9], verified: "2026-11-27", text: "OWASP advises deleting embeddings within a bounded time when the source document is deleted, and verifying with reconciliation audits."}
  - {id: preparing-knowledge-resync, class: B, sources: [preparing-knowledge-s6], verified: "2026-11-27", text: "Syncing a data source in Amazon Bedrock Knowledge Bases is incremental. A deleted document is removed from the vector store, and a document whose content or metadata changed is re-parsed, re-chunked, re-embedded and re-indexed."}
  - {id: preparing-knowledge-poison, class: A, sources: [preparing-knowledge-s9, preparing-knowledge-s10], verified: "2026-11-27", text: "An attacker who can write to the corpus can craft content whose embedding lands close to a target query, and that content is then retrieved and fed to the LLM as trusted context. The PoisonedRAG paper reports a 90% attack success rate when injecting five malicious texts for each target question into a knowledge database with millions of texts."}
  - {id: preparing-knowledge-normalise, class: A, sources: [preparing-knowledge-s9], verified: "2026-11-27", text: "OWASP advises normalising content before embedding by stripping zero-width characters, white-on-white text and Unicode homoglyphs at extraction, and applying human review to externally sourced content destined for sensitive indexes."}
