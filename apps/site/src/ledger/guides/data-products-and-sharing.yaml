sources:
  - {id: data-products-and-sharing-s1, title: "Linux Foundation: Open Data Product Specification 4.2", url: "https://opendataproducts.org/v4.2/", kind: primary, vendor: false}
  - {id: data-products-and-sharing-s2, title: "Apache Iceberg: REST Catalog Spec", url: "https://iceberg.apache.org/rest-catalog-spec/", kind: primary, vendor: false}
  - {id: data-products-and-sharing-s3, title: "Databricks: Create shares for OpenSharing", url: "https://docs.databricks.com/aws/en/opensharing/create-share", kind: primary, vendor: true}
  - {id: data-products-and-sharing-s4, title: "Databricks: Manage data recipients for OpenSharing", url: "https://docs.databricks.com/gcp/en/opensharing/manage-recipients", kind: primary, vendor: true}
  - {id: data-products-and-sharing-s5, title: "Zhamak Dehghani: How to Move Beyond a Monolithic Data Lake to a Distributed Data Mesh", url: "https://martinfowler.com/articles/data-monolith-to-mesh.html", kind: primary, vendor: false}
  - {id: data-products-and-sharing-s6, title: "Delta Sharing: Protocol", url: "https://github.com/delta-io/delta-sharing/blob/main/PROTOCOL.md", kind: primary, vendor: false}
  - {id: data-products-and-sharing-s7, title: "Delta Lake: Delta Sharing", url: "https://delta.io/sharing/", kind: primary, vendor: false}
  - {id: data-products-and-sharing-s8, title: "NIST: SP 800-53 Rev. 5 control catalogue, OSCAL", url: "https://github.com/usnistgov/oscal-content/blob/main/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json", kind: primary, vendor: false}
claims:
  - {id: data-products-and-sharing-product, class: A, sources: [data-products-and-sharing-s1], verified: "2026-11-27", text: "The Open Data Product Specification is a machine-readable model for describing the structure and attributes of digital data products."}
  - {id: data-products-and-sharing-contract, class: A, sources: [data-products-and-sharing-s1], verified: "2026-11-27", text: "The Open Data Product Specification supports data contracts, service level agreements and quality profiles in a product definition."}
  - {id: data-products-and-sharing-access, class: A, sources: [data-products-and-sharing-s1], verified: "2026-11-27", text: "The data access object of the Open Data Product Specification defines how users or machines can technically access the data product, for example through an API endpoint."}
  - {id: data-products-and-sharing-owner, class: A, sources: [data-products-and-sharing-s5], verified: "2026-11-27", text: "In the data mesh proposal a data product owner makes decisions around the vision and the roadmap for the data products and is responsible for the lifecycle of the domain datasets: when to change, revise and retire data and schemas."}
  - {id: data-products-and-sharing-slo, class: A, sources: [data-products-and-sharing-s5], verified: "2026-11-27", text: "In the data mesh proposal each data product defines and assures the target level of its integrity and truthfulness as a set of service level objectives."}
  - {id: data-products-and-sharing-interface, class: A, sources: [data-products-and-sharing-s2], verified: "2026-11-27", text: "The Iceberg REST catalog protocol defines a common API for catalog operations that clients can use with any catalog implementing the protocol."}
  - {id: data-products-and-sharing-vending, class: A, sources: [data-products-and-sharing-s2], verified: "2026-11-27", text: "The Iceberg REST catalog protocol supports secure table sharing using credential vending or remote signing."}
  - {id: data-products-and-sharing-protocol, class: A, sources: [data-products-and-sharing-s6], verified: "2026-11-27", text: "Delta Sharing is an open REST protocol in which a share is a logical grouping to share with recipients, a recipient is a principal that has a bearer token to access shared tables, and the server returns pre-signed URLs for individual data files."}
  - {id: data-products-and-sharing-no-copy, class: B, sources: [data-products-and-sharing-s7], verified: "2026-11-27", text: "The Delta Sharing project describes sharing live data in a Delta Lake without copying it to another system."}
  - {id: data-products-and-sharing-sharing, class: B, sources: [data-products-and-sharing-s3, data-products-and-sharing-s4], verified: "2026-11-27", text: "Databricks shares are collections of data assets made available to recipients, and providers grant recipient access to shares."}
  - {id: data-products-and-sharing-review, class: A, sources: [data-products-and-sharing-s4], verified: "2026-11-27", text: "Providers can view recipient share permissions and delete a recipient to end that recipient's access to shared data."}
  - {id: data-products-and-sharing-agreement, class: A, sources: [data-products-and-sharing-s8], verified: "2026-11-27", text: "NIST SP 800-53 control CA-3 has an organisation approve and manage the exchange of information between systems using agreements, document in each agreement the interface characteristics, security and privacy requirements, controls and responsibilities, and review and update the agreements at a defined frequency."}
  - {id: data-products-and-sharing-use-terms, class: A, sources: [data-products-and-sharing-s8], verified: "2026-11-27", text: "NIST SP 800-53 control AC-21 has authorised users determine whether the access authorisations assigned to a sharing partner match the access and use restrictions of the information."}
  - {id: data-products-and-sharing-account-review, class: A, sources: [data-products-and-sharing-s8], verified: "2026-11-27", text: "NIST SP 800-53 control AC-2 has accounts reviewed for compliance with account management requirements at an organisation-defined frequency."}
