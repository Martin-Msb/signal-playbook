claims:
  - id: serving-data-to-ml-and-ai-skew
    class: A
    sources: [serving-data-to-ml-and-ai-s8]
    verified: "2026-11-27"
    text: "Training-serving skew is a difference between performance during training and performance during serving, and one of its causes is a change in the data between training and serving."
  - id: serving-data-to-ml-and-ai-historical-and-online-retrieval
    class: A
    sources: [serving-data-to-ml-and-ai-s2]
    verified: "2026-11-27"
    text: "Feast supports historical feature retrieval for training datasets and online feature retrieval for real-time inference."
  - id: serving-data-to-ml-and-ai-point-in-time-join
    class: A
    sources: [serving-data-to-ml-and-ai-s1]
    verified: "2026-11-27"
    text: "A point-in-time join reproduces feature state at a past time, and created-timestamp filtering can exclude values unavailable at the entity timestamp."
  - id: serving-data-to-ml-and-ai-scan-back
    class: A
    sources: [serving-data-to-ml-and-ai-s1]
    verified: "2026-11-27"
    text: "Feast scans backward in time from each timestamp in the entity dataframe, up to the TTL specified, and by default constrains only the feature's event timestamp."
  - id: serving-data-to-ml-and-ai-no-future-data
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-27"
    text: "Feast generates point-in-time correct feature sets to ensure that no future data leaks into model training."
  - id: serving-data-to-ml-and-ai-offline-online-stores
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-27"
    text: "Feast describes offline stores for historical feature extraction and online stores for low-latency production feature serving."
  - id: serving-data-to-ml-and-ai-online-latest
    class: A
    sources: [serving-data-to-ml-and-ai-s7]
    verified: "2026-11-27"
    text: "The Feast online store keeps only the latest feature values for each entity key, with no history, and values are loaded into it through materialisation."
  - id: serving-data-to-ml-and-ai-online-serving-push
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-27"
    text: "Feast uses a push model for online serving: the feature store pushes feature values to the online store."
  - id: serving-data-to-ml-and-ai-pipeline-keeps-features-current
    class: A
    sources: [serving-data-to-ml-and-ai-s3]
    verified: "2026-11-27"
    text: "Feast does not orchestrate workflows and relies on upstream data pipelines to produce feature values."
  - id: serving-data-to-ml-and-ai-chunk-and-embed
    class: B
    sources: [serving-data-to-ml-and-ai-s11]
    verified: "2026-11-27"
    text: "Unless raw documents are small, chunking is necessary to meet the token input requirements of embedding models, and Azure AI Search can run chunking and embedding as skills of an indexer pipeline that fills a search index."
  - id: serving-data-to-ml-and-ai-vectors-with-data
    class: B
    sources: [serving-data-to-ml-and-ai-s12]
    verified: "2026-11-27"
    text: "pgvector provides vector similarity search for Postgres and stores vectors with the rest of the data."
  - id: serving-data-to-ml-and-ai-index-from-table
    class: C
    sources: [serving-data-to-ml-and-ai-s9]
    verified: "2026-11-27"
    text: "Databricks AI Search, formerly Databricks Vector Search, creates an index from a source table such as a Delta table, and Databricks can calculate the embeddings with a model the user specifies."
  - id: serving-data-to-ml-and-ai-index-governed
    class: B
    sources: [serving-data-to-ml-and-ai-s9]
    verified: "2026-11-27"
    text: "Databricks AI Search indexes appear in and are governed by Unity Catalog."
  - id: serving-data-to-ml-and-ai-sync-modes
    class: B
    sources: [serving-data-to-ml-and-ai-s10, serving-data-to-ml-and-ai-s9]
    verified: "2026-11-27"
    text: "A Delta Sync index syncs automatically with its source table and updates incrementally. Continuous mode keeps it in sync with seconds of latency, triggered mode syncs when started through the SDK or REST API, and a Direct Vector Access index is updated by its owner."
  - id: serving-data-to-ml-and-ai-source-changes-flow
    class: B
    sources: [serving-data-to-ml-and-ai-s11]
    verified: "2026-11-27"
    text: "When data changes in the source, an Azure AI Search indexer can move the updates through chunking, vectorisation and indexing, and running it on a schedule picks up changed documents."
  - id: serving-data-to-ml-and-ai-vector-record-updates
    class: A
    sources: [serving-data-to-ml-and-ai-s4]
    verified: "2026-11-27"
    text: "Qdrant points contain a vector and optional payload, and its point operations support inserting, updating and deleting records."
  - id: serving-data-to-ml-and-ai-vector-filtering
    class: A
    sources: [serving-data-to-ml-and-ai-s5]
    verified: "2026-11-27"
    text: "Qdrant can apply payload and point identifier conditions when searching or retrieving points."
  - id: serving-data-to-ml-and-ai-erasure-recipients
    class: A
    sources: [serving-data-to-ml-and-ai-s6]
    verified: "2026-11-27"
    text: "Under specified conditions, the GDPR requires controllers to communicate erasure to recipients and take reasonable steps concerning copies or replications of personal data."
