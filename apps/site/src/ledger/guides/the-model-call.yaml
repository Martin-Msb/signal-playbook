sources:
  - {id: the-model-call-s1, title: "Anthropic: Using the Messages API", url: "https://platform.claude.com/docs/en/build-with-claude/working-with-messages", kind: primary, vendor: true}
  - {id: the-model-call-s2, title: "Anthropic: Handling stop reasons", url: "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", kind: primary, vendor: true}
  - {id: the-model-call-s3, title: "OpenAI: Conversation state", url: "https://developers.openai.com/api/docs/guides/conversation-state", kind: primary, vendor: true}
  - {id: the-model-call-s4, title: "OpenAI: Text generation", url: "https://developers.openai.com/api/docs/guides/text", kind: primary, vendor: true}
  - {id: the-model-call-s5, title: "vLLM: Online serving", url: "https://docs.vllm.ai/en/latest/serving/online_serving/", kind: primary, vendor: false}
  - {id: the-model-call-s6, title: "European Union: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng", kind: primary, vendor: false}
  - {id: the-model-call-s7, title: "Anthropic: API and data retention", url: "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention", kind: primary, vendor: true}
  - {id: the-model-call-s8, title: "Anthropic: Data residency", url: "https://platform.claude.com/docs/en/manage-claude/data-residency", kind: primary, vendor: true}
  - {id: the-model-call-s9, title: "OWASP GenAI Security Project: LLM07:2025 System Prompt Leakage", url: "https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/", kind: primary, vendor: false}
claims:
  - {id: the-model-call-stateless, class: A, sources: [the-model-call-s1, the-model-call-s3], verified: "2026-11-27", text: "Anthropic states that the Messages API is stateless, which means that the full conversational history is always sent to the API. OpenAI states that each text generation request is independent and stateless."}
  - {id: the-model-call-request, class: B, sources: [the-model-call-s1], verified: "2026-11-27", text: "A request to the Anthropic Messages API names a model, sets max_tokens and carries a list of messages, each with the role user or assistant. Instructions that should apply from the first turn go in the top-level system field, which is the system prompt."}
  - {id: the-model-call-roles, class: B, sources: [the-model-call-s4], verified: "2026-11-27", text: "In OpenAI's API, developer messages are instructions provided by the application developer and are prioritised ahead of user messages, user messages are instructions provided by an end user, and messages generated by the model have the assistant role."}
  - {id: the-model-call-state, class: B, sources: [the-model-call-s1, the-model-call-s3], verified: "2026-11-27", text: "OpenAI offers a previous_response_id parameter to share context across generated responses and a Conversations API that persists conversation state as a long-running object. Anthropic offers message threads in beta, with which the API can keep the conversation so that each later request sends only the new messages."}
  - {id: the-model-call-stop-reason, class: B, sources: [the-model-call-s2], verified: "2026-11-27", text: "In the Anthropic Messages API the stop_reason field is part of every successful response. Its values include end_turn when the model completed its response naturally, max_tokens when the response reached the max_tokens limit, stop_sequence when the model emitted one of the request's stop sequences, and tool_use when the model is calling a tool."}
  - {id: the-model-call-self-hosted, class: B, sources: [the-model-call-s5], verified: "2026-11-27", text: "vLLM provides an HTTP server that supports OpenAI APIs including Completions, Chat Completions and Responses, and the Anthropic Messages API."}
  - {id: the-model-call-retention, class: C, sources: [the-model-call-s7], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that conversation content sent to its API is not retained by default, that its Covered Models require 30-day retention, that under a zero data retention arrangement prompts and responses are not stored at rest after the response is returned, and that flagged inputs and outputs may be retained for up to 2 years regardless of arrangement. On Amazon Bedrock and on Claude Models on Google Cloud (Google managed), the cloud provider is the data processor."}
  - {id: the-model-call-region, class: C, sources: [the-model-call-s8], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic's inference_geo parameter controls where model inference runs for a request: global, the default, may run in any available geography, and us runs only on US-based infrastructure. On Amazon Bedrock the inference region is determined by the endpoint URL or inference profile."}
  - {id: the-model-call-minimisation, class: A, sources: [the-model-call-s6], verified: "2026-11-27", text: "EU GDPR Article 5(1) requires personal data to be adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed (point c) and processed in a manner that ensures appropriate security of the personal data (point f)."}
  - {id: the-model-call-secrets, class: A, sources: [the-model-call-s9], verified: "2026-11-27", text: "OWASP states that sensitive data such as credentials and connection strings should not be contained within the system prompt language, and that the system prompt should not be considered a secret."}
