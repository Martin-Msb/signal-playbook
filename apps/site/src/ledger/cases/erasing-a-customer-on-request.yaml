claims:
  - {id: case-erasing-a-customer-on-request-one-month, class: A, sources: [case-erasing-a-customer-on-request-s1], verified: "2026-11-27", text: "Under Article 12(3) of Regulation (EU) 2016/679 as adopted, the controller shall provide information on action taken on a request under Articles 15 to 22 to the data subject without undue delay and in any event within one month of receipt of the request."}
