sources:
  - {id: data-layers-s1, title: "Databricks: Best practices for Lakeflow pipelines", url: "https://docs.databricks.com/aws/en/ldp/best-practices", kind: primary, vendor: true}
  - {id: data-layers-s2, title: "dbt Developer Hub: Staging models", url: "https://docs.getdbt.com/best-practices/how-we-structure/2-staging", kind: primary, vendor: true}
  - {id: data-layers-s3, title: "dbt Developer Hub: Intermediate models", url: "https://docs.getdbt.com/best-practices/how-we-structure/3-intermediate", kind: primary, vendor: true}
  - {id: data-layers-s4, title: "dbt Developer Hub: Marts", url: "https://docs.getdbt.com/best-practices/how-we-structure/4-marts", kind: primary, vendor: true}
  - {id: data-layers-s5, title: "Databricks: Access control in Unity Catalog", url: "https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/", kind: primary, vendor: true}
claims:
  - {id: data-layers-bronze, class: B, sources: [data-layers-s1], verified: "2026-11-26", text: "Databricks describes bronze tables as preserving raw source data with minimal transformation so that silver or gold tables can reprocess from the bronze source if requirements change. This is Databricks' medallion architecture guidance."}
  - {id: data-layers-silver, class: B, sources: [data-layers-s1], verified: "2026-11-26", text: "Databricks describes silver-layer streaming tables as supporting incremental row-level filtering, cleaning and parsing transformations."}
  - {id: data-layers-gold, class: B, sources: [data-layers-s1], verified: "2026-11-26", text: "Databricks describes gold-layer materialized views as precomputing aggregations, metrics and summaries for dashboards, reporting tools and downstream consumers."}
  - {id: data-layers-dbt-staging, class: B, sources: [data-layers-s2], verified: "2026-11-26", text: "dbt's guidance describes staging as the entry layer for source-conformed models, generally with a one-to-one relationship to source tables. Common transformations include renaming, type casting, basic computations and categorisation."}
  - {id: data-layers-dbt-intermediate, class: B, sources: [data-layers-s3], verified: "2026-11-26", text: "dbt describes intermediate models as preparing staging models for marts, with common patterns including grouping, pivoting, changing grain and isolating complex logic. It advises that intermediate models generally should not be exposed in the main production schema, and describes a separate schema with special permissions as one option."}
  - {id: data-layers-dbt-marts, class: B, sources: [data-layers-s4], verified: "2026-11-26", text: "dbt describes marts as the layer expressly intended for exposure to end users and as a place for business-defined entities or concepts at a unique grain."}
  - {id: data-layers-access, class: B, sources: [data-layers-s5], verified: "2026-11-26", text: "Unity Catalog access control includes privileges and ownership on securable objects, attribute-based policies, table-level filtering and masking, and workspace-level restrictions. These mechanisms work together for fine-grained access control."}
