sources:
  - {id: lineage-s1, title: "OpenLineage specification: core lineage model", url: "https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.md", kind: primary, vendor: false}
  - {id: lineage-s2, title: "OpenLineage specification: Lineage Dataset Facet", url: "https://openlineage.io/docs/spec/facets/dataset-facets/lineage/", kind: primary, vendor: false}
  - {id: lineage-s3, title: "OpenLineage Spark integration: Column-Level Lineage", url: "https://openlineage.io/docs/integrations/spark/spark_column_lineage/", kind: primary, vendor: false}
  - {id: lineage-s4, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng", kind: primary, vendor: false}
claims:
  - {id: lineage-run-model, class: B, sources: [lineage-s1], verified: "2026-11-25", text: "OpenLineage models a job as a process definition with input and output datasets, a run as an instance of that job, and a run event as an observed state of the run. A source code location facet can record the job's source location and version."}
  - {id: lineage-table-graph, class: B, sources: [lineage-s2], verified: "2026-11-25", text: "The OpenLineage Lineage Dataset Facet describes the exact datasets, jobs and fields from which a dataset derives. It supports entity-level inputs and field-level dependencies, including structural relationships with no natural run event."}
  - {id: lineage-column-graph, class: B, sources: [lineage-s3], verified: "2026-11-25", text: "OpenLineage's Spark integration derives column lineage from Spark logical plans. Its SQL parser extracts lineage from query strings for JDBC relations, but in that case reports the mentioned table or view and field names without input field types or transformation types."}
  - {id: lineage-impact, class: B, sources: [lineage-s1, lineage-s2], verified: "2026-11-25", text: "OpenLineage records job inputs and outputs in run events and can describe the dataset and field dependencies from which an output derives. Those relationships make upstream and downstream dependencies inspectable."}
  - {id: lineage-gdpr-record, class: B, sources: [lineage-s4], verified: "2026-11-25", text: "Article 30 of Regulation (EU) 2016/679 requires controllers to maintain records of processing activities that include processing purposes, categories of personal data, recipients, applicable transfers, envisaged erasure time limits where possible, and a general description of security measures where possible."}
