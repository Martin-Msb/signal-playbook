sources:
  - {id: cost-and-workload-management-s1, title: "FinOps Foundation: FinOps Framework", url: "https://www.finops.org/framework/", kind: primary, vendor: false}
  - {id: cost-and-workload-management-s2, title: "Google Cloud: Estimate and control costs", url: "https://docs.cloud.google.com/bigquery/docs/best-practices-costs", kind: primary, vendor: true}
  - {id: cost-and-workload-management-s3, title: "Google Cloud: Understand reservations", url: "https://docs.cloud.google.com/bigquery/docs/reservations-workload-management", kind: primary, vendor: true}
  - {id: cost-and-workload-management-s4, title: "Amazon S3: Lifecycle configuration elements", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html", kind: primary, vendor: true}
  - {id: cost-and-workload-management-s5, title: "Google Cloud: Optimize query computation", url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-compute", kind: primary, vendor: true}
  - {id: cost-and-workload-management-s6, title: "Google Cloud: Introduction to partitioned tables", url: "https://docs.cloud.google.com/bigquery/docs/partitioned-tables", kind: primary, vendor: true}
claims:
  - {id: cost-and-workload-management-finops, class: A, sources: [cost-and-workload-management-s1], verified: "2026-11-27", text: "FinOps is a collaborative operational framework and cultural practice that maximises technology business value and creates financial accountability."}
  - {id: cost-and-workload-management-dry-run, class: A, sources: [cost-and-workload-management-s2], verified: "2026-11-27", text: "For on-demand BigQuery queries, a dry run estimates bytes processed; the estimate is an upper bound and can exceed bytes billed after execution."}
  - {id: cost-and-workload-management-budget-control, class: A, sources: [cost-and-workload-management-s2], verified: "2026-11-27", text: "BigQuery maximum bytes billed can fail a query before execution when its estimated bytes exceed the configured limit."}
  - {id: cost-and-workload-management-reservations, class: A, sources: [cost-and-workload-management-s3], verified: "2026-11-27", text: "BigQuery reservations allocate capacity between workloads, teams or departments, and provide isolated resource pools."}
  - {id: cost-and-workload-management-autoscaling, class: B, sources: [cost-and-workload-management-s3], verified: "2026-11-27", text: "With BigQuery autoscaling reservations, capacity between the baseline and the maximum reservation size is not reserved in advance; BigQuery scales it up and down based on demand and system availability."}
  - {id: cost-and-workload-management-lifecycle, class: A, sources: [cost-and-workload-management-s4], verified: "2026-11-27", text: "Amazon S3 Lifecycle rules can transition objects between storage classes and expire objects; expiration behaviour depends on bucket versioning."}
  - {id: cost-and-workload-management-budgets, class: B, sources: [cost-and-workload-management-s2], verified: "2026-11-27", text: "Cloud Billing budgets let you track actual costs against planned costs, and budget alert threshold rules trigger email notifications. Attributing capacity charges to the projects where queries execute shows project-level compute costs and supports internal chargebacks."}
  - {id: cost-and-workload-management-pruning, class: A, sources: [cost-and-workload-management-s5, cost-and-workload-management-s6], verified: "2026-11-27", text: "BigQuery advises querying only the columns you need. Partitioning can control costs by reducing the bytes a query reads: when a query uses a qualifying filter on the partitioning column, BigQuery can scan matching partitions and skip the rest, which is called pruning."}
  - {id: cost-and-workload-management-sizing, class: B, sources: [cost-and-workload-management-s3], verified: "2026-11-27", text: "BigQuery documentation says incremental capacity is likely to give incremental performance, but adding capacity also increases costs. Assigning more slots reduces query runtime while the total slot time a query consumes can increase."}
