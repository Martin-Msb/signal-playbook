sources:
  - {id: schema-evolution-and-data-contracts-s1, title: "Apache Avro: Specification, schema resolution", url: "https://avro.apache.org/docs/1.12.0/specification/#schema-resolution", kind: primary, vendor: false}
  - {id: schema-evolution-and-data-contracts-s2, title: "Protocol Buffers: Updating A Message Type", url: "https://protobuf.dev/programming-guides/proto3/#updating", kind: primary, vendor: false}
  - {id: schema-evolution-and-data-contracts-s3, title: "Confluent Platform documentation: Schema Evolution and Compatibility", url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html", kind: primary, vendor: true}
  - {id: schema-evolution-and-data-contracts-s4, title: "Open Data Contract Standard: repository and overview", url: "https://github.com/bitol-io/open-data-contract-standard", kind: primary, vendor: false}
  - {id: schema-evolution-and-data-contracts-s5, title: "Open Data Contract Standard: Fundamentals", url: "https://bitol-io.github.io/open-data-contract-standard/latest/fundamentals/", kind: primary, vendor: false}
claims:
  - {id: schema-evolution-and-data-contracts-avro-resolution, class: A, sources: [schema-evolution-and-data-contracts-s1], verified: "2026-11-27", text: "Avro schema resolution matches record fields by name. A writer field absent from the reader schema is ignored, while a reader field absent from the writer schema requires a default or resolution signals an error."}
  - {id: schema-evolution-and-data-contracts-protobuf, class: A, sources: [schema-evolution-and-data-contracts-s2], verified: "2026-11-27", text: "Protocol Buffers documents adding a new field as binary wire-safe. When removing a field, its field number must not be reused; reserving the number can prevent future reuse."}
  - {id: schema-evolution-and-data-contracts-compatibility, class: B, sources: [schema-evolution-and-data-contracts-s3], verified: "2026-11-27", text: "Confluent Schema Registry enforces compatibility by comparing new schema versions against previous versions using configurable compatibility types, which define which schema changes are allowed. When a schema is updated, it checks compatibility before accepting the new version. Avro, Protobuf and JSON Schema have different compatibility rules."}
  - {id: schema-evolution-and-data-contracts-modes, class: B, sources: [schema-evolution-and-data-contracts-s3], verified: "2026-11-27", text: "Backward compatibility means consumers using the new schema can read data written with the old schema. Forward compatibility means consumers using the old schema can read data written with the new schema. Full compatibility requires both."}
  - {id: schema-evolution-and-data-contracts-odcs, class: B, sources: [schema-evolution-and-data-contracts-s4], verified: "2026-11-27", text: "The Open Data Contract Standard states that a data contract defines the agreement between a data producer and consumers, and that a data contract contains several sections, among them schema, data quality, team, roles and service-level agreement."}
  - {id: schema-evolution-and-data-contracts-governance, class: B, sources: [schema-evolution-and-data-contracts-s4, schema-evolution-and-data-contracts-s5], verified: "2026-11-27", text: "The Open Data Contract Standard lists team, roles, data quality and service-level agreement among the sections of a data contract. Its fundamentals section defines optional description fields for the intended purpose of the data, its recommended usage, and technical, compliance and legal limitations for data use."}
