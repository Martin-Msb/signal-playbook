sources:
  - {id: data-quality-s1, title: "W3C: Data on the Web Best Practices, Data Quality Vocabulary", url: "https://www.w3.org/TR/vocab-dqv/", kind: primary, vendor: false}
  - {id: data-quality-s2, title: "dbt Developer Hub: Add data tests to your DAG", url: "https://docs.getdbt.com/docs/build/data-tests", kind: primary, vendor: true}
  - {id: data-quality-s3, title: "Great Expectations: Define Expectations", url: "https://docs.greatexpectations.io/docs/core/define_expectations/", kind: primary, vendor: true}
  - {id: data-quality-s4, title: "Great Expectations: Retrieve all unexpected rows", url: "https://docs.greatexpectations.io/docs/core/run_validations/retrieve_all_unexpected_rows/", kind: primary, vendor: true}
  - {id: data-quality-s5, title: "Soda documentation: Home", url: "https://docs.soda.io/", kind: primary, vendor: true}
  - {id: data-quality-s6, title: "GOV.UK: Data ownership model", url: "https://www.gov.uk/government/publications/data-ownership-in-government/data-ownership-model", kind: primary, vendor: false}
claims:
  - {id: data-quality-context, class: A, sources: [data-quality-s1], verified: "2026-11-25", text: "The W3C Data Quality Vocabulary says that data quality approaches vary by domain and application, and that implementers must choose the approach that fits their scenario. It presents quality dimensions as examples, not a normative universal list."}
  - {id: data-quality-dimensions, class: A, sources: [data-quality-s1, data-quality-s2], verified: "2026-11-25", text: "The W3C Data Quality Vocabulary includes accuracy, completeness, consistency and timeliness among its quality dimensions, and describes syntactic validity in its Linked Data dimensions. dbt's built-in data tests include unique and accepted_values, which can express uniqueness and allowed-value expectations for a dataset."}
  - {id: data-quality-measurable, class: A, sources: [data-quality-s2], verified: "2026-11-25", text: "dbt data tests are assertions on models and other resources. They query for records that disprove an assertion; a test with no failing rows passes."}
  - {id: data-quality-dbt-tests, class: B, sources: [data-quality-s2], verified: "2026-11-25", text: "dbt provides generic data tests named unique, not_null, accepted_values and relationships. Data tests can be applied to models, columns, sources, seeds and snapshots."}
  - {id: data-quality-gx, class: B, sources: [data-quality-s3], verified: "2026-11-25", text: "Great Expectations defines an Expectation as a verifiable assertion about data and an Expectation Suite as a collection of Expectations that describe the ideal state of a set of data."}
  - {id: data-quality-quarantine, class: B, sources: [data-quality-s4], verified: "2026-11-25", text: "Great Expectations can return all rows that failed an UnexpectedRowsExpectation; its documentation describes writing those rows to a quarantine table as one possible use."}
  - {id: data-quality-soda, class: B, sources: [data-quality-s5], verified: "2026-11-25", text: "Soda documentation describes data testing as validation of known expectations during development, deployment or transformation, and describes data contracts as shared agreements between producers and consumers about schema, types, ranges and other constraints."}
  - {id: data-quality-ownership, class: B, sources: [data-quality-s6], verified: "2026-11-25", text: "GOV.UK's data ownership model says a data owner may be accountable for data quality, while data stewards conduct day-to-day quality monitoring, investigation, triage, remediation and reporting."}
