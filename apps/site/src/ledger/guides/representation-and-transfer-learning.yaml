claims:
  - {id: representation-and-transfer-learning-scratch, class: B, sources: [representation-and-transfer-learning-s3, representation-and-transfer-learning-s2], verified: "2026-11-27", text: "In practice, very few people train an entire convolutional network from scratch with random initialisation, because it is relatively rare to have a dataset of sufficient size. Transfer learning is usually done for tasks where the dataset has too little data to train a full-scale model from scratch."}
  - {id: representation-and-transfer-learning-pretrain, class: B, sources: [representation-and-transfer-learning-s3], verified: "2026-11-27", text: "It is common to pretrain a convolutional network on a very large dataset, for example ImageNet, which contains 1.2 million images with 1000 categories, and then use the network either as an initialisation or as a fixed feature extractor for the task of interest."}
  - {id: representation-and-transfer-learning-definition, class: A, sources: [representation-and-transfer-learning-s2], verified: "2026-11-27", text: "Transfer learning consists of taking features learned on one problem, and leveraging them on a new, similar problem."}
  - {id: representation-and-transfer-learning-general-specific, class: A, sources: [representation-and-transfer-learning-s1], verified: "2026-11-27", text: "Many deep neural networks trained on natural images learn first-layer features similar to Gabor filters and colour blobs. Such first-layer features are general in that they are applicable to many datasets and tasks, and features must eventually transition from general to specific by the last layer of the network."}
  - {id: representation-and-transfer-learning-distance, class: A, sources: [representation-and-transfer-learning-s1], verified: "2026-11-27", text: "The transferability of features decreases as the distance between the base task and the target task increases, but transferring features even from distant tasks can be better than using random features. Initialising a network with transferred features can produce a boost to generalisation that lingers even after fine-tuning to the target dataset."}
  - {id: representation-and-transfer-learning-freeze, class: B, sources: [representation-and-transfer-learning-s2, representation-and-transfer-learning-s3], verified: "2026-11-27", text: "The typical transfer learning workflow takes layers from a previously trained model, freezes them so that the information they contain is not destroyed in later training, adds new trainable layers on top, and trains the new layers on the new dataset. Used as a fixed feature extractor, the network has all its weights frozen except the final fully connected layer, which is replaced with a new one with random weights, and only this layer is trained."}
  - {id: representation-and-transfer-learning-requires-grad, class: B, sources: [representation-and-transfer-learning-s3, representation-and-transfer-learning-s2], verified: "2026-11-27", text: "In PyTorch, setting requires_grad = False freezes parameters so that their gradients are not computed in backward(), and parameters of newly constructed modules have requires_grad=True by default. In Keras, setting layer.trainable to False freezes a layer: its state is not updated during training. The PyTorch tutorial trains on about 120 images for each of its two classes."}
  - {id: representation-and-transfer-learning-embedding, class: A, sources: [representation-and-transfer-learning-s13], verified: "2026-11-27", text: "An embedding is a vector representation of data in embedding space. A model finds embeddings by projecting the high-dimensional space of initial data vectors into a lower-dimensional space, and items that are close in an embedding are more closely related than distant ones."}
  - {id: representation-and-transfer-learning-fine-tune, class: B, sources: [representation-and-transfer-learning-s2], verified: "2026-11-27", text: "Fine-tuning is a last, optional step: unfreezing the entire model and re-training it on the new data with a very low learning rate, only after the model with frozen layers has been trained to convergence. It can potentially achieve meaningful improvements by incrementally adapting the pretrained features to the new data."}
  - {id: representation-and-transfer-learning-fine-tune-overfit, class: A, sources: [representation-and-transfer-learning-s2], verified: "2026-11-27", text: "Fine-tuning trains a much larger model than the first round of training, on a dataset that is typically very small, so it is at risk of overfitting very quickly if large weight updates are applied."}
  - {id: representation-and-transfer-learning-self-supervised, class: A, sources: [representation-and-transfer-learning-s14, representation-and-transfer-learning-s5], verified: "2026-11-27", text: "Self-supervised learning is a family of techniques for converting an unsupervised machine learning problem into a supervised one by creating surrogate labels from unlabeled examples. BERT is designed to pre-train deep bidirectional representations from unlabeled text, and the pre-trained BERT model can be fine-tuned with just one additional output layer, without substantial task-specific architecture modifications."}
  - {id: representation-and-transfer-learning-fewer-labels, class: B, sources: [representation-and-transfer-learning-s4], verified: "2026-11-27", text: "The authors of SimCLR report that a linear classifier trained on its self-supervised representations achieves 76.5% top-1 accuracy on ImageNet, matching the performance of a supervised ResNet-50, and that when fine-tuned on only 1% of the labels it achieves 85.8% top-5 accuracy, outperforming AlexNet with 100 times fewer labels."}
  - {id: representation-and-transfer-learning-foundation, class: B, sources: [representation-and-transfer-learning-s6], verified: "2026-11-27", text: "Foundation models are models, such as BERT, DALL-E and GPT-3, that are trained on broad data at scale and are adaptable to a wide range of downstream tasks. They are based on standard deep learning and transfer learning."}
  - {id: representation-and-transfer-learning-inherit, class: A, sources: [representation-and-transfer-learning-s6], verified: "2026-11-27", text: "Homogenisation provides powerful leverage but demands caution, as the defects of the foundation model are inherited by all the adapted models downstream."}
  - {id: representation-and-transfer-learning-backdoor, class: A, sources: [representation-and-transfer-learning-s7], verified: "2026-11-27", text: "Many users outsource training or rely on pre-trained models that are then fine-tuned for a specific task. An adversary can create a backdoored neural network that has state-of-the-art performance on the user's training and validation samples but behaves badly on specific attacker-chosen inputs. The authors' backdoored street sign classifier identifies stop signs as speed limits when a special sticker is added, and the backdoor can persist even if the network is later retrained for another task."}
  - {id: representation-and-transfer-learning-bias, class: A, sources: [representation-and-transfer-learning-s8], verified: "2026-11-27", text: "The NIST AI Risk Management Framework states that use of pre-trained models that can advance research and improve performance can also increase levels of statistical uncertainty and cause issues with bias management, scientific validity, and reproducibility."}
  - {id: representation-and-transfer-learning-third-party, class: B, sources: [representation-and-transfer-learning-s8], verified: "2026-11-27", text: "The NIST AI Risk Management Framework includes that policies and procedures are in place that address AI risks associated with third-party entities, including risks of infringement of a third party's intellectual property or other rights (GOVERN 6.1), and that pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance (MANAGE 3.2)."}
  - {id: representation-and-transfer-learning-model-card, class: B, sources: [representation-and-transfer-learning-s9], verified: "2026-11-27", text: "On the Hugging Face Hub a model card should describe the model, its intended uses and potential limitations, including biases and ethical considerations, and which datasets were used to train it. Its metadata can state the model's licence and datasets, and a base_model field for a model that is a fine-tune, an adapter or a quantised version of a base model."}
  - {id: representation-and-transfer-learning-pickle, class: B, sources: [representation-and-transfer-learning-s10, representation-and-transfer-learning-s11, representation-and-transfer-learning-s12], verified: "2026-11-27", text: "Pickle is the default format for PyTorch model weights, and arbitrary code can be executed when a pickle file is loaded. Hugging Face suggests loading models from users and organisations you trust and relying on signed commits, which guarantee the origin of a file but not that it is safe. Safetensors is a format for storing tensors safely, as opposed to pickle. The PyTorch documentation states that torch.load() uses an unpickler and that data must never be loaded from an untrusted source."}
