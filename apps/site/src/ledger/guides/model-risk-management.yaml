sources:
  - {id: model-risk-management-s1, title: "Federal Reserve, FDIC and OCC: Supervisory Guidance on Model Risk Management, attachment to SR letter 26-2, 17 April 2026", url: "https://www.federalreserve.gov/supervisionreg/srletters/SR2602a1.pdf", kind: primary, vendor: false}
  - {id: model-risk-management-s2, title: "Federal Reserve: SR 26-2, Revised Guidance on Model Risk Management", url: "https://www.federalreserve.gov/supervisionreg/srletters/sr2602.htm", kind: primary, vendor: false, note: "States that it supersedes SR letter 11-7. The former SR 11-7 page returned not found. Checked 27 November 2026."}
  - {id: model-risk-management-s3, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: model-risk-management-s4, title: "NIST: AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework", kind: primary, vendor: false}
  - {id: model-risk-management-s5, title: "EUR-Lex: Regulation (EU) 2024/1689, Artificial Intelligence Act, consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false, note: "Incorporates Regulation (EU) 2026/1744. Checked 27 November 2026."}
  - {id: model-risk-management-s6, title: "Mitchell et al.: Model Cards for Model Reporting, FAT* 2019", url: "https://arxiv.org/abs/1810.03993", kind: primary, vendor: false}
claims:
  - {id: model-risk-management-superseded, class: C, sources: [model-risk-management-s2, model-risk-management-s1], verified: "2026-11-27", text: "SR letter 26-2, Revised Guidance on Model Risk Management, dated 17 April 2026, supersedes and replaces SR letter 11-7, Guidance on Model Risk Management, issued 4 April 2011. Its guidance is issued by the Federal Reserve, the FDIC and the OCC and is expected to be most relevant to banking organisations with over $30 billion in total assets."}
  - {id: model-risk-management-scope, class: C, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance states that it does not set forth enforceable standards or prescriptive requirements. It states that generative AI and agentic AI models are not within its scope, and that its principles apply to traditional statistical and quantitative models and to non-generative, non-agentic AI models."}
  - {id: model-risk-management-risk, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance uses the term model risk for the potential for adverse financial consequences associated with models, which may result from decisions made based on model output. It states that even a fundamentally sound model producing accurate outputs can exhibit high model risk if it is misapplied or misused."}
  - {id: model-risk-management-materiality, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "In the 2026 interagency guidance, model purpose together with model exposure determines model materiality. Models deemed of higher materiality warrant more comprehensive and rigorous oversight. For models deemed immaterial, model risk management may consist of identifying those models and monitoring model performance and the conditions under which their use may become material."}
  - {id: model-risk-management-inventory, class: B, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance describes it as common industry practice for banking organisations to maintain a comprehensive set of information for models under development or in use. An effective model inventory includes sufficient information to understand model risks, so as to support model risk management at the individual and aggregate levels."}
  - {id: model-risk-management-roles, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance states that model risk management benefits from clear roles and responsibilities with well-defined accountability, including with respect to potential conflicts of interest such as misaligned incentives between model development and validation groups. Sound governance practices delineate the individuals responsible for key activities throughout the model lifecycle, from development through validation and ongoing monitoring."}
  - {id: model-risk-management-purpose, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance states that an effective development process generally begins with a clear statement of purpose, and that using a model beyond its intended purpose introduces additional uncertainty and risk. When a model's use is extended beyond its original application, sound practice involves considering additional analysis of the new usage and its limitations, along with review of existing controls."}
  - {id: model-risk-management-challenge, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "The 2026 interagency guidance defines effective challenge as the critical analysis conducted by objective experts who evaluate model risk and effect appropriate changes throughout the model lifecycle. It is performed by individuals with the appropriate expertise, sufficient independence to maintain objectivity, and the organisational standing and influence to effect any change."}
  - {id: model-risk-management-validation, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "In the 2026 interagency guidance, model validation evaluates whether models perform as expected and includes an assessment of a model's reliability and its limitations. The nature and rigour of validation generally align with the model's approach, use and materiality. Validation generally occurs prior to a model's first use. The quality of validation depends on the rigour and effectiveness of the review rather than on the organisational structure of the risk management function."}
  - {id: model-risk-management-review, class: A, sources: [model-risk-management-s1], verified: "2026-11-27", text: "In the 2026 interagency guidance, the timing, nature and frequency of validation activities vary based on model purpose, model methodology, the frequency and scope of model changes, data limitations and other practical constraints. Ongoing model monitoring evaluates the extent to which a model is performing as expected given potential changes in products, exposures, activities, clients, data relevance or market conditions, and the frequency and scope of monitoring reports depend on the nature of the model, the availability of new data or modelling approaches, and model materiality."}
  - {id: model-risk-management-nist-inventory, class: A, sources: [model-risk-management-s3], verified: "2026-11-27", text: "NIST AI RMF Govern 1.6 has mechanisms in place to inventory AI systems, resourced according to organisational risk priorities. Govern 2.1 has roles and responsibilities and lines of communication related to mapping, measuring and managing AI risks documented and clear to individuals and teams throughout the organisation. Map 1.1 has intended purposes and the prospective settings in which the AI system will be deployed understood and documented."}
  - {id: model-risk-management-nist-independent, class: A, sources: [model-risk-management-s3], verified: "2026-11-27", text: "NIST AI RMF Measure 1.3 has internal experts who did not serve as front-line developers for the system, and/or independent assessors, involved in regular assessments and updates. Measure 2.9 has the AI model explained, validated and documented. Govern 1.3 has processes in place to determine the needed level of risk management activities based on the organisation's risk tolerance, and Govern 1.5 has periodic review planned, including determining its frequency."}
  - {id: model-risk-management-nist-status, class: C, sources: [model-risk-management-s4], verified: "2026-11-27", text: "The NIST AI Risk Management Framework is intended for voluntary use. It was released on 26 January 2023, and NIST states that the AI RMF 1.0 is being revised."}
  - {id: model-risk-management-model-cards, class: A, sources: [model-risk-management-s6], verified: "2026-11-27", text: "Mitchell et al. propose model cards: short documents accompanying trained machine learning models that provide benchmarked evaluation in a variety of conditions, such as across different cultural, demographic or phenotypic groups, and that disclose the context in which models are intended to be used and details of the performance evaluation procedures. Their stated aim is to clarify intended use cases and minimise usage in contexts for which models are not well suited."}
  - {id: model-risk-management-eu-high-risk, class: A, sources: [model-risk-management-s5], verified: "2026-11-27", text: "Under Article 6(2) of the EU AI Act, AI systems referred to in Annex III are considered high-risk. Annex III, point 5(b), lists AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score, with the exception of AI systems used for the purpose of detecting financial fraud. Under Article 6(3), an Annex III system that does not pose a significant risk of harm is not considered high-risk, but one that performs profiling of natural persons always is."}
  - {id: model-risk-management-eu-documentation, class: A, sources: [model-risk-management-s5], verified: "2026-11-27", text: "Article 11 of the EU AI Act requires the technical documentation of a high-risk AI system to be drawn up before the system is placed on the market or put into service and to be kept up to date. Annex IV has it include the intended purpose and the post-market monitoring plan. Article 49 requires the provider to register itself and an Annex III high-risk system in the EU database before placing it on the market or putting it into service, with the exception of systems under point 2 of Annex III. Article 72 requires providers to establish and document a post-market monitoring system proportionate to the nature of the AI technologies and the risks of the system."}
  - {id: model-risk-management-eu-oversight, class: A, sources: [model-risk-management-s5], verified: "2026-11-27", text: "Article 14 of the EU AI Act requires high-risk AI systems to be designed and developed so that they can be effectively overseen by natural persons during the period in which they are in use, with oversight measures commensurate with the risks, level of autonomy and context of use. Article 26(2) requires deployers to assign human oversight to natural persons who have the necessary competence, training and authority."}
  - {id: model-risk-management-eu-dates, class: C, sources: [model-risk-management-s5], verified: "2026-11-27", text: "As amended by Regulation (EU) 2026/1744, Article 113 of the EU AI Act applies Chapter III, Sections 1 to 3, which contain Articles 6, 11, 14 and 26, from 2 December 2027 for AI systems classified as high-risk under Article 6(2) and Annex III, and from 2 August 2028 for those classified under Article 6(1) and Annex I."}
