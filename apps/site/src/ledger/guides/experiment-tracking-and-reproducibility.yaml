  - {id: experiment-tracking-and-reproducibility-s12, title: "NIST AI 100-1: Artificial Intelligence Risk Management Framework (AI RMF 1.0)", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
claims:
  - {id: experiment-tracking-and-reproducibility-definition, class: A, sources: [experiment-tracking-and-reproducibility-s10], verified: "2026-11-27", text: "Reproducibility is obtaining similar results as presented in a paper or talk, using the same code and data when available. It is a necessary step to verify the reliability of research findings."}
  - {id: experiment-tracking-and-reproducibility-run, class: B, sources: [experiment-tracking-and-reproducibility-s1], verified: "2026-11-27", text: "MLflow Tracking is an API and UI for logging parameters, code versions, metrics and output files. Each run records metadata such as metrics, parameters and start and end times, and artifacts such as model weights. An experiment groups runs and models for a specific task."}
  - {id: experiment-tracking-and-reproducibility-commit, class: B, sources: [experiment-tracking-and-reproducibility-s2], verified: "2026-11-27", text: "MLflow automatically sets system tags that capture execution context. They include the source file or notebook name and, when the run starts from a git repository, the git commit hash."}
  - {id: experiment-tracking-and-reproducibility-dataset, class: B, sources: [experiment-tracking-and-reproducibility-s3], verified: "2026-11-27", text: "An MLflow dataset logged to a run carries a name, an automatically computed digest that fingerprints it, a source with lineage to the original data location, and optionally a schema and a profile. The documentation gives lineage and reproducing experiments with identical datasets as purposes."}
  - {id: experiment-tracking-and-reproducibility-artifacts, class: B, sources: [experiment-tracking-and-reproducibility-s4, experiment-tracking-and-reproducibility-s5], verified: "2026-11-27", text: "W&B Artifacts track and version data as the inputs and outputs of runs, for example a dataset going into a training run and a trained model coming out. A new artifact gets the alias v0. Logging again to the same artifact checksums the contents, and if the artifact changed a new version v1 is saved."}
  - {id: experiment-tracking-and-reproducibility-dvc, class: B, sources: [experiment-tracking-and-reproducibility-s6], verified: "2026-11-27", text: "DVC stores information about a tracked data file in a small .dvc metadata file that stands in for the data in Git, so the metadata is versioned alongside source code. A hash of the file determines its cache path. A git checkout followed by dvc checkout syncs that version of the data into the workspace."}
  - {id: experiment-tracking-and-reproducibility-environment, class: B, sources: [experiment-tracking-and-reproducibility-s7], verified: "2026-11-27", text: "When a model is logged, MLflow automatically logs conda.yaml, python_env.yaml and requirements.txt for environment recreation. These files can be used to reinstall dependencies. The MLmodel file can carry the ID of the run that created the model."}
  - {id: experiment-tracking-and-reproducibility-nondeterminism, class: B, sources: [experiment-tracking-and-reproducibility-s8], verified: "2026-11-27", text: "The PyTorch documentation states that completely reproducible results are not guaranteed across PyTorch releases, individual commits or different platforms, and that results may not be reproducible between CPU and GPU executions even with identical seeds. Seeding and avoiding nondeterministic algorithms limit the sources of nondeterministic behaviour."}
  - {id: experiment-tracking-and-reproducibility-registry, class: B, sources: [experiment-tracking-and-reproducibility-s9], verified: "2026-11-27", text: "The MLflow Model Registry records lineage for a model, meaning which MLflow experiment and run produced it. A registered model has a unique name and contains versions, aliases, tags and other metadata. An alias is a mutable, named reference to one version."}
  - {id: experiment-tracking-and-reproducibility-provenance, class: A, sources: [experiment-tracking-and-reproducibility-s12], verified: "2026-11-27", text: "The NIST AI Risk Management Framework states that maintaining the provenance of training data and supporting attribution of an AI system's decisions to subsets of training data can assist with both transparency and accountability."}
  - {id: experiment-tracking-and-reproducibility-logs, class: C, sources: [experiment-tracking-and-reproducibility-s11], verified: "2026-11-27", text: "Article 12 of Regulation (EU) 2024/1689, in the consolidated text of 27 July 2026, requires high-risk AI systems to technically allow the automatic recording of events (logs) over the lifetime of the system, for a level of traceability appropriate to the intended purpose. Under Article 113 as amended, the requirements for high-risk systems apply from 2 December 2027 for systems under Annex III and from 2 August 2028 for systems under Annex I."}
