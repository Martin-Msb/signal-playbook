claims:
  - {id: cost-latency-and-model-choice-latency, class: A, sources: [cost-latency-and-model-choice-s3], verified: "2026-11-27", text: "Latency is the time it takes a model to process a prompt and generate an output. It can be influenced by the size of the model, the complexity of the prompt and the underlying infrastructure."}
  - {id: cost-latency-and-model-choice-ttft, class: A, sources: [cost-latency-and-model-choice-s3], verified: "2026-11-27", text: "Time to first token measures the time it takes the model to generate the first token of the response from when the prompt was sent. Streaming lets the model start sending back its response before the full output is complete."}
  - {id: cost-latency-and-model-choice-fewer-tokens, class: A, sources: [cost-latency-and-model-choice-s3], verified: "2026-11-27", text: "The fewer tokens the model has to process and generate, the faster the response will be."}
  - {id: cost-latency-and-model-choice-criteria, class: B, sources: [cost-latency-and-model-choice-s2], verified: "2026-11-27", text: "Choosing a Claude model means balancing capabilities, speed and cost. Anthropic describes starting with a faster, more cost-effective model and upgrading only for specific capability gaps, or starting with a more capable model and optimising to more efficient models later."}
  - {id: cost-latency-and-model-choice-prices, class: C, sources: [cost-latency-and-model-choice-s1], verified: "2026-11-27", text: "Anthropic lists Claude Opus 5.5 at $4 per million input tokens and $20 per million output tokens, and Claude Haiku 5.5 at $0.10 and $0.50 for prompts up to 100,000 tokens. Prompts over 100,000 tokens on Claude Haiku 5.5 pay $0.50 and $2.50."}
  - {id: cost-latency-and-model-choice-fastest-tier, class: C, sources: [cost-latency-and-model-choice-s2, cost-latency-and-model-choice-s3], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that for speed-critical applications Claude Haiku 5.5 offers the fastest response times, and names it as the starting model when the lowest latency and price are needed."}
  - {id: cost-latency-and-model-choice-test-switch, class: B, sources: [cost-latency-and-model-choice-s2], verified: "2026-11-27", text: "To decide whether to change models, Anthropic advises creating benchmark tests specific to the use case, testing with actual prompts and data, comparing accuracy, response quality and handling of edge cases, and weighing performance and cost tradeoffs."}
  - {id: cost-latency-and-model-choice-multimodel, class: B, sources: [cost-latency-and-model-choice-s2], verified: "2026-11-27", text: "Multimodel strategies pair a lower-cost model with a frontier model so that most tokens are billed at the lower rate."}
  - {id: cost-latency-and-model-choice-routing, class: B, sources: [cost-latency-and-model-choice-s9], verified: "2026-11-27", text: "RouteLLM proposes router models that select between a stronger and a weaker LLM during inference to balance cost and response quality. Its authors report cost reductions of over 2 times in certain cases without compromising the quality of responses."}
  - {id: cost-latency-and-model-choice-tune-first, class: B, sources: [cost-latency-and-model-choice-s8], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic advises tuning one model before adding a second, and building a pairing of models only if it beats the single model's whole curve of score against spend."}
  - {id: cost-latency-and-model-choice-cache, class: A, sources: [cost-latency-and-model-choice-s4, cost-latency-and-model-choice-s11], verified: "2026-11-27", text: "Prompt caching lets the API resume from specific prefixes in a prompt, which reduces processing time and costs for repetitive tasks or prompts with consistent elements. OpenAI states that cache reuse requires the entire rendered prefix to match, and advises putting stable instructions and shared reference material first."}
  - {id: cost-latency-and-model-choice-cache-price, class: C, sources: [cost-latency-and-model-choice-s1], verified: "2026-11-27", text: "On the Claude API a 5-minute cache write costs 1.25 times the base input price, and a cache read costs 0.1 times on most models and 0.05 times on Claude Opus 5.5. A cache read is $0.01 per million tokens on Claude Haiku 5.5 and $0.20 on Claude Opus 5.5. With the 5-minute duration, caching saves money after one cache read."}
  - {id: cost-latency-and-model-choice-cache-life, class: C, sources: [cost-latency-and-model-choice-s4], verified: "2026-11-27", text: "By default the Claude API prompt cache has a 5-minute lifetime, refreshed at no additional cost each time the cached content is used. A 1-hour cache duration is available at additional cost."}
  - {id: cost-latency-and-model-choice-cache-rate, class: B, sources: [cost-latency-and-model-choice-s6], verified: "2026-11-27", text: "The Claude API's default input tokens per minute rate limits count only uncached input tokens. Tokens read from the cache do not count toward the limit."}
  - {id: cost-latency-and-model-choice-batch, class: B, sources: [cost-latency-and-model-choice-s5, cost-latency-and-model-choice-s10], verified: "2026-11-27", text: "The Message Batches API processes large volumes of Messages requests asynchronously and is suited to tasks that do not require immediate responses. Batch results come back as a single file, not a stream. OpenAI describes its Batch API as ideal for jobs that do not require immediate responses, such as running evaluations."}
  - {id: cost-latency-and-model-choice-batch-price, class: C, sources: [cost-latency-and-model-choice-s1, cost-latency-and-model-choice-s5, cost-latency-and-model-choice-s10], verified: "2026-11-27", text: "Anthropic charges Message Batches usage at 50 percent of standard API prices, which makes Claude Opus 5.5 $2 per million input tokens and $10 per million output tokens in a batch. OpenAI states a 50 percent cost discount for its Batch API compared to synchronous APIs."}
  - {id: cost-latency-and-model-choice-batch-time, class: C, sources: [cost-latency-and-model-choice-s5, cost-latency-and-model-choice-s10], verified: "2026-11-27", text: "Most Message Batches complete within 1 hour, and a batch expires if processing does not complete within 24 hours. OpenAI states that each batch completes within 24 hours."}
  - {id: cost-latency-and-model-choice-rate-limits, class: B, sources: [cost-latency-and-model-choice-s6], verified: "2026-11-27", text: "Rate limits for the Claude Messages API are measured in requests per minute, input tokens per minute and output tokens per minute for each model class. Exceeding a rate limit returns a 429 error."}
  - {id: cost-latency-and-model-choice-spend-limits, class: B, sources: [cost-latency-and-model-choice-s6], verified: "2026-11-27", text: "Spend limits set a maximum monthly cost an organisation can incur for API usage. Custom spend and rate limits can be set for each workspace to protect the organisation's workspaces from potential overuse."}
  - {id: cost-latency-and-model-choice-unbounded, class: A, sources: [cost-latency-and-model-choice-s14], verified: "2026-11-27", text: "OWASP describes Unbounded Consumption as occurring when an LLM application allows excessive and uncontrolled inferences, with risks of denial of service, economic losses, model theft and service degradation. Its listed mitigations include rate limiting and user quotas, timeouts and throttling."}
  - {id: cost-latency-and-model-choice-retirement, class: B, sources: [cost-latency-and-model-choice-s7], verified: "2026-11-27", text: "Anthropic regularly retires older models. A deprecated model is given a recommended replacement and a retirement date, and requests to a retired model fail. Anthropic advises testing applications with newer models well before the retirement date."}
  - {id: cost-latency-and-model-choice-retirement-notice, class: C, sources: [cost-latency-and-model-choice-s7], verified: "2026-11-27", text: "Anthropic provides at least 60 days' notice before retiring a publicly released model. Claude Opus 5.5 is listed as active, with retirement not sooner than September 22, 2027."}
  - {id: cost-latency-and-model-choice-fallbacks, class: B, sources: [cost-latency-and-model-choice-s15], verified: "2026-11-27", text: "The NIST Generative AI Profile calls for contingency processes to handle failures or incidents in third-party data or AI systems deemed to be high-risk. Its suggested actions include documenting value chain risks to identify over-reliance on third-party data and to identify fallbacks, testing and managing rollover and fallback technologies, and reviewing vendor contracts."}
  - {id: cost-latency-and-model-choice-open-weight, class: B, sources: [cost-latency-and-model-choice-s12, cost-latency-and-model-choice-s16], verified: "2026-11-27", text: "vLLM is a library for LLM inference and serving, with an OpenAI-compatible API server and continuous batching of incoming requests. OpenAI describes its gpt-oss series as open-weight models, makes the weights downloadable from the Hugging Face Hub, and documents serving them through vLLM."}
  - {id: cost-latency-and-model-choice-open-weight-size, class: C, sources: [cost-latency-and-model-choice-s16], verified: "2026-11-27", flags: [vendor-stated], text: "OpenAI states that gpt-oss-120b fits into a single 80 GB GPU and that gpt-oss-20b runs within 16 GB of memory and is for lower latency and local or specialised use cases."}
  - {id: cost-latency-and-model-choice-instance-hours, class: B, sources: [cost-latency-and-model-choice-s13], verified: "2026-11-27", text: "Hugging Face Inference Endpoints are charged at an hourly rate for the selected instance type, calculated by the minute, for the compute used while an endpoint is initialising or running."}
