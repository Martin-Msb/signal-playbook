sources:
  - {id: guardrails-s1, title: "OpenAI: Agents SDK, Guardrails", url: "https://openai.github.io/openai-agents-python/guardrails/", kind: primary, vendor: true}
  - {id: guardrails-s2, title: "NVIDIA: NeMo Guardrails, Guardrail types", url: "https://docs.nvidia.com/nemo/guardrails/latest/about-nemo-guardrails-library/rail-types", kind: primary, vendor: true}
  - {id: guardrails-s3, title: "Inan et al.: Llama Guard, LLM-based Input-Output Safeguard for Human-AI Conversations", url: "https://arxiv.org/abs/2312.06674", kind: primary, vendor: false}
  - {id: guardrails-s4, title: "OpenAI: Moderation guide", url: "https://developers.openai.com/api/docs/guides/moderation", kind: primary, vendor: true}
  - {id: guardrails-s5, title: "Microsoft: Prompt Shields in Azure AI Content Safety", url: "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection", kind: primary, vendor: true}
  - {id: guardrails-s6, title: "Presidio: Data protection and de-identification SDK", url: "https://presidio.dataprivacystack.org/", kind: primary, vendor: false}
  - {id: guardrails-s7, title: "AWS: Detect and filter harmful content by using Amazon Bedrock Guardrails", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html", kind: primary, vendor: true}
  - {id: guardrails-s8, title: "OWASP: LLM01:2025 Prompt Injection", url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/", kind: primary, vendor: false}
  - {id: guardrails-s9, title: "arXiv: The Attacker Moves Second, Stronger Adaptive Attacks Bypass Defenses Against LLM Jailbreaks and Prompt Injections", url: "https://arxiv.org/abs/2510.09023", kind: primary, vendor: false}
  - {id: guardrails-s10, title: "Sharma et al.: Constitutional Classifiers, Defending against Universal Jailbreaks across Thousands of Hours of Red Teaming", url: "https://arxiv.org/abs/2501.18837", kind: primary, vendor: true}
  - {id: guardrails-s11, title: "NIST: AI 600-1, Artificial Intelligence Risk Management Framework, Generative Artificial Intelligence Profile", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
claims:
  - {id: guardrails-definition, class: A, sources: [guardrails-s1], verified: "2026-11-27", text: "Guardrails do checks and validations of user input and agent output. Input guardrails run on the initial user input, and output guardrails run on the final agent output."}
  - {id: guardrails-tripwire, class: B, sources: [guardrails-s1], verified: "2026-11-27", text: "In the OpenAI Agents SDK, a guardrail signals a failed input or output with a tripwire and the runner raises an exception. A blocking input guardrail runs and completes before the agent starts. A parallel one runs concurrently with the agent, and the model may already have started before the guardrail completes."}
  - {id: guardrails-rails, class: B, sources: [guardrails-s2], verified: "2026-11-27", text: "In NeMo Guardrails, input rails validate and sanitise user input before the model is called, with uses such as jailbreak detection and masking of personal data. Output rails filter, edit or block unsafe or off-policy content before it reaches users."}
  - {id: guardrails-llama-guard, class: B, sources: [guardrails-s3], verified: "2026-11-27", text: "Llama Guard is an LLM-based input-output safeguard model. It uses a safety risk taxonomy to classify prompts and to classify the responses generated to them, and its taxonomy categories can be adjusted to a specific use case."}
  - {id: guardrails-moderation, class: B, sources: [guardrails-s4], verified: "2026-11-27", text: "The OpenAI moderation endpoint classifies text and image inputs for harmful content in categories that include harassment, hate, illicit, self-harm, sexual and violence. It returns a flagged boolean, a boolean per category and a score per category from 0 to 1."}
  - {id: guardrails-scores-signals, class: B, sources: [guardrails-s4], verified: "2026-11-27", text: "OpenAI states that moderation scores are signals for the application's policy, not an automatic blocking decision, that categories and scores serve logging, routing, audit trails or human review, and that policies relying on category scores may need recalibration as the model is upgraded."}
  - {id: guardrails-prompt-shields, class: B, sources: [guardrails-s5], verified: "2026-11-27", text: "Azure AI Content Safety Prompt Shields analyse text for user prompt attacks and for document attacks, which are instructions embedded in documents, emails or web pages. They do not determine whether content is harmful, factually accurate or compliant with policy."}
  - {id: guardrails-pii, class: B, sources: [guardrails-s6], verified: "2026-11-27", text: "Presidio identifies and anonymises private entities in text and images, such as credit card numbers, names, locations and phone numbers. Its recognisers use named entity recognition, regular expressions, rule based logic and checksums."}
  - {id: guardrails-pii-no-guarantee, class: A, sources: [guardrails-s6], verified: "2026-11-27", text: "Presidio detects automatically, and its documentation states that there is no guarantee it will find all sensitive information."}
  - {id: guardrails-policy-filters, class: B, sources: [guardrails-s7], verified: "2026-11-27", text: "Amazon Bedrock Guardrails evaluates input prompts and model completions against configured filters: content filters, denied topics, word filters, sensitive information filters that block or mask personal data, and contextual grounding checks. A configured message is returned to the user when an input or a response violates a filter."}
  - {id: guardrails-owasp, class: B, sources: [guardrails-s8], verified: "2026-11-27", text: "OWASP lists input and output filtering among the mitigations for prompt injection: define sensitive categories, construct rules for identifying and handling such content, and apply semantic filters and string checking. It states that it is unclear if there are fool-proof methods of prevention for prompt injection."}
  - {id: guardrails-adaptive, class: B, sources: [guardrails-s9], verified: "2026-11-27", text: "Adaptive attacks bypassed 12 recent defences against jailbreaks and prompt injections, with an attack success rate above 90% for most. The majority of those defences had originally reported near-zero attack success rates."}
  - {id: guardrails-cost, class: C, sources: [guardrails-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Constitutional Classifiers are safeguards trained on synthetic data generated from natural language rules that specify permitted and restricted content. Their authors at Anthropic report an absolute 0.38% increase in production-traffic refusals and a 23.7% inference overhead."}
  - {id: guardrails-acceptable-use, class: A, sources: [guardrails-s11], verified: "2026-11-27", text: "NIST AI 600-1 suggests that organisations define acceptable use policies for generative AI interfaces, including criteria for the kinds of queries generative AI applications should refuse to respond to."}
  - {id: guardrails-review, class: B, sources: [guardrails-s11], verified: "2026-11-27", text: "NIST AI 600-1 suggests regularly reviewing security and safety guardrails, especially if the system is operated in novel circumstances, and using human moderation systems where appropriate to review generated content."}
