claims:
  - {id: execution-environments-code-tool, class: B, sources: [execution-environments-s1], verified: "2026-11-27", text: "Anthropic's code execution tool lets the model run Bash commands and manipulate files in a sandboxed container. The container has no internet access, so only pre-installed libraries are available, and each request runs in a new container unless an earlier response's container ID is passed back."}
  - {id: execution-environments-os-boundary, class: B, sources: [execution-environments-s3], verified: "2026-11-27", text: "Claude Code's Bash sandbox is a boundary that the operating system enforces around the shell commands the agent runs. The commands start inside the boundary, and so do the processes they start. It uses Seatbelt on macOS and bubblewrap on Linux."}
  - {id: execution-environments-both-layers, class: A, sources: [execution-environments-s4], verified: "2026-11-27", text: "Anthropic states that effective sandboxing requires both filesystem and network isolation. Without network isolation a compromised agent could exfiltrate sensitive files such as SSH keys, and without filesystem isolation a compromised agent could escape the sandbox and gain network access."}
  - {id: execution-environments-namespaces, class: A, sources: [execution-environments-s5], verified: "2026-11-27", text: "Docker's documentation states that namespaces provide the first and most straightforward form of isolation: processes running within a container cannot see, and even less affect, processes running in another container. Control groups ensure each container gets its fair share of memory, CPU and disk I/O."}
  - {id: execution-environments-host-kernel, class: A, sources: [execution-environments-s6], verified: "2026-11-27", text: "gVisor's documentation states that with Linux kernel security primitives such as namespaces and seccomp filters, enforcement is still done by the single monolithic Linux kernel that the sandboxed application can still talk to, so the workload is only one system call away from host compromise. A virtual machine acts as a strong security boundary at a steep cost in resource overhead."}
  - {id: execution-environments-gvisor, class: A, sources: [execution-environments-s7], verified: "2026-11-27", text: "gVisor is an application kernel that implements a Linux-like interface, is written in Go and runs in userspace. It intercepts application system calls and acts as the guest kernel. Its runsc executable implements the Open Container Initiative runtime specification."}
  - {id: execution-environments-firecracker, class: A, sources: [execution-environments-s8], verified: "2026-11-27", text: "Firecracker is an open source virtualization technology that runs in user space and uses the Linux Kernel-based Virtual Machine (KVM) to create microVMs: lightweight virtual machines with the speed and resource efficiency of containers. Its jailer provides a second line of defence in case the virtualization barrier is ever compromised."}
  - {id: execution-environments-file-policy, class: B, sources: [execution-environments-s3], verified: "2026-11-27", text: "By default Claude Code's sandboxed Bash tool has read and write access to the current working directory and its subdirectories. Its default read access covers most of the machine, including credential files such as ~/.ssh, unless those credentials are protected by configuration."}
  - {id: execution-environments-egress-proxy, class: B, sources: [execution-environments-s3], verified: "2026-11-27", text: "In Claude Code's sandbox a command has no direct route to the network. A proxy that runs outside the sandbox checks the hostname of each connection against the allowed and denied domains."}
  - {id: execution-environments-credentials, class: B, sources: [execution-environments-s3, execution-environments-s4], verified: "2026-11-27", text: "When a credential is masked in Claude Code's sandbox, sandboxed commands see a per-session placeholder and the sandbox proxy substitutes the real value on outbound requests to allowed hosts. In Claude Code on the web, sensitive credentials such as git credentials or signing keys are never inside the sandbox: a proxy attaches the authentication token."}
  - {id: execution-environments-computer-use, class: B, sources: [execution-environments-s2, execution-environments-s9], verified: "2026-11-27", text: "Anthropic's computer use tool provides screenshot capabilities and mouse and keyboard control for autonomous desktop interaction. OpenAI's computer use lets a model operate a browser or desktop interface in a loop: send a task, execute the returned actions, return a screenshot."}
  - {id: execution-environments-page-injection, class: A, sources: [execution-environments-s2, execution-environments-s9], verified: "2026-11-27", text: "Anthropic states that instructions on webpages or contained in images might override the developer's instructions or cause the model to make mistakes, and advises isolating the model from sensitive data and actions. OpenAI's guide says to treat screen content as untrusted."}
  - {id: execution-environments-precautions, class: B, sources: [execution-environments-s2, execution-environments-s9], verified: "2026-11-27", text: "Anthropic's precautions for computer use are a dedicated virtual machine or container with minimal privileges, no access to sensitive data such as account login information, internet access limited to an allowlist of domains, and a human confirming decisions with meaningful real-world consequences. OpenAI's guide says to use an isolated browser or VM and an allow list of sites and actions, and to keep credentials out of page text and screenshots."}
  - {id: execution-environments-excessive-agency, class: A, sources: [execution-environments-s10], verified: "2026-11-27", text: "OWASP defines Excessive Agency as the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM. Its root causes are excessive functionality, excessive permissions and excessive autonomy, and its mitigations include limiting permissions to the minimum necessary and requiring a human to approve high-impact actions."}
