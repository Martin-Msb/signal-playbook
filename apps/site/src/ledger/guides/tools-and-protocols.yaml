claims:
  - {id: tools-and-protocols-purpose, class: A, sources: [tools-and-protocols-s1], verified: "2026-11-27", text: "The Model Context Protocol is an open protocol that enables integration between LLM applications and external data sources and tools. It takes inspiration from the Language Server Protocol, which standardises how to add support for programming languages across a whole ecosystem of development tools, and in a similar way standardises how to integrate additional context and tools into the ecosystem of AI applications."}
  - {id: tools-and-protocols-roles, class: A, sources: [tools-and-protocols-s1, tools-and-protocols-s2], verified: "2026-11-27", text: "The protocol uses JSON-RPC 2.0 messages between hosts, which are LLM applications that initiate connections, clients, which are connectors within the host application, and servers, which are services that provide context and capabilities. A host application creates and manages multiple clients, and each client has a 1:1 relationship with a particular server. Servers can be local processes or remote services."}
  - {id: tools-and-protocols-tools, class: A, sources: [tools-and-protocols-s3], verified: "2026-11-27", text: "MCP servers expose tools that can be invoked by language models. Clients send a tools/list request to discover available tools and a tools/call request, carrying the tool name and arguments, to invoke one. A tool definition includes a name that uniquely identifies it, a description of its functionality and an inputSchema, a JSON Schema defining the expected parameters."}
  - {id: tools-and-protocols-composable, class: A, sources: [tools-and-protocols-s2], verified: "2026-11-27", text: "The MCP design principles state that servers should be highly composable: each server provides focused functionality in isolation, multiple servers can be combined, and the shared protocol enables interoperability. Servers should not be able to read the whole conversation or see into other servers: they receive only necessary contextual information and the full conversation history stays with the host."}
  - {id: tools-and-protocols-revision, class: C, sources: [tools-and-protocols-s1, tools-and-protocols-s2], verified: "2026-11-27", text: "The current revision of the MCP specification is 2026-07-28. In this revision MCP is a stateless protocol: every request is self-contained and carries its own protocol version and capabilities, and servers advertise their capabilities in response to server/discover."}
  - {id: tools-and-protocols-small-sets, class: B, sources: [tools-and-protocols-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic states that more tools do not always lead to better outcomes and recommends building a few thoughtful tools targeting specific high-impact workflows. When tools overlap in function or have a vague purpose, agents can get confused about which ones to use. Namespacing, grouping related tools under common prefixes, can help delineate boundaries between lots of tools."}
  - {id: tools-and-protocols-a2a, class: B, sources: [tools-and-protocols-s6, tools-and-protocols-s8], verified: "2026-11-27", text: "The Agent2Agent protocol is designed to facilitate communication and interoperability between independent, potentially opaque AI agent systems, without needing access to each other's internal state, memory or tools. The A2A project describes the two protocols as complementary: A2A connects agents to each other, and MCP connects each agent to its own tools. The fundamental unit of work managed by A2A is a task."}
  - {id: tools-and-protocols-agent-card, class: B, sources: [tools-and-protocols-s7], verified: "2026-11-27", text: "An A2A server describes itself in an Agent Card, a JSON document that gives its identity, its service endpoint, its skills and the authentication schemes it requires. The standard path for the card is /.well-known/agent-card.json on the agent server's domain."}
  - {id: tools-and-protocols-skills, class: B, sources: [tools-and-protocols-s9], verified: "2026-11-27", text: "An Agent Skill is a directory containing, at minimum, a SKILL.md file with YAML frontmatter, where name and description are required, followed by Markdown instructions. Agents load skills progressively: the name and description are loaded at startup for all skills, the full SKILL.md body is loaded when the skill is activated, and other files such as scripts and references are loaded only when required."}
  - {id: tools-and-protocols-untrusted, class: A, sources: [tools-and-protocols-s1, tools-and-protocols-s3], verified: "2026-11-27", text: "The MCP specification states that tools represent arbitrary code execution and must be treated with appropriate caution, and that descriptions of tool behaviour such as annotations should be considered untrusted unless obtained from a trusted server."}
  - {id: tools-and-protocols-supply-chain, class: A, sources: [tools-and-protocols-s5], verified: "2026-11-27", text: "Local MCP servers are binaries downloaded and executed on the same machine as the MCP client. Without sandboxing and consent, an attacker can distribute a malicious payload inside the server itself or include a malicious startup command in a client configuration. A client that supports one-click local server configuration must show the exact command that will be executed and require explicit user approval, and should execute server commands in a sandboxed environment with minimal default privileges."}
  - {id: tools-and-protocols-auth, class: A, sources: [tools-and-protocols-s4], verified: "2026-11-27", text: "Authorisation is optional in MCP and, for HTTP-based transports, is based on OAuth 2.1. A protected MCP server acts as an OAuth 2.1 resource server and the MCP client as an OAuth 2.1 client. Authorisation must be included in every HTTP request from client to server, and servers must validate that access tokens were issued specifically for them as the intended audience."}
  - {id: tools-and-protocols-scopes, class: A, sources: [tools-and-protocols-s3, tools-and-protocols-s4], verified: "2026-11-27", text: "The set of tools a server returns from tools/list may vary by the authorisation presented on the request, for example returning only the tools the caller's granted scopes permit. Clients should follow the principle of least privilege by requesting only the scopes necessary for their intended operations, and a server should answer a request whose token has insufficient scope with HTTP 403 Forbidden and the scopes needed."}
  - {id: tools-and-protocols-consent, class: A, sources: [tools-and-protocols-s3], verified: "2026-11-27", text: "The MCP specification states that there should always be a human in the loop with the ability to deny tool invocations. Clients should prompt for user confirmation on sensitive operations, show tool inputs to the user before calling the server, and log tool usage for audit purposes. Servers must validate all tool inputs and implement proper access controls."}
  - {id: tools-and-protocols-passthrough, class: A, sources: [tools-and-protocols-s4, tools-and-protocols-s5], verified: "2026-11-27", text: "Token passthrough is an anti-pattern in which an MCP server accepts tokens that were not issued to it and passes them through to a downstream API. MCP servers must not accept or transit tokens that were not explicitly issued for them. The security guidance lists wildcard or omnibus scopes as a common mistake and recommends a minimal initial scope set with incremental elevation."}
