sources:
  - {id: keyword-search-s1, title: "Apache Lucene 10.0.0: Index file formats", url: "https://lucene.apache.org/core/10_0_0/core/org/apache/lucene/codecs/lucene100/package-summary.html", kind: primary, vendor: false}
  - {id: keyword-search-s2, title: "Apache Lucene 10.0.0: Package org.apache.lucene.index", url: "https://lucene.apache.org/core/10_0_0/core/org/apache/lucene/index/package-summary.html", kind: primary, vendor: false}
  - {id: keyword-search-s3, title: "Apache Lucene 10.0.0: BM25Similarity", url: "https://lucene.apache.org/core/10_0_0/core/org/apache/lucene/search/similarities/BM25Similarity.html", kind: primary, vendor: false}
  - {id: keyword-search-s4, title: "Apache Lucene 10.0.0: Package org.apache.lucene.analysis", url: "https://lucene.apache.org/core/10_0_0/core/org/apache/lucene/analysis/package-summary.html", kind: primary, vendor: false}
  - {id: keyword-search-s5, title: "Robertson and Zaragoza: The Probabilistic Relevance Framework, BM25 and Beyond", url: "https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf", kind: primary, vendor: false}
  - {id: keyword-search-s6, title: "Elastic: Similarity settings", url: "https://www.elastic.co/docs/reference/elasticsearch/index-settings/similarity", kind: primary, vendor: true}
  - {id: keyword-search-s7, title: "Elastic: Near real-time search", url: "https://www.elastic.co/docs/manage-data/data-store/near-real-time-search", kind: primary, vendor: true}
  - {id: keyword-search-s8, title: "Elastic: Controlling access at the document and field level", url: "https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/controlling-access-at-document-field-level", kind: primary, vendor: true}
  - {id: keyword-search-s9, title: "Microsoft Learn: Security filter pattern, Foundry IQ (Azure AI Search)", url: "https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search", kind: primary, vendor: true}
  - {id: keyword-search-s10, title: "Microsoft Learn: BM25 relevance scoring, Foundry IQ (Azure AI Search)", url: "https://learn.microsoft.com/en-us/azure/search/index-similarity-and-scoring", kind: primary, vendor: true}
claims:
  - {id: keyword-search-inverted, class: A, sources: [keyword-search-s1], verified: "2026-11-27", text: "Lucene's index stores terms and statistics about those terms in order to make term-based search more efficient. It falls into the family of indexes known as an inverted index, because it can list, for a term, the documents that contain it. This is the inverse of the natural relationship, in which documents list terms."}
  - {id: keyword-search-postings, class: A, sources: [keyword-search-s1, keyword-search-s2], verified: "2026-11-27", text: "A Lucene index holds a dictionary containing all of the terms used in all of the indexed fields of all of the documents and, for each term, the numbers of all the documents that contain that term. A postings enumeration iterates over the list of documents for a term, with a term frequency for each document, and can iterate the positions at which the term occurred."}
  - {id: keyword-search-docfreq, class: A, sources: [keyword-search-s2], verified: "2026-11-27", text: "For each term Lucene returns the number of documents that contain at least one occurrence of the term."}
  - {id: keyword-search-analysis, class: A, sources: [keyword-search-s4], verified: "2026-11-27", text: "Plain text passed to Lucene for indexing goes through tokenization, the process of breaking input text into small indexing elements called tokens. Analysis after tokenization can include stemming, stop word filtering, text normalisation and synonym expansion. Lucene's guidance is to start with the same analyzer for indexing and search, otherwise searches would not find what they are supposed to."}
  - {id: keyword-search-tfidf, class: B, sources: [keyword-search-s10], verified: "2026-11-27", text: "BM25 is a TF-IDF-like retrieval function that uses term frequency and inverse document frequency to calculate a relevance score for each document-query pair, which is then used for ranking results. The search score goes up if the term is rare across the index but common within the document."}
  - {id: keyword-search-saturation, class: A, sources: [keyword-search-s5], verified: "2026-11-27", text: "In BM25 any one term's contribution to the document score cannot exceed a saturation point, however frequently it occurs in the document. Without relevance information the BM25 weight is a product of two components, one based on term frequency and one on inverse document frequency, and the full document score is obtained by summing the term weights over the query terms."}
  - {id: keyword-search-length, class: A, sources: [keyword-search-s5], verified: "2026-11-27", text: "BM25 normalises term frequency by the document length relative to the average document length before applying the saturation function. Setting b = 1 performs full document-length normalisation and b = 0 switches normalisation off. Experiments suggest that values such as 0.5 < b < 0.8 and 1.2 < k1 < 2 are reasonably good in many circumstances."}
  - {id: keyword-search-params, class: C, sources: [keyword-search-s3, keyword-search-s6], verified: "2026-11-27", text: "In Lucene 10.0.0, BM25Similarity defaults to k1 = 1.2 and b = 0.75. k1 controls non-linear term frequency normalisation (saturation) and b controls to what degree document length normalises tf values. Elasticsearch documents BM25 as its default similarity, with the same default values."}
  - {id: keyword-search-lucene-based, class: B, sources: [keyword-search-s7], verified: "2026-11-27", text: "Elasticsearch is based on the Lucene Java libraries. Lucene introduced per-segment search, and a segment is similar to an inverted index."}
  - {id: keyword-search-dls, class: B, sources: [keyword-search-s8], verified: "2026-11-27", text: "In Elasticsearch, document level security restricts which documents can be accessed from document-based read APIs. A role's document query uses the same format as a query in a search request, and documents that do not match the role query are never returned."}
  - {id: keyword-search-security-filter, class: B, sources: [keyword-search-s9], verified: "2026-11-27", text: "In the security filter pattern of Foundry IQ (Azure AI Search), each document carries a field of group or user identities, and a filter on that field includes or excludes the document from the search results. Document-level authorisation is enforced by applying the security filter to every query, and the application must authenticate users, obtain trusted principal values and prevent bypasses."}
  - {id: keyword-search-filter-stats, class: B, sources: [keyword-search-s10, keyword-search-s8], verified: "2026-11-27", text: "In Foundry IQ (Azure AI Search), filters and document-level permissions enforced at query time limit which documents a query returns, but they do not change the statistics that BM25 uses to compute scores. Scoring statistics such as document frequency include documents that a filter or permission check excludes. Elasticsearch states that document level security does not affect global index statistics that relevancy scoring uses."}
