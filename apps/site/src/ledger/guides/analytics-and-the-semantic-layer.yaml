sources:
  - {id: analytics-and-the-semantic-layer-s1, title: "dbt Developer Hub: About MetricFlow", url: "https://docs.getdbt.com/docs/build/about-metricflow?version=2", kind: primary, vendor: true}
  - {id: analytics-and-the-semantic-layer-s2, title: "Cube Documentation: Cubes", url: "https://docs.cube.dev/reference/data-modeling/cube", kind: primary, vendor: true}
  - {id: analytics-and-the-semantic-layer-s3, title: "Apache Ossie: Core Metadata Specification", url: "https://github.com/apache/ossie/blob/main/core-spec/spec.md", kind: primary, vendor: false}
  - {id: analytics-and-the-semantic-layer-s4, title: "Microsoft Learn: Semantic model discoverability", url: "https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-discovery", kind: primary, vendor: true}
  - {id: analytics-and-the-semantic-layer-s5, title: "Microsoft Learn: Create reports based on semantic models from different workspaces", url: "https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-discover-across-workspaces", kind: primary, vendor: true}
  - {id: analytics-and-the-semantic-layer-s6, title: "Microsoft Learn: Row-level security with Power BI", url: "https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security", kind: primary, vendor: true}
claims:
  - {id: analytics-and-the-semantic-layer-metrics, class: A, sources: [analytics-and-the-semantic-layer-s1], verified: "2026-11-25", text: "In dbt Semantic Layer, a metric is a function that combines simple metrics, constraints, or other mathematical functions to define a quantitative indicator. Dimensions add context to metrics."}
  - {id: analytics-and-the-semantic-layer-dbt, class: B, sources: [analytics-and-the-semantic-layer-s1], verified: "2026-11-25", text: "dbt semantic models define entities as join keys and dimensions as ways to group or filter metrics. When semantic models and metrics are correctly defined, they can be used downstream with Semantic Layer integrations."}
  - {id: analytics-and-the-semantic-layer-cube, class: B, sources: [analytics-and-the-semantic-layer-s2], verified: "2026-11-25", text: "A Cube cube contains measures, dimensions, joins, pre-aggregations, and access policies."}
  - {id: analytics-and-the-semantic-layer-ossie, class: B, sources: [analytics-and-the-semantic-layer-s3], verified: "2026-11-25", text: "Apache Ossie describes a semantic model with datasets, fields, relationships and metrics in JSON or YAML. Apache identifies Ossie as a project undergoing incubation."}
  - {id: analytics-and-the-semantic-layer-certification, class: B, sources: [analytics-and-the-semantic-layer-s4], verified: "2026-11-25", text: "In Power BI, authorized experts in an organization can certify semantic models. Certified models display a badge that identifies them as endorsed content."}
  - {id: analytics-and-the-semantic-layer-rls, class: B, sources: [analytics-and-the-semantic-layer-s5, analytics-and-the-semantic-layer-s6], verified: "2026-11-25", text: "Power BI row-level security filters rows in a semantic model according to roles. RLS restrictions remain in effect when users connect to a shared semantic model to create reports."}
