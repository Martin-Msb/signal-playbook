sources:
  - {id: serving-data-to-applications-s1, title: "Hightouch: Reverse ETL", url: "https://hightouch.com/platform/reverse-etl", kind: primary, vendor: true}
  - {id: serving-data-to-applications-s2, title: "Apache Pinot: Introduction", url: "https://docs.pinot.apache.org/", kind: primary, vendor: false}
  - {id: serving-data-to-applications-s3, title: "ClickHouse: Real-time analytics", url: "https://clickhouse.com/use-cases/real-time-analytics", kind: primary, vendor: true}
  - {id: serving-data-to-applications-s4, title: "Redis: Cache-aside", url: "https://redis.io/docs/latest/develop/use-cases/cache-aside/", kind: primary, vendor: true}
claims:
  - {id: serving-data-to-applications-hightouch-sync, class: B, sources: [serving-data-to-applications-s1], verified: "2026-11-27", text: "Hightouch describes Reverse ETL as defining records from a warehouse, lake or other source, mapping source fields to a destination, and syncing to destinations in real time or on a recurring schedule. The same page says Hightouch can be used to update transactional databases. This is vendor documentation about its product and use of Reverse ETL."}
  - {id: serving-data-to-applications-hightouch-governance, class: B, sources: [serving-data-to-applications-s1], verified: "2026-11-27", text: "Hightouch documents role-based permissions for data sources and destinations, approval flows for syncs, and staging environments for testing changes before production. These controls are specific to Hightouch's platform."}
  - {id: serving-data-to-applications-pinot-user-facing, class: B, sources: [serving-data-to-applications-s2], verified: "2026-11-27", text: "Apache Pinot describes itself as a real-time OLAP datastore for low-latency, high-throughput user-facing analytics. Its documentation says data is available for analytics after ingestion and identifies freshness, low latency and reliability as requirements for user-facing real-time analytics."}
  - {id: serving-data-to-applications-clickhouse-apps, class: B, sources: [serving-data-to-applications-s3], verified: "2026-11-27", text: "ClickHouse describes real-time analytics applications using SQL queries and materialized views, and states that its REST interface can support lightweight web applications. These are vendor descriptions of ClickHouse capabilities and use cases."}
  - {id: serving-data-to-applications-redis-cache-aside, class: B, sources: [serving-data-to-applications-s4], verified: "2026-11-27", text: "Redis documents cache-aside as checking the cache first, falling back to a primary store on a miss, writing the result to cache with a time-to-live, and invalidating a key on updates. The time-to-live bounds the window in which a cached value may be stale."}
