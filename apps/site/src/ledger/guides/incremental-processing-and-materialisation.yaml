sources:
  - {id: incremental-processing-and-materialisation-s1, title: "dbt documentation: Configure incremental models", url: "https://docs.getdbt.com/docs/build/incremental-models", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s2, title: "dbt documentation: Idempotence in dbt", url: "https://docs.getdbt.com/best-practices/idempotence", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s3, title: "dbt documentation: Incremental strategy", url: "https://docs.getdbt.com/docs/build/incremental-strategy", kind: primary, vendor: true}
  - {id: incremental-processing-and-materialisation-s4, title: "PostgreSQL documentation: Materialized views", url: "https://www.postgresql.org/docs/current/rules-materializedviews.html", kind: primary, vendor: false}
  - {id: incremental-processing-and-materialisation-s5, title: "Snowflake documentation: Dynamic table refresh modes", url: "https://docs.snowflake.com/en/user-guide/dynamic-tables/refresh-modes", kind: primary, vendor: true}
claims:
  - {id: incremental-processing-and-materialisation-cost, class: B, sources: [incremental-processing-and-materialisation-s1], verified: "2026-11-26", text: "dbt incremental models transform selected new or changed rows on later runs instead of transforming the entire source dataset each time."}
  - {id: incremental-processing-and-materialisation-key, class: B, sources: [incremental-processing-and-materialisation-s1, incremental-processing-and-materialisation-s2], verified: "2026-11-26", text: "In dbt, a unique_key lets an incremental model replace a matching existing row rather than append another row; appending without a reliable key can create duplicates on a rerun."}
  - {id: incremental-processing-and-materialisation-overwrite, class: B, sources: [incremental-processing-and-materialisation-s3], verified: "2026-11-26", text: "dbt's insert_overwrite strategy replaces affected partitions with new data, and the model must select all relevant data for a partition being replaced."}
  - {id: incremental-processing-and-materialisation-backfill, class: B, sources: [incremental-processing-and-materialisation-s1, incremental-processing-and-materialisation-s2], verified: "2026-11-26", text: "dbt's full-refresh option rebuilds an incremental model from all available data; dbt describes idempotent transformations as safe to rerun and backfill without double-counting or drift."}
  - {id: incremental-processing-and-materialisation-materialised-view, class: B, sources: [incremental-processing-and-materialisation-s4], verified: "2026-11-26", text: "A PostgreSQL materialized view stores the result of its defining query, and REFRESH MATERIALIZED VIEW completely replaces its contents by executing that query."}
  - {id: incremental-processing-and-materialisation-dynamic-table, class: B, sources: [incremental-processing-and-materialisation-s5], verified: "2026-11-26", text: "Snowflake incremental dynamic table refresh processes data changed since the previous refresh; a full refresh reruns the full definition against current base tables and replaces the materialized output."}
