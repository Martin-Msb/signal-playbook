sources:
  - {id: ai-risk-management-s1, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: ai-risk-management-s2, title: "NIST: AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework", kind: primary, vendor: false}
  - {id: ai-risk-management-s3, title: "NIST: AI 600-1, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
  - {id: ai-risk-management-s4, title: "EUR-Lex: Regulation (EU) 2024/1689, Artificial Intelligence Act, consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false}
  - {id: ai-risk-management-s5, title: "IEC: ISO/IEC 42001:2023, Information technology, Artificial intelligence, Management system", url: "https://webstore.iec.ch/en/publication/90574", kind: primary, vendor: false}
claims:
  - {id: ai-risk-management-continuous, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "NIST states that AI risk management should be continuous, timely and performed throughout the AI system lifecycle, and that however users integrate the functions, the process should be iterative."}
  - {id: ai-risk-management-functions, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "The NIST AI RMF Core is composed of four functions: Govern, Map, Measure and Manage. Govern is a cross-cutting function that is infused throughout AI risk management and enables the other functions. After instituting the outcomes in Govern, most users would start with Map and continue to Measure or Manage."}
  - {id: ai-risk-management-function-roles, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "In the NIST AI RMF, Map establishes the context to frame risks related to an AI system, Measure employs quantitative, qualitative or mixed-method tools to analyse, assess, benchmark and monitor AI risk and related impacts, and Manage entails allocating risk resources to mapped and measured risks on a regular basis."}
  - {id: ai-risk-management-status, class: C, sources: [ai-risk-management-s2], verified: "2026-11-27", text: "NIST released AI RMF 1.0 on 26 January 2023 and states that the AI RMF 1.0 is being revised."}
  - {id: ai-risk-management-profile, class: B, sources: [ai-risk-management-s3], verified: "2026-11-27", text: "NIST AI 600-1, dated July 2024, is a cross-sectoral profile of the AI RMF for generative AI. The AI RMF is intended for voluntary use. The profile defines 12 risks that are novel to or exacerbated by generative AI, among them confabulation, data privacy and information security, and suggests actions to govern, map, measure and manage them."}
  - {id: ai-risk-management-red-teaming, class: B, sources: [ai-risk-management-s3], verified: "2026-11-27", text: "NIST AI 600-1 describes AI red-teaming as a structured testing exercise used to probe an AI system to find flaws and vulnerabilities such as inaccurate, harmful or discriminatory outputs, and states that it can be performed before or after AI models or systems are made available to the broader public."}
  - {id: ai-risk-management-measure, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "NIST AI RMF Measure 1.1 has metrics selected for the risks enumerated during Map, starting with the most significant, and risks that will not or cannot be measured properly documented. Measure 3.1 has approaches, personnel and documentation in place to regularly identify and track existing, unanticipated and emergent AI risks based on intended and actual performance in deployed contexts."}
  - {id: ai-risk-management-respond, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "NIST AI RMF Manage 1.2 prioritises treatment of documented AI risks based on impact, likelihood and available resources or methods. Manage 1.3 states that risk response options can include mitigating, transferring, avoiding or accepting. Manage 1.4 has negative residual risks, defined as the sum of all unmitigated risks, documented."}
  - {id: ai-risk-management-roles, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "NIST AI RMF Govern 2.1 has roles and responsibilities and lines of communication related to mapping, measuring and managing AI risks documented and clear to individuals and teams throughout the organisation. Govern 2.3 has executive leadership take responsibility for decisions about risks associated with AI system development and deployment. Govern 1.5 has ongoing monitoring and periodic review of the risk management process planned, including the frequency of periodic review."}
  - {id: ai-risk-management-incidents, class: A, sources: [ai-risk-management-s1], verified: "2026-11-27", text: "NIST AI RMF Manage 4.3 has incidents and errors communicated to relevant AI actors, including affected communities, and processes for tracking, responding to and recovering from incidents and errors followed and documented. Manage 2.3 has procedures followed to respond to and recover from a previously unknown risk when it is identified."}
  - {id: ai-risk-management-eu-system, class: A, sources: [ai-risk-management-s4], verified: "2026-11-27", text: "Article 9 of the EU AI Act requires a risk management system to be established, implemented, documented and maintained for high-risk AI systems, as a continuous iterative process planned and run throughout the entire lifecycle, requiring regular systematic review and updating. Its steps are identifying and analysing known and reasonably foreseeable risks, estimating and evaluating them, evaluating other risks from post-market monitoring data, and adopting targeted risk management measures."}
  - {id: ai-risk-management-eu-testing, class: A, sources: [ai-risk-management-s4], verified: "2026-11-27", text: "Under Article 9 of the EU AI Act, high-risk AI systems are tested against prior defined metrics and probabilistic thresholds appropriate to the intended purpose, and risk management measures are such that the residual risk associated with each hazard and the overall residual risk are judged to be acceptable."}
  - {id: ai-risk-management-eu-accountability, class: A, sources: [ai-risk-management-s4], verified: "2026-11-27", text: "Article 17 of the EU AI Act requires providers of high-risk AI systems to have a documented quality management system that includes the risk management system, a post-market monitoring system, procedures for reporting serious incidents, and an accountability framework setting out the responsibilities of the management and other staff."}
  - {id: ai-risk-management-eu-incident, class: C, sources: [ai-risk-management-s4], verified: "2026-11-27", text: "Article 73 of the EU AI Act requires providers of high-risk AI systems to report a serious incident to the market surveillance authorities not later than 15 days after becoming aware of it, not later than 10 days in the event of the death of a person, and not later than two days for a widespread infringement or a serious and irreversible disruption of critical infrastructure. The provider then investigates, including a risk assessment of the incident and corrective action."}
  - {id: ai-risk-management-eu-dates, class: C, sources: [ai-risk-management-s4], verified: "2026-11-27", text: "As amended by Regulation (EU) 2026/1744, Article 113 of the EU AI Act applies Chapter III, Sections 1 to 3, which contain Articles 9 and 17, from 2 December 2027 for high-risk AI systems under Annex III and from 2 August 2028 for those under Annex I."}
  - {id: ai-risk-management-iso, class: B, sources: [ai-risk-management-s5], verified: "2026-11-27", text: "ISO/IEC 42001:2023, published on 18 December 2023, specifies the requirements and provides guidance for establishing, implementing, maintaining and continually improving an AI management system within the context of an organisation."}
