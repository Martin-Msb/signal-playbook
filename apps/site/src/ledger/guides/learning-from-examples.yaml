claims:
  - {id: learning-from-examples-ml, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "Machine learning is the process of training a piece of software, called a model, to make useful predictions."}
  - {id: learning-from-examples-supervised, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "Supervised learning models can make predictions after seeing lots of data with the correct answers and then discovering the connections between the elements in the data that produce the correct answers."}
  - {id: learning-from-examples-unsupervised, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "An unsupervised learning model aims to identify meaningful patterns in a dataset. Many such models rely on clustering to organise similar data into groups. Clustering differs from classification because the categories are not defined by the practitioner."}
  - {id: learning-from-examples-reinforcement, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "Reinforcement learning models make predictions by getting rewards or penalties based on actions performed within an environment. A reinforcement learning system generates a policy that defines the best strategy for getting the most rewards."}
  - {id: learning-from-examples-regression, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "A regression model predicts a numeric value."}
  - {id: learning-from-examples-classification, class: A, sources: [learning-from-examples-s1], verified: "2026-11-27", text: "Classification models predict the likelihood that something belongs to a category."}
  - {id: learning-from-examples-example, class: A, sources: [learning-from-examples-s2], verified: "2026-11-27", text: "Datasets are made up of individual examples that contain features and a label. Features are the values that a supervised model uses to predict the label. The label is the answer, the value the model is to predict."}
  - {id: learning-from-examples-model, class: A, sources: [learning-from-examples-s2], verified: "2026-11-27", text: "In supervised learning, a model is the collection of numbers that define the mathematical relationship from specific input feature patterns to specific output label values. The model discovers these patterns through training."}
  - {id: learning-from-examples-training, class: A, sources: [learning-from-examples-s2], verified: "2026-11-27", text: "To train a model, it is given a dataset with labelled examples. The model compares its predicted value to the label's actual value, and arrives at a solution that makes the best predictions, on average, for each of the examples."}
  - {id: learning-from-examples-unseen, class: A, sources: [learning-from-examples-s2], verified: "2026-11-27", text: "The model learns the mathematical relationship between the features and the label so that it can make the best predictions on unseen data."}
  - {id: learning-from-examples-evaluate, class: A, sources: [learning-from-examples-s2], verified: "2026-11-27", text: "A trained model is evaluated to determine how well it learned. Evaluation uses a labelled dataset, gives the model only the features, and compares the model's predictions to the labels' true values."}
  - {id: learning-from-examples-inference, class: A, sources: [learning-from-examples-s2, learning-from-examples-s3], verified: "2026-11-27", text: "A trained model is used to make predictions, called inferences, on unlabelled examples."}
  - {id: learning-from-examples-generalisation, class: A, sources: [learning-from-examples-s3], verified: "2026-11-27", text: "Generalisation is a model's ability to make correct predictions on new, previously unseen data."}
  - {id: learning-from-examples-overfitting, class: A, sources: [learning-from-examples-s4], verified: "2026-11-27", text: "Overfitting means creating a model that matches (memorises) the training set so closely that the model fails to make correct predictions on new data. An overfit model makes excellent predictions on the training set but poor predictions on new data."}
  - {id: learning-from-examples-test, class: B, sources: [learning-from-examples-s5], verified: "2026-11-27", text: "A model should be tested against a different set of examples than those used to train it. Traditionally those examples come from splitting the original dataset, which includes a test set for evaluation of the trained model."}
  - {id: learning-from-examples-baseline, class: A, sources: [learning-from-examples-s9], verified: "2026-11-27", text: "A baseline is a model used as a reference point for comparing how well another model, typically a more complex one, is performing."}
  - {id: learning-from-examples-benchmark, class: B, sources: [learning-from-examples-s7], verified: "2026-11-27", text: "The non-ML solution is the benchmark used to determine whether ML is a good use case for a problem. Where no non-ML solution is implemented, the advice is to try solving the problem manually using a heuristic."}
  - {id: learning-from-examples-no-ml-first, class: B, sources: [learning-from-examples-s6], verified: "2026-11-27", text: "Rule 1 of Google's Rules of Machine Learning is not to be afraid to launch a product without machine learning. If machine learning is not absolutely required for the product, it should not be used until there is data."}
  - {id: learning-from-examples-heuristic, class: B, sources: [learning-from-examples-s6], verified: "2026-11-27", text: "A simple heuristic can get a product out of the door. A complex heuristic is unmaintainable. Once there is data and a basic idea of what is to be accomplished, the advice is to move on to machine learning."}
  - {id: learning-from-examples-intended-use, class: B, sources: [learning-from-examples-s8], verified: "2026-11-27", text: "NIST AI Risk Management Framework, MAP 1.1: intended purposes, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented."}
  - {id: learning-from-examples-go-no-go, class: B, sources: [learning-from-examples-s8], verified: "2026-11-27", text: "After completing the MAP function, users of the NIST AI Risk Management Framework should have sufficient contextual knowledge about AI system impacts to inform an initial go/no-go decision about whether to design, develop, or deploy an AI system."}
