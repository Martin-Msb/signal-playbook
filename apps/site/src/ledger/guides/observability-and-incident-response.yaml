sources:
  - {id: observability-and-incident-response-s1, title: "OpenTelemetry: Signals", url: "https://opentelemetry.io/docs/concepts/signals/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s2, title: "dbt Developer Hub: Source freshness", url: "https://docs.getdbt.com/docs/deploy/source-freshness", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s3, title: "Prometheus: Alerting rules", url: "https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s4, title: "Google SRE Book: Incident Management", url: "https://sre.google/sre-book/managing-incidents/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s5, title: "Google SRE Book: Postmortem Culture", url: "https://sre.google/sre-book/postmortem-culture/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s6, title: "Great Expectations: Data quality use cases", url: "https://docs.greatexpectations.io/docs/reference/learn/data_quality_use_cases/dq_use_cases_lp", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s7, title: "Databricks: Anomaly detection", url: "https://docs.databricks.com/aws/en/data-quality-monitoring/anomaly-detection/", kind: primary, vendor: true}
  - {id: observability-and-incident-response-s8, title: "Google SRE Workbook: Data Processing Pipelines", url: "https://sre.google/workbook/data-processing/", kind: primary, vendor: false}
  - {id: observability-and-incident-response-s9, title: "Google Cloud: About data lineage", url: "https://docs.cloud.google.com/dataplex/docs/about-data-lineage", kind: primary, vendor: true}
claims:
  - {id: observability-and-incident-response-signals, class: A, sources: [observability-and-incident-response-s1], verified: "2026-11-27", text: "OpenTelemetry defines signals as system outputs describing underlying activity and supports traces, metrics and logs. Metrics are runtime measurements and logs are event records."}
  - {id: observability-and-incident-response-four, class: B, sources: [observability-and-incident-response-s6], verified: "2026-11-27", text: "Great Expectations lists freshness, volume, schema and distribution among its data quality use cases: data available within expected timeframes, record quantity within expected bounds, data structure conforming to established rules, and data values adhering to expected ranges."}
  - {id: observability-and-incident-response-anomaly, class: B, sources: [observability-and-incident-response-s7], verified: "2026-11-27", text: "Databricks anomaly detection analyses historical patterns to evaluate the freshness and completeness of each table. A table is marked stale when a commit is unusually late and incomplete when its row count falls below the expected range. Impact is rated by the number of downstream tables and queries affected."}
  - {id: observability-and-incident-response-freshness, class: B, sources: [observability-and-incident-response-s2], verified: "2026-11-27", text: "dbt source freshness checks compare observed freshness with an organisation-defined service level agreement. dbt recommends checking at a frequency appropriate to the freshness target."}
  - {id: observability-and-incident-response-slo, class: B, sources: [observability-and-incident-response-s8], verified: "2026-11-27", text: "The Google SRE Workbook gives formats for data freshness service level objectives, including that the oldest data is no older than a set time, and states that monitoring out-of-SLO alerts allows detection of issues that impact customers."}
  - {id: observability-and-incident-response-alerts, class: B, sources: [observability-and-incident-response-s3], verified: "2026-11-27", text: "Prometheus alerting rules evaluate expressions and can send notifications when an alert fires. A for clause can require a condition to remain active for a duration before firing; labels and annotations can carry context such as a runbook link."}
  - {id: observability-and-incident-response-lineage, class: B, sources: [observability-and-incident-response-s9], verified: "2026-11-27", text: "Google Cloud describes lineage as a record of data being transformed from sources to targets, which helps to trace pipeline errors to their root cause and to assess downstream impact."}
  - {id: observability-and-incident-response-triage, class: B, sources: [observability-and-incident-response-s4], verified: "2026-11-27", text: "Google SRE describes incident response roles including incident command, operational work, communication and planning, plus a live incident document retained for postmortem analysis."}
  - {id: observability-and-incident-response-record, class: B, sources: [observability-and-incident-response-s5], verified: "2026-11-27", text: "Google SRE describes a postmortem as a written record of incident impact, mitigation or resolution, causes and follow-up actions to reduce recurrence; its purpose is learning and prevention."}
