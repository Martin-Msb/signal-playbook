  - {id: transactions-and-consistency-s9, title: "MySQL 8.4 Reference Manual: Transaction isolation levels", url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html", kind: primary, vendor: true}
  - {id: transactions-and-consistency-s10, title: "Microsoft Learn: Transaction locking and row versioning guide", url: "https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-transaction-locking-and-row-versioning-guide", kind: primary, vendor: true}
claims:
  - {id: transactions-and-consistency-atomic, class: A, sources: [transactions-and-consistency-s1], verified: "2026-11-25", text: "The essential point of a transaction is that it bundles multiple steps into a single, all-or-nothing operation. The intermediate states between the steps are not visible to other concurrent transactions, and if an error occurs that prevents the transaction from completing, then none of the steps affect the database at all."}
  - {id: transactions-and-consistency-begin-commit, class: A, sources: [transactions-and-consistency-s1], verified: "2026-11-25", text: "In PostgreSQL, a transaction is set up by surrounding the SQL commands of the transaction with BEGIN and COMMIT commands. Issuing ROLLBACK instead of COMMIT cancels all the updates made so far."}
  - {id: transactions-and-consistency-acid, class: A, sources: [transactions-and-consistency-s2, transactions-and-consistency-s10], verified: "2026-11-25", text: "ACID stands for atomicity, consistency, isolation and durability. Atomicity: either all operations of a transaction complete as a single unit or none do. Consistency: the data always complies with integrity constraints, and a transaction with unresolved violations at commit is rolled back. Isolation: the effects of a transaction are not visible to concurrent transactions before it commits. Durability: once a transaction has been committed, the changes remain even after a system failure or crash."}
  - {id: transactions-and-consistency-commit, class: A, sources: [transactions-and-consistency-s2], verified: "2026-11-25", text: "A commit is the act of finalizing a transaction within the database, which makes it visible to other transactions and assures its durability. The effects of a transaction are not visible to other sessions until the transaction is complete, and possibly even later, depending on the isolation level."}
  - {id: transactions-and-consistency-mvcc, class: A, sources: [transactions-and-consistency-s3], verified: "2026-11-25", text: "PostgreSQL maintains data consistency with a multiversion model, Multiversion Concurrency Control (MVCC): each SQL statement sees a snapshot of data as it was some time ago, regardless of the current state of the underlying data. Locks acquired for querying data do not conflict with locks acquired for writing data, so reading never blocks writing and writing never blocks reading."}
  - {id: transactions-and-consistency-levels, class: A, sources: [transactions-and-consistency-s4], verified: "2026-11-25", text: "The SQL standard defines four levels of transaction isolation: Read Uncommitted, Read Committed, Repeatable Read and Serializable. They are described by the phenomena each must prevent. A dirty read is a transaction reading data written by a concurrent uncommitted transaction. A nonrepeatable read is a transaction re-reading data and finding it modified by another transaction that committed since the initial read."}
  - {id: transactions-and-consistency-read-committed, class: A, sources: [transactions-and-consistency-s4], verified: "2026-11-25", text: "At Read Committed in PostgreSQL, a SELECT query sees only data committed before the query began. Two successive SELECT commands can see different data, even though they are within a single transaction, if other transactions commit changes after the first SELECT starts and before the second SELECT starts."}
  - {id: transactions-and-consistency-repeatable-read, class: A, sources: [transactions-and-consistency-s4], verified: "2026-11-25", text: "The Repeatable Read isolation level in PostgreSQL only sees data committed before the transaction began. It is implemented using a technique known as Snapshot Isolation. A repeatable read transaction cannot modify or lock rows changed by other transactions after it began: it is rolled back with the message 'could not serialize access due to concurrent update', and applications using this level must be prepared to retry transactions."}
  - {id: transactions-and-consistency-defaults, class: C, sources: [transactions-and-consistency-s4, transactions-and-consistency-s9], verified: "2026-11-25", text: "In the PostgreSQL 19 documentation, Read Committed is the default isolation level, and Read Uncommitted behaves like Read Committed. In the MySQL 8.4 Reference Manual, the default isolation level for InnoDB is REPEATABLE READ, where consistent reads within the same transaction read the snapshot established by the first read."}
  - {id: transactions-and-consistency-snapshot-paper, class: A, sources: [transactions-and-consistency-s8], verified: "2026-11-25", text: "The paper A Critique of ANSI SQL Isolation Levels by Berenson, Bernstein, Gray, Melton, O'Neil and O'Neil, dated June 1995, states that the ANSI SQL-92 phenomena fail to characterize several popular isolation levels, and defines Snapshot Isolation, which it calls an important multiversion isolation type."}
  - {id: transactions-and-consistency-write-skew, class: A, sources: [transactions-and-consistency-s7, transactions-and-consistency-s4], verified: "2026-11-25", text: "When two concurrent transactions each determine what they are writing based on reading a data set which overlaps what the other is writing, the result can be a state which could not occur if either had run before the other. This is known as write skew. In the PostgreSQL documentation's example of two transactions that each read rows and insert a row the other's query would have counted, both would be allowed to commit at Repeatable Read."}
  - {id: transactions-and-consistency-serializable, class: A, sources: [transactions-and-consistency-s4], verified: "2026-11-25", text: "The Serializable isolation level emulates serial transaction execution for all committed transactions, as if they had been executed one after another. In PostgreSQL it works like Repeatable Read and also monitors for conditions that could cause a serialization anomaly, rolling one transaction back with a serialization failure, which always returns SQLSTATE 40001. Applications using this level must be prepared to retry transactions."}
  - {id: transactions-and-consistency-row-versioning, class: B, sources: [transactions-and-consistency-s10], verified: "2026-11-25", text: "The SQL Server Database Engine supports two isolation levels that use row versioning. With READ_COMMITTED_SNAPSHOT on, READ COMMITTED presents each statement with a transactionally consistent snapshot of the data as it existed at the start of the statement. The SNAPSHOT isolation level gives transaction-level read consistency: read operations retrieve the version of the row that existed when the transaction started."}
  - {id: transactions-and-consistency-logged, class: A, sources: [transactions-and-consistency-s1, transactions-and-consistency-s5], verified: "2026-11-25", text: "A transactional database guarantees that all the updates made by a transaction are logged in permanent storage before the transaction is reported complete. In PostgreSQL, changes to data files must be written only after write-ahead log records describing the changes have been flushed to permanent storage."}
  - {id: transactions-and-consistency-replay, class: A, sources: [transactions-and-consistency-s5], verified: "2026-11-25", text: "By archiving the write-ahead log data, PostgreSQL can support reverting to any time instant covered by the available log data: a prior physical backup is installed and the log is replayed just as far as the desired time."}
  - {id: transactions-and-consistency-commit-time, class: C, sources: [transactions-and-consistency-s6], verified: "2026-11-25", text: "In the PostgreSQL 19 documentation, the setting track_commit_timestamp records the commit time of transactions. It can only be set at server start and its default value is off."}
