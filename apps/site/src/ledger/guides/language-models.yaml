sources:
  - {id: language-models-s1, title: "Brown et al.: Language Models are Few-Shot Learners", url: "https://arxiv.org/abs/2005.14165", kind: primary, vendor: false}
  - {id: language-models-s2, title: "Vaswani et al.: Attention Is All You Need", url: "https://arxiv.org/abs/1706.03762", kind: primary, vendor: false}
  - {id: language-models-s3, title: "Anthropic: Glossary", url: "https://platform.claude.com/docs/en/about-claude/glossary", kind: primary, vendor: true}
  - {id: language-models-s4, title: "Anthropic: Guides to common use cases", url: "https://platform.claude.com/docs/en/about-claude/use-case-guides/overview", kind: primary, vendor: true}
  - {id: language-models-s5, title: "OpenAI: Text generation", url: "https://developers.openai.com/api/docs/guides/text", kind: primary, vendor: true}
  - {id: language-models-s6, title: "Meta: Introducing Llama 3.1: Our most capable models to date", url: "https://ai.meta.com/blog/meta-llama-3-1/", kind: primary, vendor: true}
  - {id: language-models-s7, title: "European Union: Artificial Intelligence Act, consolidated text", url: "https://eur-lex.europa.eu/eli/reg/2024/1689/2026-07-27/eng", kind: primary, vendor: false}
  - {id: language-models-s8, title: "NIST: Artificial Intelligence Risk Management Framework (AI RMF 1.0)", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", kind: primary, vendor: false}
claims:
  - {id: language-models-llm, class: A, sources: [language-models-s3], verified: "2026-11-27", text: "Large language models are trained on vast amounts of text data and can generate human-like text, answer questions and summarise information."}
  - {id: language-models-tokens, class: A, sources: [language-models-s3], verified: "2026-11-27", text: "Tokens are the smallest individual units of a language model, and can correspond to words, subwords, characters or bytes."}
  - {id: language-models-next-word, class: A, sources: [language-models-s3], verified: "2026-11-27", text: "Autoregressive language models are pretrained to predict the next word, given the previous context of text in the document."}
  - {id: language-models-pretraining, class: A, sources: [language-models-s3], verified: "2026-11-27", text: "Pretraining is the initial process of training language models on a large unlabeled corpus of text."}
  - {id: language-models-probabilities, class: A, sources: [language-models-s2], verified: "2026-11-27", text: "The Transformer uses a learned linear transformation and softmax function to convert the decoder output to predicted next-token probabilities."}
  - {id: language-models-autoregressive, class: A, sources: [language-models-s2], verified: "2026-11-27", text: "The Transformer decoder generates an output sequence one element at a time. At each step the model is auto-regressive, consuming the previously generated symbols as additional input when generating the next."}
  - {id: language-models-in-context, class: A, sources: [language-models-s1], verified: "2026-11-27", text: "In-context learning uses the text input of a pretrained language model as a form of task specification: the model is conditioned on a natural language instruction or a few demonstrations of the task and completes further instances by predicting what comes next."}
  - {id: language-models-no-updates, class: A, sources: [language-models-s1], verified: "2026-11-27", text: "For all tasks, GPT-3 is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified purely via text interaction with the model."}
  - {id: language-models-limits, class: A, sources: [language-models-s1], verified: "2026-11-27", text: "The GPT-3 study identifies some datasets where GPT-3's few-shot learning still struggles."}
  - {id: language-models-refined, class: A, sources: [language-models-s3], verified: "2026-11-27", text: "Pretrained models are not inherently good at answering questions or following instructions, and fine-tuning and reinforcement learning from human feedback are used to refine them."}
  - {id: language-models-instructions, class: B, sources: [language-models-s5], verified: "2026-11-27", text: "In the OpenAI API the instructions parameter gives the model high-level instructions on how it should behave while generating a response."}
  - {id: language-models-tasks, class: B, sources: [language-models-s4], verified: "2026-11-27", text: "Anthropic publishes production guides for using Claude to classify and route customer support tickets, to build customer support chatbots and to summarise legal documents."}
  - {id: language-models-hosted, class: B, sources: [language-models-s5], verified: "2026-11-27", text: "With the OpenAI API a large language model can be used to generate text from a prompt, as it can using ChatGPT."}
  - {id: language-models-open-weights, class: B, sources: [language-models-s6], verified: "2026-11-27", text: "Meta states that Llama model weights are available to download, that developers can run the models in any environment, including on premises, in the cloud or locally on a laptop, and that Llama 3.1 was made available on its ecosystem of partner platforms."}
  - {id: language-models-gpai, class: A, sources: [language-models-s7], verified: "2026-11-27", text: "The EU AI Act defines a general-purpose AI model as an AI model that displays significant generality, is capable of competently performing a wide range of distinct tasks and can be integrated into a variety of downstream systems or applications."}
  - {id: language-models-deployer, class: A, sources: [language-models-s7], verified: "2026-11-27", text: "The EU AI Act defines a deployer as a person or body using an AI system under its authority and the intended purpose as the use for which an AI system is intended by the provider. A deployer that modifies the intended purpose of an AI system, including a general-purpose AI system, in such a way that it becomes high-risk is considered a provider of a high-risk AI system."}
  - {id: language-models-nist, class: A, sources: [language-models-s8], verified: "2026-11-27", text: "The NIST AI Risk Management Framework states as outcomes that intended purposes and the prospective settings in which the AI system will be deployed are understood and documented, and that roles and responsibilities related to mapping, measuring and managing AI risks are documented and clear to individuals and teams throughout the organization."}
