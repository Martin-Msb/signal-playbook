claims:
  - {id: model-deployment-batch-online, class: B, sources: [model-deployment-s5], verified: "2026-11-27", text: "On Vertex AI, online inferences are synchronous requests made to a model that is deployed to an endpoint, used when requests are made in response to application input or in situations that require timely inference. Batch inferences are asynchronous requests made to a model that is not deployed to an endpoint: the request is sent as a BatchPredictionJob directly to the model resource. Batch inference is used when an immediate response is not required and accumulated data is processed in a single request."}
  - {id: model-deployment-stream, class: B, sources: [model-deployment-s6], verified: "2026-11-27", text: "The Apache Beam RunInference API supports batch and streaming pipelines. Model handlers are available for PyTorch, scikit-learn, TensorFlow, Hugging Face, Vertex AI, ONNX, TensorRT and XGBoost."}
  - {id: model-deployment-serving-forms, class: B, sources: [model-deployment-s7], verified: "2026-11-27", text: "Google's MLOps architecture guide lists the forms in which a validated model is deployed to serve predictions: microservices with a REST API to serve online predictions, an embedded model on an edge or mobile device, or part of a batch prediction system. It states that in ML systems deployment is not as simple as deploying an offline-trained model as a prediction service, and lists verifying the compatibility of the model with the target infrastructure before deployment."}
  - {id: model-deployment-onnx, class: A, sources: [model-deployment-s2], verified: "2026-11-27", text: "ONNX is an open format built to represent machine learning models. It defines a common set of operators and a common file format to enable developers to use models with a variety of frameworks, tools, runtimes and compilers."}
  - {id: model-deployment-persistence, class: B, sources: [model-deployment-s1], verified: "2026-11-27", text: "The scikit-learn documentation states that pickle, joblib and cloudpickle have many documented security vulnerabilities by design and should only be used when the artifact comes from a trusted and verified source, and that none of these methods support loading a model trained with a different version of scikit-learn. It describes ONNX as suited to getting predictions without loading the Python object itself and to lean serving environments, since the ONNX runtime does not require Python."}
  - {id: model-deployment-mlflow-model, class: B, sources: [model-deployment-s3], verified: "2026-11-27", text: "An MLflow Model is a standard format for packaging machine learning models that can be used in a variety of downstream tools, for example real-time serving through a REST API or batch inference on Apache Spark. The flavors a model supports are defined in its MLmodel file, and the model signature defines the schema for model inputs, outputs and additional inference parameters."}
  - {id: model-deployment-shadow, class: B, sources: [model-deployment-s8], verified: "2026-11-27", text: "In an Amazon SageMaker AI shadow test, the new variant is deployed in shadow mode and a copy of the inference requests is routed to it in real time within the same endpoint. Only the responses of the production variant are returned to the calling application, and the responses of the shadow variant can be discarded or logged for offline comparison. AWS describes shadow testing as a way to evaluate operational metrics such as latency and error rate for a model validated offline, without any end user impact."}
  - {id: model-deployment-canary, class: A, sources: [model-deployment-s11], verified: "2026-11-27", text: "The Google Site Reliability Workbook defines canarying as a partial and time-limited deployment of a change in a service and its evaluation. The part of the service that receives the change is the canary, and the remainder of the service is the control. An error rate of the canary that is too far from the control error rate signals a bad canary deployment, and the response is to pause and roll back the deployment or contact a human to help troubleshoot."}
  - {id: model-deployment-canary-shift, class: B, sources: [model-deployment-s9], verified: "2026-11-27", text: "With canary traffic shifting in Amazon SageMaker AI, a portion of endpoint traffic is tested on the new fleet while the old fleet serves the remainder. CloudWatch alarms monitor the new fleet during a baking period. If any alarm trips, a rollback is initiated and all traffic returns to the old fleet. If none trips, all traffic shifts to the new fleet, and the old fleet is terminated only after a final baking period. Any issue with the updated model only impacts the canary."}
  - {id: model-deployment-canary-kserve, class: B, sources: [model-deployment-s10], verified: "2026-11-27", text: "In KServe the canaryTrafficPercent field is set to the percentage of traffic that should be routed to the new revision. KServe automatically tracks the last good revision that was rolled out with 100% traffic and splits traffic between it and the revision being rolled out. If a rollback needs to happen, 100% of the traffic is pinned to the previous healthy revision."}
  - {id: model-deployment-online-validation, class: B, sources: [model-deployment-s7], verified: "2026-11-27", text: "In Google's MLOps architecture guide, a newly deployed model undergoes online model validation in a canary deployment or an A/B testing setup before it serves predictions for the online traffic. The metadata recorded for each pipeline run includes a pointer to the previous trained model in case a rollback to a previous model version is needed. For continuous delivery with an automated CI/CD pipeline the guide lists manual deployment to a production environment after several successful runs of the pipeline on the pre-production environment."}
  - {id: model-deployment-alias, class: B, sources: [model-deployment-s4], verified: "2026-11-27", text: "In the MLflow Model Registry, each new model registered to the same model name increments the version number. A model alias is a mutable, named reference to a particular version of a registered model, such as champion, and the model serving production traffic is updated by reassigning the champion alias to a different model version. Each registered model version is linked to the MLflow run, logged model or notebook that produced it."}
  - {id: model-deployment-approval, class: B, sources: [model-deployment-s12], verified: "2026-11-27", text: "In the Amazon SageMaker AI Model Registry, a model version carries an approval status. With the provided project templates, changing the status from PendingManualApproval to Approved initiates CI/CD deployment for the approved model version, and changing it from Approved to Rejected initiates CI/CD to deploy the latest model version with an Approved status."}
  - {id: model-deployment-reviewers, class: B, sources: [model-deployment-s13], verified: "2026-11-27", text: "In GitHub Actions, required reviewers require a specific person or team to approve workflow jobs that reference an environment. With the prevent self-reviews setting, users who initiate a deployment cannot approve the deployment job, even if they are a required reviewer."}
  - {id: model-deployment-nist-proceed, class: B, sources: [model-deployment-s14], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, the MANAGE 1.1 outcome is that a determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed. The MEASURE 1.3 outcome is that internal experts who did not serve as front-line developers for the system, or independent assessors, are involved in regular assessments and updates."}
  - {id: model-deployment-nist-supersede, class: B, sources: [model-deployment-s14], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, the MANAGE 2.4 outcome is that mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use. The MANAGE 4.1 outcome is that post-deployment monitoring plans are implemented, including mechanisms for decommissioning, incident response, recovery and change management."}
