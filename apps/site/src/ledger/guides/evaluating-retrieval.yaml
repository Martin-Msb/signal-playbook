sources:
  - {id: evaluating-retrieval-s1, title: "Elastic: Ranking evaluation API", url: "https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-rank-eval", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s2, title: "Ragas: Context Recall", url: "https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_recall/", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s3, title: "Ragas: Faithfulness", url: "https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s4, title: "Microsoft Learn: Retrieval-Augmented Generation (RAG) evaluators for generative AI", url: "https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s5, title: "Gao, Yen, Yu and Chen: Enabling Large Language Models to Generate Text with Citations", url: "https://arxiv.org/abs/2305.14627", kind: primary, vendor: false}
  - {id: evaluating-retrieval-s6, title: "Rajpurkar, Jia and Liang: Know What You Don't Know: Unanswerable Questions for SQuAD", url: "https://arxiv.org/abs/1806.03822", kind: primary, vendor: false}
  - {id: evaluating-retrieval-s7, title: "Anthropic: Reduce hallucinations", url: "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s8, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: evaluating-retrieval-s9, title: "TruLens: The RAG Triad", url: "https://www.trulens.org/getting_started/core_concepts/rag_triad/", kind: primary, vendor: true}
  - {id: evaluating-retrieval-s10, title: "Anthropic: Introducing Contextual Retrieval", url: "https://www.anthropic.com/news/contextual-retrieval", kind: primary, vendor: true}
claims:
  - {id: evaluating-retrieval-two-parts, class: B, sources: [evaluating-retrieval-s4], verified: "2026-11-27", text: "Microsoft's RAG evaluators separate process evaluation, which assesses the quality of the document retrieval step, from system evaluation, which examines the quality of the final response. If retrieval quality is poor and the response requires corpus-specific knowledge, there is less chance the language model gives a satisfactory answer."}
  - {id: evaluating-retrieval-triad, class: B, sources: [evaluating-retrieval-s9], verified: "2026-11-27", text: "TruLens describes the RAG triad as three evaluations along the edges of a RAG architecture: context relevance, groundedness and answer relevance. Context relevance checks that each chunk of context is relevant to the input query."}
  - {id: evaluating-retrieval-labels, class: A, sources: [evaluating-retrieval-s1, evaluating-retrieval-s2], verified: "2026-11-27", text: "Precision and recall at k need relevance labels: documents in the collection need to be rated as either relevant or irrelevant with respect to the current query. Ragas states that calculating context recall always requires a reference to compare against, because it is about not missing anything."}
  - {id: evaluating-retrieval-precision-at-k, class: A, sources: [evaluating-retrieval-s1], verified: "2026-11-27", text: "Precision at k measures the proportion of relevant results in the top k search results. A precision at 10 value of 0.6 means 6 out of the 10 top hits are relevant."}
  - {id: evaluating-retrieval-recall-at-k, class: A, sources: [evaluating-retrieval-s1], verified: "2026-11-27", text: "Recall at k is the fraction of relevant documents in the first k results relative to all possible relevant results. A recall at 10 value of 0.5 means 4 out of 8 relevant documents were retrieved in the top 10."}
  - {id: evaluating-retrieval-recall-in-use, class: B, sources: [evaluating-retrieval-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic reports its Contextual Retrieval results as 1 minus recall@20, which measures the percentage of relevant documents that fail to be retrieved within the top 20 chunks."}
  - {id: evaluating-retrieval-faithfulness, class: B, sources: [evaluating-retrieval-s3], verified: "2026-11-27", text: "The Ragas faithfulness metric measures how factually consistent a response is with the retrieved context. It identifies all the claims in the response, checks whether each can be inferred from the retrieved context, and divides the number of supported claims by the total number of claims, giving a score from 0 to 1."}
  - {id: evaluating-retrieval-groundedness, class: B, sources: [evaluating-retrieval-s4, evaluating-retrieval-s9], verified: "2026-11-27", text: "Microsoft's groundedness evaluator measures how well the generated response aligns with the given context without fabricating content, using a model as judge. In TruLens, groundedness splits the response into individual claims and searches the retrieved context for evidence that supports each."}
  - {id: evaluating-retrieval-citations, class: A, sources: [evaluating-retrieval-s5], verified: "2026-11-27", text: "The ALCE benchmark evaluates citation quality with two metrics: citation recall, which determines if the output is entirely supported by cited passages, and citation precision, which identifies any irrelevant citations. A statement has citation recall 1 if and only if it has at least one citation and a natural language inference model finds that the concatenated cited passages entail it."}
  - {id: evaluating-retrieval-citation-gap, class: C, sources: [evaluating-retrieval-s5], verified: "2026-11-27", text: "The ALCE paper, published in 2023, reports that on the ELI5 dataset even the best models lack complete citation support 50% of the time."}
  - {id: evaluating-retrieval-unanswerable, class: A, sources: [evaluating-retrieval-s6], verified: "2026-11-27", text: "SQuAD 2.0 adds over 50,000 unanswerable questions written to look similar to answerable ones. To do well, a system must answer when the paragraph supports an answer and abstain when it does not."}
  - {id: evaluating-retrieval-decline, class: B, sources: [evaluating-retrieval-s7], verified: "2026-11-27", flags: [vendor-stated], text: "Anthropic advises explicitly giving the model permission to admit uncertainty, and having it verify each claim by finding a supporting quote and retract any claim for which it cannot find one."}
  - {id: evaluating-retrieval-tuning, class: B, sources: [evaluating-retrieval-s4], verified: "2026-11-27", flags: [vendor-stated], text: "Microsoft describes search quality metrics computed against ground truth labels as the tool for debugging a RAG pipeline and for a parameter sweep over search algorithm, top k and chunk size. It describes groundedness as the precision aspect of the response: it does not contain content outside the grounding context."}
  - {id: evaluating-retrieval-nist-measure, class: B, sources: [evaluating-retrieval-s8], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, the MEASURE 2.1 outcome is that test sets, metrics and details about the tools used during test, evaluation, verification and validation are documented. MEASURE 2.3 is that system performance or assurance criteria are measured and demonstrated for conditions similar to the deployment setting."}
  - {id: evaluating-retrieval-nist-monitor, class: B, sources: [evaluating-retrieval-s8], verified: "2026-11-27", text: "The NIST AI Risk Management Framework 1.0 states that AI systems should be tested before their deployment and regularly while in operation. Its MEASURE 2.4 outcome is that the functionality and behaviour of the AI system and its components are monitored when in production."}
