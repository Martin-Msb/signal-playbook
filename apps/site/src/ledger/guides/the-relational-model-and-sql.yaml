sources:
  - {id: the-relational-model-and-sql-s1, title: "E. F. Codd: A Relational Model of Data for Large Shared Data Banks, Communications of the ACM 13(6), June 1970", url: "https://www.engineering.upenn.edu/~zives/03f/cis550/codd.pdf", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s2, title: "PostgreSQL 19 documentation: Constraints", url: "https://www.postgresql.org/docs/current/ddl-constraints.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s3, title: "PostgreSQL 19 documentation: Joins between tables", url: "https://www.postgresql.org/docs/current/tutorial-join.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s4, title: "PostgreSQL 19 documentation: Planner/optimizer", url: "https://www.postgresql.org/docs/current/planner-optimizer.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s5, title: "PostgreSQL 19 documentation: Using EXPLAIN", url: "https://www.postgresql.org/docs/current/using-explain.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s6, title: "PostgreSQL 19 documentation: SQL conformance", url: "https://www.postgresql.org/docs/current/features.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s7, title: "Trino 484 documentation: Trino concepts", url: "https://trino.io/docs/current/overview/concepts.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s8, title: "Apache Spark 4.3.0 documentation: ANSI compliance", url: "https://spark.apache.org/docs/latest/sql-ref-ansi-compliance.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s9, title: "Google Cloud: Introduction to SQL in BigQuery", url: "https://docs.cloud.google.com/bigquery/docs/introduction-sql", kind: primary, vendor: true}
  - {id: the-relational-model-and-sql-s10, title: "PostgreSQL 19 documentation: Privileges", url: "https://www.postgresql.org/docs/current/ddl-priv.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s11, title: "PostgreSQL 19 documentation: Row security policies", url: "https://www.postgresql.org/docs/current/ddl-rowsecurity.html", kind: primary, vendor: false}
  - {id: the-relational-model-and-sql-s12, title: "pgAudit: PostgreSQL Audit Extension, README", url: "https://github.com/pgaudit/pgaudit", kind: primary, vendor: false}
claims:
  - {id: the-relational-model-and-sql-relation, class: A, sources: [the-relational-model-and-sql-s1], verified: "2026-11-25", text: "Codd defines a relation on n sets as a set of n-tuples, and presents the relational view as a sound basis for treating derivability, redundancy and consistency of relations."}
  - {id: the-relational-model-and-sql-independence, class: A, sources: [the-relational-model-and-sql-s1], verified: "2026-11-25", text: "Codd's 1970 paper states that future users of large data banks must be protected from having to know how the data is organized in the machine."}
  - {id: the-relational-model-and-sql-primary-key, class: A, sources: [the-relational-model-and-sql-s1, the-relational-model-and-sql-s2], verified: "2026-11-25", text: "A domain or combination of domains whose values uniquely identify each element of a relation is called a primary key. A PostgreSQL primary key constraint requires the values to be both unique and not null."}
  - {id: the-relational-model-and-sql-foreign-key, class: A, sources: [the-relational-model-and-sql-s2, the-relational-model-and-sql-s1], verified: "2026-11-25", text: "A foreign key constraint specifies that the values in a column or group of columns must match the values appearing in some row of another table, which maintains the referential integrity between two related tables."}
  - {id: the-relational-model-and-sql-constraints, class: A, sources: [the-relational-model-and-sql-s2], verified: "2026-11-25", text: "A check constraint specifies that the value in a column must satisfy a Boolean expression. If a user attempts to store data in a column that would violate a constraint, an error is raised."}
  - {id: the-relational-model-and-sql-join, class: A, sources: [the-relational-model-and-sql-s3], verified: "2026-11-25", text: "Queries that access multiple tables at one time are called join queries. They combine rows from one table with rows from a second table, with an expression specifying which rows are to be paired."}
  - {id: the-relational-model-and-sql-planner, class: A, sources: [the-relational-model-and-sql-s4], verified: "2026-11-25", text: "A given SQL query can be executed in a wide variety of different ways, each of which will produce the same set of results. If it is computationally feasible, the PostgreSQL query optimizer examines each possible execution plan and selects the one expected to run the fastest."}
  - {id: the-relational-model-and-sql-strategies, class: A, sources: [the-relational-model-and-sql-s4], verified: "2026-11-25", text: "The three join strategies available to the PostgreSQL planner are nested loop join, merge join and hash join."}
  - {id: the-relational-model-and-sql-explain, class: A, sources: [the-relational-model-and-sql-s5], verified: "2026-11-25", text: "PostgreSQL devises a query plan for each query it receives. The plan is a tree of plan nodes with scan nodes at the bottom level, and the EXPLAIN command shows the plan the planner creates for any query."}
  - {id: the-relational-model-and-sql-standard, class: C, sources: [the-relational-model-and-sql-s6], verified: "2026-11-25", text: "The formal name of the SQL standard is ISO/IEC 9075 Database Language SQL, and its most recent update is SQL:2023. The PostgreSQL 19 documentation states that no current version of any database management system claims full conformance to Core SQL:2023."}
  - {id: the-relational-model-and-sql-engines, class: B, sources: [the-relational-model-and-sql-s7], verified: "2026-11-25", text: "Trino is a distributed query engine that executes ANSI-compatible SQL statements, with connectors for data lakes and lakehouses including Delta Lake, Hive, Hudi and Iceberg."}
  - {id: the-relational-model-and-sql-spark, class: C, sources: [the-relational-model-and-sql-s8], verified: "2026-11-25", text: "In Spark 4.3.0, spark.sql.ansi.enabled is true by default and Spark SQL uses an ANSI compliant dialect instead of being Hive compliant."}
  - {id: the-relational-model-and-sql-bigquery, class: B, sources: [the-relational-model-and-sql-s9], verified: "2026-11-25", flags: [vendor-stated], text: "Google describes GoogleSQL, the dialect BigQuery supports and recommends for new projects, as an ANSI-compliant Structured Query Language."}
  - {id: the-relational-model-and-sql-grant, class: A, sources: [the-relational-model-and-sql-s10], verified: "2026-11-25", text: "In PostgreSQL, privileges must be granted with GRANT before roles other than the owner can use an object. The SELECT privilege allows SELECT from any column, or specific columns, of a table."}
  - {id: the-relational-model-and-sql-row-security, class: A, sources: [the-relational-model-and-sql-s11], verified: "2026-11-25", text: "PostgreSQL tables can have row security policies that restrict, on a per-user basis, which rows can be returned by normal queries or inserted, updated or deleted by data modification commands."}
  - {id: the-relational-model-and-sql-audit, class: B, sources: [the-relational-model-and-sql-s12], verified: "2026-11-25", text: "pgAudit provides detailed session and object audit logging through the standard PostgreSQL logging facility. Its object audit logging logs statements that affect a particular relation."}
