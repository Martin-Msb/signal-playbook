sources:
  - {id: retrieval-augmented-generation-s1, title: "Lewis et al.: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (2020)", url: "https://arxiv.org/abs/2005.11401", kind: primary, vendor: false}
  - {id: retrieval-augmented-generation-s2, title: "Anthropic: Search results", url: "https://platform.claude.com/docs/en/build-with-claude/search-results", kind: primary, vendor: true}
  - {id: retrieval-augmented-generation-s3, title: "Anthropic: Citations", url: "https://platform.claude.com/docs/en/build-with-claude/citations", kind: primary, vendor: true}
  - {id: retrieval-augmented-generation-s4, title: "OpenAI: File search", url: "https://developers.openai.com/api/docs/guides/tools-file-search", kind: primary, vendor: true}
  - {id: retrieval-augmented-generation-s5, title: "OWASP GenAI Security Project: LLM09:2026 Vector and Embedding Weaknesses", url: "https://genai.owasp.org/llm2026/llm092026-vector-and-embedding-weaknesses/", kind: primary, vendor: false}
  - {id: retrieval-augmented-generation-s6, title: "Microsoft Learn: Security filter pattern in Azure AI Search", url: "https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search", kind: primary, vendor: true}
claims:
  - {id: retrieval-augmented-generation-parametric-limits, class: A, sources: [retrieval-augmented-generation-s1], verified: "2026-11-27", text: "Lewis et al. state that large pre-trained language models store factual knowledge in their parameters, that their ability to access and precisely manipulate knowledge is limited, and that providing provenance for their decisions and updating their world knowledge remain open research problems."}
  - {id: retrieval-augmented-generation-definition, class: A, sources: [retrieval-augmented-generation-s1], verified: "2026-11-27", text: "Retrieval-augmented generation combines a parametric memory, a pre-trained generation model, with a non-parametric memory, a document index accessed with a retriever. For a query, the retriever finds the top-K documents and the generator conditions on the retrieved passages."}
  - {id: retrieval-augmented-generation-index-update, class: A, sources: [retrieval-augmented-generation-s1], verified: "2026-11-27", text: "Knowledge in a non-parametric memory can be updated at test time: the retrieval index can be hot-swapped to update the model without requiring any retraining, whereas parametric-only models need further training to update their behaviour as the world changes."}
  - {id: retrieval-augmented-generation-readable-memory, class: A, sources: [retrieval-augmented-generation-s1], verified: "2026-11-27", text: "The memory is raw text rather than distributed representations, which makes it human-readable and human-writable: the model's memory can be updated by editing the document index."}
  - {id: retrieval-augmented-generation-search-results, class: B, sources: [retrieval-augmented-generation-s2], verified: "2026-11-27", text: "In the Claude API a search result content block carries a source, a title and content, and is used in RAG applications where the model needs to attribute answers to the application's documents. Search results can be returned from tool calls or provided directly in user messages for pre-fetched or cached content."}
  - {id: retrieval-augmented-generation-citations, class: B, sources: [retrieval-augmented-generation-s2, retrieval-augmented-generation-s3], verified: "2026-11-27", flags: [vendor-stated], text: "With citations enabled, Claude cites search results automatically and each citation carries the source and title provided. Anthropic states that because the API extracts the cited text directly, citations are guaranteed to contain valid pointers to the provided documents."}
  - {id: retrieval-augmented-generation-file-search, class: B, sources: [retrieval-augmented-generation-s4], verified: "2026-11-27", text: "OpenAI's file search is a hosted tool that lets models retrieve information from a knowledge base of previously uploaded files through semantic and keyword search. When the model decides to use it, it calls the tool automatically, and the response contains the model's answer along with file citations."}
  - {id: retrieval-augmented-generation-scope-in-query, class: A, sources: [retrieval-augmented-generation-s5], verified: "2026-11-27", text: "OWASP advises enforcing scoping inside the index query, not as a post-retrieval filter, and validating it server-side, and applying access control at the chunk level because a mostly public document can contain a confidential paragraph."}
  - {id: retrieval-augmented-generation-security-filter, class: B, sources: [retrieval-augmented-generation-s6], verified: "2026-11-27", text: "In the Azure AI Search security filter pattern, each indexed document carries a field of group or user identities and a filter on the query returns the documents to which the request issuer has read access. The application must authenticate users, obtain trusted principal values and apply the filter to every query."}
  - {id: retrieval-augmented-generation-retrieval-log, class: A, sources: [retrieval-augmented-generation-s5], verified: "2026-11-27", text: "OWASP advises keeping immutable logs of retrieval activity, including the scope, the query and the returned IDs, and tracking provenance for every embedding, including its source and ingestion time."}
