sources:
  - {id: sensitive-data-handling-s1, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng/", kind: primary, vendor: false}
  - {id: sensitive-data-handling-s2, title: "European Data Protection Board: Guidelines 01/2025 on Pseudonymisation, version for public consultation", url: "https://www.edpb.europa.eu/system/files/2025-01/edpb_guidelines_202501_pseudonymisation_en.pdf", kind: primary, vendor: false}
  - {id: sensitive-data-handling-s3, title: "Google Cloud documentation: Best practices for using policy tags in BigQuery", url: "https://cloud.google.com/bigquery/docs/best-practices-policy-tags", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s4, title: "Google Cloud documentation: Mask column data", url: "https://cloud.google.com/bigquery/docs/column-data-masking", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s5, title: "Google Cloud documentation: Transformation reference for Sensitive Data Protection", url: "https://cloud.google.com/sensitive-data-protection/docs/transformations-reference", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s6, title: "Google Cloud documentation: Pseudonymization for Sensitive Data Protection", url: "https://cloud.google.com/sensitive-data-protection/docs/pseudonymization", kind: primary, vendor: true}
  - {id: sensitive-data-handling-s7, title: "PCI Security Standards Council: Information Supplement, PCI DSS Tokenization Guidelines", url: "https://listings.pcisecuritystandards.org/documents/Tokenization_Guidelines_Info_Supplement.pdf", kind: primary, vendor: false}
  - {id: sensitive-data-handling-s8, title: "Google Cloud documentation: Managing partitioned tables", url: "https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables", kind: primary, vendor: true}
claims:
  - {id: sensitive-data-handling-purpose, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-27", text: "The GDPR requires personal data to be collected for specified, explicit and legitimate purposes and not further processed incompatibly; to be adequate, relevant and limited to what is necessary; and to be kept in identifiable form no longer than necessary for its purposes."}
  - {id: sensitive-data-handling-erasure, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-27", text: "Under GDPR Article 17, a person has the right to obtain erasure without undue delay when specified grounds apply, including when data are no longer necessary for their purposes. The right has exceptions, including processing required by law or for legal claims. Where a controller made data public, it must take reasonable steps to inform other controllers processing it about the erasure request."}
  - {id: sensitive-data-handling-design, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-27", text: "GDPR Article 25 requires controllers to implement appropriate technical and organisational measures, such as pseudonymisation, designed to implement data protection principles such as data minimisation, and to ensure that by default only personal data necessary for each specific purpose are processed."}
  - {id: sensitive-data-handling-transfers, class: A, sources: [sensitive-data-handling-s1], verified: "2026-11-27", text: "Under GDPR Article 44, any transfer of personal data to a third country or an international organisation must comply with the conditions of Chapter V, which also apply to onward transfers. Article 45 allows a transfer where the Commission has decided that the destination ensures an adequate level of protection."}
  - {id: sensitive-data-handling-tags, class: B, sources: [sensitive-data-handling-s3], verified: "2026-11-27", text: "BigQuery policy tags enforce column-level access control and dynamic data masking on sensitive table data. A single data class can be applied to multiple data columns using a policy tag."}
  - {id: sensitive-data-handling-masking, class: B, sources: [sensitive-data-handling-s4], verified: "2026-11-27", text: "BigQuery data masking selectively obscures sensitive data and provides different levels of visibility to different groups of users. Users running queries against the column get unmasked data, masked data or an access denied error, depending on their groups and roles."}
  - {id: sensitive-data-handling-tokenisation, class: B, sources: [sensitive-data-handling-s5, sensitive-data-handling-s6], verified: "2026-11-27", text: "Google Sensitive Data Protection masks a string fully or partially by replacing a given number of characters with a specified fixed character. Its pseudonymisation replaces sensitive data values with cryptographically generated tokens; a one-way token has been transformed irreversibly, while a two-way token can be reversed."}
  - {id: sensitive-data-handling-pseudonymised, class: A, sources: [sensitive-data-handling-s1, sensitive-data-handling-s2], verified: "2026-11-27", text: "GDPR Article 4(5) defines pseudonymisation as processing after which personal data can no longer be attributed to a specific data subject without additional information that is kept separately. The EDPB guidelines name cryptographic algorithms and lookup tables as the two common classes of pseudonymising transformation, with keys or the tables themselves kept secret. They state that pseudonymised data which could be attributed to a person by the use of additional information is personal data even if the two are not in the same hands, that data subject rights apply to it, and that after all additional information is erased it becomes anonymous only if the conditions for anonymity are met."}
  - {id: sensitive-data-handling-vault, class: A, sources: [sensitive-data-handling-s7], verified: "2026-11-27", text: "The PCI DSS Tokenization Guidelines describe tokenisation as replacing the primary account number with a surrogate value called a token. The card data vault is the central repository for account numbers and tokens and is used by the token-mapping process. The ability to retrieve an account number in exchange for its token should be restricted to specifically authorised individuals, applications and systems."}
  - {id: sensitive-data-handling-retention, class: B, sources: [sensitive-data-handling-s1, sensitive-data-handling-s8], verified: "2026-11-27", text: "GDPR recital 39 says the period for which personal data are stored is limited to a strict minimum and that the controller should establish time limits for erasure or for a periodic review. In BigQuery, a partition expiration specifies how long the data in each partition is kept; an expired partition is marked for deletion and a background process deletes it asynchronously."}
