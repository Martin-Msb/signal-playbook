sources:
  - {id: release-and-change-management-s1, title: "Anthropic: Model IDs and versioning", url: "https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions", kind: primary, vendor: true}
  - {id: release-and-change-management-s2, title: "Anthropic: Model deprecations", url: "https://platform.claude.com/docs/en/about-claude/model-deprecations", kind: primary, vendor: true}
  - {id: release-and-change-management-s3, title: "OpenAI: Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering", kind: primary, vendor: true}
  - {id: release-and-change-management-s4, title: "Langfuse: Prompt version control", url: "https://langfuse.com/docs/prompt-management/features/prompt-version-control", kind: primary, vendor: true}
  - {id: release-and-change-management-s5, title: "Promptfoo: CI/CD integration for LLM eval and security", url: "https://www.promptfoo.dev/docs/integrations/ci-cd/", kind: primary, vendor: true}
  - {id: release-and-change-management-s6, title: "Google: The Site Reliability Workbook, Canarying releases", url: "https://sre.google/workbook/canarying-releases/", kind: primary, vendor: false}
  - {id: release-and-change-management-s7, title: "NIST: AI Risk Management Framework 1.0, AI RMF Core", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: primary, vendor: false}
  - {id: release-and-change-management-s8, title: "NIST: AI 600-1, Generative Artificial Intelligence Profile", url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf", kind: primary, vendor: false}
  - {id: release-and-change-management-s9, title: "GitHub: Deployments and environments", url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments", kind: primary, vendor: true}
  - {id: release-and-change-management-s10, title: "Anthropic: Writing effective tools for AI agents", url: "https://www.anthropic.com/engineering/writing-tools-for-agents", kind: primary, vendor: true}
  - {id: release-and-change-management-s11, title: "OpenAI: Deprecations", url: "https://developers.openai.com/api/docs/deprecations", kind: primary, vendor: true}
claims:
  - {id: release-and-change-management-snapshots, class: B, sources: [release-and-change-management-s3], verified: "2026-11-27", text: "OpenAI states that different model types might need to be prompted differently and that even different snapshots of models within the same family could produce different results. It strongly recommends pinning production applications to specific model snapshots to ensure consistent behaviour, and building tests and evaluation suites that measure prompt behaviour to monitor performance when iterating or when changing and upgrading model versions."}
  - {id: release-and-change-management-tools, class: B, sources: [release-and-change-management-s10], verified: "2026-11-27", flags: [vendor-stated], text: "Tool descriptions and specs are loaded into the agent's context and can collectively steer agents toward effective tool-calling behaviours. Anthropic states that even small refinements to tool descriptions can yield dramatic improvements."}
  - {id: release-and-change-management-pinned-id, class: B, sources: [release-and-change-management-s1], verified: "2026-11-27", text: "Each Claude model ID identifies a pinned version of the model, and the underlying model remains constant for the lifetime of that ID. Anthropic does not update the weights or configuration of an existing model ID, and an updated version ships under a new model ID. For models before the 4.6 generation, a shorter alias points to the most recent dated snapshot for its minor version."}
  - {id: release-and-change-management-infrastructure, class: B, sources: [release-and-change-management-s1], verified: "2026-11-27", text: "Model weights are fixed for a given Claude model ID, but the serving infrastructure around the model, including the request router, safety classifiers and sampling logic, can change over time. Infrastructure updates occasionally produce minor differences in observable behaviour even when the model ID and weights have not changed."}
  - {id: release-and-change-management-prompt-versions, class: B, sources: [release-and-change-management-s4], verified: "2026-11-27", text: "In Langfuse, version control and deployment of prompts is managed through versions and labels. Labels can assign prompts to environments such as staging and production, and a prompt version is deployed by assigning it the production label or another environment label."}
  - {id: release-and-change-management-prompt-rollback, class: B, sources: [release-and-change-management-s4], verified: "2026-11-27", text: "In Langfuse, a prompt is rolled back by setting the production label to a previous version. Labels can be protected so that the viewer and member roles cannot modify or delete them."}
  - {id: release-and-change-management-inventory, class: B, sources: [release-and-change-management-s8], verified: "2026-11-27", text: "The NIST Generative AI Profile suggests that inventory entries for generative AI systems include the underlying foundation models, versions of underlying models, and access modes. It also states that robust version control systems can be applied to track changes across the AI lifecycle over time."}
  - {id: release-and-change-management-ci-gate, class: B, sources: [release-and-change-management-s5], verified: "2026-11-27", text: "Promptfoo documents running evals in CI/CD to test prompt changes before they reach production. Its GitHub Actions example runs on pull requests that change the prompt files, quality gates enforce minimum performance thresholds, and the build fails when quality thresholds are not met."}
  - {id: release-and-change-management-reviewers, class: B, sources: [release-and-change-management-s9], verified: "2026-11-27", text: "In GitHub Actions, required reviewers require a specific person or team to approve workflow jobs that reference an environment. Only one of the required reviewers needs to approve the job for it to proceed, and a setting prevents users who initiate a deployment from approving the deployment job."}
  - {id: release-and-change-management-go-no-go, class: B, sources: [release-and-change-management-s8], verified: "2026-11-27", text: "The NIST Generative AI Profile suggests establishing minimum thresholds for performance or assurance criteria and reviewing them as part of deployment approval (go/no-go) policies, procedures and processes. It also suggests sharing results of pre-deployment testing with relevant actors, such as those with system release approval authority."}
  - {id: release-and-change-management-canary, class: A, sources: [release-and-change-management-s6], verified: "2026-11-27", text: "The Google Site Reliability Workbook defines canarying as a partial and time-limited deployment of a change in a service and its evaluation. The part of the service that receives the change is the canary, and the remainder of the service is the control."}
  - {id: release-and-change-management-canary-rollback, class: B, sources: [release-and-change-management-s6], verified: "2026-11-27", text: "In the Google Site Reliability Workbook, an error rate of the canary that is too far from the error rate of the control signals a bad canary deployment, and the response is to pause and roll back the deployment or contact a human to help troubleshoot. The canary process builds confidence in a change as it is exposed to larger and larger amounts of traffic. Canarying supplements testing, and when system defects are caught early, users are minimally impacted."}
  - {id: release-and-change-management-lifecycle, class: B, sources: [release-and-change-management-s2], verified: "2026-11-27", text: "Anthropic regularly retires older models. A deprecated model is still functional but no longer recommended, and has a recommended replacement and a retirement date. Requests to a retired model fail. Anthropic advises migrating all usage before the retirement date, testing applications thoroughly with the new models well before that date, and exporting API usage by API key and model to locate remaining use of deprecated models."}
  - {id: release-and-change-management-notice, class: C, sources: [release-and-change-management-s2], verified: "2026-11-27", text: "Anthropic gives at least 60 days' notice before retiring a publicly released model. On November 23, 2026 it announced the retirement of claude-opus-4-5-20251101 on the Claude API on January 22, 2027, with claude-opus-5-5 as the recommended replacement."}
  - {id: release-and-change-management-shutdown, class: B, sources: [release-and-change-management-s11], verified: "2026-11-27", text: "In OpenAI's model lifecycle, a deprecated model has had its retirement announced and can still be used until its shutdown date. After shutdown the model no longer accepts requests through the standard API. Impacted customers are notified by email and in the documentation."}
  - {id: release-and-change-management-nist-change, class: B, sources: [release-and-change-management-s7], verified: "2026-11-27", text: "In the NIST AI Risk Management Framework 1.0, the MANAGE 4.1 outcome is that post-deployment AI system monitoring plans are implemented, including mechanisms for decommissioning, incident response, recovery and change management. The MANAGE 2.4 outcome is that mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use."}
