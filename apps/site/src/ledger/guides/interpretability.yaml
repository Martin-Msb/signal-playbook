  - {id: interpretability-s9, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", kind: primary, vendor: false, note: "In force. EUR-Lex lists corrigenda only and one consolidated version, dated 4 May 2016. Checked 27 November 2026."}
  - {id: interpretability-s10, title: "Court of Justice of the European Union: judgment of 27 February 2025, Case C-203/22, Dun & Bradstreet Austria", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62022CJ0203", kind: primary, vendor: false}
  - {id: interpretability-s11, title: "EUR-Lex: Regulation (EU) 2024/1689, Artificial Intelligence Act, consolidated text of 27 July 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727", kind: primary, vendor: false, note: "Consolidates the amendments made by Regulation (EU) 2026/1744 of 8 July 2026. The consolidated text is a documentation tool without legal effect."}
claims:
  - {id: interpretability-tension, class: A, sources: [interpretability-s3], verified: "2026-11-27", text: "The highest accuracy for large modern datasets is often achieved by complex models that even experts struggle to interpret, such as ensemble or deep learning models, creating a tension between accuracy and interpretability."}
  - {id: interpretability-permutation, class: A, sources: [interpretability-s1], verified: "2026-11-27", text: "Permutation feature importance is a model inspection technique that measures the contribution of each feature to a fitted model's statistical performance on a given tabular dataset. It involves randomly shuffling the values of a single feature and observing the resulting degradation of the model's score. By breaking the relationship between the feature and the target, it determines how much the model relies on that feature."}
  - {id: interpretability-held-out, class: B, sources: [interpretability-s1], verified: "2026-11-27", text: "Permutation importances can be computed either on the training set or on a held-out testing or validation set. Using a held-out set makes it possible to highlight which features contribute the most to the generalisation power of the inspected model. In scikit-learn the permutation_importance function calculates the feature importance of estimators for a given dataset."}
  - {id: interpretability-particular-model, class: A, sources: [interpretability-s1], verified: "2026-11-27", text: "Permutation importance does not reflect the intrinsic predictive value of a feature by itself but how important this feature is for a particular model. Features that are deemed of low importance for a bad model could be very important for a good model, so it is always important to evaluate the predictive power of a model using a held-out set or cross-validation prior to computing importances."}
  - {id: interpretability-correlated, class: A, sources: [interpretability-s1], verified: "2026-11-27", text: "When two features are correlated and one of the features is permuted, the model still has access to the latter through its correlated feature. This results in a lower reported importance value for both features, though they might actually be important. One way to handle the issue is to cluster features that are correlated and only keep one feature from each cluster."}
  - {id: interpretability-shap, class: A, sources: [interpretability-s3], verified: "2026-11-27", text: "SHAP (SHapley Additive exPlanations) assigns each feature an importance value for a particular prediction. SHAP values attribute to each feature the change in the expected model prediction when conditioning on that feature. They explain how to get from the base value that would be predicted if no features were known to the current output."}
  - {id: interpretability-shap-unique, class: A, sources: [interpretability-s3], verified: "2026-11-27", text: "SHAP values provide the unique additive feature importance measure that adheres to three properties, local accuracy, missingness and consistency, and uses conditional expectations to define simplified inputs. Local accuracy requires the explanation model to at least match the output of the original model for the input being explained."}
  - {id: interpretability-shap-sum, class: B, sources: [interpretability-s4, interpretability-s3], verified: "2026-11-27", text: "The shap documentation states that the SHAP values of all the input features always sum up to the difference between the baseline, expected model output and the output of the model for the prediction being explained, and shows this with a waterfall plot. By default a SHAP bar plot takes the mean absolute value of each feature over all the instances, the rows, of the dataset."}
  - {id: interpretability-shap-assumption, class: A, sources: [interpretability-s3], verified: "2026-11-27", text: "When SHAP values are approximated, feature independence and model linearity are two optional assumptions that simplify the computation of the expected values. When the model is non-linear or the input features are not independent, the order in which features are added to the expectation matters, and the SHAP values arise from averaging across all possible orderings."}
  - {id: interpretability-not-causal, class: B, sources: [interpretability-s5], verified: "2026-11-27", text: "The shap documentation states that making correlations transparent does not make them causal, and that the assumptions made by interpreting a normal predictive model as causal are often unrealistic."}
  - {id: interpretability-fooled, class: A, sources: [interpretability-s8], verified: "2026-11-27", text: "Slack, Hilgard, Jia, Singh and Lakkaraju demonstrate that post hoc explanation techniques that rely on input perturbations, such as LIME and SHAP, are not reliable. They propose a scaffolding technique that effectively hides the biases of any given classifier, so that the post hoc explanations of the scaffolded classifier look innocuous."}
  - {id: interpretability-partial-dependence, class: A, sources: [interpretability-s2], verified: "2026-11-27", text: "Partial dependence plots show the dependence between the target response and a set of input features of interest, marginalising over the values of all other input features. The partial dependence can be interpreted as the expected target response as a function of the input features of interest. Partial dependence plots are good at showing the average effect of the target features, and they can obscure a heterogeneous relationship created by interactions."}
  - {id: interpretability-ice, class: A, sources: [interpretability-s2], verified: "2026-11-27", text: "An individual conditional expectation plot visualises the dependence of the prediction on a feature for each sample separately, with one line per sample. The average of the individual conditional expectation lines corresponds to the partial dependence line."}
  - {id: interpretability-independence, class: A, sources: [interpretability-s2], verified: "2026-11-27", text: "Both partial dependence plots and individual conditional expectation plots assume that the input features of interest are independent from the complement features, and this assumption is often violated in practice. In the case of correlated features, absurd data points are created to compute them."}
  - {id: interpretability-counterfactual, class: A, sources: [interpretability-s6], verified: "2026-11-27", text: "Counterfactual explanations take a similar form to the statement: you were denied a loan because your annual income was £30,000; if your income had been £45,000, you would have been offered a loan. They describe the smallest change to the world that can be made to obtain a desirable outcome, and can be offered without opening the black box."}
  - {id: interpretability-aims, class: A, sources: [interpretability-s6], verified: "2026-11-27", text: "Wachter, Mittelstadt and Russell propose three aims for explanations to assist data subjects: to inform and help the subject understand why a particular decision was reached, to provide grounds to contest adverse decisions, and to understand what could be changed to receive a desired result in the future, based on the current decision-making model. None hinge on explaining the internal logic of automated decision-making systems."}
  - {id: interpretability-several, class: A, sources: [interpretability-s6], verified: "2026-11-27", text: "Multiple counterfactuals are possible, as multiple desirable outcomes can exist and there may be several ways to achieve any of them. Knowing the smallest possible change to a variable may not always be the most helpful type of counterfactual: relevance depends also on case-specific factors such as the mutability of a variable or the real world probability of a change."}
  - {id: interpretability-post-hoc, class: A, sources: [interpretability-s7], verified: "2026-11-27", text: "Rudin distinguishes explainable machine learning, where a second, post hoc model is created to explain the first black box model, from inherently interpretable models, which provide their own explanations that are faithful to what the model actually computes. She states that explanations of a black box cannot have perfect fidelity with respect to the original model: if the explanation was completely faithful to what the original model computes, the explanation would equal the original model."}
  - {id: interpretability-myth, class: B, sources: [interpretability-s7], verified: "2026-11-27", text: "Rudin states that it is a myth that there is necessarily a trade-off between accuracy and interpretability. When considering problems that have structured data with meaningful features, there is often no significant difference in performance between more complex classifiers, such as deep neural networks, boosted decision trees and random forests, and much simpler classifiers, such as logistic regression and decision lists, after preprocessing."}
  - {id: interpretability-gdpr-22, class: C, sources: [interpretability-s9], verified: "2026-11-27", text: "Article 22(1) of Regulation (EU) 2016/679 states that the data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her. Where the decision is necessary for a contract or based on explicit consent, Article 22(3) requires the controller to implement suitable measures, at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision."}
  - {id: interpretability-recital-71, class: C, sources: [interpretability-s9], verified: "2026-11-27", text: "Recital 71 of Regulation (EU) 2016/679 gives automatic refusal of an online credit application as an example of such a decision, and states that the processing should be subject to suitable safeguards, which should include the right to obtain an explanation of the decision reached after such assessment and to challenge the decision."}
  - {id: interpretability-logic, class: C, sources: [interpretability-s9], verified: "2026-11-27", text: "Articles 13(2)(f), 14(2)(g) and 15(1)(h) of Regulation (EU) 2016/679 entitle the data subject to information on the existence of automated decision-making, including profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful information about the logic involved, as well as the significance and the envisaged consequences of such processing for the data subject."}
  - {id: interpretability-court, class: C, sources: [interpretability-s10], verified: "2026-11-27", text: "In Case C-203/22 the Court of Justice of the European Union ruled on 27 February 2025 that under Article 15(1)(h) of Regulation (EU) 2016/679 the data subject may require the controller to explain, by means of relevant information and in a concise, transparent, intelligible and easily accessible form, the procedure and principles actually applied in order to use, by automated means, the personal data concerning that person with a view to obtaining a specific result, such as a credit profile. The mere communication of a complex mathematical formula, such as an algorithm, does not satisfy those requirements."}
  - {id: interpretability-variation, class: C, sources: [interpretability-s10], verified: "2026-11-27", text: "In paragraph 62 of its judgment in Case C-203/22 the Court of Justice of the European Union states that, as regards profiling such as that at issue, the referring court could find that it is sufficiently transparent and intelligible to inform the data subject of the extent to which a variation in the personal data taken into account would have led to a different result."}
  - {id: interpretability-ai-act-86, class: C, sources: [interpretability-s11], verified: "2026-11-27", text: "Article 86(1) of Regulation (EU) 2024/1689 gives any affected person subject to a decision taken by the deployer on the basis of the output from a high-risk AI system listed in Annex III, with the exception of systems listed under point 2, and which produces legal effects or similarly significantly affects that person in a way that they consider to have an adverse impact on their health, safety or fundamental rights, the right to obtain from the deployer clear and meaningful explanations of the role of the AI system in the decision-making procedure and the main elements of the decision taken. Point 5(b) of Annex III lists AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score, with the exception of AI systems used for the purpose of detecting financial fraud. Under Article 86(3) the article applies only to the extent that the right is not otherwise provided for under Union law."}
  - {id: interpretability-ai-act-dates, class: C, sources: [interpretability-s11], verified: "2026-11-27", text: "In the consolidated text of Regulation (EU) 2024/1689 dated 27 July 2026, which incorporates the amendments of Regulation (EU) 2026/1744 of 8 July 2026, Article 86 carries no amendment. Article 113 as amended states that Chapter III, Sections 1, 2 and 3 apply from 2 December 2027 as regards AI systems classified as high-risk pursuant to Article 6(2) and Annex III."}
