claims:
  - {id: master-and-reference-data-linkage, class: A, sources: [master-and-reference-data-s1], verified: "2026-11-25", text: "Record linkage is the process of using the information within records to assess whether records refer to the same entity. Real datasets often lack truly unique identifiers, both within and across datasets. With a shared unique identifier, linking datasets would be a simple inner join."}
  - {id: master-and-reference-data-resolution, class: B, sources: [master-and-reference-data-s4, master-and-reference-data-s5], verified: "2026-11-25", text: "AWS Entity Resolution is a service that helps match, link and enhance related records stored across multiple applications, channels and data stores. Matching is the process of combining and comparing data from different input fields, tables or databases and determining which of it is alike, based on matching rules or models."}
  - {id: master-and-reference-data-rules, class: B, sources: [master-and-reference-data-s5], verified: "2026-11-25", text: "Rule-based matching in AWS Entity Resolution is a hierarchical set of waterfall matching rules designed to find exact matches. AWS recommends ordering rules to find more precise matches first. It returns a match ID and a rule number for each matched set of data. Normalisation standardises data by removing extra spaces and special characters and standardising to lowercase."}
  - {id: master-and-reference-data-ml, class: B, sources: [master-and-reference-data-s4, master-and-reference-data-s5], verified: "2026-11-25", text: "Machine learning-based matching in AWS Entity Resolution finds matches across data that might be incomplete or might not look exactly the same. Each match group has an associated confidence score of 0.0 to 1.0."}
  - {id: master-and-reference-data-fellegi-sunter, class: A, sources: [master-and-reference-data-s2], verified: "2026-11-25", text: "The Fellegi-Sunter model is the statistical model that underlies Splink. The m probability is the probability of a given observation given the records are a match, and the u probability is the probability of a given observation given the records are not a match. Match weights are additive, and the probability of two records being a match can be derived from the total match weight."}
  - {id: master-and-reference-data-blocking, class: A, sources: [master-and-reference-data-s3], verified: "2026-11-25", text: "The number of pairwise record comparisons grows with approximately the square of the number of records: a dataset of 1 million input records would generate around 500 billion pairwise record comparisons. Blocking is a technique for reducing the number of record pairs that are considered by a model, and a blocking rule on first name and surname generates only the comparisons where both match."}
  - {id: master-and-reference-data-threshold, class: B, sources: [master-and-reference-data-s10], verified: "2026-11-25", text: "In SQL Server Data Quality Services, only records with a probability of a match greater than a value set by the data steward in the matching policy are considered a match. The data steward verifies the matching results, rejects any record that is not an appropriate match for a cluster, and selects a survivorship rule."}
  - {id: master-and-reference-data-dqs-removed, class: C, sources: [master-and-reference-data-s10], verified: "2026-11-25", text: "Data Quality Services is removed in SQL Server 2025 (17.x) and remains supported in SQL Server 2022 (16.x) and earlier versions."}
  - {id: master-and-reference-data-master, class: B, sources: [master-and-reference-data-s8], verified: "2026-11-25", text: "Master data is the data that defines a domain entity, with examples including customer, product, asset, location and vendor data, and it can be present in multiple systems. Organisations capture customer data across an increasing number of systems and applications, and duplicate customer records with inconsistencies and discrepancies result."}
  - {id: master-and-reference-data-golden, class: B, sources: [master-and-reference-data-s8, master-and-reference-data-s9], verified: "2026-11-25", text: "Survivorship rules selectively populate the golden record with information chosen across all source systems. Golden records represent the authoritative version of master data assets. If master data records have been merged into a single golden record, parent-child links to the original records are preserved."}
  - {id: master-and-reference-data-review, class: B, sources: [master-and-reference-data-s8], verified: "2026-11-25", text: "In the Microsoft Purview and Profisee architecture, any record that fails validation or that returns a low probability score is subject to remediation: a workflow process assigns records that require review to data stewards who are experts in their business data domain. After a record has been verified or corrected, it is ready to use as a golden record master."}
  - {id: master-and-reference-data-unify, class: B, sources: [master-and-reference-data-s6], verified: "2026-11-25", text: "Unification in Dynamics 365 Customer Insights creates a single customer profile record for each customer and assigns it a unique CustomerId. When source data or rules change such that the records no longer match, the next unification run creates two or more customer profiles where one previously existed."}
  - {id: master-and-reference-data-winner, class: B, sources: [master-and-reference-data-s7], verified: "2026-11-25", text: "When fields are merged in Dynamics 365 Customer Insights, Importance identifies the winning value by the importance rank set for the participating fields, is the default merge option and uses the first non-null value. Most recent and Least recent identify the winning value by recency and require a date or numeric field."}
  - {id: master-and-reference-data-reltio, class: B, sources: [master-and-reference-data-s11], verified: "2026-11-25", text: "Reltio survivorship processes each attribute according to the attribute's defined survivorship rule to get an operational value. The Frequency rule returns the value that occurs most frequently, and the Aggregation rule returns all values, such as all addresses."}
  - {id: master-and-reference-data-reference, class: B, sources: [master-and-reference-data-s8], verified: "2026-11-25", text: "Reference data exists as numerous lists of data that are often used to further describe other sets of master data, such as lists of countries or regions, currencies, colours, sizes and units of measure. Inconsistent reference data makes it difficult to crosswalk, or map, reference data values between systems: the colour red is represented by R in one system and Red in another."}
  - {id: master-and-reference-data-dpia, class: B, sources: [master-and-reference-data-s12], verified: "2026-11-25", text: "The Article 29 Working Party guidelines on data protection impact assessment give nine criteria for processing likely to result in a high risk. One is matching or combining datasets, for example originating from two or more data processing operations performed for different purposes or by different data controllers in a way that would exceed the reasonable expectations of the data subject. In most cases, a controller can consider that processing meeting two criteria would require an assessment."}
  - {id: master-and-reference-data-dpia-2026, class: C, sources: [master-and-reference-data-s13, master-and-reference-data-s14], verified: "2026-11-25", text: "The European Data Protection Board announced on 14 April 2026 that it had adopted a template for data protection impact assessments, subject to public consultation until 9 June 2026. The Digital Omnibus regulation proposal, which would streamline data protection impact assessments, had the status Tabled and was not adopted on the page as updated on 25 October 2026."}
