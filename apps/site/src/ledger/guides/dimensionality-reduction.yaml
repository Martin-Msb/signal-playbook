sources:
  - {id: dimensionality-reduction-s1, title: "scikit-learn user guide: Decomposing signals in components", url: "https://scikit-learn.org/stable/modules/decomposition.html", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s2, title: "scikit-learn API reference: PCA", url: "https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s3, title: "scikit-learn user guide: Manifold learning", url: "https://scikit-learn.org/stable/modules/manifold.html", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s4, title: "Distill: How to Use t-SNE Effectively, Wattenberg, Viégas and Johnson, 2016", url: "https://distill.pub/2016/misread-tsne/", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s5, title: "UMAP documentation: Uniform Manifold Approximation and Projection for Dimension Reduction", url: "https://umap-learn.readthedocs.io/en/latest/", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s6, title: "UMAP documentation: Using UMAP for Clustering", url: "https://umap-learn.readthedocs.io/en/latest/clustering.html", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s7, title: "UMAP documentation: Basic UMAP Parameters", url: "https://umap-learn.readthedocs.io/en/latest/parameters.html", kind: primary, vendor: false}
  - {id: dimensionality-reduction-s8, title: "Science: Reducing the Dimensionality of Data with Neural Networks, Hinton and Salakhutdinov, 2006", url: "https://www.cs.toronto.edu/~hinton/absps/science.pdf", kind: primary, vendor: false, note: "Science, volume 313, 28 July 2006. Read from the PDF on the first author's university page."}
claims:
  - {id: dimensionality-reduction-purpose, class: A, sources: [dimensionality-reduction-s8], verified: "2026-11-27", text: "Dimensionality reduction facilitates the classification, visualization, communication, and storage of high-dimensional data."}
  - {id: dimensionality-reduction-artificial, class: A, sources: [dimensionality-reduction-s3], verified: "2026-11-27", text: "Manifold learning is an approach to non-linear dimensionality reduction. Algorithms for this task are based on the idea that the dimensionality of many data sets is only artificially high."}
  - {id: dimensionality-reduction-directions, class: A, sources: [dimensionality-reduction-s8], verified: "2026-11-27", text: "A simple and widely used method is principal components analysis (PCA), which finds the directions of greatest variance in the data set and represents each data point by its coordinates along each of these directions."}
  - {id: dimensionality-reduction-centred, class: B, sources: [dimensionality-reduction-s1, dimensionality-reduction-s2], verified: "2026-11-27", text: "In scikit-learn, PCA centers but does not scale the input data for each feature before applying the SVD."}
  - {id: dimensionality-reduction-pca, class: A, sources: [dimensionality-reduction-s1], verified: "2026-11-27", text: "PCA is used to decompose a multivariate dataset in a set of successive orthogonal components that explain a maximum amount of the variance."}
  - {id: dimensionality-reduction-components, class: B, sources: [dimensionality-reduction-s2], verified: "2026-11-27", text: "In scikit-learn's PCA, components_ holds the principal axes in feature space, representing the directions of maximum variance in the data, sorted by decreasing explained variance. explained_variance_ratio_ is the percentage of variance explained by each of the selected components, and if n_components is not set all components are stored and the sum of the ratios is equal to 1.0."}
  - {id: dimensionality-reduction-n-components, class: B, sources: [dimensionality-reduction-s2], verified: "2026-11-27", text: "In scikit-learn's PCA, n_components is the number of components to keep. If 0 < n_components < 1 and svd_solver is 'full', the number of components is selected such that the amount of variance that needs to be explained is greater than the percentage specified by n_components."}
  - {id: dimensionality-reduction-project, class: B, sources: [dimensionality-reduction-s1, dimensionality-reduction-s2], verified: "2026-11-27", text: "In scikit-learn, PCA is implemented as a transformer object that learns n components in its fit method, and can be used on new data to project it on these components. Its inverse_transform method transforms data back to its original space."}
  - {id: dimensionality-reduction-linear, class: A, sources: [dimensionality-reduction-s2, dimensionality-reduction-s3], verified: "2026-11-27", text: "PCA is linear dimensionality reduction that projects the data to a lower dimensional space. Linear dimensionality reduction frameworks such as Principal Component Analysis can be powerful, but often miss important non-linear structure in the data."}
  - {id: dimensionality-reduction-autoencoder, class: A, sources: [dimensionality-reduction-s8], verified: "2026-11-27", text: "High-dimensional data can be converted to low-dimensional codes by training a multilayer neural network with a small central layer to reconstruct high-dimensional input vectors. Hinton and Salakhutdinov describe such an autoencoder as a nonlinear generalization of PCA that uses an adaptive, multilayer encoder network to transform the high-dimensional data into a low-dimensional code and a similar decoder network to recover the data from the code."}
  - {id: dimensionality-reduction-tsne, class: A, sources: [dimensionality-reduction-s3], verified: "2026-11-27", text: "t-SNE converts affinities of data points to probabilities and minimises the Kullback-Leibler divergence of the joint probabilities in the original space and the embedded space by gradient descent. This allows t-SNE to be particularly sensitive to local structure. The main purpose of t-SNE is visualization of high-dimensional data."}
  - {id: dimensionality-reduction-stochastic, class: A, sources: [dimensionality-reduction-s3], verified: "2026-11-27", text: "The t-SNE algorithm is stochastic and multiple restarts with different seeds can yield different embeddings. Global structure is not explicitly preserved, a problem that is mitigated by initializing points with PCA."}
  - {id: dimensionality-reduction-perplexity, class: A, sources: [dimensionality-reduction-s3, dimensionality-reduction-s4], verified: "2026-11-27", text: "The perplexity is effectively the number of nearest neighbors t-SNE considers when generating the conditional probabilities. A lower perplexity considers a smaller number of neighbors, and thus ignores more global information in favour of the local neighborhood. The perplexity value has a complex effect on the resulting pictures."}
  - {id: dimensionality-reduction-sizes, class: A, sources: [dimensionality-reduction-s4], verified: "2026-11-27", text: "You cannot see relative sizes of clusters in a t-SNE plot, and distances between well-separated clusters in a t-SNE plot may mean nothing."}
  - {id: dimensionality-reduction-noise, class: A, sources: [dimensionality-reduction-s4], verified: "2026-11-27", text: "A classic pitfall is thinking you see patterns in what is really just random data. For 500 points drawn from a unit Gaussian distribution in 100 dimensions, the t-SNE plot with perplexity 2 seems to show dramatic clusters, and those clumps are not meaningful. Recognizing these clumps as random noise is an important part of reading t-SNE plots."}
  - {id: dimensionality-reduction-umap, class: A, sources: [dimensionality-reduction-s5, dimensionality-reduction-s7], verified: "2026-11-27", text: "Uniform Manifold Approximation and Projection (UMAP) is a dimension reduction technique that can be used for visualisation similarly to t-SNE, but also for general non-linear dimension reduction. Its n_neighbors parameter controls how UMAP balances local versus global structure in the data, and low values of min_dist will result in clumpier embeddings."}
  - {id: dimensionality-reduction-tears, class: A, sources: [dimensionality-reduction-s6], verified: "2026-11-27", text: "UMAP, like t-SNE, does not completely preserve density. UMAP, like t-SNE, can also create false tears in clusters, resulting in a finer clustering than is necessarily present in the data. Using UMAP as a preprocessing step for clustering is somewhat controversial, and should be attempted with care."}
  - {id: dimensionality-reduction-validate, class: B, sources: [dimensionality-reduction-s4, dimensionality-reduction-s6], verified: "2026-11-27", text: "Getting the most from t-SNE may mean analyzing multiple plots with different perplexities. As with any clustering approach, one will want to do some exploration and evaluation of the clusters that come out of a UMAP embedding to try to validate them if possible."}
  - {id: dimensionality-reduction-scale, class: B, sources: [dimensionality-reduction-s3], verified: "2026-11-27", text: "For manifold learning, make sure the same scale is used over all features. Because manifold learning methods are based on a nearest-neighbor search, the algorithm may perform poorly otherwise."}
  - {id: dimensionality-reduction-two-dims, class: A, sources: [dimensionality-reduction-s3], verified: "2026-11-27", text: "Failing to visualize well separated homogeneously labeled groups with t-SNE in 2D does not necessarily imply that the data cannot be correctly classified by a supervised model. It might be the case that 2 dimensions are not high enough to accurately represent the internal structure of the data."}
