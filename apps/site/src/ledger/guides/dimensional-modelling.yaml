claims:
  - {id: dimensional-modelling-fanout, class: A, sources: [dimensional-modelling-s8], verified: "2026-11-25", text: "When an orders table is joined to an order items table on the order id, each order total is repeated once per item, and a sum of the total over the joined rows counts it more than once."}
  - {id: dimensional-modelling-mixed-grain, class: A, sources: [dimensional-modelling-s1, dimensional-modelling-s2], verified: "2026-11-25", text: "Different grains must not be mixed in the same fact table. Records at mixed grain represent different physical measurement events that are not comparable, values can be double counted without a constraint in the query, and end-user tools should not be relied on to fix grain problems."}
  - {id: dimensional-modelling-grain, class: A, sources: [dimensional-modelling-s1], verified: "2026-11-25", text: "The grain establishes exactly what a single fact table row represents. It must be declared before choosing dimensions or facts, because every candidate dimension or fact must be consistent with it. Atomic grain is the lowest level at which data is captured by a given business process."}
  - {id: dimensional-modelling-facts, class: A, sources: [dimensional-modelling-s3], verified: "2026-11-25", text: "Facts are the measurements that result from a business process event and are almost always numeric. A fact table row corresponds one to one to a measurement event as described by the grain, and only facts consistent with the declared grain are allowed."}
  - {id: dimensional-modelling-dimensions, class: A, sources: [dimensional-modelling-s4], verified: "2026-11-25", text: "Dimensions provide the who, what, where, when, why and how context surrounding a business process event. Dimension tables contain the descriptive attributes used by BI applications for filtering and grouping the facts."}
  - {id: dimensional-modelling-dimension-care, class: B, sources: [dimensional-modelling-s4], verified: "2026-11-25", text: "Kimball calls dimension tables the soul of the data warehouse because they contain the entry points and descriptive labels for analysis, and states that a disproportionate amount of effort goes into their data governance and development."}
  - {id: dimensional-modelling-star, class: A, sources: [dimensional-modelling-s5, dimensional-modelling-s10], verified: "2026-11-25", text: "Dimensional models implemented in relational databases are star schemas, in which fact tables are linked to dimension tables through primary and foreign key relationships. A fact table forms the centre of a star and the related dimension tables form its points."}
  - {id: dimensional-modelling-keys, class: B, sources: [dimensional-modelling-s11, dimensional-modelling-s12], verified: "2026-11-25", flags: [vendor-stated], text: "In Microsoft's guidance for Fabric Warehouse, dimension keys in a fact table reference the surrogate keys of the related dimensions. A surrogate key is a single-column unique identifier generated and stored in the dimension table. The date dimension's surrogate key stores the date as an integer in YYYYMMDD form, an exception where the key value has meaning. A sales order number is kept in the fact table as an attribute."}
  - {id: dimensional-modelling-summarise, class: A, sources: [dimensional-modelling-s12, dimensional-modelling-s9], verified: "2026-11-25", text: "Analytic queries summarise measures by using sum, count, average and other functions within the context of dimension filters and groupings. Dimension tables enable filtering and grouping, and fact tables enable summarisation."}
  - {id: dimensional-modelling-additive, class: A, sources: [dimensional-modelling-s7, dimensional-modelling-s12], verified: "2026-11-25", text: "Fully additive facts can be summed across any dimension of the fact table. Semi-additive facts such as balances can be summed across some dimensions and not across time. Non-additive facts such as ratios and unit prices cannot be summed, and the recommended practice is to store their additive components and compute the ratio after summing."}
  - {id: dimensional-modelling-conformed, class: A, sources: [dimensional-modelling-s6], verified: "2026-11-25", text: "Dimension tables conform when attributes in separate dimension tables have the same column names and domain contents. Information from separate fact tables can then be combined in a single report. Conformed dimensions are defined once in collaboration with the business's data governance representatives and reused across fact tables."}
  - {id: dimensional-modelling-shared, class: B, sources: [dimensional-modelling-s11], verified: "2026-11-25", text: "Conformed dimensions relate to many fact tables, so they are shared by multiple stars in a dimensional model, and a date dimension is a common conformed dimension."}
  - {id: dimensional-modelling-obt, class: B, sources: [dimensional-modelling-s13], verified: "2026-11-25", text: "A One Big Table joins the fact table against all of its dimension tables. The dbt Developer Blog guide creates one when the BI tool has no semantic layer that supports relationships between tables."}
  - {id: dimensional-modelling-denormalise, class: B, sources: [dimensional-modelling-s14], verified: "2026-11-25", flags: [vendor-stated], text: "Google's BigQuery documentation states that star schemas are typically optimised schemas for analytics and that performance might not be significantly different if they are denormalised further."}
  - {id: dimensional-modelling-vault, class: A, sources: [dimensional-modelling-s15], verified: "2026-11-25", text: "Linstedt defines the Data Vault as a detail oriented, historical tracking and uniquely linked set of normalised tables, architected to meet the needs of the data warehouse and not to be confused with a data mart. Hubs carry at a minimum a unique list of business keys, links represent relationships between hubs, and satellites hold descriptive context for a hub key."}
  - {id: dimensional-modelling-vault-layer, class: B, sources: [dimensional-modelling-s16], verified: "2026-11-25", flags: [vendor-stated], text: "Databricks states that the Data Vault methodology can be applied to the Silver layer, where data is transformed into hubs, links and satellites, and that data marts can be built in the Gold layer following dimensional modelling."}
