sources:
  - {id: clustering-and-anomaly-detection-s1, title: "scikit-learn user guide: Clustering", url: "https://scikit-learn.org/stable/modules/clustering.html", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s2, title: "scikit-learn user guide: Novelty and Outlier Detection", url: "https://scikit-learn.org/stable/modules/outlier_detection.html", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s3, title: "scikit-learn user guide: Gaussian mixture models", url: "https://scikit-learn.org/stable/modules/mixture.html", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s4, title: "scikit-learn API reference: DBSCAN", url: "https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s5, title: "scikit-learn API reference: IsolationForest", url: "https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s6, title: "Google Machine Learning, Clustering course: What is clustering?", url: "https://developers.google.com/machine-learning/clustering/overview", kind: primary, vendor: false}
  - {id: clustering-and-anomaly-detection-s7, title: "EUR-Lex: Regulation (EU) 2016/679, General Data Protection Regulation", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng", kind: primary, vendor: false, note: "Status in force. The only consolidated version listed is dated 4 May 2016, with a corrigendum of 23 May 2018. Checked 27 November 2026."}
  - {id: clustering-and-anomaly-detection-s8, title: "Article 29 Data Protection Working Party: Guidelines on Automated individual decision-making and Profiling for the purposes of Regulation 2016/679, WP251rev.01", url: "https://ec.europa.eu/newsroom/article29/items/612053/en", kind: primary, vendor: false, note: "Adopted 3 October 2017, last revised and adopted 6 February 2018. Read from the English PDF linked on this page."}
claims:
  - {id: clustering-and-anomaly-detection-unsupervised, class: A, sources: [clustering-and-anomaly-detection-s6], verified: "2026-11-27", text: "Clustering is an unsupervised machine learning technique designed to group unlabeled examples based on their similarity to each other. After clustering, each group is assigned a unique label called a cluster ID. Market segmentation and anomaly detection are among its listed uses."}
  - {id: clustering-and-anomaly-detection-similarity, class: A, sources: [clustering-and-anomaly-detection-s6], verified: "2026-11-27", text: "A similarity measure, the metric used to compare samples, has to be defined explicitly, and different similarity measures may be more or less appropriate for different clustering scenarios."}
  - {id: clustering-and-anomaly-detection-kmeans, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "The KMeans algorithm clusters data by trying to separate samples in n groups of equal variance, minimising a criterion known as the inertia or within-cluster sum-of-squares. The algorithm requires the number of clusters to be specified."}
  - {id: clustering-and-anomaly-detection-kmeans-steps, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "K-means has three steps. The first chooses the initial centroids, with the most basic method being to choose k samples from the dataset. After initialisation it loops between the other two: the first assigns each sample to its nearest centroid, and the second creates new centroids by taking the mean value of all of the samples assigned to each previous centroid."}
  - {id: clustering-and-anomaly-detection-kmeans-local, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "Given enough time, K-means will always converge, however this may be to a local minimum. The k-means++ initialisation scheme, implemented in scikit-learn, is one method to help address this issue."}
  - {id: clustering-and-anomaly-detection-inertia, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "Inertia makes the assumption that clusters are convex and isotropic, which is not always the case. Inertia is not a normalised metric: lower values are better and zero is optimal."}
  - {id: clustering-and-anomaly-detection-silhouette, class: B, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "If the ground truth labels are not known, evaluation must be performed using the model itself. The Silhouette Coefficient is an example of such an evaluation, where a higher score relates to a model with better defined clusters."}
  - {id: clustering-and-anomaly-detection-mixture, class: A, sources: [clustering-and-anomaly-detection-s3], verified: "2026-11-27", text: "A Gaussian mixture model is a probabilistic model that assumes all the data points are generated from a mixture of a finite number of Gaussian distributions with unknown parameters. Mixture models can be thought of as generalising k-means clustering to incorporate information about the covariance structure of the data as well as the centres of the latent Gaussians. The algorithm always uses all the components it has access to, so held-out data or information theoretical criteria are needed to decide how many components to use."}
  - {id: clustering-and-anomaly-detection-dbscan, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "The DBSCAN algorithm views clusters as areas of high density separated by areas of low density. Clusters found by DBSCAN can be any shape, as opposed to k-means which assumes that clusters are convex shaped. The HDBSCAN algorithm can be seen as an extension of DBSCAN and OPTICS."}
  - {id: clustering-and-anomaly-detection-core, class: A, sources: [clustering-and-anomaly-detection-s1], verified: "2026-11-27", text: "Core samples are samples that are in areas of high density. Two parameters, min_samples and eps, define formally what dense means: a core sample is a sample such that there exist min_samples other samples within a distance of eps, which are defined as neighbours of the core sample."}
  - {id: clustering-and-anomaly-detection-noise, class: B, sources: [clustering-and-anomaly-detection-s1, clustering-and-anomaly-detection-s4], verified: "2026-11-27", text: "Any sample that is not a core sample, and is at least eps in distance from any core sample, is considered an outlier by DBSCAN. In scikit-learn noisy samples are given the label -1 and non-negative integers indicate cluster membership."}
  - {id: clustering-and-anomaly-detection-lof, class: A, sources: [clustering-and-anomaly-detection-s2], verified: "2026-11-27", text: "The Local Outlier Factor algorithm measures the local density deviation of a data point with respect to its neighbours, to detect the samples that have a substantially lower density than their neighbours. In practice the local density is obtained from the k-nearest neighbours."}
  - {id: clustering-and-anomaly-detection-outlier, class: A, sources: [clustering-and-anomaly-detection-s2], verified: "2026-11-27", text: "In outlier detection the training data contains outliers, defined as observations that are far from the others. Outlier detection and novelty detection are both used for anomaly detection, where one is interested in detecting abnormal or unusual observations, and outlier detection is also known as unsupervised anomaly detection."}
  - {id: clustering-and-anomaly-detection-isolation, class: A, sources: [clustering-and-anomaly-detection-s2, clustering-and-anomaly-detection-s5], verified: "2026-11-27", text: "The IsolationForest isolates observations by randomly selecting a feature and then randomly selecting a split value between the maximum and minimum values of the selected feature. The number of splittings required to isolate a sample is equivalent to the path length from the root node to the terminating node, and this path length, averaged over a forest of such random trees, is a measure of normality. Random partitioning produces noticeably shorter paths for anomalies."}
  - {id: clustering-and-anomaly-detection-threshold, class: B, sources: [clustering-and-anomaly-detection-s2, clustering-and-anomaly-detection-s5], verified: "2026-11-27", text: "In scikit-learn's outlier detection estimators inliers are labelled 1 and outliers -1. The predict method makes use of a threshold on the raw scoring function computed by the estimator, and the threshold can be controlled by the contamination parameter, the proportion of outliers in the data set."}
  - {id: clustering-and-anomaly-detection-profiling, class: C, sources: [clustering-and-anomaly-detection-s7], verified: "2026-11-27", text: "Article 4(4) of Regulation (EU) 2016/679 defines profiling as any form of automated processing of personal data consisting of the use of personal data to evaluate certain personal aspects relating to a natural person."}
  - {id: clustering-and-anomaly-detection-automated, class: C, sources: [clustering-and-anomaly-detection-s7], verified: "2026-11-27", text: "Article 22(1) of Regulation (EU) 2016/679 states that the data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her. Under Article 22(3), in the contract and explicit consent cases the controller's suitable measures include at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision."}
  - {id: clustering-and-anomaly-detection-discrimination, class: C, sources: [clustering-and-anomaly-detection-s7], verified: "2026-11-27", text: "Recital 71 of Regulation (EU) 2016/679 says the controller should use measures that prevent, inter alia, discriminatory effects on natural persons on the basis of racial or ethnic origin, political opinion, religion or beliefs, trade union membership, genetic or health status or sexual orientation, or that result in measures having such an effect."}
  - {id: clustering-and-anomaly-detection-inference, class: B, sources: [clustering-and-anomaly-detection-s8], verified: "2026-11-27", text: "The Article 29 Working Party guidelines state that profiling can create special category data by inference from data which is not special category data in its own right but becomes so when combined with other data, and that correlations may be discovered that indicate something about individuals' health, political convictions, religious beliefs or sexual orientation."}
  - {id: clustering-and-anomaly-detection-category, class: B, sources: [clustering-and-anomaly-detection-s8], verified: "2026-11-27", text: "The Article 29 Working Party guidelines state that profiling can perpetuate existing stereotypes and social segregation, and that it can lock a person into a specific category and restrict them to their suggested preferences."}
  - {id: clustering-and-anomaly-detection-meaningful, class: B, sources: [clustering-and-anomaly-detection-s8], verified: "2026-11-27", text: "The Article 29 Working Party guidelines state that to qualify as human involvement, the controller must ensure that any oversight of the decision is meaningful, rather than just a token gesture, and that it should be carried out by someone who has the authority and competence to change the decision."}
