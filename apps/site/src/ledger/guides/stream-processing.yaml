sources:
  - {id: stream-processing-s1, title: "Apache Flink: Timely Stream Processing", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/", kind: primary, vendor: false}
  - {id: stream-processing-s2, title: "Apache Flink: Windows", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", kind: primary, vendor: false}
  - {id: stream-processing-s3, title: "Apache Kafka: Kafka Streams Core Concepts", url: "https://kafka.apache.org/43/streams/core-concepts/", kind: primary, vendor: false}
  - {id: stream-processing-s4, title: "Apache Spark: Structured Streaming Programming Guide", url: "https://spark.apache.org/docs/latest/streaming/apis-on-dataframes-and-datasets.html", kind: primary, vendor: false}
  - {id: stream-processing-s5, title: "Apache Flink: Window Aggregation in SQL", url: "https://nightlies.apache.org/flink/flink-docs-release-2.0/docs/dev/table/sql/queries/window-agg/", kind: primary, vendor: false}
claims:
  - {id: stream-processing-time, class: A, sources: [stream-processing-s1], verified: "2026-11-26", text: "Flink distinguishes processing time, the executing machine's system time, from event time, when the event occurred on its producing device. Event-time programs specify how to generate watermarks to signal progress in event time."}
  - {id: stream-processing-windows, class: A, sources: [stream-processing-s1, stream-processing-s2], verified: "2026-11-26", text: "Streams are generally unbounded, so stream aggregates such as counts and sums are scoped by windows. Flink assigns events to windows by a window assigner; tumbling windows are fixed and do not overlap, while sliding windows can overlap."}
  - {id: stream-processing-state, class: A, sources: [stream-processing-s3], verified: "2026-11-26", text: "Kafka Streams uses state stores for stateful operations such as joins, grouping and aggregation. Windowing groups records with the same key into windows for stateful operations."}
  - {id: stream-processing-watermark, class: A, sources: [stream-processing-s1], verified: "2026-11-26", text: "A Flink Watermark(t) declares that event time has reached t and that no more elements with timestamps less than or equal to t are expected. Watermarks let window operators know when event time has passed a window's end."}
  - {id: stream-processing-late, class: A, sources: [stream-processing-s2], verified: "2026-11-26", text: "By default, Flink drops late elements when the watermark is past a window's end. An allowed-lateness period lets elements arrive after the watermark has passed the end and still enter the window; the window state is kept until that period expires. Flink can send discarded late data to a side output."}
  - {id: stream-processing-kafka-grace, class: A, sources: [stream-processing-s3], verified: "2026-11-26", text: "Kafka Streams window grace periods specify how long the system waits for out-of-order records; a record later than the window end plus its grace period is discarded from that window."}
  - {id: stream-processing-spark-watermark, class: A, sources: [stream-processing-s4], verified: "2026-11-26", text: "Spark Structured Streaming uses watermarks to bound how much intermediate state a long-running query accumulates. Its event-time window aggregation can retain and update state for late data until the watermark passes the window threshold."}
  - {id: stream-processing-sql-window, class: B, sources: [stream-processing-s5], verified: "2026-11-26", text: "Flink SQL supports window aggregations over streaming tables with TUMBLE, HOP, CUMULATE and SESSION window types."}
  - {id: stream-processing-policy, class: A, sources: [stream-processing-s1, stream-processing-s2], verified: "2026-11-26", text: "A stream-processing lateness policy specifies how long windows retain state for late events; after that policy's boundary, the engine can discard the event or route it to a late-data output."}
