sources:
  - {id: forecasting-s1, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): Time series patterns", url: "https://otexts.com/fpp3/tspatterns.html", kind: primary, vendor: false}
  - {id: forecasting-s2, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): Autocorrelation", url: "https://otexts.com/fpp3/acf.html", kind: primary, vendor: false}
  - {id: forecasting-s3, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): Time series cross-validation", url: "https://otexts.com/fpp3/tscv.html", kind: primary, vendor: false}
  - {id: forecasting-s4, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): Distributional forecasts and prediction intervals", url: "https://otexts.com/fpp3/prediction-intervals.html", kind: primary, vendor: false}
  - {id: forecasting-s5, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): Exponential smoothing", url: "https://otexts.com/fpp3/expsmooth.html", kind: primary, vendor: false}
  - {id: forecasting-s6, title: "Hyndman and Athanasopoulos, Forecasting: Principles and Practice (3rd ed): ARIMA models", url: "https://otexts.com/fpp3/arima.html", kind: primary, vendor: false}
  - {id: forecasting-s7, title: "scikit-learn: TimeSeriesSplit", url: "https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html", kind: primary, vendor: false}
  - {id: forecasting-s8, title: "scikit-learn: Lagged features for time series forecasting", url: "https://scikit-learn.org/stable/auto_examples/applications/plot_time_series_lagged_features.html", kind: primary, vendor: false}
  - {id: forecasting-s9, title: "amazon-science/chronos-forecasting: README", url: "https://github.com/amazon-science/chronos-forecasting", kind: primary, vendor: false}
  - {id: forecasting-s10, title: "Hugging Face: amazon/chronos-2 model card", url: "https://huggingface.co/amazon/chronos-2", kind: primary, vendor: false}
  - {id: forecasting-s11, title: "google-research/timesfm: README, licence notice for pretrained weights", url: "https://github.com/google-research/timesfm", kind: primary, vendor: true}
  - {id: forecasting-s12, title: "Hugging Face: Salesforce/moirai-2.0-R-small model card", url: "https://huggingface.co/Salesforce/moirai-2.0-R-small", kind: primary, vendor: false}
claims:
  - {id: forecasting-order, class: A, sources: [forecasting-s7], verified: "2026-11-27", text: "For time-ordered data, cross-validation methods other than a time series split are inappropriate, as they would lead to training on future data and evaluating on past data."}
  - {id: forecasting-trend, class: A, sources: [forecasting-s1], verified: "2026-11-27", text: "A trend exists when there is a long-term increase or decrease in the data. It does not have to be linear."}
  - {id: forecasting-seasonal, class: A, sources: [forecasting-s1], verified: "2026-11-27", text: "A seasonal pattern occurs when a time series is affected by seasonal factors such as the time of the year or the day of the week. Seasonality is always of a fixed and known period."}
  - {id: forecasting-autocorrelation, class: A, sources: [forecasting-s2], verified: "2026-11-27", text: "Autocorrelation measures the linear relationship between lagged values of a time series."}
  - {id: forecasting-seasonal-lags, class: A, sources: [forecasting-s2], verified: "2026-11-27", text: "When data are seasonal, the autocorrelations will be larger for the seasonal lags, at multiples of the seasonal period, than for other lags."}
  - {id: forecasting-lag-features, class: B, sources: [forecasting-s8], verified: "2026-11-27", text: "The scikit-learn example on lagged features uses lagged features for time series forecasting with HistGradientBoostingRegressor, and evaluates with TimeSeriesSplit, a splitting strategy that takes the temporal structure of the dataset into account."}
  - {id: forecasting-tscv, class: A, sources: [forecasting-s3], verified: "2026-11-27", text: "In time series cross-validation the training set consists only of observations that occurred prior to the observation that forms the test set, so no future observations can be used in constructing the forecast. The procedure is known as evaluation on a rolling forecasting origin, and forecast accuracy is computed by averaging over the test sets."}
  - {id: forecasting-supersets, class: A, sources: [forecasting-s7], verified: "2026-11-27", text: "In scikit-learn's TimeSeriesSplit, unlike standard cross-validation methods, successive training sets are supersets of those that come before them."}
  - {id: forecasting-interval, class: A, sources: [forecasting-s4], verified: "2026-11-27", text: "A prediction interval gives an interval within which the value is expected to lie with a specified probability."}
  - {id: forecasting-widen, class: A, sources: [forecasting-s4], verified: "2026-11-27", text: "Prediction intervals usually increase in length as the forecast horizon increases. The further ahead the forecast, the more uncertainty is associated with it."}
  - {id: forecasting-novalue, class: A, sources: [forecasting-s4], verified: "2026-11-27", text: "The value of prediction intervals is that they express the uncertainty in the forecasts. Point forecasts can be of almost no value without the accompanying prediction intervals."}
  - {id: forecasting-smoothing, class: A, sources: [forecasting-s5], verified: "2026-11-27", text: "Forecasts produced using exponential smoothing methods are weighted averages of past observations, with the weights decaying exponentially as the observations get older."}
  - {id: forecasting-arima, class: B, sources: [forecasting-s6], verified: "2026-11-27", text: "Exponential smoothing and ARIMA models are the two most widely used approaches to time series forecasting. Exponential smoothing models are based on a description of the trend and seasonality in the data, and ARIMA models aim to describe the autocorrelations in the data."}
  - {id: forecasting-chronos, class: C, sources: [forecasting-s9, forecasting-s10], verified: "2026-11-27", text: "Chronos is a family of pretrained time series forecasting models. Chronos-2 offers zero-shot support for univariate, multivariate and covariate-informed forecasting tasks. The repository and the amazon/chronos-2 model card state the Apache-2.0 licence."}
  - {id: forecasting-timesfm-licence, class: C, sources: [forecasting-s11], verified: "2026-11-27", flags: [vendor-stated], text: "TimesFM is a pretrained time-series foundation model developed by Google Research. Its source code is licensed under Apache-2.0 and model weights up to version 2.5 remain Apache-2.0. TimesFM 3.0 pretrained weights are distributed under a separate non-commercial licence and are restricted to non-commercial, non-production use when downloaded or self-hosted."}
  - {id: forecasting-moirai-licence, class: C, sources: [forecasting-s12], verified: "2026-11-27", text: "The Salesforce Moirai 2.0 model card carries the licence cc-by-nc-4.0."}
