claims:
  - {id: data-quality-dimensions, class: A, sources: [data-quality-s1], verified: "2026-11-27", text: "The UK Government Data Quality Framework names six core data quality dimensions, as defined by DAMA UK: completeness, uniqueness, consistency, timeliness, validity and accuracy. It describes data quality as fitness for purpose and says the list of dimensions is not prescriptive."}
  - {id: data-quality-definitions, class: A, sources: [data-quality-s1], verified: "2026-11-27", text: "In the UK Government Data Quality Framework, completeness is the degree to which records are present, uniqueness the degree to which there is no duplication in records, validity the degree to which data is in the range and format expected, consistency the degree to which values in a data set do not contradict other values representing the same entity, and accuracy the degree to which data matches reality. Its timeliness example is a change entered after three days against a two day service level agreement."}
  - {id: data-quality-lifecycle, class: A, sources: [data-quality-s1], verified: "2026-11-27", text: "The UK Government Data Quality Framework says quality assessment and assurance should take place at each stage of the data lifecycle."}
  - {id: data-quality-dbt-tests, class: B, sources: [data-quality-s2], verified: "2026-11-27", text: "dbt data tests are assertions about models and other resources such as sources, seeds and snapshots. A data test is a select statement that seeks failing records, and it passes when it returns zero failing rows. dbt ships with four generic data tests: unique, not_null, accepted_values and relationships."}
  - {id: data-quality-dbt-sources, class: B, sources: [data-quality-s3], verified: "2026-11-27", text: "dbt lets data tests be added to sources. It can also capture the freshness of source tables, reporting a pass, warning or error for each source based on its warn_after and error_after thresholds."}
  - {id: data-quality-gx, class: B, sources: [data-quality-s4], verified: "2026-11-27", text: "Great Expectations defines an Expectation as a verifiable assertion about data and an Expectation Suite as a collection of Expectations that describe the ideal state of a set of data. Expectations are validated against a Batch of data."}
  - {id: data-quality-quarantine, class: B, sources: [data-quality-s5, data-quality-s6], verified: "2026-11-27", text: "Great Expectations documents retrieving all failing rows of an UnexpectedRowsExpectation and gives quarantining bad records as the example use. In dbt, store_failures saves the records that failed a test in a table with the name of the test."}
  - {id: data-quality-soda, class: B, sources: [data-quality-s7], verified: "2026-11-27", text: "A Soda data contract is a YAML document that contains data quality checks. Its check types include missing, invalid, duplicate, freshness, schema and failed rows checks."}
  - {id: data-quality-contract, class: B, sources: [data-quality-s8], verified: "2026-11-27", text: "A dbt model contract defines the shape of the returned dataset. When the contract is enforced it must include every column's name and data type, and a model that does not conform to that shape does not build. dbt describes data tests as a more flexible mechanism for validating the content of a model after it is built."}
  - {id: data-quality-block-or-flag, class: B, sources: [data-quality-s9, data-quality-s10], verified: "2026-11-27", text: "In dbt build, tests on upstream resources block downstream resources from running, and a test failure causes those downstream resources to skip. Test severity is error by default, and a test with severity warn only returns a warning."}
  - {id: data-quality-ownership, class: B, sources: [data-quality-s11], verified: "2026-11-27", text: "GOV.UK's data ownership model describes a data owner as a senior individual with dedicated accountabilities for data, who ensures that the quality of the data they are responsible for is known. Data stewards are responsible for day-to-day operational activities in their data domain, including data quality governance processes such as monitoring, investigating, triaging, remediating and reporting."}
