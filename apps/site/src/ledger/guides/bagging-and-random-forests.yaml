sources:
  - {id: bagging-and-random-forests-s1, title: "scikit-learn user guide: Ensembles, gradient boosting, random forests, bagging, voting, stacking", url: "https://scikit-learn.org/stable/modules/ensemble.html", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s2, title: "scikit-learn API reference: RandomForestClassifier", url: "https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s3, title: "Leo Breiman and Adele Cutler, University of California, Berkeley: Random Forests", url: "https://www.stat.berkeley.edu/~breiman/RandomForests/cc_home.htm", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s4, title: "scikit-learn user guide: Permutation feature importance", url: "https://scikit-learn.org/stable/modules/permutation_importance.html", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s5, title: "scikit-learn example: Permutation Importance vs Random Forest Feature Importance (MDI)", url: "https://scikit-learn.org/stable/auto_examples/inspection/plot_permutation_importance.html", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s6, title: "Google Machine Learning, Decision Forests course: Random forests", url: "https://developers.google.com/machine-learning/decision-forests/random-forests", kind: primary, vendor: false}
  - {id: bagging-and-random-forests-s7, title: "Google Machine Learning, Decision Forests course: Out-of-bag evaluation", url: "https://developers.google.com/machine-learning/decision-forests/out-of-bag", kind: primary, vendor: false}
claims:
  - {id: bagging-and-random-forests-variance, class: A, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "Individual decision trees typically exhibit high variance and tend to overfit."}
  - {id: bagging-and-random-forests-bootstrap, class: A, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "In random forests each tree in the ensemble is built from a sample drawn with replacement, a bootstrap sample, from the training set."}
  - {id: bagging-and-random-forests-same-size, class: A, sources: [bagging-and-random-forests-s6], verified: "2026-11-27", text: "In a random forest each decision tree is trained on the same number of examples as in the original training set, and the reuse of examples during sampling is called training with replacement."}
  - {id: bagging-and-random-forests-left-out, class: A, sources: [bagging-and-random-forests-s3, bagging-and-random-forests-s7], verified: "2026-11-27", text: "About one-third of the cases are left out of the bootstrap sample and not used in the construction of a given tree."}
  - {id: bagging-and-random-forests-bagging, class: A, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "Bagging methods build several instances of an estimator on random subsets of the original training set and then aggregate their individual predictions to form a final prediction. They are used as a way to reduce the variance of a base estimator such as a decision tree. When the samples are drawn with replacement the method is known as bagging, and scikit-learn offers it as the BaggingClassifier and BaggingRegressor meta-estimators."}
  - {id: bagging-and-random-forests-deep, class: B, sources: [bagging-and-random-forests-s1, bagging-and-random-forests-s6], verified: "2026-11-27", text: "Bagging methods work best with strong and complex models such as fully developed decision trees, and individual decision trees in a random forest are trained without pruning. scikit-learn states that good results are often achieved when fully developing the trees, that these values are usually not optimal, and that the best parameter values should always be cross-validated."}
  - {id: bagging-and-random-forests-cancel, class: A, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "The randomness injected into a forest yields decision trees with somewhat decoupled prediction errors. By taking an average of those predictions, some errors can cancel out. Random forests achieve a reduced variance by combining diverse trees, sometimes at the cost of a slight increase in bias."}
  - {id: bagging-and-random-forests-average, class: B, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "The prediction of the ensemble is given as the averaged prediction of the individual trees. In contrast to the original publication, the scikit-learn implementation combines classifiers by averaging their probabilistic prediction instead of letting each classifier vote for a single class."}
  - {id: bagging-and-random-forests-oob, class: B, sources: [bagging-and-random-forests-s1, bagging-and-random-forests-s2], verified: "2026-11-27", text: "When bootstrap sampling is used, the generalisation error can be estimated on the left out or out-of-bag samples. In scikit-learn this is enabled by setting oob_score=True and is only available if bootstrap=True."}
  - {id: bagging-and-random-forests-oob-how, class: A, sources: [bagging-and-random-forests-s7, bagging-and-random-forests-s3], verified: "2026-11-27", text: "Out-of-bag evaluation evaluates the random forest on the training set and, for each example, uses only the decision trees that did not see the example during training. Breiman and Cutler state that with it there is no need for cross-validation or a separate test set."}
  - {id: bagging-and-random-forests-features, class: A, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "During the construction of each tree in a random forest, a random subset of the features is considered when splitting a node. The size of this subset is controlled by the max_features parameter."}
  - {id: bagging-and-random-forests-correlation, class: A, sources: [bagging-and-random-forests-s3], verified: "2026-11-27", text: "The forest error rate depends on the correlation between any two trees in the forest and on the strength of each individual tree. Increasing the correlation increases the forest error rate. Reducing the number of variables tried at each node reduces both the correlation and the strength."}
  - {id: bagging-and-random-forests-max-features, class: B, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "The lower max_features is, the greater the reduction of variance, but also the greater the increase in bias. Empirical good default values are max_features=1.0 for regression problems, which is equivalent to bagged trees, and max_features=sqrt for classification tasks. 0.3 is a typical default in the literature."}
  - {id: bagging-and-random-forests-n-estimators, class: B, sources: [bagging-and-random-forests-s1], verified: "2026-11-27", text: "The main parameters to adjust for forests are n_estimators and max_features. For the number of trees, the larger the better, but also the longer it will take to compute, and results will stop getting significantly better beyond a critical number of trees."}
  - {id: bagging-and-random-forests-default-trees, class: C, sources: [bagging-and-random-forests-s2], verified: "2026-11-27", text: "In the stable scikit-learn documentation the default value of n_estimators for RandomForestClassifier is 100."}
  - {id: bagging-and-random-forests-mdi, class: B, sources: [bagging-and-random-forests-s1, bagging-and-random-forests-s2], verified: "2026-11-27", text: "In scikit-learn the fraction of samples a feature contributes to is combined with the decrease in impurity from splitting them, and averaging this estimate over the trees is known as the mean decrease in impurity. The estimates are stored in the feature_importances_ attribute of the fitted model, whose values are positive and sum to 1.0."}
  - {id: bagging-and-random-forests-mdi-flaws, class: A, sources: [bagging-and-random-forests-s1, bagging-and-random-forests-s4], verified: "2026-11-27", text: "Impurity-based feature importances computed on tree-based models are computed on statistics derived from the training dataset and therefore do not necessarily inform on which features are most important to make good predictions on a held-out dataset. They also favour high cardinality features, that is features with many unique values."}
  - {id: bagging-and-random-forests-random-num, class: B, sources: [bagging-and-random-forests-s5], verified: "2026-11-27", text: "In scikit-learn's example a non-predictive random numerical variable with as many unique values as records is ranked as one of the most important features by the impurity-based importance of a random forest, while permutation importances computed on a held-out test set give both random features very low importances."}
  - {id: bagging-and-random-forests-permutation, class: A, sources: [bagging-and-random-forests-s4], verified: "2026-11-27", text: "Permutation feature importance randomly shuffles the values of a single feature and observes the resulting degradation of the model's score, and it can be computed on unseen data. It does not reflect the intrinsic predictive value of a feature by itself but how important this feature is for a particular model."}
  - {id: bagging-and-random-forests-correlated, class: A, sources: [bagging-and-random-forests-s4], verified: "2026-11-27", text: "When two features are correlated and one of the features is permuted, the model still has access to it through its correlated feature. This results in a lower reported importance value for both features, though they might actually be important."}
